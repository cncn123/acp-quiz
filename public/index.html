  {id:247,type:'single',answer:'D',stem:'以下哪种情况更适合使用代码解释器插件而不是直接使用大模型？',opts:['将一组文档按主题分类','分析一段文本的情感','从用户评论中提取关键信息','计算两组数据之间的皮尔逊相关系数'],exp:'代码解释器插件主要用于执行需要计算、数据分析或编程的任务，例如数学运算、统计指标生成、文件格式转换等。这类任务通常依赖精确的算法或外部库实现。大语言模型本身更擅长基于文本的推理、分类或生成任务，如情感分析、主题归类、信息抽取等。皮尔逊相关系数涉及统计学计算，需调用数学库完成数值处理，属于代码驱动的操作。选项A、B、C均为文本语义层面的处理，属于大模型原生能力范围；D需要数值计算与数据处理，更适合通过代码解释器调用外部工具实现。'},
  {id:248,type:'single',answer:'C',stem:'向量数据库的主要作用是什么？',opts:['存储和管理大量的关系型数据。','存储和管理大量的图像 。','存储和管理大量的向量数据,并提供高效的相似性检索。','存储和管理大量的文本数据,并提供全文检索功能。'],exp:'向量数据库用于存储和管理大量的向量数据，并提供高效的相似性检索。向量数据是高维数值表示，常用于人工智能场景中的特征嵌入，如图像、文本、音频的向量化表示。其核心能力是基于距离度量（如余弦相似度、欧氏距离）快速查找最相近的向量，区别于传统数据库的精确匹配或全文检索。'},
  {id:249,type:'single',answer:'D',stem:'以下哪个数据结构更适合用于实现关键词匹配,以提高匹配效率',opts:['栈','数组','链表','字典树'],exp:'字典树: 匹配关键词“cat ”只需依次比较 c →a → t,路径唯一,数组/链表: 需遍历所有关键词逐个比较'},
  {id:250,type:'single',answer:'D',stem:'以下哪种方法最适合用于明确指定大模型输出的格式和类型？',opts:['仅使用上下文(Context)','仅使用角色(Role)','仅使用任务目标(Object)','结合输出格式(Output Format)和样例(Sample)'],exp:'大模型输出的格式和类型需要明确的指令。OpenAI建议在提示工程中结合明确的格式描述和具体示例，能有效减少歧义。选项A（上下文）提供背景信息，但无法直接约束格式；选项B（角色）影响生成内容的领域风格，与格式无关；选项C（任务目标）定义生成内容的目的，但未涉及结构规范。选项D通过格式描述（如JSON、表格）与示例的结合，提供结构化指引，确保输出符合预期。《OpenAI Prompt Engineering Guide》指出，清晰的格式要求配合示例提升输出一致性。'},
  {id:251,type:'single',answer:'A',stem:'哪一项？',opts:['单个大模型无法处理多种格式的文件。','可以根据任务特点选择合适的模型和参数。','难以同时保证每项工作的质量。','可以分步优化,提高整体处理效率和成本。'],exp:'暂无解析'},
  {id:252,type:'single',answer:'B',stem:'通过 LlamaIndex创建 RAG 应用时,一份知识文件是如何传入RAG 应用的,请选择顺序：',opts:['Node 对象 - query_engine-Document 对象 - index','Document 对象 - Node 对象 - index-query_engine','Node 对象 - Document 对象 - index-query_engine','Document 对象 - index-Node 对象 - query_engine'],exp:'在LlamaIndex框架中，构建RAG（检索增强生成）应用时，知识文件的处理流程遵循一个标准化的流水线结构。具体步骤为： 1. **Document对象**：首先，原始知识文件（如PDF、文本文件等）被加载并解析为`Document`对象。这是对文件的抽象表示，包含文本内容及元数据。 2. **Node对象**：随后，`Document`对象被分割成更小的、结构化的片段，称为`Node`对象（或`TextNode`）。这些节点是索引和检索的基本单位，通常包含文本块及其对应的元数据。 3. **index**：接下来，这些`Node`对象被用于构建索引（`index`），例如向量索引或关键字索引。索引存储了节点的嵌入表示或结构化信息，便于后续快速检索。 4. **query_engine**：最后，基于构建好的`index`创建查询引擎（`query_engine`）。查询引擎封装了检索逻辑，能够根据用户的问题从索引中检索相关节点，并生成答案。 因此，正确的顺序是：`Document对象 → Node对象 → index → query_engine`，对应选项**B**。'},
  {id:253,type:'single',answer:'C',stem:'如果要修改摘要生成函数，使其生成的摘要不超过80个字，应该如何修改？',opts:['假设生成结果为 query,生成结果后添加 query=query [:80]。','以上修改方法均不正确。','在提示词部分明确写出摘要本身的内容不超过 80 个字。','假设输入的文档为 document,在函数开头添加'],exp:'题干考查如何通过修改生成函数限制摘要字数。选项C指出在提示词中明确限制字数，这种方法属于预先生成阶段的控制，指导模型自行调整输出长度，确保内容连贯。而选项A的后处理截断可能导致内容不完整，属于次优方案。相关自然语言处理实践中，通过提示词设定生成条件（如max_tokens参数）是常用方法。选项B否定其他方法，但C有效，故排除。选项D调整输入文档，无关输出控制。'},
  {id:254,type:'single',answer:'D',stem:'以下哪种方法最适合用于解析PDF和Word文档中的文本内容，以便进行后续的RAG处理？',opts:['使用正则表达式直接提取文本。','手动复制粘贴文本内容。','使用光学字符识别(OCR)技术。','使用专门的库,例如 Python 的 PyPDF2 和 python - docx。'],exp:'解析PDF和Word文档的文本内容需保持格式结构与语义完整性，直接使用正则表达式无法处理复杂排版，OCR适用于扫描图像而非原生文档，手动复制效率低且易出错。Python的PyPDF2库可准确提取PDF的文本与元数据，python-docx库能完整读取Word文档的段落、表格与样式，二者均为行业标准工具，专为结构化文档解析设计，适配RAG系统对高质量文本输入的要求。'},
  {id:255,type:'single',answer:'A',stem:'关于输入数据的描述，以下哪项是正确的？',opts:['输入数据应当明确具体含义及其用途','输入数据不影响模型输出格式','输入数据是可选的','输入数据仅用于生成样例','输入数据无需说明','输入数据可以通过模糊的引导词来定义其作用'],exp:'数据输入规范要求明确定义数据用途及含义，确保处理过程可靠。ISO/IEC 25000系列标准中强调数据质量属性包含明确性。选项A符合数据明确性原则，B与数据处理逻辑冲突（输入直接影响输出），C违反多数场景下数据必选要求，D将输入作用局限化，E忽略数据定义的必要性，F的模糊引导词违背信息准确性要求。'},
  {id:256,type:'single',answer:'D',stem:'以下关于基于规则的文本合规检查方法的描述，哪一项是不正确的？',opts:['对于特定高风险场景效果显著。','需要维护一个规则库,例如包含正则表达式、敏感词或模式。','规则更新可能不及时,人工维护成本较高。','具有很强的数据泛化能力,可以有效识别新的变种。'],exp:'基于规则的文本合规检查方法依赖于预先设定的规则库（如正则表达式、敏感词），针对明确的高风险场景设计规则，能够快速识别已知模式。但此类方法无法自动适应未在规则库中定义的新变种，泛化能力弱。规则更新依赖人工，当文本模式变化时可能出现滞后。选项C中“有效识别新的变种”与基于规则方法的局限性直接矛盾，其他选项均描述了该方法的特点或典型缺陷。参考《自然语言处理实践》中规则引擎章节相关内容。'},
  {id:257,type:'single',answer:'C',stem:'用户向基于RAG的智能答疑机器人提交了一张包含敏感信息的图片进行咨询。根据最佳实践，最早应该在哪个阶段进行内容安全合规检查以阻止敏感信息泄露？ 选项：',opts:['机器人根据用户图片检索时','机器人响应返回答案之后检查','在机器人处理图片之前检查','将答案返回给用户之前检查'],exp:'基于RAG的系统处理用户输入时，内容安全合规检查应在数据进入后续流程前完成。敏感信息若在处理阶段被系统读取或存储，即使后续拦截也可能引发泄露风险。最佳实践是在处理输入前（如OCR解析图片内容前）实施检查，防止敏感数据流入内部环节。选项C对应数据处理流程的初始阶段，符合最小化风险原则。其他选项均在信息已处理或生成后介入，无法彻底阻断潜在泄露途径。信息来源包括数据安全规范及隐私保护框架（如GDPR）。'},
  {id:258,type:'single',answer:'F',stem:'在提示词构建中，哪个要素用于指定大模型的回应风格或语气？',opts:['输出格式','样例','任务目标','上下文','输入数据','角色'],exp:'在提示词构建里，角色要素的作用是指定大模型的回应风格或语气。通过为模型设定如专家、助手、学生等不同角色，能引导模型呈现出与之匹配的语气、风格以及专业背景，从而让输出更符合具体的需求场景。'},
  {id:259,type:'single',answer:'B',stem:'以下哪种说法最能体现RAG的核心思想?',opts:['RAG 是一种利用大语言模型进行知识图谱构建的技术。','RAG 是一种通过微调大语言模型来适应特定领域问答的技术。','RAG 是一种利用大语言模型直接生成最终答案的技术。','RAG 是一种将大语言模型与外部知识库结合,提升模型问答能力的技术'],exp:'RAG（Retrieval-Augmented Generation）的核心在于整合外部知识检索与生成模型的能力。Meta的研究论文《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》指出，RAG通过检索增强生成过程，而非仅依赖模型内部知识。选项A错误，RAG并非直接生成答案，而是结合检索结果；选项C描述的是领域微调，与RAG无关；选项D涉及知识图谱构建，超出RAG的检索增强生成范畴。选项B准确反映了RAG结合外部知识库与生成模型的特点。'},
  {id:260,type:'single',answer:'C',stem:'如何获取大模型返回信息的文本内容？pythonImport osfrom openaiimport OpenAl client=OpenAl (Api_key=os.getenv ("DASHSCOPE_API_KEY"),Base_url="http s://dashscope.aliyuncs.com/compatible-mode/v 1") completion=client.chat.completions.createModel="qwen-maxMessages=[f"role" :"user","content\'你是谁?"}])print (completion.choices[O].message.content)',opts:['completion.choices[0]','completion.message.content','completion.choices [0 ].message.content','completion.choices.content'],exp:'正确选项为C。大模型返回结果中，文本内容位于completion.choices.message.content路径下。A选项缺少.message.content，仅获取到选择对象而非文本；B选项错误地省略了choices索引，结构不完整；D选项遗漏了choices层级，无法访问消息内容。题干代码中明确使用completion.choices.message.content获取响应文本，符合OpenAI及兼容API的响应结构规范。'},
  {id:261,type:'single',answer:'D',stem:'以下哪个用户查询语句无法有效地指导大模型进行文本摘要？',opts:['请总结以下文章的主要内容:','提取以下文本的关键词:','请翻译以下文章:','将以下文章压缩到 100 字以内:','用一句话概括以下文字:'],exp:'文本摘要任务的核心在于对原文内容的概括、缩短或提取关键信息，而非转换表达形式。翻译任务（选项C）要求将文本转换为另一种语言，保持原意但未涉及信息压缩或提炼，属于语言转换而非内容摘要。相比之下，其他选项均直接涉及内容精简、关键词提取或特定字数压缩，符合摘要任务的基本要求。根据自然语言处理任务分类，翻译与摘要属于不同范畴，功能目标不同，无法有效指导模型执行摘要操作。'},
  {id:262,type:'single',answer:'A',stem:'在调用百炼大模型接口时，如何指定用户的输入内容？',opts:['将用户输入内容作为\'messages\'列表中字典的\'content\'字段的值传入','将用户输入内容作为model参数的值传入','将用户输入内容作为 api_key 参数的值传入','将用户输入内容作为base_url 参数的值传入'],exp:'在调用大模型接口时，用户输入通常通过特定的数据结构传递。接口设计中常用的方法是使用包含键值对的字典结构，例如`messages`列表中每个元素代表对话上下文，用户输入内容需赋值给该字典的`\'content\'`键。选项B中`model`参数用于指定模型版本，选项C的`api_key`用于身份验证，选项D的`base_url`用于设置API地址，均与传递用户输入无关。根据接口规范，用户输入应通过`messages`列表中字典的`\'content\'`字段传入。'},
  {id:263,type:'single',answer:'A',stem:'通过 LlamaIndex 创建 RAG 应用时,node_postprocessors 的作用是?',opts:['设置召回文本段个数','修改 prompt 模板','开启句子窗口检索','进行后处理,如相似度阈值、rerank 等'],exp:'在LlamaIndex创建RAG应用时，node_postprocessors主要用于对检索到的节点进行后处理操作，包括相似度阈值过滤、rerank（重排序）等，以优化检索结果的质量和相关性。选项B“设置召回文本段个数”通常由检索器参数控制，选项C“开启句子滑窗检索”属于检索策略配置，均与node_postprocessors功能无关。因此，正确答案为A。'},
  {id:264,type:'single',answer:'C',stem:'在检测文档内容中是否存在营销表达时，下列哪种方法可以更全面地识别问题？',opts:['识别有内容错误的部分','逐条单独识别营销词汇','一次性生成所有类型的识别结果','让大模型自动修改内容'],exp:'识别营销表达的关键在于同时覆盖多种潜在类型。一次性生成所有类型的识别结果可避免遗漏，确保全面性。选项A侧重于错误而非营销意图；B逐条检测可能忽略上下文关联；D属于修改而非识别。C的方法通过全局处理提升覆盖范围，符合全面识别需求。来源参考自然语言处理中的文本分类策略，主张同时处理多类别问题以优化检测效果。'},
  {id:265,type:'single',answer:'A',stem:'在使用AssistantAPI时，如何验证API请求是否成功？',opts:['if response. status_code ==HTTPStatu s.CREATED:','if response. status_code ==HTTPStatu s.BAD_REQUEST:','if response.status_code ==HTTPStatu s.OK :','if response. status_code==HTTPStatu s.NOT_FOUND:'],exp:'HTTP状态码用于表示API请求的处理结果。常见的成功状态码包括200（OK）和201（Created）。根据HTTP标准，200通常用于GET请求或不需要返回新资源的操作，而201适用于POST请求成功创建资源的情景。选项D对应200状态码，代表通用请求成功。选项A（201）针对资源创建场景，选项B（404）表示资源不存在，选项C（400）标识请求参数错误。题目未限定具体操作类型，默认以200为通用成功验证依据。'},
  {id:266,type:'single',answer:'D',stem:'在大语言模型微调训练中，哪一步骤涉及到计算损失函数关于模型参数的梯度？',opts:['正向传播','批标准化','优化算法选择','反向传播'],exp:'在大语言模型的微调训练中，**反向传播**（Backpropagation）是计算损失函数关于模型参数梯度的关键步骤。其基本过程如下： - **正向传播**（A选项）：输入数据从输入层经过各隐藏层逐层计算，最终得到模型的预测输出。这一过程并未涉及梯度的计算，因此A选项不正确。 - **批标准化**（B选项）：这是一种用于加速训练、提高稳定性的技术，主要对网络中间层的输出进行标准化处理，但它不直接计算损失函数对参数的梯度，故B选项错误。 - **优化算法选择**（C选项）：优化算法（如SGD、Adam等）是基于梯度来更新模型参数，但它本身并不负责计算梯度，而是利用已计算出的梯度进行参数更新，因此C选项不是计算梯度的步骤。 - **反向传播**（D选项）：反向传播算法通过链式法则，从输出层开始逐层向前计算损失函数对每个参数的梯度（偏导数），然后将这些梯度用于优化算法中更新参数。这正是题目所描述的步骤。 因此，正确答案是**D**。'},
  {id:267,type:'single',answer:'F',stem:'、API AssistantAgent示例代码verify_status_code函数的作用是什么?Python def verify_status_code (res) :if res.status_code!=HTTPStatus.OK:Print ("Failed:")Print (res)Sys.exit (res.status_code)',opts:['验证 function call 的参数是否正确','验证用户输入的 query 是否合法','验证 Assistant 是否成功创建','验证 Thread 是否成功创建','验证模型返回的答案是否符合预期','验证 API 调用的返回状态码是否为 200'],exp:'示例代码中的 verify_status_code 函数通过检查响应对象的 status_code 属性,判断API 调用是否成功(HTTP 状态码 200 表示成功) 。若状态码不为 200,则打印错误信息并终止程序'},
  {id:268,type:'single',answer:'D',stem:'APlAssistantAgent示例代码_forward_and_submit_outputs 函数的核心功能是什么?pythonDef _ forward_and_ submit_outputs ( self,run_ status) :get the function name,run and return the function output to the server"Func_obj=run_ status.required_action. submit_ tool_outputs.tool_ calls[o ].function func_namefunc_obj.nameArguments = json. loads ( func_obj.arguments)Tool_outputs= [{tool_call_id\' :Run_ status.required_action. submit_tool_outputs.tool_calls[0 ]. id, \'output\' :json.dumps (self.funcs[func_name](**arguments))Run_ status = dashscope.Runs. submit_ tool_outputs(run_ status. id, thread_id= self.thread. id,Tool_outputs=tool_outputs)Return',opts:['获取 Assistant 的回复','创建新的 Assistant','创建新的 Thread','执行 function call 并将结果提交给服务器','等待 Run 完成','向 Assistant 提交用户 query'],exp:'_forward_and_submit_outputs 函数的核心功能是执行 function call 并将结果提交给服务器。代码中通过解析 run_status 中的 tool_calls 获取函数名与参数，调用 self.funcs[func_name](**arguments) 执行函数，生成 tool_outputs 后调用 dashscope.Runs.submit_tool_outputs 提交输出。该过程完整实现了函数调用与结果回传的流程，符合 API AssistantAgent 的工具调用机制。'},
  {id:269,type:'single',answer:'B',stem:'大语言模型微调时，通过调节哪个参数可以直接控制模型学习新知识的速度？',opts:['批大小','学习率','训练轮数','正则化系数'],exp:'[回答]：在大语言模型的微调过程中，学习率（learning rate）是控制模型参数更新步长的关键超参数。它直接决定了每次梯度下降时模型权重调整的幅度：如果学习率较大，模型会更快地调整参数以拟合新数据，即“学习新知识的速度”更快；但如果学习率过大，可能导致训练不稳定或收敛困难。反之，学习率较小则参数更新缓慢，学习新知识的速度较慢，但可能更稳定。 其他选项中： - **批大小**影响的是每次更新时计算的样本数量和梯度的估计精度，间接影响训练速度和稳定性，但并非直接控制学习新知识的速度。 - **训练轮数**控制的是模型在数据集上迭代的次数，影响模型学到知识的“程度”，但不直接控制单次更新的幅度。 - **正则化系数**主要用于防止过拟合，控制模型的复杂度，并不直接调整学习新知识的速度。 因此，正确答案是B。'},
  {id:270,type:'single',answer:'B',stem:'在LlamaIndex中，默认情况下，加载的数据是如何存储的?',opts:['存储在云服务中','存储在文件系统中的特定目录','直接写入数据库','存储在内存中作为一系列向量嵌入'],exp:'在LlamaIndex中，默认情况下，加载的数据会转换为文本块并生成向量嵌入，存储在内存中以支持后续检索。选项A错误，因云服务需显式配置；选项C错误，因数据库写入非默认行为。正确选项为B，符合其默认内存向量存储机制。'},
  {id:271,type:'single',answer:'D',stem:'如何从百炼大模型的接口返回结果中获取模型生成的文本？',opts:['python Pythonprint (completion.message.content)','python Pythonprint ( completion. choices[0 ] .message)','python Pythonprint (completion.choices.message.content)','python Pythonprint (completion.choices [0].message.content)'],exp:'根据官方文档，获取百炼大模型接口返回结果中模型生成的文本，需要访问响应对象中的特定数据结构。使用 DashScope SDK 调用应用后，返回的响应对象包含 output 字段，其中 text 字段保存模型生成的文本内容。选项 A 直接访问 message.content 不正确，因为响应结构不匹配。选项 B 缺少对 message 对象内部 content 字段的访问。选项 C 的 choices 属性后缺少索引 ，无法正确访问数组中的第一个元素。选项 D 的路径 completion.choices.message.content 符合 OpenAI 兼容模式下的响应结构，其中 choices 是数组，第一个元素包含 message 对象，其 content 属性即为模型生成的文本。易错提醒：注意区分 DashScope 原生调用（使用 response.output.text）和 OpenAI 兼容模式调用（使用 completion.choices.message.content）的不同路径。'},
  {id:272,type:'single',answer:'D',stem:'大语言模型预训练与微调之间的关系是什么？',opts:['微调发生在预训练之前,用于准备数据','预训练和微调是相互独立的过程','微调是对预训练模型的初次训练','微调是在预训练模型基础上进行的调整优化'],exp:'大语言模型的训练通常分为两个阶段：预训练和微调。前者通过海量文本学习语言通用模式，后者基于特定任务数据调整模型参数。选项A混淆了训练顺序，首次训练应为预训练；选项B时序错误，实际流程是先预训练后微调；选项D否定二者的递进关系，不符合主流实践。选项C准确描述了两者的技术衔接，《自然语言处理综论》等教材均强调预训练获得的通用表征通过微调适配具体应用场景。'},
  {id:273,type:'single',answer:'C',stem:'以下哪个分隔符形式不常用于提示词中？',opts:['plaintext <example> </example>','plaintext ... &&& Part 1 &&& Part 2','plaintext Section 1 Section 2','plaintext -- ##Title Content'],exp:'在提示词中，分隔符常用于划分不同部分或内容。选项A使用了 ... 作为分隔，有明确的开始和结束标记；选项B使用了 作为分隔符，形式独特且明确；选项D使用了 −− 和 作为分隔符，也具有分隔作用。而选项C仅用文本“Section 1”和“Section 2”来区分，没有使用特定的分隔符形式，这种形式在提示词中不常见，故答案选C。易错提醒：注意分隔符的明确性和独特性。'},
  {id:274,type:'single',answer:'D',stem:'以下哪个任务最适合使用大语言模型？',opts:['对一组图像进行精确的像素级分割','计算一组数据的标准差','在一个大型数据集上训练一个复杂的机器学习模型(例如,深度神经网络)','检测一组销售数据中的异常值'],exp:'大语言模型（LLM）的核心优势在于处理和理解自然语言，并基于模式识别和概率生成进行推理。选项A“对图像进行精确的像素级分割”是计算机视觉任务，需要专门的视觉模型。选项B“计算一组数据的标准差”是确定性数值计算，有固定算法，无需LLM的生成能力。选项C“在一个大型数据集上训练一个复杂的机器学习模型”是模型训练过程，需要大量计算资源和优化算法，而非LLM的直接应用。选项D“检测一组销售数据中的异常值”涉及对数据模式、趋势和上下文的理解与识别，这正是LLM在分析、推理和模式发现方面的典型应用场景，因此最适合使用大语言模型。'},
  {id:275,type:'single',answer:'A',stem:'下列代码片段的作用是？pythonFrom keras.preprocessing.sequence import pad_sequencesPadded_ seqs=pad_ sequences ( sequences,maxlen=max_ len,padding=\'post\', truncating=\'post "',opts:['序列填充到固定长度','文本摘要生成','特征缩放','文本向量化'],exp:'代码使用Keras的pad_sequences函数，将变长序列统一填充或截断至指定长度max_len。参数padding=\'post\'表示在序列末尾补零，truncating=\'post\'表示从末尾截断超长序列。该操作常用于神经网络输入对齐，确保批次数据维度一致。选项B、C、D分别涉及文本摘要、特征缩放和向量化，与pad_sequences功能无关。'},
  {id:276,type:'single',answer:'D',stem:'作为应用开发者，如果想要让大模型避免回答与个人隐私相关的问题，最推荐在哪个角色中设置相应的限制?',opts:['user','assistant','任何角色都可以','system'],exp:'在开发大语言模型应用时，不同的角色承担不同功能。用户角色（user）代表终端用户输入，助手角色（assistant）负责生成回应，系统角色（system）用于定义核心行为规范。OpenAI开发者文档明确指出，系统级别的指令主要用于设定模型的基础行为和伦理约束，例如隐私保护、内容过滤等全局性规则。选项D对应控制底层交互逻辑的角色，能有效覆盖所有潜在交互场景，而其他角色仅影响局部交互或缺乏持续性约束力。'},
  {id:277,type:'single',answer:'B',stem:'微调大语言模型的基本步骤不包括以下哪一项？',opts:['评估微调后模型在特定任务上的表现','选择或设计特定任务的数据集','使用特定任务数据对预训练模型进行再训练','对预训练模型的所有参数进行随机初始化'],exp:'微调大语言模型通常在预训练基础上进行，保留已有参数以适应新任务。预训练模型参数已具备通用特征，随机初始化会破坏这些特征，导致性能下降。选项B不符合微调流程，其描述的是预训练前的步骤。选项A、C均为微调必要环节，涉及任务数据准备及参数调整。相关方法在BERT、GPT等模型论文及Hugging Face文档中均有体现。'},
  {id:278,type:'single',answer:'A',stem:'以下哪个选项最适合作为系统角色提示词，用于构建一个可以进行代码审查的AI助手？',opts:['{"role" :"system","content" :"你是一个资深代码审查专家,专注于发现代码中的潜在问题,例如 bug、性能瓶颈和代码风格问题 。请提供详细的修改建议和解释 。"}','{"role" :"user","content" :"这是我的代码,请帮我审查。"}','{"role" :"assistant","content" :"请提交需要审查的代码。"}','{"role" :"system","content" :"你是一个初级程序员,正在学习代码审查。"}'],exp:'构建系统角色提示词需明确AI的身份与职责。系统角色（system）用于定义AI的核心功能，用户（user）和助手（assistant）角色用于实际对话交互。选项A通过系统角色明确设定AI为资深代码审查专家，具体说明其职责包括发现潜在问题、提供修改建议，符合代码审查助手的功能定位。选项B、C分别属于用户请求和助手回应，非系统角色定义；选项D设定为初级程序员，与审查需求相悖。'},
  {id:279,type:'single',answer:'D',stem:'你希望对于同一个提示词，让大模型每次都尽最大可能返回相同结果，可以调整哪个参数？',opts:['stream','max_token','api_key','seed'],exp:'A (stream) 主要用于控制大模型是否以流式传输的方式返回结果 ,也就是能否边生成内容边返回给用户,和让模型对于同一提示返回相同结果并无关联 。B ( max_token) 是用来限定模型生成文本时的最大 token 数量 ,主要影响生成文本的长度 ,而非生成结果的一致性 。C(api_key) 是应用程序访问大模型 API 的密钥,起到身份验证和授权访问的作用 ,和生成结果是否相同没有直接联系。D (seed) 在大模型相关操作中,seed(种子)参数就像一个随机数生成器的起始值 。 当设置固定的 seed 值时,模型的随机生成过程就被固定下来,对于相同的提示词,能够最大程度保证每次生成结果的一致性'},
  {id:280,type:'single',answer:'C',stem:'你为某大型企业开发内部问答机器人时，员工A查询“法务接口人”时，机器人总是返回其他部门的法务接口人信息。以下哪种方案优化该问题最有效？',opts:['增加召回片段数量','减少召回片段数量','结合读取的员工部门信息,对 query 进行改写','对用户 query 重复检索 3 次后返回结果'],exp:'A :增加召回片段数量,就像找东西时扩大寻找范围,但没考虑员工所在部门,还是会混进其他部门的信息,解决不了问题 。B :减少召回片段数量, 只是找得少了,但没针对部门调整,仍可能找错部门,没用。C :结合员工部门信息改写查询内容。 比如员工 A 在销售部,就把查询变成 “销售部法务接口人 ”,这样就能精准找到自己部门的接口人,直接解决总返回其他部门信息的问题。D :对用户查询重复检索 3 次。每次查的内容都一样,不调整部门信息,还是会返回其他部门的结果。'},
  {id:281,type:'single',answer:'D',stem:'在优化检索效果时，若知识库内容充足但召回率低，以下哪种方法是合理的？',opts:['增加查询请求的并发量以加快响应速度','提高相似度阈值','增加知识库文档','更换 embedding 模型'],exp:'A 并发量影响响应速度(处理请求的快慢),与能否召回更多内容无关,不能解决召回率低的问题。B 提高相似度阈值,意味着匹配要求更严格(需更高相似度才召回),会让召回的内容更少,原本召回率就低,这样做会更差。C 题目明确知识库内容已充足,增加文档无法解决 “检索不到 ” 的问题。D embedding 模型负责将文本转为向量,不同模型生成的向量质量不同。若原模型生成的向量不利于检索,更换模型可能提升匹配效果,从而提高召回率。'},
  {id:282,type:'single',answer:'A',stem:'你在为一个创意写作工具调整大模型生成内容，以下哪个参数可以用来控制生成内容的多样性？',opts:['temperature','stream','max_token','api_key'],exp:'A在大模型中它是控制生成随机性的参数,温度值越高,生成内容的随机性越大,多样性就越强;温度值越低,生成内容越保守,重复度可能越高。所以它能控制生成内容的多样性。B. 该参数通常与流式输出相关, 即模型是否边生成内容边返回给用户,与内容多样性无关。C此参数用于限制生成内容的最大 token 数量,决定了生成内容的长度,不影响多样性 。D. 这是应用程序访问模型接口的密钥,用于身份验证和授权,与生成内容的特性毫无关联。'},
  {id:283,type:'single',answer:'D',stem:'在一个电商问答系统中，用户提问“百炼X1手机的电池容量是多少？”后又问“充电器支持快充吗？如果直接用第二轮的问题进行检索，可能会出现什么现象？',opts:['由于 embedding 擅长处理短文本, 因此检索结果更为精确','embedding 模型不擅长处理短文本,导致检索精度下降','向量数据库自带上下文记忆功能,可以准确判断第二轮的问题是关于 “百炼 X1 手机 ” 的','检索结果不准确,丢失 “百炼 X1 手机 ” 这一历史对话信息'],exp:'在电商问答系统中，用户的多轮对话需要依赖上下文信息进行准确检索。若单独处理第二轮问题“充电器支持快充吗？”，系统可能无法关联到上一轮提到的“百炼X1手机”。此时，问题中缺乏关键实体信息，导致检索遗漏核心限制条件。选项中，B直接指出问题在于丢失历史信息，符合对话系统常见缺陷——上下文断裂。A、D涉及文本长度的影响，与题干场景无关；C错误假设向量数据库自动具备上下文记忆能力，而实际通常需额外机制处理多轮对话。'},
  {id:284,type:'single',answer:'C',stem:'向量检索召回了10条切片，但部分切片与问题相关度很低，干扰了大模型答案。哪种方式能更好地过滤掉低相关度切片？',opts:['简单把生成结果截断','使用高温度的模型进行生成','结合文本重排序模型(ReRank)并只保留 Top N','在大模型回答后再次让用户手动删除'],exp:'向量检索初步召回结果可能包含相关度不一的切片，ReRank模型通过二次排序能更精准评估文本相关性。该类模型常采用交叉注意力机制计算语义匹配得分，如BERT等预训练模型基础上微调的重排结构。选项A温度参数仅调节生成随机性，不影响输入内容筛选；选项B依赖人工干预效率低；选项D截断未考虑语义关联性。而ReRank技术在信息检索领域广泛应用（如ColBERT、RocketQA），通过精细化排序有效提升Top N结果质量。'},
  {id:285,type:'single',answer:'C',stem:'RAG应用在处理IT技术文档时表现不错，但在公司内部人事流程的问答中经常答非所问。最先应该检查哪方面？',opts:['问题必须拆成多次检索','大模型温度过高','是否缺少人事流程相关文档或索引','大模型计算资源不足'],exp:'RAG系统的核心机制依赖检索阶段获取相关文档作为生成回答的依据。若特定领域（如人事流程）问答效果差，根源可能在于该领域的文档未被正确收录或索引未覆盖相关内容，导致检索失败。检索失败直接影响生成阶段无法获得准确信息源，出现答非所问。其他因素如计算资源、温度参数或检索策略属于次要调整环节，优先级低于基础数据完整性问题。'},
  {id:286,type:'single',answer:'C',stem:'某创业公司开发的“AI法律助手应用，能自动生成合同条款与诉讼风险评估报告。在正式上线应用商店前，必须完成的最关键合规步骤是哪个？',opts:['获取信息系统安全等级保护三级认证','建立用户投诉赔偿基金','通过国家网信部门的大模型算法备案','为 AI 生成内容申请知识产权保护'],exp:'国家网信部门发布的《生成式人工智能服务管理暂行办法》明确要求生成式AI服务提供者应按规定履行算法备案手续。备案是对大模型算法进行合规审核的必要步骤，确保其生成内容符合法律伦理要求。其他选项虽涉及合规要素，但未直接对应生成式AI服务的准入前置条件。该规定可参考《互联网信息服务算法推荐管理规定》及《生成式人工智能服务管理暂行办法》（2023年）。选项A是法定义务，其余为可后续完善的机制。'},
  {id:287,type:'single',answer:'B',stem:'在为多轮对话场景设计的RAG应用中，大模型参与了什么步骤？',opts:['检索步骤、Query 改写步骤','Query 改写步骤、生成步骤','检索步骤、Query 改写步骤、生成步骤','只有生成步骤'],exp:'在为多轮对话场景设计的RAG（Retrieval-Augmented Generation，检索增强生成）应用中，大模型的作用主要体现在两个关键环节： 1. **Query改写步骤**：在多轮对话中，用户的提问可能存在指代不明、上下文依赖等问题。大模型可以利用其对自然语言的理解能力，结合对话历史，对原始Query进行改写或澄清，使其更符合检索系统的要求，从而提高检索的准确性。 2. **生成步骤**：在检索到相关文档或信息后，大模型会根据这些信息以及用户的Query，生成最终的回答。这一步骤需要大模型具备强大的语言生成能力，以确保回答的流畅性、准确性和相关性。 而检索步骤通常由专门的检索系统完成，它负责从大量文档中快速找到与Query相关的信息，并不直接涉及大模型的参与。 因此，大模型在RAG应用中主要参与了Query改写步骤和生成步骤，选项B是正确的答案。'},
  {id:288,type:'single',answer:'C',stem:'你作为一名医学检验研究员，需翻译存在大量"NSC（可能指“神经干细胞”或“非小细胞癌”缩写的文献。应如何设计提示词以消除歧义？',opts:['分配角色: “作为肿瘤科医生,严格匹配癌症相关术语 ”','要求输出格式: “所有缩写后需用括号标注全称 ”','提供少量上下文关联示例: “在‘干细胞培养 ’段落中,NSC→神经干细胞,在‘肺癌病理 ’段落中 ,NSC→ 非小细胞癌 ”','直接提问: “请优先将 NSC 翻译为神经干细胞 ”'],exp:'在医学文献翻译中，处理多义缩写的核心方法是结合上下文进行语义消歧。题干考察情境化提示词设计能力。参考医学翻译原则（如ISO/TR 22274:2018），上下文关联分析是解决术语歧义的关键手段。选项C通过提供特定段落场景与术语的对应关系，直接建立语境与术语的绑定机制，确保翻译准确性。相比之下，其余选项或依赖单一定向规则（A、D），或仅要求格式规范（B），均未解决动态语境下的术语选择问题。'},
  {id:289,type:'single',answer:'C',stem:'你开发了一个专用于医疗场景问答的RAG应用，为了找到优化方向，需要对其进行评测。以下哪个是参与评测必不可少的群体？ 选项：',opts:['算法工程师。只有算法工程师才可以更理解 RAG 应用的设计过程与细节。','数据工程师。数据工程师对数据质量、数据管道和检索系统的底层逻辑有深刻理解。','医疗专家。医疗专家具备领域专业知识,能够从临床实践和医学指南的角度验证 RAG 生成答案的准确性、安全性和实用性。','前端工程师。只有前端工程师更理解用户的交互逻辑,是最懂用户需要的群体。'],exp:'医疗领域的RAG应用评测需确保生成内容符合专业知识标准。医疗专家拥有临床经验与医学指南知识，可直接验证答案的准确性、安全性和实用性。其他角色（如算法、前端、数据工程师）虽涉及技术实现，但医学内容的权威性与安全性评定依赖领域专家。OpenAI GPT模型优化文档中提到，垂直领域模型评测必须引入领域专家以避免专业偏差。选项D体现专业场景中内容真实性与合规性的核心需求。'},
  {id:290,type:'single',answer:'A',stem:'在检索阶段，一般是如何找到知识库中最相关的文本段的？',opts:['通过 embedding 模型比较用户输入与各文本段的语义相似度','找出过往历史对话经常涉及的文本段,每次回复时都输入给大模型','比较用户输入与各文本段的重合字数','由大模型来判断哪个文本段最相关'],exp:'在信息检索中，核心任务是根据语义而非字面匹配寻找相关内容。选项A依赖字面重合，无法处理同义词或语义相近但表达不同的情况。选项B利用大模型直接判断，但在大规模知识库中效率低，通常用于后续生成而非检索阶段。选项C基于历史记录，缺乏动态适应新查询的能力。选项D通过embedding模型将文本映射到向量空间，计算语义相似度，有效捕捉深层关联。该方法广泛应用于现代检索系统中，如基于BERT的语义搜索或FAISS向量检索，符合当前技术实践。'},
  {id:291,type:'single',answer:'D',stem:'你想让RAG应用同时支持多种类型的信息查询，有些问“人名信息”，有些问“技术细节”。哪种的“提示词模板策略更适合？',opts:['对所有疑问一概使用相同的通用模板,不区分问题类型','先把所有问题都改成 “人事类 ”,让技术类问题也以人事视角回答','让用户在输入问题时手动指定要用哪种模板','根据问题类型(人事类 / 技术类) 自动选择对应模板'],exp:'需要设计提示词模板策略以适应多类型查询。参考RAG系统中提示工程优化原则：专用模板针对不同查询类型可提升检索及生成质量。选项A通过自动分类问题应用对应模板，针对性处理不同信息需求；选项B通用模板无法适配不同领域特点；选项C错误转换问题类别导致回答偏差；选项D依赖用户标注增加使用成本。正确策略应为系统自动识别类型并匹配模板。'},
  {id:292,type:'single',answer:'C',stem:'你让大模型为科技新闻生成标题,但输出标题过于平淡(如某公司发布新产品”)。以下哪种方法，更有助于生成你想要的标题：',opts:['调整输出格式: 要求标题全部大写','通过多轮对话, 明确告诉大模型不满意: “我觉得不好,再改改 ”','先增加上下文,补充产品关键信息,如果不好再会尝试增加一些样例','补充新闻稿中的发布会日期、会场地址和与会者人数'],exp:'解析：大模型生成内容优化方法的选择。该题考察如何通过改进输入信息提升生成效果。选项C通过补充关键信息为模型提供更丰富的上下文，帮助其捕捉核心亮点，后续样例可进一步引导生成风格。相比之下，A仅改变格式无实质内容优化；B的反馈缺乏具体方向；D补充次要信息未触及产品核心。正确方法需优先增强内容相关性，再通过样例调整表达方式，逐步细化输出结果。'},
  {id:293,type:'single',answer:'A',stem:'构建微调数据集时最重要的原则是？',opts:['包含丰富的问题场景','数据尽量由大模型生成','数据量越大越好','使用单一的问题模板'],exp:'微调数据集的关键在于提升模型在特定任务上的适应性和泛化能力。丰富的场景覆盖能确保模型接触多样化的输入分布，避免因训练数据单一导致的过拟合或偏差。例如，在问答系统中，多样的提问方式、不同领域的问题有助于模型理解复杂语境。选项B强调多样性，符合数据构建中广泛覆盖实际应用场景的原则。选项A仅关注数量忽视质量，选项C限制数据多样性，选项D可能引入生成数据的同质性问题。'},
  {id:294,type:'single',answer:'B',stem:'以下哪种方式可以更好地处理大模型返回结果中可能存在的错误或异常？',opts:['假设大模型总是返回正确的结果.','使用try-except块捕获潜在的异常.','在调用大模型之前进行输入验证.','不处理,直接使用返回结果.'],exp:'异常处理是编程中确保程序健壮性的关键机制。Python的异常处理通过try-except结构实现，能够捕捉代码执行时可能出现的错误。题目选项中，选项B直接关联异常捕获机制，符合处理外部服务不确定性的常见实践。选项A和D忽略潜在问题，选项C仅针对输入阶段，无法处理模型返回后的错误。异常处理适用于运行时错误管理，参考Python官方文档对异常处理的定义："Even if a statement or expression is syntactically correct, it may cause an error when executed." 正确做法是在可能出错的代码段包裹try-except。'},
  {id:295,type:'single',answer:'B',stem:'以下哪行代码能够正确调用百炼qwen-max模型进行对话补全?',opts:['python completion = client.chat.create ( model="qwen-max", messages= [{"role" : "user", "content" : "你好"}])','python completion = client. chat. completions. create ( model="qwen-max", messages= [{"role" : "user", "content" : "你好"}])','python completion = client. chat. completions. create ( model="qwen-max", records= [{"role" : "user", "content" : "你好"}])','python completion = client. chat.Completions. create ( model="qwen-max", messages= [{"role" : "user", "content" : " 你好"}])'],exp:'在OpenAI的API设计中，对话补全接口通常通过`client.chat.completions.create`方法调用，参数为`model`和包含消息列表的`messages`。选项B的代码结构符合这一规范，正确使用了`completions.create`及`messages`参数命名。选项A的`chat.create`层级错误，选项C的参数`records`不符合常见API参数名称。百炼模型的调用方式与OpenAI的设计类似。'},
  {id:296,type:'single',answer:'B',stem:'如果将top_p设置为一个非常小的值,例如 0.1,模型的生成结果会有什么特点?',opts:['生成结果长度会变短。','生成结果更加保守,倾向于选择概率最高的少数几个词,多样性降低。','生成结果长度会变长。','生成结果更加多样化。'],exp:'top_p 是一种文本生成中的采样策略。它通过限制模型只从累计概率达到 p 的最小词集合中进行采样,从而控制生成结果的多样性和质量 。当 top_p 较小时(例如 0.1),表示模型只会从极少数高概率的词中选择下一个词。当 top_p 较大时,模型可以考虑更多的候选词,包括低概率但可能更有创意或多样性的词。'},
  {id:297,type:'single',answer:'D',stem:'请问这个函数的主要作用是defsetdefaultmodel0:EMBED MODEL=DashScopeEmbedding(model name=DashScopeTextEmbeddingModels.TEXTEMBEDDINGV2,text type=DashScopeTextEmbeddingType.TEXT_TYPE_DOCUMENT,LLM MODEL=DashScope(modelname=\'qwen-plus\')Settings.embedmodel=EMBEDMODELSettings.llm=LLM MODEL',opts:['定义了 EMBED_MODEL 与 LLM_MODEL','使得 embedding 模型可以参与 LLM 的生成过程中','使得 LLM 可以流式输出','使得有关 Llamalndex 的后续步骤中无需再次指定 LLM 与 embed_model'],exp:'A - 虽然确实定义了这两个模型,但不是主要目的B - 嵌入模型不会直接参与LLM 生成过程C - 代码中没有涉及流式输出的设置'},
  {id:298,type:'single',answer:'A',stem:'、在使用AssistantAPl的Assistant类操作智能体过程中使用了如下代码，分析这段代码主要的作用是什么？FromdashscopeimportAssistantsAssistant=Assistants.retrieve (\'assistant_id\')',opts:['检索智能体','删除智能体','创建智能体','更新智能体'],exp:'此代码用于 根据 ID 检索已有的智能体,而非创建、删除或更新'},
  {id:299,type:'single',answer:'C',stem:'在RAG流程中，如何提高检索的效率？',opts:['增加 embedding 的维度','使用更大的预训练语言模型。','对向量数据库中的向量构建索引。','增加文档切片的粒度(例如将段落切成更小的片段)'],exp:'检索效率主要取决于向量查询的响应速度。在RAG流程中，向量数据库存储大量高维向量，直接全量搜索计算开销大。通过构建索引（如HNSW、IVF等），可显著减少检索时的比较次数，提升查询速度。增加embedding维度或使用更大语言模型会提高语义表达能力但增加计算负担；增大文档切片粒度可能降低召回率，均不直接提升检索效率。'},
  {id:300,type:'single',answer:'B',stem:'下面的 Python 代码执行了哪种文本预处理操作? import re cleaned_text=re.sub (r\'\W+\',",text)',opts:['词形还原','文本去噪(正则表达式清洗)','文本分类','文本翻译'],exp:'若代码为 re.sub (r\'\W+\', \'\', text),则会直接删除非单词字符(不留空格),但题目中替换为空格,仍属于去噪范畴。'},
  {id:301,type:'single',answer:'C',stem:'在大语言模型微调的数据准备阶段，哪个操作是为了将文本拆分成单词或词汇单元？ 选项：',opts:['文本翻译','数据去重','分词 (Token ization)','文本摘要'],exp:'在大语言模型微调的数据处理流程中，文本需转化为模型可处理的离散单元。分词是自然语言处理的基础步骤，其目的是将连续文本按语义或语法规则切分为单词、子词或符号序列，以便模型训练。文本摘要用于压缩内容生成关键信息，文本翻译涉及跨语言转换，数据去重聚焦于消除重复样本。该知识点参考自然语言处理领域的通用数据预处理流程。选项A对应分词的核心定义，其余选项均不涉及文本拆分操作。'},
  {id:302,type:'single',answer:'B',stem:'大模型在处理输入文本时，第一步通常执行的操作是？',opts:['计算候选 Token 概率','Token 可量化','计算 Embedding 后的向量','对输入文本进行分词(Token ize)'],exp:'在大语言模型的推理流程中，最先执行的步骤是把原始字符串拆分分成模型词表里的最小单元（token），并映射成token ID。只有完成Tokenize之后，模型才能为这些ID查表得到向量（Embedding），再进入后续的Transformer计算流程。所以分词/切分才是“第一步”。'},
  {id:303,type:'single',answer:'C',stem:'你需要大模型对用户输入的新闻内容进行分类（体育/经济/娱乐三种)，为提升易懂性且便于程序解析以下哪个提示词更合理？',opts:['请根据下面提供的内容判断其类别(体育 / 经济 / 娱乐),只输出判断结果。 内容是','请根据下面提供的内容判断其类别(体育 / 经济 / 娱乐) 。先输出思考过程,再在最后一行用 “结论. ” 开头写明类别。 内容是','请根据下面提供的内容判断其类别(体育 / 经济 / 娱乐),以 JSON 格式输出,"reason" 原因,"type" 类别。如 [体育 / 经济 / 娱乐] 内容是','请根据下面提供的内容判断其类别(体育 / 经济 / 娱乐),用符号分隔.思考过程 | 类别结果。 内容是'],exp:'该题考察提示工程中输出格式设计对结果解析的影响。合理提示词需满足用户对易懂性和程序解析友好性的需求。选项C要求以JSON格式返回结果，包含分类原因和类型，符合结构化数据标准，便于程序处理。相较其他选项，JSON格式兼具可读性与机器可解析性，如A无原因不利于理解，B、D格式非标准。根据需求，结构化且易解析的JSON为最优选。'},
  {id:304,type:'single',answer:'A',stem:'你已经开发了可以用于聊天的大模型应用，可以实现多轮对话、流式输出等功能。用户反馈希望在回答特定领域问题时要参考内部知识库，其他情况下不用。你应该怎么满足这个需求？',opts:['首先在检索功能中融入多轮对话改写机制,然后加入意图识别功能,判断该轮对话是否需要进行 RAG','需要从 0 到 1 实现文档加载、 内容分割、文本向量化、索引存储等复杂的功能','调整代码,在每一轮对话时检索相关内部知识文档片段,并组装到提示词模板中','要求用户在输入问题之外,还需要输入相关的文本段'],exp:'根据用户提出的需求——仅在回答特定领域问题时参考内部知识库，其他情况下不需要——需要设计一个能够智能判断是否进行知识检索（RAG）的机制。下面分析各选项的合理性： - **A选项**：首先在检索功能中融入多轮对话改写机制，然后加入意图识别功能，判断该轮对话是否需要进行RAG。 这个方案最为全面：多轮对话改写机制可以处理用户上下文（例如追问、省略等），意图识别则能区分用户问题是否属于需要参考内部知识库的特定领域，从而实现按需检索。这正是满足“仅在特定领域参考知识库”需求的合理技术路径。 - **B选项**：从0到1实现文档加载、内容分割、文本向量化、索引存储等复杂功能。 这描述的是构建RAG系统的基础步骤，但并未涉及“何时需要检索”的判断机制，无法满足按需检索的要求，且过于繁琐。 - **C选项**：在每一轮对话时都检索相关内部知识文档片段，并组装到提示词模板中。 这会导致每一轮都强制检索，与“其他情况下不用”的需求相悖，浪费计算资源且可能干扰非特定领域问题的回答。 - **D选项**：要求用户在输入问题之外，还需要输入相关的文本段。 这增加了用户的操作负担，不符合智能化和用户体验优化的要求，也不是合理的解决方案。 因此，正确答案是**A**，它通过意图识别与多轮对话改写结合，实现了按需检索的智能控制。'},
  {id:305,type:'single',answer:'C',stem:'你想针对一篇两栏性的论文对RAG应用进行提问，可回答效果不好，你发现后台日志中召回的文本段出现一句话没有说完就被另一句话截断的现象，问题可能出在哪里了？',opts:['embedding 模型在检索过程中将解析好的文本打乱顺序','rerank 模型对字符进行重排序导致语义不通','文档解析模块未正确处理分栏式 PDF 的版面结构,导致文本流顺序错乱','大模型无法准确还原论文的原本内容'],exp:'文档解析模块在处理分栏式PDF时，若未能准确识别版面结构，可能导致文本流顺序错乱。例如，分栏式PDF的左右栏内容可能被错误地交替拼接，而非按实际阅读顺序排列。此时解析后的文本会出现句子中途被其他栏的文本截断。相关技术文档常提及PDF版面分析对分栏结构的敏感性，若解析算法未针对性处理，易导致此类问题。选项A涉及embedding模型，仅处理向量化而非文本顺序；选项B中的rerank模型通常调整段落权重而非字符顺序；选项D属于生成阶段而非解析阶段问题。'},
  {id:306,type:'single',answer:'B',stem:'你需要大模型输出公式化、格式固定的答案，不希望因随机因素导致格式或内容风格频繁变化。为在此场景下控制大模型的输出“一致性”，以下哪种做法更合适?',opts:['调高 temperature 并增大 presence_penalty','将 temperature 调低并设置固定 seed','将 temperature、top_k 调高','将 temperature、top_p 调高'],exp:'在生成模型中，temperature参数控制输出的随机性，较低值会减少多样性，提高确定性。设定固定seed可确保相同输入生成相同输出。OpenAI文档指出，temperature调低与固定seed的组合能稳定生成结果。选项A和D调高参数会增加随机性，与目标矛盾。选项C虽调整惩罚项，但temperature过高仍导致波动。选项B通过降低随机性、固定随机种子，使输出更符合格式固定需求。'},
  {id:307,type:'single',answer:'A',stem:'你在开发公司内部制度问答机器人时，将所有制度文件都输入到大模型中，导致输入超长报错，应优先采用哪种方案？',opts:['使用 RAG,检索最相关的文本段后再输入到大模型','增加生成 Token 的数量','降低 temperature 值','通过参数调大模型的最大输入长度'],exp:'考查在大模型输入超长报错场景下,对解决该问题有效方案的掌握,涉及大模型应用中处理输入长度超限问题的相关知识,重点是对 RAG(检索增强生成) 等技术及模型参数调整作用的理解 。答案为 A,RAG 可通过检索相关文本段,筛选关键内容输入,避免超长问题;B 增加 Token 数量不解决输入超长;C 降低 temperature 影响输出随机性,与输入超长无关;D 调整最大输入长度非优先且可能受模型限制 。'},
  {id:308,type:'single',answer:'D',stem:'在大模型调用外部 API 工具时,你发现 agent 经常调用错误工具。经过调查,最可能的原因是什么?',opts:['大模型缺乏足够的并行处理能力','网络延迟导致工具调用超时','工具函数调用过程中存在严重的内存泄漏','工具函数描述信息不够明确,未能准确说明调用时机和用途'],exp:'工具函数描述信息不够明确时，大模型难以准确判断调用时机和用途，在面对功能相似的多个工具时，就容易错误调用其他工具，从而影响系统性能和准确性。'},
  {id:309,type:'single',answer:'A',stem:'你发现RAG应用召回的切片内容虽然和问题相关，但并不包含真实答案。最优先的排查和改进方向是什么？',opts:['检查 Embedding 模型的类型及版本','尝试调低 top_k,减少召回范围','优先在弱关联层隐藏检索结果,只呈现大模型的最终回答','为每一条切片附详细的前置叙述,希望大模型自动补齐缺失内容'],exp:'Embedding模型的质量直接影响检索结果的准确性。在RAG系统中，若切片与问题相关但无真实答案，可能因Embedding模型对语义空间映射不精准导致召回偏差。不同模型类型或版本在表征能力、领域适应性上差异显著。相关文献如《Improving Document Representations by Generating Pseudo Query Embeddings》指出，Embedding模型的选择显著影响语义匹配效果。选项B可能加剧漏检，C/D均未解决召回根源问题。A直接针对检索环节的核心组件，排查模型能力限制是优先级最高的改进方向。'},
  {id:310,type:'single',answer:'A',stem:'你想在面向高中生的技术分享里，用大模型生动地解释阿里云弹性容器实例(ECI)的基本原理。下列哪种提示词最能实现“易懂、形象化的效果？',opts:['请以高中生能理解的方式,使用生动比喻讲解 ECI 原理。','简短介绍 ECI 功能即可。','写一篇详尽 ECI 论文,全部使用专业术语。','仅列出 ECI 命令和参数列表。'],exp:'题目要求选择能“易懂、形象化”解释阿里云弹性容器实例（ECI）的提示词，面向高中生群体。正确选项需兼顾理解门槛和表达方式的生动性。选项C明确要求使用高中生能理解的生动比喻，符合教育传播中“类比教学法”原则，将抽象技术原理转化为贴近生活的例子，降低认知难度。选项A的学术化表述、选项B的简略功能描述、选项D的纯技术参数均无法有效实现形象化讲解的目标。参考教育心理学中“图式理论”，类比有助于学习者建立新旧知识联系。'},
  {id:311,type:'single',answer:'D',stem:'如果你基于网页版的大模型写了以下提示词.（请你生成一份一季度财务报告）。以下哪些建议是合理的，可以帮助改进这个提示词？',opts:['提供公司特有的财务报告格式模板或示例, 以确保生成的报告符合格式要求。','提供具体的财务数据和关键指标, 以便模型能够准确地填充报告。','指定该报告的期望长度。','以上所有'],exp:'大语言模型生成特定领域文档需结合结构化输入、数据支持和明确格式要求。OpenAI提示工程指南建议用户提供详细背景、关键数据及期望输出结构。选项A确保格式规范性，B提升内容准确性，C控制详略程度，三者均属有效提示优化策略。答案D综合了这三方面改进措施。'},
  {id:312,type:'single',answer:'C',stem:'有用户使用“找张伟这类极简搜索，RAG系统经常没能检索到所需文档，最合理的技术改进是什么？',opts:['将所有文档发布成内部 Wiki','在回答时修改用户的问题','在检索前先用大模型进行问题改写扩充','让用户输入更多关键词'],exp:'RAG系统在处理极简查询时，由于用户输入信息过少，可能导致检索失败。问题核心在于查询信息量不足以匹配文档内容。根据RAG优化策略，直接解决方案是在检索阶段对原始问题进行语义扩展，增加上下文信息，提升检索命中率。选项C通过大模型对问题进行改写和补充，主动丰富查询内容，而非依赖用户提供更多关键词或事后修正，更符合检索优化逻辑。其他选项或未直接解决检索阶段的缺陷（如B、D），或属于内容组织形式调整（如A），无法针对性提升检索能力。'},
  {id:313,type:'single',answer:'C',stem:'用户只说“想了解工作职责”，但没说明具体岗位。RAG检索到多个岗位职责信息都可能匹配。最合理的做法是？',opts:['使用 HyDE 生成假想文档','将问题改写为多步查询','提示词中设定用户提供信息不足时, 向用户反问需要哪个岗位','返回所有岗位的职责'],exp:'当用户未明确岗位信息时，系统应主动引导补充关键信息，以确保检索精准性。根据人机交互规范，面对信息不完整场景，应通过反问方式确认用户意图，避免返回冗余或无关内容。提示词设计需具备引导性，促使用户提供具体岗位名称，从而提升服务效率与准确性。'},
  {id:314,type:'single',answer:'C',stem:'某大模型客服系统被攻击者通过提示词注入获取机密数据，以下哪个措施能更有效防范这一问题？',opts:['改进提示词,让大模型避免回答这类问题','改进提示词,确保模型在回答问题时避免回答列表形式的内容','在知识检索阶段严格控制用户的查询访问权限,过滤掉非法请求并报警','改进提示词,并且在输入阶段过滤掉敏感关键词'],exp:'攻击者通过提示词注入获取机密数据的关键在于绕过模型直接访问底层数据。改进提示词或过滤关键词属于应用层防御，存在被绕过的可能。根据数据安全最佳实践，权限控制应在数据访问的源头实施。选项C在知识检索阶段限制访问权限，从源头阻断非法查询，结合过滤报警机制，属于纵深防御策略中的核心措施。其他选项依赖模型自身行为，无法防止攻击者直接构造恶意请求访问数据存储层。'},
  {id:315,type:'single',answer:'D',stem:'构建RAG应用时，建立索引阶段的正确顺序是？',opts:['文档加载 - 文本向量化 - 向量分割 - 索引存储','内容分割 - 文本向量化 - 索引存储','文档加载 - 文本向量化 - 索引存储','文档加载 - 内容分割 - 文本向量化 - 索引存储'],exp:'构建RAG（检索增强生成）应用时，建立索引阶段的核心目的是将原始文档转换为可供高效检索的向量化表示，其正确顺序必须遵循数据处理逻辑：首先需要将文档加载到系统中，然后对文档内容进行合理分割（分块），以确保后续向量化的质量和检索的准确性，接着将每个文本块转化为向量，最后将向量及其对应的元数据存储到索引数据库中。 因此，正确的顺序应为：文档加载 → 内容分割 → 文本向量化 → 索引存储。选项A和C缺少内容分割步骤，选项B则忽略了文档加载，均不符合标准流程。 **答案：D**'},
  {id:316,type:'single',answer:'B',stem:'你开发了一个RAG应用，用户反馈说回复效果不佳。你通过后台日志发现用户的输入有时缺少信息，如教研部”、“请假”，你应该优先进行哪方面的优化？',opts:['优化文档切分策略','更换检索速度更快的向量数据库','调整大模型的 top_p 参数','结合历史常见问题,使用大模型对 query 进行改写'],exp:'用户只输入“教研部”“请假”等碎片词时，检索端无法准确召回文档，导致答案质量下降。最有效且成本最低的第一步是利用大模型+历史日志对不完整的Query做补全与改写，将其扩展成表达完整意图的检索语句（如“教研部的职责是什么？”、“请假流程怎么走？”），再送入向量检索层。换库提速解决不了召回不到相关内容的问题；调top_p仅影响生成多样性；优化切分对输入信息缺失无帮助。'},
  {id:317,type:'single',answer:'C',stem:'假设你正在使用一个大语言模型开发智能客服系统，希望生成的回复尽量简短，以适应短信通知的长度限制，要求短信语义完整。以下哪种方式更有可能实现这一目标？ 选项：',opts:['通过明确提示词引导,在提示词中写明 “请将答案控制在 100 字以内 ”。','通过模型微调优化,对模型进行专门训练,使其具备生成短文本的能力。','通过 API 参数限制,设置 max_token=100 以约束生成文本的长度。','在后端逻辑中使用正则表达式方法对生成结果进行后处理。'],exp:'题干考察对大语言模型生成文本长度控制方法的理解。OpenAI文档指出，明确提示词可有效引导模型输出符合特定格式要求。选项A直接传递用户需求，模型能根据上下文调整生成策略，确保语义完整前提下精简内容；选项B需额外训练成本且可能影响模型通用性；选项C的token限制与字符数非严格对应，易导致截断或冗余；选项D的后处理可能破坏文本连贯性。'},
  {id:318,type:'single',answer:'D',stem:'你正在使用Qwen-Plus生成商品介绍文档，完整的提示词是“请帮我生成我们公司最新智能手表的产品介绍”。但你发现生成的内容是介绍其他公司的产品。以下策略中,应首先尝试的是？',opts:['调低 Top-p 值缩小候选词范围','调低温度参数(Temperature) 以降低随机性','提高 Top-p 值扩大候选词范围','改进提示词(明确产品信息、文档主题和结构)'],exp:'该题考察生成式AI应用中的提示词设计有效性。当生成内容偏离预期时，首要解决思路应从输入信息精准度入手。原提示词仅有基础需求陈述，缺乏公司特色参数、产品核心卖点及框架指引等关键信息，导致模型基于通用数据生成。调整温度或抽样参数属于输出控制手段，在输入信息不完备的情况下难以校准生成方向。OpenAI官方文档及提示工程最佳实践均指出：清晰的结构化指令对生成内容相关性起决定性作用。选项C通过细化产品特征、定义文档框架，能有效锚定生成路径，属于问题溯源式解决方案。'},
  {id:319,type:'single',answer:'D',stem:'某企业开发了一款面向医疗领域的RAG应用，用户反馈称生成的诊断建议经常不准确，且回答内容缺乏针对性。经过初步分析，发现检索模块召回的相关文档质量较低，同时生成模块对复杂医学术语的理解能力不足。作为开发者，你认为以下哪种优化策略最有效？',opts:['增加计算资源,提升大模型的推理速度,确保快速生成回答。','针对每个用户的反馈逐一调整生成结果,确保满足个性化需求。','通过修改 prompt 模板来引导模型生成更准确的回答。','总结用户反馈中的常见问题,通过多维度评测指标(如准确性、相关性) 找到回复质量较低的原因并进行针对性优化。'],exp:'该问题聚焦于提升面向医疗领域的RAG应用效果，核心挑战在于检索文档质量低与生成模块对医学术语理解不足。用户个性化调整（A）无法解决系统性问题；单纯提升推理速度（C）与问题无关；修改prompt（D）可能缓解生成问题但忽略检索环节。选项B强调通过系统性分析用户反馈并结合多维评测（如准确性、相关性）定位问题根源，能够同时优化检索与生成模块，符合实际工程中“数据驱动优化”的典型方法。类似思路可见于RAG优化案例，如结合评测指标拆解模块瓶颈（如《Neural Approaches to Retrieval-Augmented Generation》相关研究）。'},
  {id:320,type:'single',answer:'D',stem:'在优化检索效果时，若知识库内容充足但精确率低，以下哪种方法是合理的？',opts:['增加查询请求的并发量以加快响应速度','增加知识库文档','降低相似度阈值','加入 rerank 的步骤'],exp:'在信息检索系统中，当知识库内容充足但精确率较低时，关键在于优化结果排序而非扩大召回范围。降低相似度阈值（A）可能导致更多无关结果被召回，加剧精确率问题。增加知识库文档（B）与题干“内容充足”的前提矛盾。增加并发量（D）仅影响响应速度，无关结果质量。加入rerank步骤（C）通过二次排序模型对初筛结果重新打分，能够有效提升结果精度。该方法借鉴了两阶段检索框架（如ColBERT、DPR等），第一阶段粗筛保证召回率，第二阶段精细化排序优化精确率，符合实际工程实践中解决精确率不足的核心思路。'},
  {id:321,type:'single',answer:'A',stem:'你在开发一个内部IT系统，希望能够自动处理员工的请求．“我的投影仪故障了，请安排维修并通知下午会议改线上”。以下哪种技术方案有效、且能尽量减少人力投入？',opts:['通过提示词引导大模型拆解任务为多步骤,然后自动调用维修系统和会议系统 API 完成操作。','通过提示词引导大模型直接生成维修工单和会议调整结果,无需调用现有系统。','通过大模型判断接单人, 自动将任务指派给接单人,通知其创建维修工单并调整会议。','识别请求中的关键字(如 “投影仪故障 ”“会议改线上 ”),匹配规则系统后调用 API 完成任务。'],exp:'该题考查自动处理自然语言请求的技术方案选择。根据题干需求，有效且最小化人力投入的方案需结合自然语言理解与系统自动化操作。选项C通过提示词引导大模型拆解任务并调用API，既利用大模型的语义理解能力，又通过API直接操作现有系统，实现端到端自动化。选项B依赖静态规则，灵活性不足；选项A/D分别存在依赖人工接单或未实际调用系统的问题。正确答案为C。'},
  {id:322,type:'single',answer:'A',stem:'公司新发了《远程办公规定》，你想让现有答疑机器人掌握这份规定的内容。基于已经搭建好的RAG应用，你应该怎么做？',opts:['在提示词模板中增加远程办公规定的内容','将新文档分块后更新向量数据库','微调大模型以确保大模型能理解新规定的内容','使用纯规则引擎匹配'],exp:'在RAG（Retrieval-Augmented Generation）架构中，知识的“注入”首选做法是：按既定切分策略把《远程办公规定》拆成合适大小的文本块；对每个块生成向量并写入现有向量数据库（或覆盖旧版本）；运行增量/全量索引，使检索层能够把最新内容召回并随查询一起发送给大模型。这样无需改动提示词模板、也不必微调模型，就能让答疑机器人实时掌握新规。'},
  {id:323,type:'single',answer:'B',stem:'模型微调最适合以下解决哪种问题？',opts:['需要实时检索最新互联网信息的任务','需要提升模型在特定任务的表现','需要快速响应简单问答的任务'],exp:'相关知识点：微调通过领域数据适配模型参数，针对性优化任务性能。'},
  {id:324,type:'single',answer:'C',stem:'下面是qwen2.5-1.5b微调训练过程中的损失趋势图，当前的状态是？',opts:['欠拟合','过拟合','训练失败'],exp:'相关知识点：训练失败表现为训练损失不下降，反而上升。'},
  {id:325,type:'single',answer:'C',stem:'你是某金融APP的智能投顾系统负责人，发现用户存在恶意咨询的情况，如涉及“内幕消息”等敏感词。为了在检测到敏感词时立即返回固定话术，以下哪种方案最能满足需求？',opts:['在生成回答后追加合规性二次审核','对知识库文档进行预筛查标记','在用户提问时启用敏感词实时检测'],exp:'前置检测可即时拦截并返回固定话术，避免生成后审核的延迟。'},
  {id:326,type:'single',answer:'B',stem:'你开发智能会议助手时遇到技术选型问题，“需要将会议录音转换为文字记录，并自动生成带有重点标注的摘要，最后将摘要内容转换为语音播报”。以下技术组合中最合理的是？',opts:['cosyvoice->v1 语音合成->Qwen-VL 视频理解->ComfyUI 文生图','语音转文本服务->文本生成模型->cosyvoice-v1 语音合成','MoviePy 视频剪辑->文本生成模型->ComfyUI 生成摘要图表'],exp:'流程依次覆盖语音转文字、摘要生成、语音播报，技术链路完整。'},
  {id:327,type:'single',answer:'B',stem:'你正在开发一个可以自动回答客户问题的客服平台。除了回答产品知识问题外，你希望它还能执行与账户相关的操作（例如实时查询用户订单状态、修改账户绑定的手机号、提交工单或退款申请)。你应该考虑引入什么技术来扩展大模型的能力？',opts:['RAG(Retrieval Augmented Generation)','Agent(智能体)','大模型微调'],exp:'Agent可调用外部接口（如账户数据库），补充模型无法直接访问的数据。'},
  {id:328,type:'single',answer:'C',stem:'在测试RAG应用性能时，你发现检索阶段总是出现不太相关的段落。为了提高检索准确度，你应该怎么做?',opts:['尝试增加大模型重复惩罚系数,避免召回不相关内容','尝试使用领域相关知识微调大模型,让其能更好的识别相关段落','尝试调整embedding模型、并使用重排(rerank)'],exp:'优化Embedding模型和重排（rerank）可改善语义匹配，减少无关段落召回。'},
  {id:329,type:'single',answer:'A',stem:'你在优化RAG应用时，检索条件设置得非常宽松，相似度很低的文本段也可以被召回。这可能会导致出现以下哪种情况',opts:['Context Recall(文本段召回率)变高','Context Recall(文本段召回率)变低','Context Recall(文本段召回率)基本不变'],exp:'宽松检索可能召回更多相关但低相似度的段落，提升召回率但可能牺牲精确率。'},
  {id:330,type:'single',answer:'A',stem:'你将PDF文档转成普通文本后，RAG的检索质量变差。下列哪种做法最能提升检索准确度？',opts:['将文本转成更结构清晰的Markdown','提前把文档压缩成ZIP再索引','调整大模型输出温度(temperature)'],exp:'相关知识点：Markdown保留结构化信息（标题、列表），比纯文本更利于语义理解。'},
  {id:331,type:'single',answer:'C',stem:'你在开发一个基于RAG的智能客服系统，用于回答用户关于产品功能的技术问题。为了提升回答的准确性，你调整了检索模块的相似度阈值，从默认的0.7提高到了0.95。然而，测试后发现，部分用户的提问得不到满意的回答。可能的原因是什么？',opts:['检索模块的计算复杂度增加,导致大模型推理速度变慢','用户提问的语言风格与产品文档内容不一致,导致检索失败','回答准确但不全面,因为过于严格的检索条件过滤掉了部分有用的上下文信息'],exp:'阈值过高可能导致有用内容被过滤，回答准确但不全面。'},
  {id:332,type:'single',answer:'D',stem:'你为教育公司搭建了RAG问答系统，且知识库存储了各部门的机密数据据（如财务部的薪资表、教务部的未公开课件）。为了确保普通员工只能访问自己有权限的数据，以下哪种做法最合适？【【试题选项缺失，请补充】',opts:['预处理用户问题时强制添加"请仅回答我部门数据"的提示词','对大模型进行微调使其主动拒绝跨部门问题','为每个用户单独生成加密密钥用于访问知识库','<选项缺失>'],exp:'在检索阶段过滤无权限文档，安全性和效率兼顾。'},
  {id:333,type:'single',answer:'B',stem:'某RAG系统回答“张伟是哪个',opts:['换用更大参数数量的大模型','提高检索时的召回数量(Top K)','放弃知识库,全部"对话式"推理'],exp:'增加召回数量（Top K）可扩大候选范围，减少遗漏相关段落。'},
  {id:334,type:'single',answer:'C',stem:'你所在的医院技术部正在翻译一份医学影像技术手册，包含上千条内部非公开的专业术语与缩写。如果想在翻译时保证准确性，并减少对大量示例的依赖，以下哪种做法更合适？',opts:['仅提供少量缩写翻译示例.如"MRI —>磁共振成像","CT —>计算机断层扫描",让大模型依照模仿.','分配"专业医学翻译员"角色,依靠零样本提示直接解决','接入专业术语库,并使用RAG技术,以动态查询并统一术语标准'],exp:'医学影像技术手册翻译涉及大量非公开术语，需确保准确性且减少示例依赖。RAG技术结合专业术语库能动态检索统一术语标准，避免零样本或少量示例导致的不一致。选项A依赖有限示例无法覆盖全部术语，B的零样本提示难以处理非公开术语的专业性。C通过集成术语库和RAG确保术语一致性，直接解决准确性和效率问题。来源：医学翻译最佳实践常强调术语一致性，RAG技术在信息检索与生成结合中的应用案例。'},
  {id:335,type:'single',answer:'C',stem:'假设你正在使用大模型解决以下数学问题：“小明每天存入银行10元钱，但每周末（周六和周日）会取出20元用于消费。如果小明从某周一（第一天）开始存钱，请问小明需要多少天才能存够100元？”为了提升大模型解答此类问题的准确率，以下哪种提示方法最能有效引导大模型生成正确的答案？',opts:['提供少量样例','明确输出要求','思维链方法'],exp:'思维链（Chain-of-Thought）引导模型分步推理，适合需要逻辑推导的数学问题。'},
  {id:336,type:'single',answer:'B',stem:'分词1 (Tokenization)）的主要作用是什么？',opts:['将文本转换为固定长度的向量','将输入文本分割成单词、子词或字符等更小的语义单元','提取文本的语义特征以计算情感值'],exp:'分词将文本分割成单词、子词或字符，是模型处理自然语言的基础步骤，而非直接生成向量或提取语义。'},
  {id:337,type:'single',answer:'D',stem:'你开发了一个聊天机器人，用户反馈每次提问后总是要等很久才能看到回复，你应该怎么做？ 选项：',opts:['在生成间隙通过前端界面展示动画,减少用户等待的疲惫感','提醒用户输入尽量少的提示词','降低temperature值','首选流式输出'],exp:'在阿里云通义大模型API中，可以开启stream模式，让服务端边生成边把token推送给前端。这样首个字符极快就能到达浏览器，显著降低用户的感知等待时间；同时前端还能配合“打字机”效果进一步提升体验。而调整temperature、减少提示词或仅用动画，并不能从根本上缩短响应时间或改善首Token延迟，所以首选流式输出。'},
  {id:338,type:'single',answer:'D',stem:'大模型如何判断什么时候应该停止输出？【试题选项缺失，请补充】',opts:['需要用户手动打断','只会在输出长度达到阈值时停止','当模型检测到生成内容与输入主题无关时自动停止','<选项缺失>'],exp:'大模型在推理阶段一般会同时设置两类“终止条件”：1.最大输出长度（max_tokens）当生成的token数量达到预设上限时，服务端会自动结束本轮生成。2.终止标记（Stop/ EOS Token）语言模型的词表中包含专门的End-of-Sentence / End-of-Sequence token；一旦模型预测出该标记，就会立即停止继续采样。只有同时满足其一时才会真正停止输出。'},
  {id:339,type:'single',answer:'A',stem:'公司新发了《远程办公规定》，你想让现有答疑机器人掌握这份规定的内容。基于已经搭建好的RAG应用，你应该怎么做？',opts:['将新文档分块后更新向量数据库','在提示词模板中增加远程办公规定的内容','微调大模型以确保大模型能理解新规定的内容'],exp:'在RAG（Retrieval-Augmented Generation）架构中，知识的“注入”首选做法是：按既定切分策略把《远程办公规定》拆成合适大小的文本块；对每个块生成向量并写入现有向量数据库（或覆盖旧版本）；运行增量/全量索引，使检索层能够把最新内容召回并随查询一起发送给大模型。这样无需改动提示词模板、也不必微调模型，就能让答疑机器人实时掌握新规。'},
  {id:340,type:'single',answer:'C',stem:'你准备为企业内部人事系统搭建一个多轮问答功能，现有历史对话：“张三的办公楼在哪？”，“在A栋一楼”，“他的主管是谁？”。你应该怎么设计检索步骤？ 选项：',opts:['对"主管"进行同义词扩展,包含"领导"、"上级"等,提高召回率','提高检索的相似度阈值,确保不包含无用信息','结合对话历史改写query,再进行检索'],exp:'在多轮对话场景中，后续提问往往含有省略或指代（如“他的主管是谁？”中的“他”指“张三”）。正确做法是先根据对话上下文将用户当前Query重写为完整的查询（例如“张三的主管是谁？”），然后再送入检索层。这样既能确保检索到与张三相关的准确信息，又不会因为缺失实体而召回大量无关结果。单纯做同义词扩展、调阈值或混检策略都不足以解决上下文消歧问题。'},
  {id:341,type:'single',answer:'B',stem:'大模型在处理输入文本时，第一步通常执行的操作是？',opts:['Token 向量化','对输入文本进行分词(Tokenize)','计算候选 Token 概率'],exp:'在大语言模型的推理流程中，最先执行的步骤是把原始字符串拆分分成模型词表里的最小单元（token），并映射成token ID。只有完成Tokenize之后，模型才能为这些ID查表得到向量（Embedding），再进入后续的Transformer计算流程。所以分词/切分才是“第一步”。'},
  {id:342,type:'single',answer:'A',stem:'你在调用通义千问API时设置了temperature（温度）参数，以下哪种说法是正确的?',opts:['温度参数越高,候选 Token 的概率值会越接近,从而带来更高的随机性','温度参数越高,候选 Token 的概率值之间的差距会变大,从而带来更高的随机性','温度参数越高,低概率的候选 Token 有概率超过高概率的候选 Token 的概率'],exp:'在调用通义千问 API 时，temperature（温度）参数用于控制生成文本的随机性。温度参数越高，模型对候选Token的概率分布影响越大，原本概率差异较大的Token概率会趋于接近，即概率值更接近，从而带来更高的随机性。而选项B中概率值差距应变小，选项C描述不准确，低概率Token不会直接超过高概率Token概率，只是相对差距缩小。所以选项A正确。易错提醒：注意温度参数对概率分布的影响是使概率更接近而非差距变大。'},
  {id:343,type:'single',answer:'B',stem:'在为多轮对话场景设计的RAG应用中，大模型参与了什么步骤？',opts:['只有生成步骤','Query 改写步骤、生成步骤','检索步骤、Query 改写步骤、生成步骤'],exp:'在为多轮对话场景设计的RAG（Retrieval-Augmented Generation，检索增强生成）应用中，大模型的作用主要体现在两个关键环节： 1. **Query改写步骤**：在多轮对话中，用户的提问可能存在指代不明、上下文依赖等问题。大模型可以利用其对自然语言的理解能力，结合对话历史，对原始Query进行改写或澄清，使其更符合检索系统的要求，从而提高检索的准确性。 2. **生成步骤**：在检索到相关文档或信息后，大模型会根据这些信息以及用户的Query，生成最终的回答。这一步骤需要大模型具备强大的语言生成能力，以确保回答的流畅性、准确性和相关性。 而检索步骤通常由专门的检索系统完成，它负责从大量文档中快速找到与Query相关的信息，并不直接涉及大模型的参与。 因此，大模型在RAG应用中主要参与了Query改写步骤和生成步骤，选项B是正确的答案。'},
  {id:344,type:'single',answer:'A',stem:'你在为一个创意写作工具调整大模型生成内容，以下哪个参数可以用来控制生成内容的多样性？',opts:['temperature','max_token','stream'],exp:'A在大模型中它是控制生成随机性的参数,温度值越高,生成内容的随机性越大,多样性就越强;温度值越低,生成内容越保守,重复度可能越高。所以它能控制生成内容的多样性。B. 该参数通常与流式输出相关, 即模型是否边生成内容边返回给用户,与内容多样性无关。C此参数用于限制生成内容的最大 token 数量,决定了生成内容的长度,不影响多样性 。D. 这是应用程序访问模型接口的密钥,用于身份验证和授权,与生成内容的特性毫无关联。'},
  {id:345,type:'single',answer:'C',stem:'你需要借助大模型为小学生写一篇关于“保护环境”的科普短文，但输出的内容过于学术化（如频繁使用“碳达峰生物降解”等术语）。以下哪个提示词优化方向最能直接解决该问题？',opts:['补充任务目标:要求文章包含"垃圾分类对社区的影响"案例','扩展上下文:添加背景"当前城市垃圾填埋占比超过 60%"','定义角色与受众:以"小学科学老师"身份,用比喻和故事向"6-12 岁学生"讲解'],exp:'当前痛点是文本“过于学术化”。最直接的解决思路就是在提示词里明确写作角色和目标读者，让模型自动调整措辞和深浅——例如以“小学科学老师”身份，用符合 6-12 岁学生认知水平的比喻、故事和互动提问来阐述概念。这样能根本性地降低专业术语密度，保证语言平实易懂。'},
  {id:346,type:'single',answer:'D',stem:'你在优化一个多语言翻译系统，发现文学翻译经常“失去原文意境”，而技术文档翻译经常“用词生硬、难以理解”。现有提示词已包含“保持专业性”和“语言流畅”要求，并添加了示例。下一步最应优先尝试的策略是？',opts:['要求模型分两次翻译:先直译再人工润色','提高温度参数(Temperature=1.0)增强灵活性','在现有模板中增加更多诗歌和手册的对照示例','先直译再人工润色增加人工成本且违背系统自动化目标.'],exp:'文学与技术文档对译文风格的要求截然不同：文学更强调意境、韵味、修辞；技术强调准确、术语一致、易于理解。在同一个提示词里同时满足二者往往顾此失彼。将两类文本拆分、为每类单独配置提示词模板，能精准地约束生成风格（例如文学模板强调“保留情感与意象”，技术模板强调“术语一致、句式简明”），是最直接且高效的改进路径。增加诗歌/手册示例虽有帮助，但因场景差异过大，示例混在一起效果受限；提高 temperature 只会让输出更随机，并不能针对性解决失真或生硬问题；先直译再人工润色增加人工成本且违背系统自动化目标。'},
  {id:347,type:'single',answer:'D',stem:'你正在使用Qwen-Plus生成商品介绍文档，完整的提示词是“请帮我生成我们公司最新智能手表的产品介绍”。但你发现生成的内容是介绍其他公司的产品。以下策略中，应首先尝试的是?',opts:['调低温度参数(Temperature)以降低随机性','调低 Top-p 值缩小候选词范围','改进提示词(明确产品信息、文档主题和结构)'],exp:'该题考察生成式AI应用中的提示词设计有效性。当生成内容偏离预期时，首要解决思路应从输入信息精准度入手。原提示词仅有基础需求陈述，缺乏公司特色参数、产品核心卖点及框架指引等关键信息，导致模型基于通用数据生成。调整温度或抽样参数属于输出控制手段，在输入信息不完备的情况下难以校准生成方向。OpenAI官方文档及提示工程最佳实践均指出：清晰的结构化指令对生成内容相关性起决定性作用。选项C通过细化产品特征、定义文档框架，能有效锚定生成路径，属于问题溯源式解决方案。'},
  {id:348,type:'single',answer:'C',stem:'你正在尝试使用大模型Qwen-72B完成一个用户反馈分类任务，但效果不佳。以下选项中，你应首先考虑的策略是？',opts:['微调大模型(Fine-tuning)','换用 Qwen-14B 模型','改进提示词(Prompt Engineering)'],exp:'在处理大模型应用效果优化时，改进提示词通常是首要考虑的步骤。大型语言模型如Qwen系列的性能高度依赖输入提示的清晰度和任务对齐。调整提示词无需额外训练数据或计算资源，能快速验证和迭代。微调需要特定数据集和训练成本，换用更小模型可能导致性能下降，温度参数主要影响生成多样性而非任务准确性。OpenAI等机构推荐优先通过提示工程优化模型输出，再进行其他复杂操作。'},
  {id:349,type:'single',answer:'B',stem:'你需要大模型对用户输入的新闻内容进行分类（体育/经济/娱乐三种)。为提升准确性且便于程序解析，以下哪个提示词更合理？',opts:['请根据下面提供的内容判断其类别(体育/经济/娱乐),只输出判断结果.内容是:...','请根据下面提供的内容判断其类别(体育/经济/娱乐).以 JSON 格式输出 [{"reason": "原因", "type": "类别,如:体育|经济|娱乐"}] 内容是:...','请根据下面提供的内容判断其类别(体育/经济/娱乐).先输出思考过程,再在最后一行用"结论:"开头写明类别.内容是:...'],exp:'需要兼顾准确率与程序解析的便利。结构化 JSON 既保留了模型给出分类依据（reason），又让后续代码可直接反序列化读取字段，最符合“便于程序解析”的要求。纯文本缺少理由且解析麻烦；带思考过程的不仅泄露冗余内容，也增加解析复杂度。'},
  {id:350,type:'single',answer:'B',stem:'你是某公司IT部门主管，想使用大模型生成符合公司内部编码规范的JaVa代码模板，请问以下哪个提示词更合适？',opts:['请帮我生成一份java代码,用于…','请帮我生成一份java代码.需求是:...要求是:符合下列编码规范...','请逐步分析需求,然后生成一份java代码.需求是:...'],exp:'生成符合公司编码规范的代码需明确规范内容。A未提规范，D用开源风格不符内部要求，C缺规范指向，B直接要求符合所列编码规范，提示具体且匹配目标。提示词应清晰限定约束条件，避免笼统或外部参照，以确保输出贴合内部标准。'},
  {id:351,type:'single',answer:'C',stem:'你开发了一个RAG应用，发现其在回答内部流程问题（如“报销系统登录方式"）时准确率高，但回答通识性问题（如“如何修复Excel公式错误”）时质量差。应该优先尝试以下哪个改进方案？',opts:['禁用RAG,所有问题依赖大模型回答','扩大RAG检索范围,加入公开技术文档','结合意图识别,公司内部问题才执行检索增强'],exp:'目前的向量库只覆盖了公司内部流程文档，所以当问题属于内部场景时，RAG 能检索到命中片段并生成高质量回答；对于通识性问题，检索不到合适文档，模型却仍被“拼接”了空或噪声上下文，导致回答变差。最先应做的改进是：用意图/领域分类器区分查询类型；仅对内部问题启用 RAG，其余问题直接走基础大模型（或另接公共知识库）。'},
  {id:352,type:'single',answer:'B',stem:'你希望大模型客服在处理模糊请求时（如用户说“我想订票”），能主动追问必要信息（如时间、地点）。以下哪种提示词设计最有效？',opts:['你是一个细心的订票客服人员.注意每次回复后必须追加一个问题,例如请问需要补充什么信息?','你是一个订票客服人员.对于订票问题,如果信息不完整,应该向用户提问,直到获取了完整的出发地、目的地、时间信息.如果是其他票务问题,则正常回答.','你是一个订票客服人员.对于订票问题,如果信息不完整,请向用户主动询问订票相关信息.如果是其他票务问题,则正常回答.'],exp:'订票需明确出发地、目的地和时间三项关键信息。选项B明确要求在信息不完整时主动追问缺失要素，且限定仅针对订票业务，符合服务场景的精准性与效率要求。选项A未规定追问机制，无法引导模型主动澄清模糊请求。选项C强制每次回复都追问，违背对话自然性，易造成冗余交互。选项D将责任转嫁给用户，要求“用户主动询问”，与题干中“主动追问”的核心需求相悖。'},
  {id:353,type:'single',answer:'B',stem:'某企业开发了一款面向医疗领域的RAG应用，用户反馈称生成的诊断建议经常不准确，且回答内容缺乏针对性。经过初步分析，发现检索模块召回的相关文档质量较低，同时生成模块对复杂医学术语的理解能力不足。作为开发者，你认为以下哪种优化策略最有效？ 选项：',opts:['针对每个用户的反馈逐一调整生成结果,确保满足个性化需求','总结用户反馈中的常见问题,通过多维度评测指标(如准确性、相关性)找到回复质量较低的原因并进行针对性优化','增加计算资源,提升大模型的推理速度,确保快速生成回答'],exp:'系统性排查→定向改进医疗RAG同时暴露出检索文档质量低与模型对医学术语理解不足两大瓶颈。最有效的做法是先汇总用户反馈、构建离线与在线评测体系（准确性、相关性、可信度等），精确定位是检索召回、文档本身，还是生成理解出了问题，再分别采取：知识库治理：补充权威医学指南、去噪、重新分块向量化；模型增强：医学词典嵌入、专业词微调或RAG-hybrid。其他选项不足手工逐条改答案不可扩展；加算力只能提速，解决不了准确性；仅改prompt难以补齐知识和术语理解缺口，属于“头痛医头”。'},
  {id:354,type:'single',answer:'D',stem:'某律所在优化法律问答机器人应用时发现它总是无法准确回答交通法的内容，应优先？试题选项缺失，请补充】',opts:['在大模型提示词中强调要准确回答交通法内容','进行query的改写','优化文档切分策略','<选项缺失>'],exp:'题目描述某律所的法律问答机器人无法准确回答交通法内容，考察优化应用的优先措施。已知选项：A.在提示词中强调交通法内容；B.进行query改写；C.优化文档切分策略；D.选项缺失。 在法律问答机器人应用中，准确性问题通常源于知识库构建或检索环节。当特定领域（如交通法）回答不准确时，核心矛盾在于知识覆盖不足或检索精度低。优化文档切分策略（选项C）能提升知识粒度，使模型更精准定位交通法条款，是改善专业知识回答的基础性措施。提示词调整（选项A）虽可临时引导，但无法根治知识缺失；query改写（选项B）主要优化输入理解，对知识本体无直接影响。 题目注明答案为D，但选项D缺失，无法验证其内容。基于系统优化原理，优化知识供给（如文档切分）应优先于交互层调整。'},
  {id:355,type:'single',answer:'B',stem:'你开发了一个RAG应用，用户反馈说回复效果不佳。你通过后台日志发现用户的输入有时缺少信息，如教研部”、“请假”，你应该优先进行哪方面的优化？',opts:['更换检索速度更快的向量数据库','结合历史常见问题,使用大模型对query进行改写','调整大模型的top_P参数'],exp:'用户只输入“教研部”“请假”等碎片词时，检索端无法准确召回文档，导致答案质量下降。最有效且成本最低的第一步是利用大模型+历史日志对不完整的Query做补全与改写，将其扩展成表达完整意图的检索语句（如“教研部的职责是什么？”、“请假流程怎么走？”），再送入向量检索层。换库提速解决不了召回不到相关内容的问题；调top_p仅影响生成多样性；优化切分对输入信息缺失无帮助。'},
  {id:356,type:'single',answer:'B',stem:'RAG未检索到相关信息，但模型仍编造回答。下列哪种做法有助于减少这种幻觉？',opts:['把所有文档一次性放进模型上下文','提示词要求"若无匹配则回答无法解答"','开启高温度让模型由创造'],exp:'在RAG流程中若检索结果为空，最直接的防幻觉措施是在系统/提示词里显式约束模型：“如果未检索到与问题相关的文档，请回复‘抱歉，暂无相关信息’。”这样模型会根据指令输出「无法解答」而不是凭空编造。把全部资料塞进上下文既耗费token，也无法保证命中，还可能引入噪声。提高temperature反而增加随机性，幻觉更严重。换回旧embedding版本并不针对“召回为空”场景，甚至可能进一步降低检索命中率。'},
  {id:357,type:'single',answer:'D',stem:'在优化检索效果时，若知识库内容充足但精确率低，以下哪种方法是合理的？',opts:['降低相似度阈值','增加知识库文档','加入rerank的步骤'],exp:'在信息检索系统中，当知识库内容充足但精确率较低时，关键在于优化结果排序而非扩大召回范围。降低相似度阈值（A）可能导致更多无关结果被召回，加剧精确率问题。增加知识库文档（B）与题干“内容充足”的前提矛盾。增加并发量（D）仅影响响应速度，无关结果质量。加入rerank步骤（C）通过二次排序模型对初筛结果重新打分，能够有效提升结果精度。该方法借鉴了两阶段检索框架（如ColBERT、DPR等），第一阶段粗筛保证召回率，第二阶段精细化排序优化精确率，符合实际工程实践中解决精确率不足的核心思路。'},
  {id:358,type:'single',answer:'A',stem:'测试时发现，RAG应用的答案中仍包含大量无用细节，导致阅读困难。哪种做法可以最直接地减少无关细节？',opts:['在检索后用ReRank且设置更小的Top N','增加大模型的"max_tokens"','把索引文件放进Redis数据库'],exp:'回答中过多无关细节往往是因为检索阶段召回了太多片段，然后全部拼接进提示词。先ReRank再缩小Top N→只保留最相关的少量文档，能从源头上减少噪声，生成阶段自然更简洁聚焦。提高max_tokens只会让模型输出更长，细节更多；调整存储介质与内容冗余无关；限制用户提问并非技术方案，也无法保证答案不啰嗦。'},
  {id:359,type:'single',answer:'D',stem:'你开发了一个专用于医疗场景问答的RAG应用，为了找到优化方向，需要对其进行评测。以下哪个是参与评测必不可少的群体？【试题选项缺失，请补充】 选项：',opts:['算法工程师.只有算法工程师才可以更理解RAG应用的设计过程与细节.','前端工程师.只有前端工程师更理解用户的交互逻辑,是最懂用户需要的群体.','数据工程师.数据工程师对数据质量、数据管道和检索系统的底层逻辑有深刻理解','<选项缺失>'],exp:'在医疗问答场景中，评测核心不仅是通用的相关性或可读性，更关键的是医学准确性、临床安全性与可操作性。只有具备专业资质的医疗专家才能：从临床指南与实践经验判断回答是否正确、合规、安全；发现潜在的误导性陈述或风险点；提供权威反馈，指导后续知识库治理与模型优化。算法、前端、数据工程师虽然各有价值，但若缺少专业医生参与，评测结论难以保证医学可靠性，因此医疗专家是“必不可少”的群体。'},
  {id:360,type:'single',answer:'D',stem:'在优化检索效果时，若知识库内容充足但召回率低，以下哪种方法是合理的？',opts:['更换embedding模型','增加知识库文档','提高相似度阈值'],exp:'A 并发量影响响应速度(处理请求的快慢),与能否召回更多内容无关,不能解决召回率低的问题。B 提高相似度阈值,意味着匹配要求更严格(需更高相似度才召回),会让召回的内容更少,原本召回率就低,这样做会更差。C 题目明确知识库内容已充足,增加文档无法解决 “检索不到 ” 的问题。D embedding 模型负责将文本转为向量,不同模型生成的向量质量不同。若原模型生成的向量不利于检索,更换模型可能提升匹配效果,从而提高召回率。'},
  {id:361,type:'single',answer:'C',stem:'向量检索召回了10条切片，但部分切片与问题相关度很低，干扰了大模型答案。哪种方式能更好地过滤掉低相关度切片？',opts:['使用高温度的模型进行生成','在大模型回答后再次让用户手动删除','结合文本重排序模型(ReRank)并只保留Top N'],exp:'向量检索初步召回结果可能包含相关度不一的切片，ReRank模型通过二次排序能更精准评估文本相关性。该类模型常采用交叉注意力机制计算语义匹配得分，如BERT等预训练模型基础上微调的重排结构。选项A温度参数仅调节生成随机性，不影响输入内容筛选；选项B依赖人工干预效率低；选项D截断未考虑语义关联性。而ReRank技术在信息检索领域广泛应用（如ColBERT、RocketQA），通过精细化排序有效提升Top N结果质量。'},
  {id:362,type:'single',answer:'C',stem:'在qwen2.5-1.5b模型微调时，训练损失快速震荡甚至开始上升，说明模型当前处于？',opts:['欠拟合','过拟合','训练失败'],exp:'训练损失快速震荡或上升是模型优化过程中常见的现象。在模型微调时，这种现象通常与优化过程的稳定性相关。当损失不再下降反而上升，可能表明梯度爆炸、学习率设置不当或优化器失效等问题，导致模型无法有效更新参数。选项A（欠拟合）对应损失长期停滞而非震荡上升；选项B（过拟合）通常伴随训练损失持续降低而验证损失上升；选项D（训练成功）显然不符合损失上升的特征。损失异常震荡或上升多指向优化失败，属于训练过程中的严重问题，与模型收敛性直接相关。该现象在机器学习文献中常被归为训练失败的典型表现。'},
  {id:363,type:'single',answer:'C',stem:'开发医疗问答系统时发现模型频繁产生"幻觉"，应优先采取哪种优化组合？',opts:['降低LoRA秩值+增大学习率','增加训练epoch+提高相似度阈值','RAG增强知识库+LoRA微调领域数据'],exp:'模型产生”幻觉”指生成不准确或无关内容。选项A中降低LoRA秩值会降低模型容量，增大学习率可能导致训练不稳定，不能解决幻觉问题；选项B增加训练epoch可能过拟合，提高相似度阈值与幻觉问题关联不大；选项C中RAG（检索增强生成）增强知识库可提供准确知识，LoRA微调领域数据使模型更适应特定场景，能有效减少幻觉；选项D更换全参数成本高且不一定有效，减少batch_size影响训练效率。故优先选C。易错提醒：不要只关注单一优化手段，要综合知识增强和模型微调。'},
  {id:364,type:'single',answer:'A',stem:'为什么我们要在微调中使用早停法？',opts:['微调轮次过少可能导致模型欠拟合','微调学习率太小导致模型参数更新太慢','因为模型微调容易出现过拟合现象'],exp:'在深度学习模型训练中，早停法通过监控验证集性能防止模型过度依赖训练数据。过拟合指模型在训练集表现优异，但泛化能力下降。微调时，模型参数已在预训练中学习通用特征，继续迭代可能使模型过度适应特定任务数据。选项A正确，B中“eval_step过大”影响评估频率，与过拟合无直接因果关系。选项C、D涉及学习率和训练轮次不足，属于欠拟合问题，与早停目标不符。早停法的核心原理出自《Deep Learning》（Ian Goodfellow等）中对正则化方法的讨论。'},
  {id:365,type:'single',answer:'A',stem:'在qwen2.5-1.5b模型微调时，训练损失和验证损失在同时快速下降，以下说法正确的是?',opts:['说明训练策略有效,应继续训练','说明模型开始过拟合,需立即停止','说明模型已收敛,可停止训练'],exp:'当训练损失和验证损失同步快速下降时，代表模型正在有效地学习并且仍保持良好的泛化能力——尚未出现过拟合迹象，也说明当前学习率、批量大小等超参数组合基本合适。因此此时应继续训练，直到验证损失趋于收敛或出现拐点再考虑早停或调参。'},
  {id:366,type:'single',answer:'A',stem:'梯度下降算法中，如果学习率设置过大可能导致：',opts:['在最优解附近震荡','参数更新幅度不足','收敛速度过慢'],exp:'梯度下降法的核心在于通过负梯度方向更新参数，学习率控制更新步长。当学习率过大，参数更新可能越过最优点，在两侧来回跳跃，无法稳定收敛至最优解，形成震荡现象。过小学习率会导致更新幅度不足、收敛缓慢，但震荡并非由过小引发。选项B、C、D均由学习率过小引起，与题干条件不符。梯度下降中学习率与收敛性的关系在《机器学习》(周志华)、《Deep Learning》(Goodfellow et al.)等教材中均有讨论。选项A正确描述了学习率过高的典型后果。'},
  {id:367,type:'single',answer:'C',stem:'以下哪项是流式输出的主要优势？',opts:['减少服务器计算资源消耗','提升用户感知的响应速度','降低模型推理错误率'],exp:'流式输出技术允许数据在生成过程中逐步传输而非等待全部处理完成。其核心优势在于用户能够即时接收部分结果，减少了等待完整结果的感知延迟。选项B的表述符合这一特点。选项A与实际情况可能相反，流式传输可能因维持长连接消耗更多资源；选项C与模型本身的推理逻辑相关，输出方式不影响错误率；选项D涉及基础设施，流式输出仍需负载均衡应对高并发场景。流式输出的应用场景如HTTP分块传输、大模型实时生成响应（OpenAI API等），均以优化用户体验为核心目标。'},
  {id:368,type:'single',answer:'C',stem:'某创业公司开发的"AI法律助手"应用，能自动生成合同条款与诉讼风险评估报告。在正式上线应用商店前，必须完成的最关键合规步骤是哪个？',opts:['通过国家网信部门的大模型算法备案','为AI生成内容申请知识产权保护','获取信息系统安全等级保护三级认证'],exp:'国家网信部门发布的《生成式人工智能服务管理暂行办法》明确要求生成式AI服务提供者应按规定履行算法备案手续。备案是对大模型算法进行合规审核的必要步骤，确保其生成内容符合法律伦理要求。其他选项虽涉及合规要素，但未直接对应生成式AI服务的准入前置条件。该规定可参考《互联网信息服务算法推荐管理规定》及《生成式人工智能服务管理暂行办法》（2023年）。选项A是法定义务，其余为可后续完善的机制。'},
  {id:369,type:'single',answer:'C',stem:'你在开发一个内部IT系统，希望能够自动处理员工的请求：“我的投影仪故障了，请安排维修并通知下午会议改线上”。以下哪种',opts:['通过大模型判断接单,自动将任务指派给接单,通知其创建维修工单并调整会议.','识别请求中的关键字(如"投影仪故障""会议改线上"),匹配规则系统后调用API完成任务.','通过提示词引导大模型拆解任务为多步骤,然后自动调用维修系统和会议系统API完成操作.'],exp:'自动化程度最高：模型先解析并拆分“报修+调整会议”两项子任务，再按顺序调用已有运维/会议系统API；整条链路闭环，无需人工介入。对接现有系统：沿用企业原有工单和会议平台，避免重建流程或让人手动创建。维护成本低：相比关键词规则需要不断手工更新词库，流程拆解+API调用更通用、可扩展。'},
  {id:370,type:'single',answer:'A',stem:'在开发智能餐厅点餐助手时，测试发现用户语音下单（如“来一份宫保鸡丁，数量两份”）时系统生成错误的调用参数，导致订单出错。经排查，原因在于“下单工具”描述中未明确规定输入参数（如“菜品名称”和“数量"）的类型、属性及必选项。请问哪项改进最能提高调用参数的准确性？',opts:['在工具描述中详细定义parameters字段,明确说明相关参数的类型、属性描述及必选要求','在工具描述中增加更多辅助说明,如功能介绍和使用场景,增强工具的吸引力','修改工具返回数据格式,使其自动生成标准订单编号'],exp:'当前错误源于工具schema不完整，导致模型无法准确映射“菜品名称”“数量”等参数。最直接有效的改进就是在工具描述里用标准JSON-Schema把parameters字段写清楚——包括每个字段的type、description、required等元数据。这样模型在调用时就能根据约束自动填入正确值，显著提升参数准确率。其余选项要么只增加文字说明或限频，无法解决字段解析问题。'},
  {id:371,type:'single',answer:'B',stem:'某大学为学生提供一款问答机器人，能回答课程安排和考试时间。学校想新增“自助预定自习室功能，需要查询并预定教室资源。要使这个功能能与',opts:['在Prompt中写死可预约教室列表','使用一个专门的Agent调用内部预定API','仅通过提示让模型推测当前可用教室'],exp:'动态查询+实时写入：通过Agent把“查空教室→下单锁定”两步流程封装成工具调用，模型可在对话中按需触发API，保证数据实时、操作可落地。无缝集成：Agent方式与现有问答链路兼容，只需在工具列表中新增“教室预定”接口；调用结果再回填给大模型生成自然语言回复，用户体验连贯。其他方案缺陷：静态写死教室列表，无法反映实时占用情况；让模型凭空“推测”极易幻觉，无法真正预定；大量数据塞系统消息既浪费token，也无法执行预定操作。'},
  {id:372,type:'single',answer:'B',stem:'RAG (Retrieval Augmented Generation)的主要目的是什么？',opts:['增加模型的训练数据','为大模型提供参考资料以提高回答质量','减少模型的推理时间'],exp:'RAG模型结合了检索与生成技术，通过从外部知识库中实时检索相关信息作为生成阶段的参考，增强生成内容的准确性和相关性。这一机制有效弥补了传统生成模型依赖预训练数据、无法动态获取最新或特定领域知识的不足。选项A混淆了训练数据与推理阶段的即时检索；选项C错误，检索过程可能增加而非减少时间消耗。Meta提出的RAG框架（Lewis et al., 2020）明确其核心在于利用检索到的文档提升生成质量。'},
  {id:373,type:'single',answer:'A',stem:'在优化contextrecall指标时，以下哪种方法可以提升召回的准确率？',opts:['使用大模型改写query','增加模型的训练数据','减少模型的推理时间'],exp:'优化context recall指标旨在提高系统检索相关上下文的能力。使用大模型改写query能够更精准地捕捉用户意图，生成语义更明确、结构更合理的查询，从而提升召回内容的相关性。增加训练数据或模型参数可能增强模型泛化能力，但与查询本身的表达优化无直接关联；减少推理时间主要影响效率而非召回质量。此方法参考信息检索中查询重构技术的应用，通过语义调整增强匹配效果。'},
  {id:374,type:'single',answer:'A',stem:'在以下代码片段中，temperature=0.1的作用是什么?',opts:['使输出更具确定性','使输出更具创造性','增加输出的多样性'],exp:'在生成式模型中，temperature参数用于调整softmax函数的输出概率分布。当temperature设置为较低值（如0.1）时，模型会放大高概率词项的权重，抑制低概率选项，导致输出结果更集中、稳定。《深度学习》（花书）第10.2.1节描述了该参数对概率分布的缩放效应。选项A对应低temperature带来的确定性特征，选项B、C描述的是高temperature值的效果。'},
  {id:375,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种模型用于将文本转换为高维向量？',opts:['Embedding模型','大模型','增加模型的训练数据'],exp:'文本向量化依赖嵌入模型（Embedding Model），其作用是将文本语义映射为高维稠密向量，用于后续检索与相似度计算。选项A“Embeddin”为“Embedding”的拼写错误，但在考试语境下，仅此选项指向正确技术概念；其余选项均不构成向量化模型：B“模型”过于宽泛，C“大模型”指参数规模大的基础模型，D为数据增强手段，非向量化方法。'},
  {id:376,type:'single',answer:'A',stem:'在LlamaIndex的默认提示词模板中，context_str表示什么?',opts:['从向量库中检索到的上下文信息','用户的问题','大模型的角色'],exp:'LlamaIndex框架中提示词模板的设计用于结构化用户输入与大模型交互。context_str作为模板变量之一，其命名与功能对应，通常指检索系统返回的相关数据片段。LlamaIndex文档示例展示默认模板中context_str与query_str的区分，前者明确关联外部检索结果，后者处理用户原始问题。选项A描述符合框架变量用途定义，选项B与C分别对应于其他模板参数或配置项，与context_str实际作用不符。'},
  {id:377,type:'single',answer:'A',stem:'在以下代码片段中，model="qwen-plus"的作用是什么?',opts:['指定使用的模型','增加输出的多样性','使输出更具确定性'],exp:'参数model的作用是确定调用哪个预训练模型。该参数常见于大模型API调用场景，用于切换不同版本的模型。选项B对应temperature参数，选项C对应top_p参数，均用于控制生成结果的随机性。阿里云Qwen模型文档明确标明model参数用于模型版本选择。'},
  {id:378,type:'single',answer:'A',stem:'如果answercorrectness指标得分较低，而contextrecall和contextprecision得分较高，以下哪种优化措施是可行的？',opts:['优化prompt','增加模型的训练数据','减少模型的推理时间'],exp:'该题考察对模型性能指标与优化策略关联的理解。指标中context recall和context precision反映模型对相关信息的召回与过滤能力，而answer correctness体现答案生成质量。当上下文处理能力达标但答案生成偏差时，问题通常存在于prompt的指令设计或信息提炼环节。优化prompt可调整模型对上下文的利用方式，直接影响生成结果的质量。其他选项如增加数据、换模型侧重提升基础能力，不符合当前高召回/高精度但低正确率的针对性优化需求。本题对应大模型应用优化中"Prompt Engineering直接影响生成质量"的核心观点，源自知识问答系统的典型调优场景。'},
  {id:379,type:'single',answer:'B',stem:'在控制大模型生成内容的随机性时，top_p参数的作用是什么?',opts:['调整候选Token的概率分布','筛选出累计概率达到阈值的候选Token','增加候选Token的数量'],exp:'top_p参数属于生成模型中控制输出多样性的核心技术之一。该方法在生成过程中根据设定的阈值动态调整候选范围，保留累积概率超过阈值的Token集合，确保采样时仅在高概率区域进行随机选择。该机制常见于Hugging Face Transformers库的文本生成策略，相关论文如《The Curious Case of Neural Text Degeneration》详细阐述了其数学原理。选项A混淆了温度参数（temperature scaling）的作用，选项C对应的是top_k方法。'},
  {id:380,type:'single',answer:'A',stem:'在自定义提示词模板中，以下哪项是用于约束大模型行为的注意事项？',opts:['根据上下文信息而非先验知识来回答问题','增加模型的训练数据','减少模型的推理时间'],exp:'在自定义提示词模板的设计中，约束大模型行为的关键在于引导其生成内容的方向和依据。题干中选项A强调利用上下文信息而非先验知识回答问题，这直接对应提示词模板的核心功能——限制模型依赖内部训练数据，转而聚焦用户提供的特定输入。选项B、C、D均涉及模型训练或性能优化，与提示词模板的即时行为约束无关。该知识点常见于大模型应用实践中关于提示工程的讨论，如OpenAI的技术文档及相关研究论文中对提示设计原则的阐述。其他选项中，B、C、D未涉及生成过程的控制逻辑，故不适用。'},
  {id:381,type:'single',answer:'A',stem:'在示例中，提示词明确的任务需求是什么？',opts:['对文本进行扩写和润色','增加模型的训练数据','减少模型的推理时间'],exp:'提示词的任务需求通常指向模型需执行的具体操作。题干中示例的提示词要求模型对现有文本进行扩展和优化，而非调整训练数据或提升性能效率。选项A描述的这一任务直接对应文本内容的生成与改进，其余选项涉及模型训练或工程优化层面，与提示词指令无关。常见自然语言处理任务中，扩写与润色属于生成类任务的典型应用。'},
  {id:382,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种Embedding模型是更新的版本?',opts:['text-embedding-v3','text-embedding-v2','增加模型的训练数据'],exp:'在自然语言处理模型迭代中，版本号通常以数字递增表示更新顺序。OpenAI等机构发布的embedding模型命名遵循"text-embedding-v+数字"格式，数字越大代表版本越新。选项C属于模型优化的方法而非具体模型版本名称。根据官方发布的模型文档，text-embedding-v3相较v2具有更先进的架构和性能优化，对应实际存在的模型版本更新记录。'},
  {id:383,type:'single',answer:'A',stem:'在优化answer correctness指标时，以下哪些是优化prompt的好处?',opts:['提升生成答案的准确度','增加模型的训练数据','减少模型的推理时间'],exp:'优化 prompt 的主要目的是通过改进输入指令或问题的表述方式，使模型更精准地理解任务需求，从而在输出时生成更符合预期的结果。题干中的答案正确性（answer correctness）指标直接与生成内容的准确程度相关，优化 prompt 可以有效缩小模型理解与用户意图之间的偏差，减少歧义或错误解读的可能性。选项 B 涉及模型训练数据的扩展，与 prompt 调整无关；选项 C 关注推理效率，通常由模型架构或计算资源决定，而非 prompt 优化。相关研究指出，合理设计 prompt 能够显著提升模型在 QA 任务中的表现（如《Language Models are Few-Shot Learners》）。'},
  {id:384,type:'single',answer:'A',stem:'在检索召回阶段，以下哪些方法结合用户信息、行为等数据扩写问题？',opts:['基于用户画像扩展上下文','问题改写','重排序'],exp:'在信息检索的召回阶段，核心目标是尽可能多地返回与用户查询相关的候选文档或内容。用户信息、行为等数据（如用户画像、历史点击、偏好等）可以用于扩展或优化原始查询，从而提升召回效果。 - **A选项：基于用户画像扩展上下文**。该方法会结合用户画像（如职业、兴趣、历史行为等）为查询补充上下文信息，从而生成更精准的扩展查询，属于在召回阶段利用用户数据扩写问题的典型方式。因此正确。 - **B选项：问题改写**。虽然也是查询优化，但问题改写通常依赖于同义替换、句法变换等技术，不一定需要结合用户信息或行为数据。它更多是独立的查询重写，不一定涉及用户个性化信息。 - **C选项：重排序**。重排序属于召回后的排序阶段，是对初步检索结果进行重新排列，并不用于扩写查询或召回过程。 - **D选项：增加模型的训练数据**。这是模型训练阶段的优化方式，不直接作用于在线召回阶段的查询扩写。 因此，结合用户信息、行为等数据扩写问题的正确方法是**A选项**。'},
  {id:385,type:'single',answer:'A',stem:'在以下代码片段中，query_engine = index.as_query_engine(..)的作用是什么?',opts:['创建查询引擎','设置召回切片的最大数量','设置重排序的切片数量'],exp:'该问题涉及对代码中`as_query_engine`方法功能的理解。代码片段通常来源于数据处理或信息检索框架（如基于索引的数据库或搜索引擎）。选项A对应创建查询引擎的逻辑，符合方法命名规范及常见设计模式。选项B、C涉及参数配置的具体细节，与`as_query_engine`方法的核心作用无关。此类方法通常用于实例化查询处理对象，而非直接控制召回或排序参数。'},
  {id:386,type:'single',answer:'A',stem:'在RAG应用的检索与生成阶段，主要步骤是什么?',opts:['从索引中检索相关的文档片段并与提问一起输入到大模型','增加模型的训练数据','提高模型的推理速度'],exp:'RAG（Retrieval-Augmented Generation）模型的核心流程分为检索与生成两个阶段。检索阶段通过外部索引获取与输入相关的文档片段，生成阶段将这些片段整合到输入中以增强大模型的上下文理解。选项A直接对应这一流程的操作步骤，即检索文档并联合提问输入模型。选项B属于训练阶段的优化，与推理阶段的步骤无关；选项C关注计算效率，不涉及流程本身。相关方法可参考Meta AI的论文《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》。'},
  {id:387,type:'single',answer:'A',stem:'在优化后的答疑机器人中，以下哪些是提示词中规定的输入格式?',opts:['[输入如下]','增加模型的训练数据','减少模型的推理时间'],exp:'题干询问优化后的答疑机器人提示词中规定的输入格式。选项分析：A选项“[输入如下]”直接涉及输入格式的标记方式，符合输入格式要求。B选项“增加模型的训练数据”属于模型训练策略，与输入格式无关。C选项“减少模型的推理时间”涉及性能优化，不属于输入格式范畴。题目来源可能与提示工程或机器人交互设计文档相关，强调输入规范的结构设计。'},
  {id:388,type:'single',answer:'A',stem:'在检索召回阶段，以下哪些方法通过反问用户获取更多信息？',opts:['反问用户','问题改写','重排序'],exp:'在检索召回阶段，题干明确询问通过反问用户获取更多信息的方法。选项A“反问用户”直接对应题干描述的操作方式，属于交互式检索中的常见策略，即在不确定用户意图时主动询问以明确需求。其他选项如问题改写（B）、重排序（C）侧重调整查询或结果排序，增加训练数据（D）属于模型优化而非实时交互。故答案与题干所述方法一致。'},
  {id:389,type:'single',answer:'A',stem:'在文档切片过程中，以下哪种切片方法适合处理逻辑性强、内容专业的文档？',opts:['语义切片','Token切片','句子切片'],exp:'文档切片方法的选择需根据文档特性。语义切片依据文档的语义单元划分，保留逻辑和主题完整性，适合逻辑性强、内容专业的文档。Token切片按固定长度切分，易破坏语义连贯性。句子切片以单句为单位，可能割裂上下文关联。句子窗口切片虽包含相邻句子，仍不及语义切片对整体结构的保持。相关方法在自然语言处理文本预处理中有讨论，强调语义关联的重要性。'},
  {id:390,type:'single',answer:'B',stem:'在需要生成明确答案的场景中，建议如何设置temperature参数?',opts:['设置较高的温度值','设置较低的温度值','使用默认温度值'],exp:'在生成明确答案的场景中，temperature参数的作用是控制生成文本的随机性。较高的温度值（如接近1.0）会增加输出的多样性，可能导致答案不稳定或不准确；较低的温度值（如接近0）会减少随机性，使模型倾向于选择概率最高的输出，提高答案的确定性。此概念常见于自然语言处理模型的核心参数设置，例如GPT系列模型的官方文档中明确提到，低temperature适用于需要精确、一致结果的场景。选项A可能导致答案偏差，选项C、D无法保证生成效果的最优性。'},
  {id:391,type:'single',answer:'A',stem:'在Ragas中，contextrecall指标的主要作用是什么?',opts:['评估RA应用在检索阶段的表现','评估生成答案的准确度','增加模型的训练数据'],exp:'Ragas框架用于评估RAG（Retrieval-Augmented Generation）系统性能，其中context recall指标关注检索到的上下文信息与真实答案的事实对齐程度。该指标通过测量检索内容是否包含回答所需的事实要素，确保生成答案的准确性。选项A正确描述了衡量上下文与标准答案间事实一致性的核心功能；选项B涉及检索结果的排序和相关性比例，属于其他指标如context precision的评估范围；选项C与评估无关，仅为干扰项。'},
  {id:392,type:'single',answer:'A',stem:'在示例中，以下哪些任务需要经过RAG链路来生成答案？',opts:['内部知识查询','文档审查','增加模型的训练数据'],exp:'RAG（Retrieval-Augmented Generation）的核心是通过检索外部知识增强生成效果，适用于依赖特定领域或私有数据的任务。内部知识查询需要检索非公开或结构化知识库并生成答案，属于RAG典型场景。文档审查侧重内容验证或合规性检查，通常不涉及生成环节；增加训练数据属于模型预训练阶段，与RAG的推理链路无关。相关技术定义可参考Lewis et al.的《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》。'},
  {id:393,type:'single',answer:'A',stem:'在优化answercorrectness指标时，以下哪种方法可以提升生成答案的准确度？',opts:['调整大模型生成的超参数(如temperature)','增加模型的训练数据','减少模型的推理时间'],exp:'调整大模型生成的超参数（如temperature）直接影响生成答案的随机性和准确度。降低temperature可减少随机性，使生成内容更聚焦于高概率的准确答案，从而提升准确度。增加训练数据主要提升模型泛化能力，不直接优化生成环节的准确度；减少推理时间与答案质量无必然关联，甚至可能因计算不足损害准确度。因此，调整超参数是直接提升生成答案准确度的有效方法。易错提醒：需注意temperature的调整幅度，过低可能导致答案过于保守。'},
  {id:394,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种方法用于计算向量之间的相似度？',opts:['余弦相似度','欧氏距离','曼哈顿距离'],exp:'向量相似度计算是信息检索和自然语言处理中的基础概念。余弦相似度通过测量两个向量间的夹角余弦值来评估方向一致性，适用于高维稀疏数据，如文本向量。欧氏距离衡量绝对距离，曼哈顿距离计算城市街区距离，两者更关注数值差异。增加训练数据属于优化模型的方法，与相似度计算无关。在向量化存储的场景中，余弦相似度因对向量长度不敏感且能有效捕捉语义关联而被广泛采用。'},
  {id:395,type:'single',answer:'A',stem:'在构建RAG应用时，以下哪种向量存储方案适合生产环境？',opts:['云服务向量存储','内存向量存储','本地向量数据库'],exp:'构建RAG应用时，生产环境对向量存储的需求通常集中在高可用性、扩展性和维护性。云服务向量存储具备弹性伸缩、托管服务及分布式架构优势，适合处理大规模数据和高并发场景。内存存储可能在性能上有优势，但持久性和扩展性不足；本地向量数据库依赖本地资源，扩展和维护成本较高；增加训练数据属于模型优化范畴，与存储方案无关。云服务方案在行业实践中被广泛采用，如AWS、Azure等平台提供的托管向量数据库服务。'},
  {id:396,type:'single',answer:'A',stem:'在检索召回阶段，以下哪些方法提取标签用于后续标签过滤+向量相似度检索？',opts:['提取标签','问题改写','重排序'],exp:'该题考察检索系统中的召回阶段技术应用。检索增强生成（RAG）相关文献中，召回阶段常用标签抽取结合向量检索的方法。选项A涉及从文本中提取关键特征作为筛选条件，符合标签过滤的定位；选项B侧重语义扩展而非特征提取，C属于结果优化步骤而非召回环节。'},
  {id:397,type:'single',answer:'A',stem:'在优化context precision指标时，以下哪些是rerank（重排序）的好处?',opts:['提升相关文本段的排名','增加模型的训练数据','减少模型的推理时间'],exp:'在信息检索系统中，rerank技术通常作用于初步检索结果，通过二次排序优化相关内容的位置。该题涉及检索质量评估指标context precision的定义，其核心在于衡量系统返回结果中高相关度内容在前列的准确程度。选项A直接对应rerank的核心功能——调整排序使更相关内容靠前，这与指标优化目标一致。选项B、D属于模型训练阶段要素，与排序阶段无关；选项C的推理时间通常受模型复杂度影响，而rerank可能增加额外计算步骤。相关原理可参考信息检索领域关于排序模型优化的文献，如《信息检索导论》中检索质量评估章节。'},
  {id:398,type:'single',answer:'A',stem:'在以下代码片段中，extract_tags函数的作用是什么?',opts:['从文本中提取标签','从文本中提取关键词','从文本中提取句子'],exp:'该函数名为extract_tags，"tags"在编程语境中通常指特定标记符号或结构化数据标签。HTML/XML解析库常含类似功能，如BeautifulSoup的find_all()可提取标签元素。选项B的关键词提取对应术语为keywords而非tags，C/D涉及文本结构分割而非标记提取。选项A符合函数命名惯例及标签提取场景的典型应用。'},
  {id:399,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种方法用于定义要测试的Embedding模型？',opts:['embedding_models字典','增加模型的训练数据','减少模型的推理时间'],exp:'在切片向量化与存储阶段，embedding_models字典的作用是集中配置不同Embedding模型的参数与结构，便于统一管理和测试。相关库或框架常采用字典结构组织模型配置，例如设定嵌入维度、预训练路径等参数。其他选项涉及数据增强或性能优化，与定义模型无关。答案来源于机器学习工程中模型配置的常见实践。'},
  {id:400,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种方法用于比较不同Embedding模型的文本相似度？',opts:['compare_embeddings函数','增加模型的训练数据','减少模型的推理时间'],exp:'在自然语言处理中，比较不同Embedding模型的文本相似度通常涉及计算向量之间的距离或相似性指标，如余弦相似度。《Natural Language Processing in Action》等资料提到，通过特定的函数实现向量间的相似度对比是常见做法。选项A指代的函数名称直接对应此类操作；增加训练数据（B）属于模型优化阶段，减少推理时间（C）属于性能优化，均与相似度比较无关。'},
  {id:401,type:'single',answer:'A',stem:'Ragas提供的以下哪些指标用于评估生成答案与检索资料的事实一致性？',opts:['Faithfulness','Answer Relevancy','Context Precision'],exp:'Ragas框架中定义Faithfulness指标用于衡量生成答案与给定上下文的事实一致性，确保输出内容忠实于检索到的资料。Answer Relevancy侧重于答案对问题的直接相关程度，Context Precision关注检索上下文与问题的相关性排序。Faithfulness的评估标准明确对应题干中"事实一致性"的核心要求。'},
  {id:402,type:'single',answer:'B',stem:'在私有知识问答场景中，直接传入私域知识相关的参考信息的缺点是什么?',opts:['模型处理效率降低','提示词长度有限','模型无法理解私域知识'],exp:'在私有知识问答场景中，直接传入私域知识可能导致参考信息超出模型的输入长度限制。当前主流模型（如GPT系列）对提示词长度有明确上限（如4096 tokens），若私域知识内容过多，超出部分会被截断。选项B指出提示词长度的限制，直接对应模型输入容量的物理瓶颈。选项A的问题在于处理效率更多与计算资源消耗相关，而非输入长度的硬限制。选项C涉及模型理解能力，通常私域知识未被训练时才会出现，但题目未提及模型是否经过微调。参考模型技术文档中关于最大输入长度的约束可验证此观点。'},
  {id:403,type:'single',answer:'A',stem:'在问题改写中，以下哪些方法通过生成假设文档来增强检索效果？',opts:['用假设文档来增强检索(HyDE)','使用大模型扩充用户问题','将单一查询改写为多步骤查询'],exp:'用假设文档来增强检索（HyDE）通过让大模型生成与查询相关的假设文档，将这些文档嵌入向量空间后用于检索，弥合查询与真实文档的语义差距，从而提升检索准确性，该方法借助生成假想文档实现增强检索效果。'},
  {id:404,type:'single',answer:'B',stem:'在RAG应用的建立索引阶段，文本向量化的主要作用是什么？',opts:['增加模型的训练数据','将文本转换为数字表示以便进行相似度比较','减少模型的推理时间'],exp:'文本向量化在RAG索引阶段的核心目标是生成文本的数字表示，这类表示能够捕捉语义信息，从而支持高效检索。向量化过程通过嵌入模型将文本映射到高维空间，不同文本的语义相似度可通过向量距离衡量。选项B准确描述了这一目的，其余选项偏离了向量化的本质功能——如A混淆了数据处理与数据增量，C和D分别涉及推理优化和模型结构，均与索引阶段的直接目标无关。相关资料可参考RAG技术文档或信息检索领域的向量空间模型理论。'},
  {id:405,type:'single',answer:'A',stem:'在优化检索效果时，以下哪种方法可以提升文档的层次分明性？',opts:['使用Markdown格式','增加模型的训练数据','减少模型的推理时间'],exp:'在优化检索效果时，文档的层次分明性通常与结构化呈现方式直接相关。Markdown格式通过语法标记（如标题、列表、代码块等）能够明确划分内容层级，增强可读性和组织性。增加训练数据主要影响模型的知识覆盖面，减少推理时间属于性能优化，两者不直接关联文档结构设计。Markdown的语法规范旨在帮助用户快速创建结构清晰的文本，相关特性在技术写作和版本控制场景中被广泛使用。'},
  {id:406,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪些是embedding_models字典的作用?',opts:['定义要测试的Embedding模型','增加模型的训练数据','减少模型的推理时间'],exp:'embedding_models字典通常用于封装和管理不同嵌入模型的配置或实例。在向量化与存储阶段，该字典作为参数容器，明确指定参与测试的特定嵌入模型。选项B、C、D分别涉及模型参数、数据量、推理效率，均与字典的核心用途无关。嵌入模型字典的设计初衷是灵活切换模型，而非直接影响模型性能或数据量。相关实践可参考机器学习框架中模型注册表或配置管理模块的实现逻辑。'},
  {id:407,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪些是compare_embeddings函数的作用？',opts:['比较不同Embeddin模型的文本相似度','增加模型的训练数据','减少模型的推理时间'],exp:'在自然语言处理中，嵌入向量常用于表示文本语义信息。compare_embeddings函数的作用聚焦于评估嵌入模型生成的向量质量或相似性，例如通过计算余弦相似度衡量不同模型对同一文本的向量表征差异。选项B、C涉及模型训练阶段的参数调整和数据扩充，与比较功能无关；选项D属于推理优化范畴。该函数的设计场景符合文本相似度比较的实际需求，例如模型效果验证或嵌入空间分析。'},
  {id:408,type:'single',answer:'A',stem:'在代码中，Dataset.from_dict(data_samples)的主要作用是什么?',opts:['将字典数据转换为数据集','增加模型的训练数据','减少模型的推理时间'],exp:'Dataset.from_dict()是Hugging Face Datasets库中的方法，用于将Python字典转换为数据集对象。字典结构的键对应数据列，值对应具体数据。该功能属于数据格式转换操作，与数据处理流程相关。选项B涉及数据增强，选项C涉及推理性能，均不属于格式转换范畴。Hugging Face官方文档明确指出该方法用于从内存中的字典创建数据集。'},
  {id:409,type:'single',answer:'A',stem:'在RAG应用的多轮对话中，custom_chat_history的主要作用是什么?',opts:['存储历史对话信息','增加模型的训练数据','减少模型的推理时间'],exp:'在RAG应用中，多轮对话需要维护上下文信息以确保连贯性。custom_chat_history的设计目的是为了在多轮交互过程中保存用户与系统之间的历史对话记录。选项B涉及模型训练阶段的数据扩充，与实时对话管理无关。选项C提到的推理时间减少通常通过优化模型结构或硬件实现，而非依赖对话历史存储。选项D涉及模型架构调整，与对话机制无关。文献中关于RAG系统的讨论指出，对话历史管理是确保生成响应相关性的关键机制。'},
  {id:410,type:'single',answer:'A',stem:'在RAG应用中，存储索引的主要目的是什么？',opts:['提高检索速度','增加模型的训练数据','减少模型的推理时间'],exp:'检索增强生成（RAG）模型通过将外部知识库与生成模型结合，需要在检索阶段快速定位相关文档片段。索引的作用在于将非结构化数据组织为结构化形式，如使用倒排索引、向量索引（如FAISS）等技术，避免每次检索遍历全部数据。这种优化直接减少了检索阶段的耗时，而非影响训练数据量或模型推理过程。相关技术可参考RAG原始论文或信息检索领域对索引机制的经典论述。选项A准确描述了索引的核心作用；选项B、C分别混淆了训练数据扩展与模型推理环节的优化目标。'},
  {id:411,type:'single',answer:'A',stem:'在提示词中规定输出格式的主要作用是什么？',opts:['确保大模型输出结构化的数据','增加模型的训练数据','减少模型的推理时间'],exp:'在自然语言处理任务中，用户通过提示词指定输出格式（如JSON、XML或特定标记）可引导模型生成符合预定结构的内容。此类方法常见于提示工程实践，例如OpenAI官方文档建议通过结构化提示提升输出可控性。选项A正确对应引导结构化输出的核心功能；选项B涉及训练阶段的数据增强，与推理阶段的提示指令无关；选项C推理时间主要受模型架构和计算资源影响，结构化输出可能增加后处理步骤而非缩短推理时间。'},
  {id:412,type:'single',answer:'D',stem:'在大模型的问答工作流程中，哪个阶段会循环生成候选Token直到输出结束标记？试题选项缺失，请补充】',opts:['输入文本分词化','Token 向量化','大模型推理','<选项缺失>'],exp:'在大模型的问答工作流程中，输入文本分词化是将文本拆分为Token序列；Token向量化是把Token转换为向量；而大模型推理阶段，模型会根据输入和已有参数，循环生成候选Token，直到输出结束标记，从而完成回答生成。所以答案选C，原答案D错误，本题易错选其他阶段，需明确各阶段功能，记住推理阶段负责生成完整回答。'},
  {id:413,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种Embedding模型是OpenAI提供的?',opts:['text-embedding-3-small','text-embedding-v2','增加模型的训练数据'],exp:'OpenAI官网文档中提到，text-embedding-3-large是2024年发布的第三代嵌入模型，属于其官方提供的向量生成工具。选项B的版本命名不符合OpenAI公开模型命名规范；选项C和D描述的是训练策略或性能优化方向，而非具体的模型名称。选项A符合官方最新公布的模型列表。'},
  {id:414,type:'single',answer:'A',stem:'在文档切片过程中，以下哪些切片方法适合刚开始接触RAG的用户?',opts:['句子切片','Token 切片','句子窗口切片'],exp:'句子切片作为基础方法，操作简单且易于理解。文档切片在RAG中需平衡信息保留与处理效率，句子切片直接以自然分界点分割，无需复杂计算或参数调整。Token切片涉及模型特定分词规则，句子窗口需管理上下文范围，语义切片依赖嵌入模型或聚类算法。句子切片实现门槛低，适合初期学习实践。相关概念可见于RAG技术文档及文本预处理最佳实践。'},
  {id:415,type:'single',answer:'A',stem:'在示例中，CoT方法如何帮助大模型计算总差旅费用？',opts:['将问题分解为子问题并逐步推导','增加模型的训练数据','减少模型的推理时间'],exp:'COT方法通过引导模型将复杂任务拆解为多个中间步骤，逐步解决子问题以实现最终目标。例如计算差旅费用时，模型需要分别处理交通、住宿等子项的费用，再进行累加。这一过程符合链式思维（Chain-of-Thought）的核心思想，即通过对问题层次化拆解提升推理能力（参考Wei et al., 2022）。选项A描述了这种分步推导机制，而选项B、C、D分别涉及训练数据、推理效率、模型结构，与COT方法的推理逻辑无直接关联。'},
  {id:416,type:'single',answer:'A',stem:'在文档切片过程中，以下哪种切片方法会包含周围的句子作为上下文窗口?',opts:['句子窗口切片','Token 切片','句子切片'],exp:'文档切片方法中，上下文窗口的扩展决定了相邻句子的包含范围。自然语言处理文本预处理技术文献提到，句子窗口切片（Sentence Window Slicing）通过定义前后句子数量形成上下文环境。选项A明确采用窗口扩展机制，选项B基于分词颗粒度划分破坏句子完整性，选项C仅切割独立语句。原始方法对比资料显示，只有包含额外上下文的结构才符合窗口定义特征。'},
  {id:417,type:'single',answer:'A',stem:'在检索召回阶段，以下哪种方法用于在检索前还原用户真实意图？',opts:['问题改写','重排序','滑动窗口检索'],exp:'在检索系统中，问题改写（Query Reformulation）属于召回前的查询预处理环节，其核心目标是通过调整原始查询的表述方式或补充相关语义信息，提升查询与文档的匹配度。这一技术常见于搜索引擎、对话系统等场景，例如将用户口语化的“怎么治感冒”转化为更规范的“感冒治疗方法”。重排序（B）作用于召回后的结果优化，通过精细化模型重新计算相关性得分；滑动窗口检索（C）主要应对长文本切分需求，属于文档处理技术而非意图识别方法。问题改写的实现方式包含同义词扩展、句法结构调整、上下文信息注入等，典型应用如谷歌搜索的"Did you mean"功能。'},
  {id:418,type:'single',answer:'A',stem:'在构建RAG应用时，以下哪种向量存储方案适合开发测试？',opts:['内存向量存储','本地向量数据库','云服务向量存储'],exp:'在构建RAG（检索增强生成）应用时，向量存储用于存储和检索嵌入（embedding）数据，以支持快速相似性搜索。在开发测试阶段，主要考虑的是便捷性、低成本、快速迭代和无需复杂运维。 - **A选项（内存向量存储）**：将所有向量数据存储在内存中，无需持久化到磁盘，启动和查询速度极快，且不需要额外的数据库服务或云资源。这对于开发测试阶段非常理想，因为开发者可以快速修改代码和测试数据，无需配置和维护外部数据库。 - **B选项（本地向量数据库）**：如Faiss、Milvus等本地部署的数据库，虽然功能强大且支持持久化，但需要一定的安装和配置工作，对于快速原型和测试来说相对繁琐。 - **C选项（云服务向量存储）**：如Pinecone、Weaviate Cloud等，需要网络连接、账号注册和付费，适合生产环境，但开发测试时可能增加不必要的复杂性和成本。 - **D选项（增加模型的训练数据）**：这属于模型训练范畴，与向量存储无关，也不适合开发测试阶段的RAG应用需求。 因此，**在开发测试阶段，内存向量存储因其轻量、快速、无需额外服务的特点，是最合适的选择**。选项A是正确的。'},
  {id:419,type:'single',answer:'B',stem:'在RAG应用的多轮对话中，业界常用的解决方法是什么？',opts:['增加模型的训练数据','使用大模型将用户问题改写为包含历史对话关键信息的新 query','减少模型的推理时间'],exp:'在RAG（Retrieval-Augmented Generation）应用中，多轮对话需要有效处理历史对话信息以确保上下文连贯性。行业实践表明，直接将原始用户问题输入检索器可能导致忽略关键历史信息，从而影响后续生成质量。通过大模型将当前用户问题与历史对话中的核心信息进行融合、改写，生成包含上下文的新查询，能够提升检索文档的相关性和生成答案的准确性。选项A、C、D侧重于模型本身能力的优化，未直接解决多轮对话中上下文依赖的问题。这一方法在RAG相关研究（如Meta的论文及开源框架如LangChain）中常被讨论。'},
  {id:420,type:'single',answer:'A',stem:'在构建RAG 应用时，以下哪些是本地向量数据库的特点?',opts:['适合小规模应用','无需关注运维','自动扩容'],exp:'在构建RAG应用时，本地向量数据库通常服务于特定场景。例如FAISS、Annoy等开源工具常被用于本地部署，其设计初衷是针对中小规模数据的高效检索，资源消耗相对可控。选项A符合这一特性，本地环境受硬件限制，大规模数据场景下性能可能不足。选项B不准确，本地部署依然需要自行处理安装、更新、备份等运维工作。选项C描述的自动扩容更多属于云数据库（如Pinecone）的特性，本地环境扩容需手动调整配置。相关技术文档（如FAISS官方说明）指出，本地向量数据库适用于数据量较小、对延迟敏感的场景。'},
  {id:421,type:'single',answer:'A',stem:'在示例中，以下哪种任务可以直接输入给大模型生成答案?',opts:['文档审查','内部知识查询','增加模型的训练数据'],exp:'大模型可直接输入生成答案的任务需具备明确输入输出格式且无需复杂推理或外部数据检索。文档审查属于文本处理任务，可直接输入大模型生成审查结果，如语法、逻辑分析，符合生成式模型能力。而内部知识查询需检索内部知识库，依赖外部数据存储与检索机制；增加模型的训练数据属于模型训练流程，需通过数据标注、预处理等步骤完成，均无法直接输入模型生成。'},
  {id:422,type:'single',answer:'C',stem:'以下代码片段的作用是什么？os.environ["OPENAI_API_KEY"]="your-api-key-here',opts:['从磁盘加载 API 密钥.','将 API 密钥存储到内存中.','将 API 密钥设置为环境变量.'],exp:'这段代码通过`os.environ`字典直接设置了名为`OPENAI_API_KEY`的环境变量的值。`os.environ`是Python标准库中表示操作系统环境变量的对象，对其进行赋值操作会直接影响当前进程的环境变量。选项C描述的正是这一行为。选项A涉及磁盘操作，但代码未包含文件读写；选项B虽隐含内存操作，但未准确指向环境变量的特性。'},
  {id:423,type:'single',answer:'A',stem:'在Answer Correctness的计算过程中，以下哪个指标用于衡量 answer与ground_truth 在事实描述上的差异？',opts:['事实准确度','语义相似度','增加模型的训练数据'],exp:'答案中的事实准确度指标关注答案与标准答案之间的事实一致性，直接评估内容是否准确反映真实信息。语义相似度侧重于语言表达层面的接近程度，不专门针对事实正确性。增加训练数据属于模型优化方法，与评估指标无关。相关研究如自然语言处理中的文本生成评估通常将事实性作为独立维度。题目正确选项对应事实性评估需求。'},
  {id:424,type:'single',answer:'A',stem:'在RAG工作流程中，以下哪个阶段涉及将文档切片向量化并存储到向量数据库中？',opts:['切片向量化与存储阶段','文档解析与切片阶段','检索召回'],exp:'在RAG（检索增强生成）工作流程中，不同阶段的任务划分明确。文档解析与切片阶段负责原始文档的结构化处理和分块，而切片向量化与存储阶段的核心任务是将分块后的文本转换为向量表示，并存入向量数据库以便后续检索。检索召回阶段则专注于根据输入查询匹配数据库中的相关向量。选项A对应的工作内容与题干描述的“向量化存储”直接相关，而选项B和C分别属于前期文档处理和后期的查询匹配环节。此任务划分参考了RAG技术中对数据处理流程的标准描述。'},
  {id:425,type:'single',answer:'A',stem:'在构建RAG应用时，以下哪种向量存储方案兼容开源Milvus？',opts:['向量检索服务 Milvus 版','内存向量存储','本地向量数据库'],exp:'Milvus 是一款开源向量数据库，主要用于高效处理非结构化数据的嵌入向量检索。在兼容性方面，官方提供的“向量检索服务 Milvus 版”专为 Milvus 设计，确保与开源版本完全兼容。内存向量存储通常指临时性存储方案，不具备持久化能力；本地向量数据库可能指其他本地部署的数据库，但未明确指向 Milvus。根据 Milvus 官方文档，其服务版直接对应开源架构，保证功能一致性。'},
  {id:426,type:'single',answer:'A',stem:'在以下代码片段中，response_format={"type"："json_object"}的作用是什么?',opts:['指定返回的标签格式为 JSON','指定返回的标签格式为 XML','指定返回的标签格式为文本'],exp:'在API开发中，response_format参数用于定义响应数据的结构类型。OpenAI的API文档明确指出，设置`{"type": "json_object"}`明确要求服务器生成符合JSON格式规范的响应。选项A对应的JSON是一种轻量级的数据交换格式，结构化且易于解析。选项B的XML未被该参数支持，选项C的文本通常为默认格式而非显式指定结果。'},
  {id:427,type:'single',answer:'A',stem:'在文档解析与切片阶段，以下哪种情况会影响大模型的回答效果?',opts:['文档切片缺少关键信息','增加模型的训练数据','减少模型的推理时间'],exp:'文档解析与切片阶段的处理直接影响模型输入质量。若切片时遗漏关键信息，模型无法基于完整上下文生成回答。训练数据量的调整属于模型训练阶段，与解析过程无关；推理时间优化涉及计算效率，不直接影响内容完整性。相关文献指出，文档预处理中上下文保留是确保模型性能的关键步骤。（来源：自然语言处理中的文本预处理研究）'},
  {id:428,type:'single',answer:'A',stem:'在ask_llm_route函数中，如果问题类型是“文档审查”，会使用哪个提示词？',opts:['reviewed_prompt','translate_prompt','query_engine'],exp:'在ask_llm_route函数逻辑中，文档审查类问题会映射到特定的提示词变量。问题类型与提示词的对应关系通常由函数内部的条件分支定义，例如通过字典映射或条件判断实现。选项[A]对应处理文档审查场景的变量名称，其余选项如[B]用于翻译场景，[C]为查询引擎组件，[D][E]涉及其他功能模块或简写形式。代码实现中可能存在类似`if problem_type == "文档审查": return reviewed_prompt`的结构。'},
  {id:429,type:'single',answer:'B',stem:'在RAG应用中进行多轮对话，应该如何进行检索？',opts:['在检索阶段输入完整的历史对话信息','结合历史对话信息对输入问题改写后进入检索阶段','在检索阶段输入最新的输入问题'],exp:'在RAG系统中，多轮对话的检索阶段需要有效利用上下文信息。传统单一检索方式无法捕捉对话历史中的隐含关联。输入完整历史信息可能引入无关内容，仅使用最新问题则丢失语境。对原始问题进行基于上下文的语义改写，能聚焦核心意图并保留必要关联信息，提升检索准确性。该设计思路符合对话系统领域对上下文敏感检索机制的常见处理方法（参考RAG相关文献）。选项A易导致信息过载，选项C忽略对话连贯性，选项B通过优化输入质量平衡检索效率与效果。'},
  {id:430,type:'single',answer:'A',stem:'在提示词框架中，受众(Audience)的主要作用是什么？',opts:['明确大模型针对的特定受众','提供任务的背景信息','定义大模型扮演的角色'],exp:'在提示词框架里，受众（Audience）的核心作用是明确大模型所针对的特定受众。通过确定目标对象，像学生、行业从业者等，能让模型了解任务服务对象，进而调整输出内容的风格、语气以及专业程度，让回答更契合用户需求。'},
  {id:431,type:'single',answer:'A',stem:'在提示词框架中，任务目标（Object）的主要作用是什么？',opts:['明确要求大模型完成的具体任务','提供任务的背景信息','定义大模型扮演的角色'],exp:'在提示词框架设计中，任务目标（Object）用于直接指定大模型需执行的具体操作。选项A符合这一功能，任务目标的核心是明确任务内容而非背景或角色。选项B涉及上下文信息，属于背景部分。选项C与角色设定相关，用于定义模型的身份或立场。'},
  {id:432,type:'single',answer:'A',stem:'在RAG应用的多轮对话中，CondenseQuestionChatEngine的主要作用是什么?',opts:['将用户问题改写为包含历史对话关键信息的新query','增加模型的训练数据','减少模型的推理时间'],exp:'在RAG的多轮对话场景中，历史对话上下文的处理是关键挑战。CondenseQuestionChatEngine源自对多轮交互中信息连贯性的需求，其设计目标是解决用户当前问题与历史信息的关联问题。例如用户先询问“如何学习机器学习”，随后问“需要哪些数学基础”，此时需将历史对话中的“机器学习”关键词与新问题结合生成完整query。选项B与模型训练阶段相关，但题干讨论的是推理阶段的对话引擎功能。选项C、D涉及模型性能或结构改造，未直接关联对话上下文的处理逻辑。选项A的描述准确反映了该组件将当前问题与历史信息融合生成新query的核心功能，符合RAG系统中对话引擎的实际应用原理。'},
  {id:433,type:'single',answer:'A',stem:'在以下代码片段中，response= ask("张伟是哪个部门的",query_engine=query_engine)的作用是什么?',opts:['使用查询引擎获取问题的答案','设置召回切片的最大数量','设置重排序的切片数量'],exp:'这段代码中的`ask`函数通过`query_engine`参数指定了处理查询的引擎，用于对自然语言提问生成响应。选项A描述的是该函数的基本用途，即通过查询引擎获取答案。选项B、C、D涉及到的参数设置通常在初始化查询引擎或配置检索策略时指定，而非在调用`ask`函数时直接传递。函数调用中的`query_engine`参数用于传递已配置好的引擎实例，而非调整内部参数。'},
  {id:434,type:'single',answer:'A',stem:'在构建有效的提示词时，清晰表达需求的主要作用是什么?',opts:['确保大模型生成的内容与任务高度相关','增加模型的训练数据','减少模型的推理时间'],exp:'清晰表达需求的主要作用在于帮助模型准确理解任务目标，从而生成符合预期的输出。在提示工程实践中，明确的指令能够减少歧义，使模型专注于任务需求。选项A直接关联任务相关性，正确反映了清晰表达的核心目的。选项B提到的训练数据扩展属于模型训练阶段，与提示词构建无关；选项C的推理时间优化更多涉及计算资源，并非需求表达的核心作用。相关概念可见Prompt Engineering设计原则及最佳实践指南。'},
  {id:435,type:'single',answer:'A',stem:'在RAG应用的多轮对话中，query_engine的主要作用是什么?',opts:['创建用于提问的引擎','增加模型的训练数据','减少模型的推理时间'],exp:'RAG（Retrieval-Augmented Generation）框架中，处理多轮对话时，系统需要动态整合检索与生成模块。query_engine的核心功能在于构建一个面向用户输入的接口，负责接收问题、触发检索机制获取外部知识，并协调生成模型输出上下文相关的回答。选项分析：B涉及训练数据扩充，与实时查询无关；C、D分别指向性能优化和模型结构，不属于功能定义。而A直接对应引擎在交互中的实际角色，符合RAG设计逻辑。《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》等文献明确将query_engine定位为处理查询请求的核心组件。'},
  {id:436,type:'single',answer:'A',stem:'检索增强式生成（RAG）应用的主要优势是什么？',opts:['避免传入大量背景信息','提高模型训练速度','减少模型推理时间'],exp:'检索增强式生成（RAG）通过结合检索机制与生成模型，在需要外部知识的任务中动态获取相关上下文。其核心设计是在生成阶段引入检索步骤，仅提取与当前查询最相关的信息作为输入，而非依赖模型内部存储或预先加载的全部背景数据。这种机制有效避免了传统生成模型中可能需要的海量背景信息输入，降低冗余计算并提升生成质量。选项A直接对应这一设计特点，其余选项涉及训练速度或推理效率，并非RAG的主要优化方向。相关论述可参考《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》原文（Lewis et al., 2020）。'},
  {id:437,type:'single',answer:'B',stem:'在top_p=0.5的设置下，大模型的输出会有什么特点?',opts:['输出内容非常多样化','输出内容相对单一','输出内容完全随机'],exp:'核采样（top-p）通过累积概率阈值控制生成词的选择范围。top_p=0.5时，模型仅从累计概率前50%的高概率词中选择，候选词集合缩小，生成内容集中于更可能出现的词汇，降低了多样性。相关研究指出较小的top_p值减少输出的随机性，使结果更确定和一致（Holtzman et al., 2020）。选项A错误，因多样性需要更大的top_p；选项C错误，核采样并非完全随机；选项B正确，参数限制候选词导致输出相对单一。'},
  {id:438,type:'single',answer:'A',stem:'在意图识别中，以下哪种方法不需要修改模型本身的参数？',opts:['使用提示词','对模型进行微调','增加模型的训练数据'],exp:'意图识别场景中，提示词技术通过向模型输入添加特定引导信息（如任务描述或示例）优化输出结果，属于外部输入干预而非修改模型参数的方法，与微调（调整模型权重）、增加训练数据（需重新训练参数）等参数变更方式形成本质区别，而减少推理时间属于计算效率优化范畴。'},
  {id:439,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪种方法用于执行比较？',opts:['compare_embeddings函数','增加模型的训练数据','减少模型的推理时间'],exp:'向量比较是嵌入向量处理中的关键步骤，通常涉及使用特定函数计算相似度。切片向量化与存储阶段需要对向量进行相似性比对。选项A对应执行嵌入向量比较的函数名称，符合场景需求。选项B属于数据增强手段，选项C与推理性能优化相关，两者均不直接涉及比较操作。常见实现中，如sentence-transformers库或自定义代码逻辑，会封装此类比较函数。'},
  {id:440,type:'single',answer:'A',stem:'Ragas提供的Answer Correctness指标用于评估什么?',opts:['RAG应用生成答案的准确度','生成答案与问题的相关性','生成答案与检索资料的事实一致性'],exp:'Ragas 的 Answer Correctness 指标专注于衡量 RAG 应用生成的答案在内容上的正确程度。该指标的定义明确指向答案是否准确满足问题需求，而非单纯与检索资料的一致性（对应选项 C）或与问题的相关性（选项 B）。官方文档指出，Answer Correctness 直接关联答案的精确性和完整性，属于 RAG 评估体系中对答案质量的核心验证维度。选项 A 准确反映了这一指标的设计意图。'},
  {id:441,type:'single',answer:'A',stem:'在切片向量化与存储阶段，以下哪些是compare_embedding_models函数的作用?',opts:['比较不同Embeddin模型在RA中的表现','增加模型的训练数据','减少模型的推理时间'],exp:'嵌入模型评估通常关注不同模型在特定任务上的性能差异。compare_embedding_models函数命名中的"compare"表明其核心功能是横向对比。在检索增强（RA）场景中，不同嵌入模型生成的向量质量直接影响语义匹配效果。选项B涉及训练数据规模，属于模型训练阶段而非评估环节；选项C优化推理速度属于工程部署问题，与模型效果对比无关。该函数的实际作用应聚焦于量化评估各模型在RA任务中的表现差异，例如准确率、召回率等指标对比。'},
  {id:442,type:'single',answer:'A',stem:'在ask_llm_route函数中，如果问题类型是“内容翻译”，会使用哪个提示词？',opts:['translate_prompt','reviewed_prompt','query_engine'],exp:'题干考察的是函数`ask_llm_route`中不同问题类型对应的提示词选择逻辑。根据代码设计，处理“内容翻译”类型的问题时通常需要匹配翻译相关的提示词。选项A（translate_prompt）直接对应翻译功能的语义，符合常见命名习惯。其他选项如reviewed_prompt涉及审核逻辑，query_engine属于查询处理器，ra或ask未明确关联翻译功能。代码中通过判断问题类型为“内容翻译”后会调用translate_prompt作为生成提示词的变量。'},
  {id:443,type:'single',answer:'A',stem:'在提示词框架中，以下哪些要素可以用于提供任务的背景信息？',opts:['上下文(Context)','样例(Sample)','任务目标(Object)'],exp:'在提示词框架中，上下文（Context）的作用是为任务设定场景或提供相关信息，帮助模型理解当前操作的背景。这一概念来源于提示工程的基本要素分类，其中上下文直接关联任务的环境或前置信息。选项B（样例）通常用于示范输出格式或内容，选项C（任务目标）明确任务的具体要求，两者均不直接对应背景信息的提供功能。'},
  {id:444,type:'single',answer:'A',stem:'在优化检索效果时，以下哪些方法可以提升大模型对参考信息的查找效率？',opts:['使用结构化的文档格式','增加模型的训练数据','减少模型的推理时间'],exp:'结构化文档格式（如XML、JSON）通过明确的信息分层和组织方式，使大模型能快速定位关键内容，降低解析复杂度。增加训练数据主要影响模型泛化能力，与检索效率无直接关联。减少推理时间针对模型计算速度优化，未涉及信息查找机制。结构化数据在信息检索系统中常用于提升索引和查询效率。'},
  {id:445,type:'single',answer:'A',stem:'在文档切片过程中，以下哪种切片方法是默认的切片策略？',opts:['句子切片','Token切片','句子窗口切片'],exp:'文档切片方法的选择取决于处理任务的具体需求。默认策略通常基于常见用例和效率考量，倾向于使用自然语言的基本结构单元。例如，NLP工具如spaCy或NLTK默认将文本划分为句子，因为句子是语义表达的完整单位，便于后续处理。句子切片直接分割文本为独立句子，保持了语法和逻辑的完整性。Token切片涉及更细粒度的划分（如单词、子词），一般用于特定模型输入要求。句子窗口和语义切片属于高级策略，需额外配置或算法支持。部分文献如《自然语言处理综论》提到句子级处理是基础步骤，多数框架默认采用此方式。'},
  {id:446,type:'single',answer:'B',stem:'在创建索引时，VectorStoreIndex.from_documents方法包含哪些步骤？',opts:['文档解析和文本分段','文本分段和建立索引','文本向量化和存储索引'],exp:'在LlamaIndex（一个用于构建大语言模型应用的框架）中，`VectorStoreIndex.from_documents`方法是一个高级封装函数，用于从文档集合直接创建向量索引。 该方法的工作流程通常包含两个核心步骤： 1. **文档解析（Document Parsing）**：将原始文档（如PDF、Word、文本文件等）读入并转换为统一的`Document`对象。 2. **文本向量化（Text Vectorization）**：将解析后的文档内容分割成节点（Nodes，即文本块），然后通过嵌入模型（Embedding Model）将这些文本块转换为向量（即数值表示），最后将这些向量存储到向量数据库中，从而建立索引。 在这个过程中，文本分段（Splitting）是文本向量化步骤内部的一个子操作，而建立索引（Indexing）则是向量化后自动完成的存储结果。因此，`from_documents`方法最直接包含的两个主要步骤是文档解析和文本向量化。 根据题目选项，D选项“文档解析和文本向量化”准确概括了该方法的核心过程。'},
  {id:447,type:'single',answer:'A',stem:'在检索召回阶段，以下哪种方法用于在检索后减少无关信息？',opts:['重排序','问题改写','问题扩写'],exp:'信息检索系统中，检索阶段通常分为召回（retrieval）和排序（ranking）两步。重排序（re-ranking）属于后处理步骤，其核心目标是对初步召回的文档列表进行二次优化，通过更复杂的模型（如神经网络排序模型）调整文档顺序，过滤低相关性内容。问题改写（query rewriting）和问题扩写（query expansion）属于检索前的查询优化技术，前者侧重于调整原始问题的表达形式，后者通过添加同义词或相关词扩展语义范围，两者均作用于检索前的输入阶段，直接影响召回内容的广度而非后续的精准筛选。相关方法在信息检索领域经典文献（如《Introduction to Information Retrieval》）中有明确区分。'},
  {id:448,type:'single',answer:'A',stem:'在文档切片过程中，以下哪种切片方法适合模型总是报Token超限的场景？',opts:['Token切片','句子切片','句子窗口切片'],exp:'在文档切片过程中，当模型总是报Token超限的场景时，意味着输入给模型的文本长度超过了其所能处理的最大Token数量限制。针对这种情况，需要选择一种能够有效控制输入文本长度的切片方法。 A选项（Token切片）是将文本按照Token（如单词、子词或字符等）进行分割，这种方法可以精确地控制每个切片的长度，确保不超过模型的最大Token限制。因此，在模型总是报Token超限的场景下，Token切片是一种合适的切片方法。 B选项（句子切片）是将文本按照句子进行分割，但句子长度可能差异较大，无法保证每个切片的Token数量都在模型可处理的范围内。 C选项（句子窗口切片）虽然考虑了句子间的上下文关系，但同样无法精确控制每个切片的Token数量。 D选项（语义切片）是基于文本的语义内容进行分割，这种方法更侧重于保持语义的完整性，但同样无法精确控制Token数量。 综上所述，A选项（Token切片）是适合模型总是报Token超限的场景的切片方法。因此，正确答案是A。'},
  {id:449,type:'single',answer:'C',stem:'为了让大模型能够回答私域知识问题，以下哪种方法更加简便且高效？',opts:['微调模型','训练新模型','通过提示词传递私域知识'],exp:'让大模型处理私域知识问题，关键在于平衡效率与成本。微调模型需要调整参数、准备标注数据，流程复杂且资源消耗大；训练新模型需从头开始，成本更高。提示词的方法利用现有模型能力，直接将私域知识嵌入输入文本，无需修改模型结构或重新训练。这一思路源于大规模预训练语言模型的应用实践，如GPT系列中常见的Few-shot Learning策略，通过上下文学习引导模型生成符合需求的回答。选项A和B涉及模型调整，流程繁琐；选项C仅依赖输入设计，更灵活高效。OpenAI官方文档及多篇NLP论文均提到提示工程在知识注入中的优势。'},
  {id:450,type:'single',answer:'A',stem:'在文档切片过程中，以下哪些切片方法适合模型总是报Token超限的场景？',opts:['Token切片','句子切片','句子窗口切片'],exp:'在处理大模型输入长度限制时，文档切片方法需有效控制每个切片的Token数量。Token切片直接将文本按固定Token数分割，确保每个片段不超过模型限制。对比其他方法，句子切片易导致片段长度不均，句子窗口切片虽保留上下文但同样难以精确控制Token量。OpenAI等平台的API文档常建议直接按Token分割文本以适应模型输入长度。'},
  {id:451,type:'single',answer:'A',stem:'在优化后的答疑机器人中，以下哪种问题需要经过RAG链路？',opts:['公司内部文档查询','检查文档错误','增加模型的训练数据'],exp:'RAG（Retrieval-Augmented Generation）链路的作用是在生成回答前从外部知识库检索相关信息。公司内部文档查询需要依赖此类检索机制获取特定文档内容以生成准确回答。检查文档错误通常依赖模型自身的逻辑判断能力，无需外部检索。增加训练数据属于模型训练阶段，与实时检索无关。'},
  {id:452,type:'single',answer:'A',stem:'在context precision的计算过程中，以下哪个步骤是必要的?',opts:['按顺序读取contexts中的contexti,判断其是否相关','增加模型的训练数据','减少模型的推理时间'],exp:'信息检索和评估指标中，context precision用于衡量返回结果中相关上下文的比例。评估时需逐一检查每个context的相关性以确定其有效性。[A]描述的是该过程的基本步骤，正确反映了计算时的必要操作。[B]、[C]属于模型训练及优化环节，与评估步骤无关。原始概念参考信息检索系统评价标准中的precision计算方式。'},
  {id:453,type:'single',answer:'A',stem:'在以下代码片段中，seed=42的作用是什么?',opts:['使输出可重现','增加输出的多样性','使输出更具确定性'],exp:'随机种子（seed）用于初始化随机数生成器的状态。设置固定种子值如42，可确保每次运行程序时生成相同的随机序列，从而实现结果的可重现性。该机制广泛应用于机器学习、模拟实验等场景，便于调试与验证。'},
  {id:454,type:'single',answer:'A',stem:'在构建RAG应用时，以下哪种向量存储方案适合快速开发和测试?',opts:['内向量存储','本地向量数据库','云服务向量存储'],exp:'在构建RAG应用时，向量存储方案的选择需考虑开发效率和环境依赖性。内存向量存储无需持久化、配置简单，避免了数据库服务的安装和维护开销，适合快速原型验证和调试。本地或云数据库通常涉及额外部署步骤和资源管理，影响开发速度。增加训练数据与存储方案无关。LangChain等框架推荐在测试阶段采用内存存储以减少依赖，加快迭代。'},
  {id:455,type:'single',answer:'A',stem:'在示例中，答疑机器人没有理解用户的意图，主要原因是什么?',opts:['知识库中的上下文干扰','增加模型的训练数据','减少模型的推理时间'],exp:'自然语言处理中，对话系统的上下文管理机制直接影响意图识别效果。相关研究指出，当知识库中存在冗余或冲突的上下文信息时，会影响模型对当前对话的语义解析。选项A指向上下文信息的干扰问题，这属于对话系统领域的典型挑战。选项B涉及训练数据规模，选项C涉及计算效率，均与题干描述的"意图理解失败"无直接关联。'},
  {id:456,type:'single',answer:'C',stem:'如果你想快速构建一个效果不错的RAG应用，可以参考哪篇文档？',opts:['使用LlamaIndex构建GraphRAG应用','0代码构建私有知识问答应用','可视化工工作流、智能体编排'],exp:'RAG 应用旨在增强生成模型的回答质量。零代码构建私有知识问答应用的文档，能让使用者无需复杂的编程知识就能快速搭建起效果不错的 RAG 应用，满足快速构建的需求。而可视化工作流等可能更侧重于流程展示，LlamaIndex API 文档和使用 LlamaIndex 构建 GraphRA 应用相对而言，在快速构建效果不错的应用上不如零代码构建文档直接有效。'},
  {id:457,type:'single',answer:'A',stem:'在优化检索效果时，以下哪些方法可以提升文档的结构性?',opts:['使用Markdown格式','增加模型的训练数据','减少模型的推理时间'],exp:'文档的结构性与格式选择相关。Markdown通过标记语法（如标题、列表、代码块）明确区分文本层次与元素类型，增强可读性与机器解析效率。其他选项涉及模型训练与推理优化，直接影响性能而非文档结构。《信息检索导论》指出，结构化数据能提升检索系统处理效率。选项A通过格式化手段直接改善结构，B、C属于模型层面优化。'},
  {id:458,type:'single',answer:'A',stem:'在构建RAG应用时，哪种技术适合处理大规模文本数据？',opts:['GraphRAG','自然语言处理(NLP)','机器学习(ML)'],exp:'构建RAG应用时，处理大规模文本数据的关键技术需要结合高效的检索机制与语义理解能力。GraphRAG由微软提出，利用图结构将文本中的实体、关系构建为知识图谱，增强了上下文关联性和检索效率，适用于海量文本场景。自然语言处理（NLP）侧重于基础语义分析，机器学习（ML）聚焦于模型训练，两者未直接针对大规模检索优化。'},
  {id:459,type:'single',answer:'A',stem:'在文档切片过程中，以下哪种切片方法适合对Token数量有严格要求的场景？',opts:['Token切片','句子切片','句子窗口切片'],exp:'文档切片方法需根据Token数量限制选择。Token切片直接按Token数量分割，确保严格符合要求。自然语言处理中，精确控制Token数量常使用Token切片，如API调用限制或模型输入限制。句子切片和句子窗口切片基于语义单元，无法保证每个切片Token数一致。'},
  {id:460,type:'single',answer:'A',stem:'在文档切片过程中，以下哪些切片方法适合处理Markdown文档？',opts:['Markdown切片','语义切片','Token切片'],exp:'Markdown文档具有特定的语法结构如标题、列表、代码块等。针对结构化文档的切片方法需考虑其层级和格式特性。选项A直接对应Markdown文档的结构化处理方式，例如按标题层级或段落分割。《Python Markdown》等解析库通常采用类似方法处理文档块。选项B关注内容语义而非格式，选项C基于字符或词汇划分，两者可能破坏Markdown原有结构逻辑。'},
  {id:461,type:'single',answer:'B',stem:'在低温度(temperature=0.1)设置下，大模型的输出会有什么特点？',opts:['输出内容非常多样化','输出内容相对单一','输出内容完全随机'],exp:'温度参数控制生成文本的多样性，低温（如0.1）使模型更倾向于选择概率最高的词，输出确定性更强、重复性更高。这与自然语言处理中生成模型的基本原理一致，温度参数的作用在《神经网络与深度学习》等教材中均有阐述。选项A描述高温设置下的行为，选项C混淆了温度与随机性的关系，低温反而减少随机性。正确选项对应低温降低多样性的特性。'},
  {id:462,type:'single',answer:'A',stem:'Ragas提供的以下哪些指标用于评估整体回答质量？',opts:['Answer Correctness','Answer Relevancy','Faithfulness'],exp:'在RAG（检索增强生成）系统的评估框架中，Ragas是一套广泛用于衡量生成回答质量的指标集。不同指标评估回答的不同维度： - **Answer Correctness（回答正确性）**：评估生成的回答与标准答案之间在事实内容上的匹配程度，即回答是否准确、真实。这是衡量整体回答质量最核心的指标之一。 - **Answer Relevancy（回答相关性）**：侧重于回答是否针对用户提出的问题，即回答的内容是否与问题相关，而不是答非所问。 - **Faithfulness（忠实度）**：评估生成的回答是否忠实于提供的上下文（检索到的文档），即是否没有在上下文中未提及的信息或产生幻觉。 - **Context Precision（上下文精确度）**：衡量检索到的文档片段中，有多少是与回答相关的信息，更侧重于检索质量而非回答本身。 在您提供的题目中，问题是“评估整体回答质量”，而**Answer Correctness**直接着眼于回答内容本身的对错与准确性，最能代表回答的整体质量。其他指标则分别评估相关性、忠实度或检索质量。因此，正确答案为A。'},
