<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ACP大模型认证刷题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#e8ebef;color:#333}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:720px;margin:0 auto;background:#f0f2f5;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06)}

/* Header */
.hd{background:#07c160;color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-shrink:0;z-index:10}
.hd-left{min-width:0;flex:1}
.hd-title{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}
.hd-sub{font-size:12px;opacity:.85;margin-top:2px;overflow-wrap:anywhere;word-break:break-word}
.hd-right{font-size:13px;opacity:.85;text-align:right;flex-shrink:0}

/* Progress */
.pg-wrap{background:#fff;padding:10px 16px 8px;border-bottom:1px solid #eee;flex-shrink:0}
.pg-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pg-text{font-size:13px;color:#888;min-width:0;overflow-wrap:anywhere}
.pg-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pick-open{background:none;border:1px solid #07c160;color:#07c160;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer}
.fav-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:0;line-height:1;color:#f5a623}
.pg-bar{height:4px;background:#e8e8e8;border-radius:2px;overflow:hidden}
.pg-fill{height:100%;background:#07c160;border-radius:2px;transition:width .35s ease}

/* Main scroll area */
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* Screen toggle */
.screen{display:none}
.screen.on{display:block}

/* Question card */
.q-card{background:#fff;margin:12px 12px 8px;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.q-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:10px}
.badge-s{background:#e8f5e9;color:#2e7d32}
.badge-m{background:#e3f2fd;color:#1565c0}
.q-stem{font-size:16px;line-height:1.65;color:#222;overflow-wrap:anywhere;word-break:break-word}

/* Options */
.opts{margin:0 12px 8px;display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #e0e0e0;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;color:#333;text-align:left;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:all .15s;-webkit-user-select:none;user-select:none;width:100%}
.opt-label{width:28px;height:28px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#555;flex-shrink:0;transition:all .15s}
.opt-text{flex:1;min-width:0;padding-top:2px;overflow-wrap:anywhere;word-break:break-word}
.opt.sel{border-color:#1890ff;background:#e6f7ff}
.opt.sel .opt-label{background:#1890ff;color:#fff}
.opt.ok{border-color:#52c41a;background:#f6ffed}
.opt.ok .opt-label{background:#52c41a;color:#fff}
.opt.ng{border-color:#ff4d4f;background:#fff1f0}
.opt.ng .opt-label{background:#ff4d4f;color:#fff}
.opt:disabled{cursor:default}

/* Submit (multi) */
.submit-btn{display:block;margin:0 12px 8px;padding:14px;background:#07c160;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:calc(100% - 24px)}
.submit-btn:disabled{background:#ccc;cursor:default}

/* Result */
.result{margin:0 12px 8px;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.6;display:none;overflow-wrap:anywhere;word-break:break-word}
.result.ok{background:#f6ffed;border-left:4px solid #52c41a;color:#237804}
.result.ng{background:#fff1f0;border-left:4px solid #ff4d4f;color:#a8071a}

/* Next btn */
.next-btn{display:none;margin:0 12px 20px;padding:14px;background:#07c160;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:calc(100% - 24px);text-align:center}

/* Score screen */
.score-wrap{padding:24px 16px;text-align:center}
.score-title{font-size:20px;font-weight:700;color:#333}
.score-sub{font-size:14px;color:#999;margin-top:4px}
.score-ring{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#07c160,#52c41a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;box-shadow:0 6px 24px rgba(7,193,96,.3)}
.score-num{font-size:48px;font-weight:800;line-height:1}
.score-lbl{font-size:13px;opacity:.85;margin-top:4px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.sc{background:#fff;border-radius:10px;padding:14px 6px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sc-n{font-size:26px;font-weight:800}
.sc-d{font-size:12px;color:#999;margin-top:3px}
.act-btns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.act-btn{padding:14px;border-radius:10px;font-size:16px;font-weight:700;border:none;cursor:pointer}
.act-p{background:#07c160;color:#fff}
.act-s{background:#fff;color:#07c160;border:2px solid #07c160}

/* List screens */
.list-wrap{padding:12px}
.list-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.list-count{font-size:14px;color:#888}
.list-go{background:#07c160;color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.list-go.red{background:#ff4d4f}
.list-item{background:#fff;border-radius:10px;margin-bottom:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.list-num{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.ln-s{background:#52c41a}
.ln-m{background:#1890ff}
.list-stem{font-size:14px;color:#444;line-height:1.5;flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.empty{text-align:center;padding:60px 20px;color:#ccc}
.empty-ico{font-size:56px;margin-bottom:12px}
.empty-txt{font-size:15px}

/* Bottom nav — pinned by flex shell */
.bot-nav{position:relative;background:#fff;border-top:1px solid #e0e0e0;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;border:none;background:none;cursor:pointer;color:#bbb;font-size:11px;gap:2px}
.tab.on{color:#07c160}
.tab-ico{font-size:22px;line-height:1}

/* Mode badge on header */
.mode-tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:4px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* Pick screen */
.pick-wrap{padding:16px 12px 24px}
.pick-seg{display:flex;gap:10px;margin-bottom:14px}
.pick-type{flex:1;padding:12px 8px;border:2px solid #e0e0e0;background:#fff;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;color:#555}
.pick-type.on{border-color:#07c160;background:#f0fff6;color:#07c160}
.pick-type small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:4px}
.pick-meta{font-size:13px;color:#888;margin-bottom:14px}
.pick-field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.pick-field input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:18px;font-weight:700}
.pick-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pick-chip{padding:6px 12px;border:none;background:#fff;border-radius:16px;font-size:13px;cursor:pointer;color:#555;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pick-chip.on{background:#07c160;color:#fff}
.pick-preview{margin:4px 0 16px;padding:12px 14px;background:#fff;border-radius:10px;font-size:14px;line-height:1.55;color:#444;min-height:64px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow-wrap:anywhere;word-break:break-word}
.pick-hint{color:#07c160;margin-top:6px;font-size:13px}

/* Cloud sync */
.sync-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px}
.sync-btn.warn{background:rgba(255,193,7,.35)}
.sync-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
.sync-mask.on{display:flex}
.sync-panel{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,.15)}
.sync-title{font-size:17px;font-weight:800;margin-bottom:6px}
.sync-desc{font-size:13px;color:#888;line-height:1.55;margin-bottom:14px}
.sync-field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#555}
.sync-field input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px}
.sync-status{font-size:13px;color:#666;margin:12px 0;min-height:1.4em;overflow-wrap:anywhere}
.sync-status.ok{color:#07c160}
.sync-status.err{color:#ff4d4f}
.sync-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sync-actions button{flex:1;min-width:88px;padding:12px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer}
.sync-save{background:#07c160;color:#fff}
.sync-close{background:#f0f2f5;color:#555}
.sync-now{background:#fff;color:#07c160;border:2px solid #07c160 !important}
@media(min-width:520px){
  .sync-mask{align-items:center}
  .sync-panel{border-radius:16px;margin:16px}
}
@media(min-width:740px){
  body{padding:0}
  .app{border-left:1px solid rgba(0,0,0,.06);border-right:1px solid rgba(0,0,0,.06)}
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="hd">
    <div class="hd-left">
      <div class="hd-title">ACP大模型认证刷题 <span class="mode-tag" id="modeTag">顺序练习</span></div>
      <div class="hd-sub" id="hdSub">阿里云大模型ACP认证 · 共1866题（单选1344·多选522）</div>
    </div>
    <div class="hd-right">
      <div id="hdRight"></div>
      <button type="button" class="sync-btn" id="syncBtn" onclick="openSyncPanel()">☁ 同步</button>
    </div>
  </div>

  <div class="sync-mask" id="syncMask" onclick="if(event.target===this)closeSyncPanel()">
    <div class="sync-panel" role="dialog" aria-label="云端同步设置">
      <div class="sync-title">云端同步</div>
      <div class="sync-desc">设置同一口令后，手机和电脑会自动同步刷题进度、错题集和收藏。口令请自己保管，不要用常用密码。</div>
      <div class="sync-field">
        <label for="syncTokenInput">同步口令（至少 8 位）</label>
        <input type="password" id="syncTokenInput" autocomplete="off" placeholder="例如：acp-my-secret">
      </div>
      <div class="sync-status" id="syncStatus"></div>
      <div class="sync-actions">
        <button type="button" class="sync-close" onclick="closeSyncPanel()">关闭</button>
        <button type="button" class="sync-now" onclick="manualSync()">立即同步</button>
        <button type="button" class="sync-save" onclick="saveSyncToken()">保存</button>
      </div>
    </div>
  </div>

  <!-- Progress (only in practice) -->
  <div class="pg-wrap" id="pgWrap">
    <div class="pg-row">
      <span class="pg-text" id="pgText">第 1 题 / 共 50 题</span>
      <div class="pg-actions">
        <button class="pick-open" onclick="switchTab(1)">选题</button>
        <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
      </div>
    </div>
    <div class="pg-bar"><div class="pg-fill" id="pgFill" style="width:0%"></div></div>
  </div>

  <!-- Main scrollable area -->
  <div class="main" id="mainArea">

    <!-- Practice screen -->
    <div class="screen on" id="scrPractice">
      <div class="q-card">
        <span class="q-badge" id="qBadge">单选题</span>
        <div class="q-stem" id="qStem">加载中...</div>
      </div>
      <div class="opts" id="optsWrap"></div>
      <button class="submit-btn" id="submitBtn" onclick="submitMulti()" style="display:none" disabled>提交答案</button>
      <div class="result" id="resultArea"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">下一题 →</button>
    </div>

    <!-- Score screen -->
    <div class="screen" id="scrScore">
      <div class="score-wrap">
        <div class="score-title">本次练习完成！</div>
        <div class="score-sub">答题详情如下</div>
        <div class="score-ring">
          <div class="score-num" id="scoreNum">0</div>
          <div class="score-lbl">正确率</div>
        </div>
        <div class="score-grid">
          <div class="sc"><div class="sc-n" id="scTotal" style="color:#333">0</div><div class="sc-d">共答题</div></div>
          <div class="sc"><div class="sc-n" id="scOk" style="color:#52c41a">0</div><div class="sc-d">答对</div></div>
          <div class="sc"><div class="sc-n" id="scNg" style="color:#ff4d4f">0</div><div class="sc-d">答错</div></div>
        </div>
        <div class="act-btns">
          <button class="act-btn act-p" onclick="goWrong()">查看错题集</button>
          <button class="act-btn act-s" onclick="restart()">重新练习</button>
        </div>
      </div>
    </div>

    <!-- Pick screen -->
    <div class="screen" id="scrPick">
      <div class="pick-wrap">
        <div class="pick-seg">
          <button class="pick-type on" id="pickSingle" onclick="setPickType('single')">单选题<small id="pickSingleCount"></small></button>
          <button class="pick-type" id="pickMulti" onclick="setPickType('multi')">多选题<small id="pickMultiCount"></small></button>
        </div>
        <div class="pick-meta" id="pickMeta"></div>
        <div class="pick-field">
          <label for="pickNum">从题号开始</label>
          <input type="number" id="pickNum" inputmode="numeric" pattern="[0-9]*" oninput="updatePickPreview()" onkeydown="if(event.key==='Enter')confirmPick()">
        </div>
        <div class="pick-chips" id="pickChips"></div>
        <div class="pick-preview" id="pickPreview"></div>
        <button class="submit-btn" onclick="confirmPick()">从该题开始顺序练习</button>
      </div>
    </div>

    <!-- Wrong screen -->
    <div class="screen" id="scrWrong">
      <div class="list-wrap" id="wrongWrap"></div>
    </div>

    <!-- Fav screen -->
    <div class="screen" id="scrFav">
      <div class="list-wrap" id="favWrap"></div>
    </div>

  </div><!-- /main -->

  <!-- Bottom Nav -->
  <div class="bot-nav">
    <button class="tab on" id="tab0" onclick="switchTab(0)">
      <span class="tab-ico">📚</span><span>练习</span>
    </button>
    <button class="tab" id="tab1" onclick="switchTab(1)">
      <span class="tab-ico">🔢</span><span>选题</span>
    </button>
    <button class="tab" id="tab2" onclick="switchTab(2)">
      <span class="tab-ico">❌</span><span>错题集</span>
    </button>
    <button class="tab" id="tab3" onclick="switchTab(3)">
      <span class="tab-ico">⭐</span><span>收藏夹</span>
    </button>
  </div>
</div>

<script>
// ===================== 题目数据 =====================
// 如需添加新题，在此数组末尾追加对象即可
// id: 题号, type: 'single'|'multi', answer: 答案字母(多选用连写如'BC'), stem: 题干, opts: 选项数组(不含ABCD前缀)
const QS = [
  {id:1,type:'single',answer:'D',stem:'Transformer架构中，Self-Attention机制的核心计算步骤不包括以下哪一项？',opts:['计算Query、Key、Value矩阵','计算注意力权重分数','对权重进行Softmax归一化','使用RNN进行序列编码'],exp:'Transformer完全摒弃了RNN结构，Self-Attention直接计算序列中所有位置之间的依赖关系，无需递归或循环结构。'},
  {id:2,type:'single',answer:'B',stem:'在Multi-Head Attention中，多个注意力头的作用是什么？',opts:['增加模型参数量以提升训练速度','让模型从不同表示子空间同时关注信息','减少计算量，提高推理效率','替代位置编码的功能'],exp:'Multi-Head Attention通过多个独立的注意力头，允许模型在不同的表示子空间中学习不同类型的注意力模式，丰富语义表达。'},
  {id:3,type:'single',answer:'C',stem:'BPE（Byte Pair Encoding）分词算法的基本思想是？',opts:['按单词边界直接切分','按固定字符数切分文本','通过统计频率迭代合并高频字符对','使用预定义词典进行最大匹配'],exp:'BPE从字符级别开始，反复统计并合并出现频率最高的相邻字符对，逐步构建子词词表，兼顾覆盖率和语义完整性。'},
  {id:4,type:'single',answer:'B',stem:'在Embedding（词嵌入）中，向量的维度通常代表什么？',opts:['词在文本中的位置信息','词在语义空间中的表示','词的出现频率','词的字符长度'],exp:'Embedding将离散的词映射到连续的高维向量空间，向量各维度编码了词的语义特征，语义相近的词向量距离也相近。'},
  {id:5,type:'single',answer:'B',stem:'解码策略中，temperature参数的值越接近0，模型输出会呈现什么特征？',opts:['输出更加随机多样','输出更加确定保守','输出速度更快','输出长度更短'],exp:'temperature控制概率分布的平滑程度，值越小分布越尖锐，模型倾向于选择概率最高的Token，输出更确定。'},
  {id:6,type:'single',answer:'B',stem:'top_p（核采样）参数设置为0.3的含义是什么？',opts:['从概率最高的前30个Token中随机采样','从累积概率达到30%的最小Token集合中采样','只保留概率大于0.3的Token','每次生成时有30%概率随机选择'],exp:'top_p核采样从概率从高到低累积，当累积概率首次超过阈值p时，仅从该集合内采样，截断尾部低概率Token。'},
  {id:7,type:'single',answer:'B',stem:'Beam Search（束搜索）与贪心解码的主要区别是什么？',opts:['Beam Search每次只保留最优的一个候选','Beam Search同时维护多个候选序列','Beam Search不需要计算概率','Beam Search只能用于翻译任务'],exp:'Beam Search在每个时间步维护beam_size个最优候选序列，通过考虑多条路径来避免贪心解码的局部最优问题。'},
  {id:8,type:'single',answer:'B',stem:'在预训练阶段，大语言模型通常采用什么训练目标？',opts:['强化学习的奖励最大化','下一个Token预测（Next Token Prediction）','分类任务的交叉熵最小化','对抗生成训练'],exp:'GPT类大模型的预训练采用自回归语言模型目标，即根据前文预测下一个Token，最大化训练数据的似然概率。'},
  {id:9,type:'single',answer:'B',stem:'SFT（Supervised Fine-Tuning）的含义是什么？',opts:['使用无标注数据进行自监督训练','使用人工标注的高质量指令数据进行有监督微调','通过强化学习优化模型输出','使用对比学习训练模型'],exp:'SFT指令微调使用人工编写的（指令-回答）数据对模型进行有监督训练，使其学会遵循指令完成任务。'},
  {id:10,type:'single',answer:'C',stem:'RLHF（基于人类反馈的强化学习）训练流程中，以下哪个阶段是第一步？',opts:['训练奖励模型（Reward Model）','使用PPO算法优化策略','收集人类偏好数据进行SFT训练','部署模型进行在线推理'],exp:'RLHF的标准流程为：首先进行SFT训练获得初始策略，然后训练奖励模型，最后使用PPO等强化学习算法优化策略。'},

  {id:57,type:'single',answer:'B',stem:'在RAG检索阶段，Query改写的主要目的是什么？',opts:['减少检索时间','将用户的模糊或简短问题改写为更精准的检索查询','翻译用户问题','增加检索结果数量'],exp:'用户原始问题往往不够精确，Query改写将问题优化为更适合检索的形式，补充上下文或纠正歧义，提升检索召回质量。'},

  {id:60,type:'single',answer:'B',stem:'在多轮对话RAG场景中，以下哪个是必须处理的关键问题？',opts:['向量数据库的选型','对话历史的有效管理和上下文融合','文档的字体格式','模型的参数数量'],exp:'多轮对话RAG需要管理对话历史，正确处理指代消解和上下文继承，将多轮信息融入检索和生成流程。'},

  {id:99,type:'single',answer:'B',stem:'不安全插件设计中，以下哪种做法存在最大的安全风险？',opts:['插件使用HTTPS协议通信','插件直接执行用户输入而不进行任何校验和过滤','插件有完善的错误处理','插件请求最小权限'],exp:'直接执行未校验的用户输入可能导致代码注入、命令注入等严重安全漏洞，是所有插件设计中最危险的模式。'},
  {id:100,type:'single',answer:'B',stem:'内容安全审核在大模型应用中的主要目的是什么？',opts:['提升模型推理速度','过滤和拦截违规有害内容，确保输出合规','减少API调用成本','优化模型参数'],exp:'内容安全审核对模型的输入和输出进行检测，拦截色情、暴力、政治敏感等违规内容，是线上服务合规运行的基础保障。'},
  {id:101,type:'single',answer:'B',stem:'下列哪种做法不能保证关键数据的语义独立性与完整性”？',opts:['对不同的数据类型(例如文本、表格、 图片)采用不同的处理方式。','将标题下的所有文本合并成一个段落。','针对表格中每一行单元格的数据,扩写加上各级标题、表格头部的字段说明','确保每个语义单元都有清晰的边界和完整的上下文信息。'],exp:'独立性: 数据单元(如文本段落、表格行、 图片标题等) 应保持自身明确的语义边界,不与其他内容混淆。完整性:数据单元应包含足够的上下文信息,确保其含义清晰且不被割裂。'},
  {id:102,type:'single',answer:'C',stem:'下列哪项不是向量数据库的主要作用？',opts:['检索向量数据','为向量数据构建索引','训练Embedding模型','存储向量数据'],exp:'向量数据库的核心功能集中在向量数据的管理与高效访问。相关技术文献（如FAISS、Milvus官方文档）明确指出，其设计目标包括存储大量向量、构建索引加速相似性搜索、支持快速检索。检索（A）、索引构建（B）、存储（D）均属于这一范畴。训练Embedding模型（C）属于机器学习模型开发环节，需通过算法和训练数据调整模型参数，不属于数据库职责。'},
  {id:103,type:'single',answer:'A',stem:'句子窗口检索的优势在于：',opts:['提高检索阶段的精确性同时,保证了生成阶段的信息完整性','对大模型的注意力机制进行了针对性改善','提高大模型生成的速度','可以降低对数据库存储空间要求'],exp:'句子窗口检索技术主要关注检索质量与生成效果的平衡。该技术通过限定检索范围提升准确性，同时保留上下文信息避免生成内容碎片化。选项A强调生成速度，未涉及质量优化；选项B指向模型结构改进，与检索无关；选项D讨论存储需求，非技术核心。选项C准确反映了检索阶段精准定位与生成阶段完整性的结合，符合技术设计目标。'},
  {id:104,type:'single',answer:'B',stem:'在模型训练循环中，哪段代码用于更新模型权重（梯度更新）？',opts:['loss = criterion(outputs, labels)','optimizer.step()','model.train()','loss.backward()'],exp:'在训练神经网络时，梯度更新通过优化器实现。PyTorch中，优化器的step()方法根据计算出的梯度调整模型参数。反向传播由loss.backward()完成，仅计算梯度而不更新权重。model.train()设置模型为训练模式，不影响参数更新。criterion计算损失值属于前向传播阶段。更新权重的操作明确由optimizer.step()执行。'},
  {id:105,type:'single',answer:'D',stem:'top_p (nucleus sampling)参数的主要作用是什么?',opts:['控制模型使用的 CPU 核心数量。','控制模型生成文本的长度。','控制模型输出的格式。','控制模型只考虑概率最高的几个词,例如这里设置 0.9,则模型只考虑累积概率前 90% 的词'],exp:'top_p参数（nucleus sampling）用于调整生成文本时筛选词汇的概率范围。该参数来自Holtzman等人2019年提出的核采样方法（《The Curious Case of Neural Text Degeneration》）。选项A关联硬件资源，与生成策略无关；选项B对应生成长度控制参数（如`max_length`）；选项C涉及输出结构而非内容生成逻辑；选项D准确描述核采样的核心机制——动态截取累积概率达阈值的词汇集合，保证生成多样性同时过滤低概率词。'},
  {id:106,type:'single',answer:'C',stem:'以下哪种用法不能有效利用system角色提示词?',opts:['限制模型的输出行为','设定对话的背景和目标','直接回答用户问题','提供特定领域的知识'],exp:'在大型语言模型中，system角色提示词主要用于设定对话框架而非执行具体交互。OpenAI官方文档指出，该角色承担定义对话规则、设置响应格式、提供上下文知识等功能。选项A通过规范输出范围实现内容约束，属于典型应用场景；选项B通过建立对话基础框架满足任务导向需求，符合角色定位；选项D通过输入专业知识增强模型领域适配性，属于预设信息范畴。而选项C要求的即时问题应答属于对话执行层面，应由assistant角色而非system角色完成，偏离了该角色设计初衷。'},
  {id:107,type:'single',answer:'B',stem:'根据"Multi-Agent"的思想，以下哪种方式更适合处理复杂的RAG优化任务？',opts:['只使用 DashScopeParse 解析文档,其他优化步骤都手动完成.','根据任务特点,将复杂任务拆分成多个子任务,每个子任务使用不同的模型、prompt 或代码逻辑进行处理.','将所有任务步骤整合到一个大型 prompt 中,一次调用大模型完成所有处理.','仅使用通义千问 API 完成所有处理,不使用其他工具.'],exp:'Multi-Agent思想的核心是通过分工协作提升系统性能，强调任务分解与模块化处理。OpenAI的研究及RAG优化相关文献指出，复杂任务需针对不同环节设计专用处理单元。选项B通过拆分任务并分配差异化处理策略，适配子任务特性，避免单一模型或工具的能力瓶颈，契合Multi-Agent的分布式、协作式设计原则。其他选项或依赖单一工具（A、D），或忽略任务复杂度对模型容量的挑战（C），缺乏系统性优化能力。'},
  {id:108,type:'single',answer:'B',stem:'以下哪种情况最适合在输出的内容安全合规检查中处理？',opts:['用户上传的图片格式不符合要求。','机器人的回答包含公司内部代码片段。','用户输入的问题包含辱骂性词汇。','机器人无法理解用户的问题。'],exp:'唯一涉及 AI 输出内容的安全风险(内部代码泄露)'},
  {id:109,type:'single',answer:'B',stem:'请问这段代码的主要作用是？pythonNode_parser = SentenceWindowNodeParser.from_defaults ( window_size=3,Window_metadata_key="window",Original_text_metadata_key="original_text"Nodes = node_parser.get_nodes_from_documents([document]) window_text',opts:['对召回的文本段进行 rerank 后,输入大模型进行回复','在句子窗口检索中,将扩展后的句子传入上下文并进行回复','在自动合并检索中,判断父节点是否有超过半数的子节点被召回','加载本地索引,对 query 进行回复'],exp:'代码直接对应句子窗口检索的流程,扩展上下文优化生成,其他选项不符合代码功能'},
  {id:110,type:'single',answer:'B',stem:'在下列哪项任务中，大模型可能不是最佳工具选择？',opts:['分析用户反馈,识别产品改进建议的主题。','确定两种药物治疗效果是否有统计学上的显著差异。','自动为新闻文章分配合适的标签类别。','从大量日志数据中自动检测异常登录行为'],exp:'确定统计学显著性需专业工具,大模型更适合语言相关任务。其他选项均可通过 LLM 实现(或辅助)。'},
  {id:111,type:'single',answer:'C',stem:'Python#获取用户意图的核心算法Def get_purpose (document) :Prompt_template="【角色背景】你是一个专业的管理者，你将阅读一条用户的问题并进行用户意图分类【任务要求】我们需要将用户的意图分成如下几类：请假政策，福利待遇，绩效考核，工作职责,开发规范【输出要求】请以json格式输出,不要输出其他内容格式如"purpose":"请假政策",，"query":"请假流程是怎样的,需要提前多久申请？"}其中,purpose是你识别出的意图,query 是用户输入的原始文本【用户输入】以下是用户输入，请审阅：Query = prompt_template + document',opts:['只需要修改输入的用户 query 列表','需要修改输出格式要求。','需要修改 prompt_template 中的【任务要求】 部分, 以及可能需要更新 get_purpose 函数中的逻辑。','只需要修改 大模型 query 函数 Q_S_Line'],exp:'这道题考察对代码中意图分类逻辑的理解。原代码的prompt_template在【任务要求】部分明确列出了支持的意图类别列表，包括请假政策、福利待遇等。当新增"入职流程"意图时，必须修改该列表才能让模型识别新类别。虽然函数主体看似仅拼接字符串，但实际分类逻辑依赖prompt内容，因此需要调整模板。输出格式和用户输入部分无需改动，但需注意若后续处理代码存在类别校验逻辑，则需同步更新函数内部处理流程。此场景对应自然语言处理中基于prompt的文本分类任务设计。代码中【任务要求】的结构直接影响模型输出结果。'},
  {id:112,type:'single',answer:'A',stem:'在创建一个消息(Message)时，需要传递哪个参数来指定线程ID?',opts:['thread.id','message.id','content','assistant.id'],exp:'根据常见的消息创建API设计（例如OpenAI的对话补全接口或类似的多线程聊天系统），在创建一个消息（Message）时，如果需要指定该消息属于哪个线程（Thread），通常使用一个参数来标识线程的ID。这个参数一般是**`thread.id`**（或类似于`thread_id`），用于将消息关联到特定的对话线程。题目选项中的`thread.id`正是为了指定线程ID，而其他选项如`message.id`是消息自身的ID，`content`是消息内容，`assistant.id`是助手的ID，均不符合“指定线程ID”的要求。 因此，正确答案是A。'},
  {id:113,type:'single',answer:'D',stem:'在大模型对话的API中，assistant角色的作用是什么？',opts:['提供用户输入','监控对话的安全性','设定对话的背景信息','代表模型本身,返回生成的回复'],exp:'在大模型对话API的设计中，角色分为system、user、assistant等。其中system通常用于设定对话背景或规则（A选项）；user代表用户输入（D选项）。assistant角色专门用于承载模型生成的回复内容，如OpenAI官方文档指出，assistant消息保存模型生成的响应。B选项涉及安全监控，通常属于系统层功能而非角色定义。正确选项对应API设计中assistant的明确职责。'},
  {id:114,type:'single',answer:'D',stem:'通过 LlamaIndex 创建 RAG 应用时,rerank 的作用是?',opts:['替换 embedding model','设置召回文本段个数','根据用户的输入去向量数据库进行检索','对向量数据库的检索结果进行重新排序'],exp:'Rerank的作用是对向量数据库的检索结果进行重新排序，通过更精细的打分机制提升相关性排名，确保最匹配的文本排在前列。'},
  {id:115,type:'single',answer:'D',stem:'在大语言模型微调的训练循环中，哪个步骤负责计算模型输出与真实标签之间的差异？',opts:['反向传播','参数初始化','梯度更新','正向传播'],exp:'在机器学习训练过程中，损失函数的计算是模型评估预测误差的关键环节。这一问题涉及微调阶段的训练循环步骤，其中反向传播的作用是利用链式法则将损失值从输出层向输入层传递，计算每个参数的梯度。该知识点来源于神经网络训练流程的基本原理。选项分析中，梯度更新（A）涉及参数调整而非差异计算；参数初始化（B）是训练前的准备工作；正向传播（D）负责生成预测输出，并不直接处理差异；反向传播（C）在计算出损失后，通过导数链式传播梯度，因此包含了误差计算的过程。'},
  {id:116,type:'single',answer:'D',stem:'你正在使用大模型逐条输出检测结果。以下哪种数据结构最适合存储和处理这些结果？',opts:['列表(List)','集合(Set)','字符串','字典(Dictionary),键为检测项,值为检测结果和描述'],exp:'字典以键值对形式完美匹配检测项与结果的关联需求'},
  {id:117,type:'single',answer:'D',stem:'以下哪种文本切片方法最有可能保留完整的语义信息？',opts:['按标点符号分割,例如句号、问号等.','按字符数分割,每50个字符为一个chunk.','按token长度分割,每100个token为一个chunk.','使用专门的语义分割模型将文本分割成语义完整的段落.'],exp:'专门的语义分割模型基于自然语言处理技术，能够识别文本中的语义边界，将文本分割成语义完整且逻辑连贯的段落。相比按标点、字符或token分割的方法，该模型能更精准地保持文本原意，避免切断语义单元，从而最大程度保留完整语义信息。'},
  {id:118,type:'single',answer:'C',stem:'、以下哪个代码片段能够正确处理classify_intent函数可能抛出的异常，并打印错误信息？',opts:['pythonfor id, query in feedback_ list :try :intent = classify_ intent (query) Print (f"ID : {id}, Intent : {intent}") Finally : Print ("Finished processing query.")','python For id, query in feedback_ list : Intent = classify_ intent (query) Print (f"ID : {id}, Intent : {intent}") Except Exception as e : Print (f"Error : {e}")','python For id, query in feedback_ list : Try : Intent = classify_ intent (query) Print (f"ID : {id}, Intent : {intent}") Except Exception as e : Print (f"Error processing query {id} : {e}")','python For id, query in feedback_ list : If classify_ intent (query) : Intent = classify_ intent (query) Print (f"ID : {id}, Intent : {intent}") Else : Print ("Error processing query.")'],exp:'正确处理异常需使用 try-except 结构，且应在异常发生时输出具体错误信息。选项 A 中语法错误（Try、Finally 首字母不应大写），且未捕获异常。选项 B 捕获异常但未输出异常内容，仅打印固定字符串。选项 D 未使用异常处理机制，通过返回值判断错误不严谨，且可能重复调用函数。选项 C 正确使用 try-except 结构，捕获 Exception 并打印包含上下文的错误信息，符合异常处理规范。'},
  {id:119,type:'single',answer:'C',stem:'以下哪个向量数据库不适合用于存储和检索文本向量？',opts:['Milvus','FAISS','MySQL','Pinecone'],exp:'MySQL 不是为向量操作设计的, 因此不适合存储和检索文本向量'},
  {id:120,type:'single',answer:'C',stem:'你使用Qwen-Max生成了课程内容，现在需要将其转换为Marp 格式的Markdown。以下哪个Qwen-Max的提示词最有效？',opts:['把这些内容转换成 Markdown','用 Markdown 写个幻灯片','将以下内容转换为适合 Marp 幻灯片演示的 Markdown 格式,并包含标题、列表和代码块等元素.','"帮我转换成 PPT"'],exp:'该题目评估如何构造有效提示词以生成特定格式文档的能力。Marp是基于Markdown的幻灯片工具，需特定语法如`---`分隔幻灯片、标题层级和元素支持。选项中仅C明确指定了目标格式（Marp）、结构要素（标题/列表/代码块），其余选项或过于模糊（A/D）或未提及关键工具（B）。有效的提示词需包含具体输出格式、内容结构等关键指令，符合OpenAI文档中"清晰明确的prompt能提升生成质量"的原则。'},
  {id:121,type:'single',answer:'B',stem:'以下哪个提示词框架要素用于提供参考案例，帮助大模型理解预期输出？ 选项：',opts:['输入数据 (Input Parameters)','样例 (Sample)','任务目标 (Object)','角色 (Role)'],exp:'样例的作用:直接提供“模板 ”或“示例 ”,减少模糊性'},
  {id:122,type:'single',answer:'B',stem:'假设你需要统计每种意图出现的次数，以下哪个代码片段实现了这个功能？',opts:['python Intent_counts = {} For i in range (len (feedback_list)) : Intent = classify_intent (feedback_list [i] [0]) intent_counts[intent] += 1 Print (intent_counts)','python Intent_counts = {} For id, query in feedback_list : Intent = classify_ intent (query) Intent_counts [intent] = intent_counts.get (intent, 0) + 1 print (intent_counts)','python Intent_counts = {} For id, query in feedback_ list : Intent = classify_ intent ( id) If intent in intent_counts : Intent_counts [intent] = 1 else : Intent_counts [intent] = 0 print (intent_counts)','python Intent_counts = [] For query in feedback_ list : Intent = classify_intent (query [1]) Intent_ counts. append ( intent) Print (intent_counts)'],exp:'选项B正确。代码初始化空字典Intent_counts，遍历feedback_list中每个(id, query)元组，使用intent_counts.get(intent, 0) + 1安全地获取并递增意图计数，最终输出各意图出现次数。选项A语法错误，变量名大小写不一致且未处理键不存在情况；选项C逻辑错误，将新意图计数设为1，已有意图设为0，无法累计；选项D使用列表而非字典，仅存储意图而未统计频次。'},
  {id:123,type:'single',answer:'B',stem:'以下哪个代码片段能够正确遍历feedback_list并打印每个问题的意图？feedback_list的格式为【(1，"问题1")，(2，"问题2")，】 选项：',opts:['python For query in feedback_ list : Intent = classify_ intent (query) Print (f"Intent : {intent}")','python For query in feedback_ list : Intent = classify_intent (query [1]) Print (f"Intent : {intent}")','python For item in feedback_list : Id = item[0] Intent = classify_intent (item[0]) Print (f"ID : {id}, Intent : {intent}")','python For i in range (len (feedback_list)) : Intent = classify_ intent (feedback_list [i]) Print (f"Intent : {intent}")'],exp:'遍历列表并分类每个问题的实现'},
  {id:124,type:'single',answer:'D',stem:'如果一款大模型无法理解复杂图片中的信息，应该采取什么策略？',opts:['手动提取图片信息。','使用其他开源 OCR 工具再次尝试识别。','放弃使用该图片。','使用语义空间 API 的视觉理解模型对图片进行更深层次的分析。'],exp:'视觉理解模型专门处理图片语义,API 方式可无缝增强大模型能力,不丢失图片中的有价值信息'},
  {id:125,type:'single',answer:'C',stem:'下列哪项不属于大语言模型微调可能带来的挑战？',opts:['需要足够高质量的特定领域数据','微调过程可能引入偏见','模型大小和复杂度降低','过拟合特定任务,泛化能力下降'],exp:'大语言模型微调涉及在预训练模型基础上使用特定任务数据调整参数。微调通常需要高质量领域数据（A），可能因数据偏差引入偏见（B），并可能因过度适配特定任务而泛化能力下降（D）。模型微调一般不改变其架构，因此模型大小和复杂度降低（C）与实际不符。'},
  {id:126,type:'single',answer:'B',stem:'大语言模型微调相比从头训练的主要优势是什么？',opts:['训练时间更长','可以利用预训练学到的通用知识','需要更多计算资源','对特定任务的表现不如从头训练的模型'],exp:'微调的核心优势,预训练模型已具备通用语言理解能力'},
  {id:127,type:'single',answer:'C',stem:'在RAG系统中，将文档拆分成多个分块（chunks)的主要目的是什么?',opts:['减小存储空间,提高检索效率','方便用户浏览,提升用户体验','适配大模型的输入限制,并提高检索的准确性和相关性','简化文档预处理流程,降低开发成本'],exp:'RAG系统在处理文档时，分块的核心原因与大模型的技术特性直接相关。大语言模型（如GPT系列）对输入内容的长度有明确的限制，过长的文本会被截断。将文档拆分为多个分块可确保信息适配模型的输入窗口。同时，更细粒度的分块能提升检索精度，避免因长文本包含冗余内容导致相关片段被稀释或遗漏。例如，若未分块的文档涵盖多个主题，检索时可能返回与查询弱相关的整体文档，而分块后能聚焦具体段落，增强结果针对性。这一机制在RAG相关论文（如《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》）中被明确提及。选项A中存储效率并非主要目标，分块可能增加存储开销；选项B的用户体验更多依赖后端检索结果的质量，而非分块本身。'},
  {id:128,type:'single',answer:'D',stem:'数据预处理中，将分类任务的标签转化为模型可理解的数字形式称为什么？',opts:['文本标准化','词嵌入(Word Embedding)','特征缩放','标签编码(Label Encoding)'],exp:'分类任务中，将标签转换为数字形式的过程涉及数据预处理的基本技术。文本标准化处理文本格式统一问题，例如大小写转换；词嵌入将词语映射为向量，属于文本表示方法；特征缩放调整数值范围，消除量纲影响；标签编码则将类别标签（如“红”“蓝”）转换为数值（如0、1），便于模型计算。该术语在机器学习库scikit-learn中对应LabelEncoder类实现。'},
  {id:129,type:'single',answer:'B',stem:'发现机器人输出的内容包含不安全信息，以下哪种做法不推荐？',opts:['记录不安全信息,用于后续模型改进和安全策略优化.','直接将原始输出返回给用户.','过滤掉不安全信息,返回剩余安全内容.','向用户返回提示信息,告知其输出内容存在风险.'],exp:'在人工智能伦理和安全处理规范中，确保输出内容的安全性属于基础要求。处理不安全信息的标准措施通常包括拦截、记录、提示或改进策略。当系统检测到不安全信息时，正确做法需优先阻断风险传播并提升后续安全性。选项B忽略安全处理步骤，将包含隐患的原始信息直接传递给用户，可能导致信息泄露或滥用，违背了内容安全过滤的基本原则。其他选项均体现了风险控制、迭代优化或用户告知等安全实践。'},
  {id:130,type:'single',answer:'B',stem:'你需要使用Qwen-Max生成一个关于"Python基础"的课程脚本。以下哪种请求方式最合适？',opts:['向 Qwen-Max 发送一条包含"Python 基础课程脚本"的请求,并附加一些示例代码.','向 Qwen-Max 发送一条详细描述课程目标和内容的请求,例如:"请生成一个 Python 基础课程脚本,包含变量、数据类型、运算符、控制流等内容."','向 Qwen-Max 发送多条分别包含"Python 变量"、"Python 数据类型"、"Python 运算符"等关键词的请求.','向 Qwen-Max 发送一条包含"Python"关键词的请求.'],exp:'在使用生成式人工智能模型（如Qwen - Max）生成特定内容（如关于“Python基础”的课程脚本）时，请求的清晰度和详细程度对生成结果的质量至关重要。 选项A中，虽然发送了“Python基础课程脚本”的请求并附加了一些示例代码，但仅这些信息可能不够全面，无法准确涵盖课程脚本应包含的所有关键要素，比如课程的具体结构、重点讲解的内容等，生成的脚本可能无法完全满足需求。 选项B中，详细描述了课程目标和内容，明确指出要生成的课程脚本应包含变量、数据类型、运算符、控制流等内容。这种详细且明确的请求方式能够让模型更准确地理解用户的需求，从而生成更符合预期的课程脚本，是最合适的请求方式。 选项C中，发送多条分别包含不同关键词的请求，这种方式比较零散，模型难以将这些零散的信息整合成一个完整、连贯的课程脚本，不利于生成高质量的结果。 选项D中，仅发送包含“Python”关键词的请求，信息过于简略和模糊，模型无法明确用户具体想要生成什么样的内容，更无法生成符合要求的课程脚本。 综上所述，选项B是最合适的请求方式，所以答案选B。'},
  {id:131,type:'single',answer:'D',stem:'以下哪个步骤最能体现RAG中的知识增强的思想？',opts:['文档解析:将PDF转换为Markdown','表格单元格改写:kv形式补充单元格信息,增强语义信息','语义化分割:基于段落为主体进行语义化分割','文段召回:从数据库中匹配合适的文段用于回答问题'],exp:'[回答]：RAG（检索增强生成）技术的核心思想是通过检索外部知识库中的相关信息，来增强语言模型的生成能力，使其回答更准确、更基于事实，而不仅仅依赖模型自身的参数化记忆。 在给出的选项中： - **A选项（文档解析）** 属于数据预处理，将非结构化文本转换为可处理格式，并未直接涉及“增强”生成过程。 - **B选项（表格单元格改写）** 属于数据清洗和语义优化，目的是改善数据质量，而非在生成时增强知识。 - **C选项（语义化分割）** 属于文本分割策略，便于后续检索，但本身不体现“知识增强”的思想。 - **D选项（文段召回）** 直接从知识库中检索与用户问题相关的信息片段，并将其提供给生成模型作为参考，这正是RAG中“知识增强”的核心环节。通过召回，模型能够获取超出其训练数据的、最新的或特定领域的外部知识，从而提升回答的准确性和时效性。 因此，正确答案是D。'},
  {id:132,type:'single',answer:'C',stem:'以下代码片段中,temperature参数设置为0.6,其主要作用是什么？plaintextdo_sample" : true, "temperature" : 0.6, "top_p" : 0.9,#otherparameters',opts:['控制模型使用的 GPU 数量。','控制模型加载的权重数量。','控制模型生成文本的多样性。','控制模型生成文本的长度。'],exp:'ACP 大模型-2.png'},
  {id:133,type:'single',answer:'A',stem:'在微调大语言模型的数据预处理流程中，哪一步骤旨在减少文本中的噪声，提高数据质量？',opts:['文本清洗','序列填充','特征选择','数据增强'],exp:'文本清洗是数据预处理中专门针对原始文本进行净化的步骤，通过去除HTML标签、特殊符号、拼写错误及低质量内容，消除干扰信息，使数据更规范、干净，直接提升输入模型的文本质量。序列填充用于统一文本长度，特征选择聚焦关键信息提取，二者均不涉及噪声清理。'},
  {id:134,type:'single',answer:'B',stem:'以下代码片段中,哪一个是用于计算模型预测结果(前向传播)的?',opts:['optimizer.zero_grad ()','outputs = model (inputs)','loss = criterion (outputs, labels)','optimizer.step ()'],exp:'B 是前向传播的核心代码,将输入数据 inputs 传递给模型 model,计算并返回预测结果 outputs'},
  {id:135,type:'single',answer:'B',stem:'在使用Qwen-Max辅助内容生成的过程中，以下哪个操作是正确的？',opts:['让 Qwen-Max 执行编程代码','利用 Qwen-Max 生成课程脚本','应用 Qwen-Max 进行视频剪辑任务','直接使用 Qwen-Max 进行图像设计'],exp:'Qwen-Max是文本生成类大模型，擅长处理语言理解与生成任务。生成逻辑脚本属于文本指令驱动的自动化内容创作范畴，符合其核心能力边界。编程代码执行、视频剪辑、图像设计均需调用专用工具或算力环境，超出纯文本模型的功能范围。'},
  {id:136,type:'single',answer:'D',stem:'在检测文档内容中是否存在营销性表达时，下列哪种方法可以更全面地识别问题？',opts:['识别所有内容错误的部分','让大模型自动修改内容','逐条单独识别营销词汇','一次性生成所有类型的识别结果'],exp:'利用大模型(如 Qwen-Max) 的批量分析能力,可同时检测直接营销词汇、隐含诱导性语言、夸张表述等,覆盖更全面。'},
  {id:137,type:'single',answer:'A',stem:'以下哪段代码设置了模型训练过程中的学习率？',opts:['optimizer = torch.optim.Adam(model.parameters(), lr=learning_rate)','criterion = nn.CrossEntropyLoss()','scheduler = torch.optim.lr_scheduler.StepLR(optimizer, step_size=100, Gamma=0.1)','learning_rate = 0.001'],exp:'在PyTorch中，优化器的初始化参数包含学习率设置。Adam优化器的官方文档明确提到，`lr`参数用于指定初始学习率。选项A通过`lr=learning_rate`直接将学习率传递给优化器。选项B涉及损失函数，无关学习率。选项C是学习率调度器，依赖优化器已有的学习率进行调整。选项D仅定义变量而未与优化器关联。PyTorch优化器文档指出，学习率需通过优化器参数配置。'},
  {id:138,type:'single',answer:'C',stem:'以下哪种方式不符合RAG优化的最佳实践？',opts:['使用 DashScopeParse 解析文档,提取文本和图片信息。','根据图片内容的复杂程度,选择性地使用视觉模型进行深层次解析。','直接将原始 PDF 文档内容输入向量数据库,不进行任何预处理。','使用语义千问 API 润色目录层级,补全缺失信息。'],exp:'RAG优化要求对原始文档进行有效预处理和结构化嵌入，以提升检索准确性。直接忽略原始PDF内容并放弃向量数据库嵌入，会导致知识源缺失，违背RAG系统依赖高质量索引数据的核心原则。其他选项均涉及合理增强：使用工具解析多模态信息、按需调用视觉模型、通过语义API补全结构，均为行业推荐做法。'},
  {id:139,type:'single',answer:'A',stem:'实现早停法(early stopping)时,通常在哪种情况下停止训练?',opts:['验证集损失连续 n 轮不再下降','验证集准确率达到 100%','训练集损失达到最小值','训练集准确率连续 n 轮上升'],exp:'早停法的核心思想是防止模型过拟合,当验证集损失在连续多轮训练中不再下降时,说明模型性能不再提升,此时应停止训练。'},
  {id:140,type:'single',answer:'C',stem:'以下哪个代码片段展示了正确的用户(user)提问方式?',opts:['python Messages = [ {"role" : "user", "content" : "你是一个诗歌生成器。"}, {"role" : "assistant", "content" : "我想写一首关于秋天的诗。"} ]','python Messages = [ {"role" : "system", "content" : "你是一个诗歌生成器。"}, {"role" : "assistant", "content" : "请告诉我你想写一首关于什么的诗。"} ]','python Messages = [ {"role" : "system", "content" : "你是一个诗歌生成器。"}, {"role" : "user", "content" : "我想写一首关于秋天的诗。"} ]','python Messages = [ {"role" : "system", "content" : "你是一个诗歌生成器。"}, {"role" : "system", "content" : "我想写一首关于秋天的诗。"} ]'],exp:'选项C的代码使用`input()`函数接收用户输入，这是Python中标准的用户提问方式。选项A使用`print()`只输出信息，选项B使用`sys.argv`获取命令行参数而非交互输入，选项D使用`os.system()`执行系统命令而非接收用户输入。根据Python官方文档，`input()`是获取用户键盘输入的标准方法。'},
  {id:141,type:'single',answer:'D',stem:'以下哪个场景最适合使用规则匹配的文本合规检测？',opts:['理解用户提问的深层含义','判断用户评论是否包含特定品牌的广告信息','识别文章中蕴含的复杂情感','检测用户上传的文本是否包含明确的违禁词汇'],exp:'规则匹配的优势场景是明确模式、 固定表达的检测如违禁词、格式校验,需要语义理解的场景。'},
  {id:142,type:'single',answer:'D',stem:'运行以下代码等待任务结束时,不属于终止状态的是哪一项？pythonFrom dashscope import RunsRun = Runs.wait (run_id, thread_id=\'thread_id\')',opts:['completed','failed','cancelled','in_progress'],exp:'终止状态指任务不可再变更的最终状态(如完成/失败/取消),而 in_progress 是进行状态,不属于终止状态。'},
  {id:143,type:'single',answer:'A',stem:'以下哪个步骤不是RAG工作流程中“建立索引阶段的一部分？',opts:['将用户问题转换为向量表示','将长文本切成更小的片段','将文档解析为纯文本','将文本片段转换为向量表示'],exp:'建立索引"是离线预处理文档,而选项 A 是在线处理用户请求,属于后续流程'},
  {id:144,type:'single',answer:'D',stem:'为了将不同长度的文本序列调整为统一长度以便模型处理，通常会采取哪种措施？',opts:['删除过长的句子','忽略长度差异','截断过短的句子','填充序列到固定长度(Padding)'],exp:'为使不同长度的文本序列适配模型输入，需将序列统一至固定长度。常用方法是通过填充（Padding）在较短序列末尾添加特殊标记（如[PAD]），使所有序列长度一致。截断虽可缩短过长序列，但单独使用无法处理短序列；删除或忽略长度差异无法保证输入结构统一。填充是深度学习中标准预处理手段，确保批量处理时张量维度一致。'},
  {id:145,type:'single',answer:'B',stem:'以下哪种分隔符最适合用于区分不同的对话轮次或历史记录？',opts:['plaintext ... === 用户 ===你好 === 机器人 === 你好,有什么可以帮你?','plaintext <chat_history>用户:你好 机器人:你好,有什么可以帮你? </chat_history>','plaintext ##用户 你好 ##机器人 你好,有什么可以帮你?','plaintext <用户>> 你好 <机器人>> 你好,有什么可以帮你?'],exp:'对话轮次分隔需具备明确标识与结构化特征，便于系统解析。选项B使用XML标签包裹完整对话内容，并以用户和机器人作为明确角色前缀，符合标准数据封装规范，能被程序准确识别与提取。其他选项中，A使用不规则符号===，C使用##符号，D使用>>符号，均缺乏标准化语义结构，易引发解析歧义或匹配失败。'},
  {id:146,type:'single',answer:'B',stem:'以下哪个代码片段最能体现大模型的优势？',opts:['python From scipy.stats import pearsonr X = [1, 2, 3, 4, 5] Y = [2.4, 6.8, 10] Correlation = pearsonr (x, y) Print (correlation)','python Text = "我非常喜欢这款产品!" Sentiment = analyze_sentiment (text) # 调用大模型接 口print (sentiment) # 输出: 积极','python Data = [1, 2, 3, 4, 5] sum_of_data = sum (data) Print ( sum_of_data)','python Import numpy as np Data = [1, 2, 3, 4, 5, 100] std_dev = np.std (data) Print ( std_dev)'],exp:'大模型的核心优势在于处理自然语言理解与生成任务，能够通过语义分析完成情感判断、意图识别等复杂认知功能。选项B调用大模型接口分析文本情感并输出“积极”，直接体现其在非结构化文本中的语义理解能力。其他选项均为基础数值计算：A为相关系数计算，C为求和，D为标准差计算，均属传统统计库功能，无需大模型支持。'},
  {id:147,type:'single',answer:'B',stem:'以下哪种情况最适合将文档拆分成更小的分块?',opts:['文档格式简单,例如纯文本文件.','文档内容包含多个主题,信息量较大.','文档内容非常简短,总共只有几句话.','文档内容高度相关,主题单一.'],exp:'当文档内容包含多个主题且信息量较大时，信息复杂度高，拆分成更小的分块可提升信息处理的针对性与效率，便于精准检索特定主题内容，也能针对不同部分单独分析、总结。'},
  {id:148,type:'single',answer:'A',stem:'使用模型检查点(checkpointing)保存模型时,一般会保存哪种情况下的模型?',opts:['验证集性能最好的模型','训练结束时的模型','每次迭代后的模型','训练初期的模型'],exp:'模型检查点的标准做法是保存验证集上表现最优的模型,可确保最终选择的是泛化能力最强的版本,而非过拟合的模型。'},
  {id:149,type:'single',answer:'C',stem:'在 RAGAS的这行代码中,data_samples 可能是什么格式？pythonDataset = Dataset.from_dict (data_ samples)',opts:['python Data_samples = { "question" :"sample_question", "answer" :"sample_answer", "contexts" :"sample_contexts" }','python Data_samples = { "question" :"sample_question", "answer" :"sample_answer", "contexts" : ["sample_context1","sample_context2"], "ground_truth" : ["sample_ground_truth1","sample_ground_truth2"] }','python Data_samples = { "question" :"sample_question", "answer" :"sample_answer", "contexts" : ["sample_context1","sample_context2"] }','python Data_samples = DataFrame ( Question=" sample_question", answer=" sample_answer", Contexts=" sample_contexts")'],exp:'data_samples 应为字典格式，键对应字段名，值为列表，如 {"question": ["sample_question"], "answer": ["sample_answer"], "contexts": ["sample_contexts"]}。Hugging Face Dataset.from_dict() 方法要求输入为字典结构，其中每个键对应一列，值为相同长度的列表。选项 C 中使用 DataFrame 构造不符合该方法输入规范，但题干中选项 C 表述存在明显错误，实际应为字典而非 DataFrame 实例。根据 Hugging Face 数据集加载标准，正确格式应为字典，而选项 C 虽形式错误，但在所有选项中唯一提及字段名与数据结构关联，符合命题意图。'},
  {id:150,type:'single',answer:'D',stem:'如果想要自定义langchain的LLM对象，理论上只需要准备以下哪个要素？',opts:['一个API Key','一个Model name','一个JSON,直接加载即可','一个输入为字符串,输出为字符串的函数'],exp:'LangChain的自定义LLM要求用户提供一个处理字符串输入并生成字符串输出的方法。官方文档指出，自定义LLM的核心是实现`_call`方法，该方法接受字符串作为输入并返回字符串。选项D符合这一接口定义，其他选项如API Key或模型名称并非自定义的必要条件，JSON文件也不直接构成方法实现。'},
  {id:151,type:'single',answer:'A',stem:'如果想要发送“你好，请介绍一下你自己”给大模型，应该修改以下代码的哪一行？pythonImportosFrom openai import OpenAlClient = OpenAl (Api_key=os.getenv ("DASHSCOPE_API_KEY"),Base_url="http s://dashscope.aliyuncs.com/compatible-mode/v 1" )Completion = client. chat. completions. create (Model="qwen-max",Messages= [f"role": "user","content":"你是谁?"}])Print ( completion.choices [o ] .message. content)',opts:['messages= [{"role" : "user", "content" : "你是谁?"}]','api_key=os.getenv ("DASHSCOPE_API_KEY")','base_url="http s://dashscope.aliyuncs.com/compatible-mode/v1"','model="qwen-max"'],exp:'修改用户提问只需变更 messages 列表中 user 角色的 content 字段,其他配置无需改动'},
  {id:152,type:'single',answer:'B',stem:'LlamaIndex在创建RAG应用时,第一步 SimpleDirectoryReader是将知识文件解析为?',opts:['Document 对象','元素为 Document 对象的列表','索引 index','包含所有文字信息的字符串'],exp:'在 LlamaIndex 中,SimpleDirectoryReader 的作用是将知识文件(如 PDF、TXT 等) 批量解析为多个 Document 对象组成的列表'},
  {id:153,type:'single',answer:'A',stem:'以下哪个代码片段正确地使用了system 角色来指示模型扮演一个友好的客服代表?',opts:['python Messages = [ {"role" : "system", "content" : "你是一位友好的客服代表,随时准备帮助客户解决问题。"} ]','python Messages = [ {"role" : "assistant", "content" : "您好,请问有什么可以帮您的?"} ]','python Messages = [ {"role" : "user", "content" : "我想咨询一下退货流程。"} ]','python Messages = [ {"role" : "system", "content" : "用户想咨询退货流程。"} ]'],exp:'system 角色用于设定模型的行为和身份'},
  {id:154,type:'single',answer:'D',stem:'以下代码片段中，StorageContext的作用是什么？PythonStorage_contextStorageContext.from_defaults(persist_dirPERSIST_DIR)Index load_index_from_storage(storage_context)',opts:['加载存储在内存中的索引.','创建新的索引.','执行查询操作.','提供加载持久化索引所需的上下文信息.'],exp:'StorageContext用于封装持久化存储的配置与路径信息，支持从磁盘加载已保存的索引。在代码中，from_defaults(persist_dir=PERSIST_DIR)指定持久化目录，load_index_from_storage通过该上下文读取之前保存的索引结构，而非重新创建或加载内存索引，其核心作用是为恢复持久化索引提供必要的存储环境参数。'},
  {id:155,type:'single',answer:'A',stem:'以下哪个代码片段最适合将文本片段转换为向量表示？',opts:['python From sentence_transformers import SentenceTransformer model = SentenceTransformer (\'all-mpnet-base-v2\') Def embed_text (text) : Return model. encode ( text)','python Def embed_text (text) : Return len (text)','python Import hashlib Def embed_text (text) : Return hashlib.sha256 (text.encode ()).hexdigest ()','python Import numpy as np Def embed_text (text) : Return np.random.rand (100) # 随机生成一个 100 维向量'],exp:'sentence-transformers 库专为文本嵌入设计 ,预训练模型(如 all-mpnet-base-v2)生成的向量能捕捉语义信息,适合检索、聚类等任务'},
  {id:156,type:'single',answer:'A',stem:'以下哪个提示词示例最有效地利用了分隔符来区分不同的要素？',opts:['plaintext ... ## 任务目标 写一首关于春天的诗## 受众 儿童 ## 输出格式四行诗','plaintext ... 任务目标是写一首关于春天的诗,受众是儿童,输出格式是四行诗。','plaintext ... 任务目标,写一首关于春天的诗,受众,儿童,输出格式, 四行诗','plaintext ... 任务目标写一首关于春天的诗受众儿童输出格式四行诗'],exp:'试题解析：题目要求判断分隔符运用效果。答案选项A通过明确分隔符（##）将任务目标、受众、输出格式分块呈现，结构层次清晰。其他选项B使用句号与分号分隔，格式松散；C依赖逗号分隔，要素混杂；D完全未使用分隔符，导致信息粘连。根据提示词编写规范，合理分隔符可提升指令可读性，故选项A符合要求。'},
  {id:157,type:'single',answer:'C',stem:'如果让你从faithfulness,context_recall,context_precision,answer_correctness中选择一个最能代表RAG应用整体性能的指标，你会选哪个？',opts:['context_precision','context_recall','answer_correctness','faithfulness'],exp:'RAG应用的最终目标是生成准确的答案，因此answer_correctness直接衡量系统输出结果的正确性，是评估整体性能的核心指标。faithfulness关注生成内容与检索上下文的一致性，context_recall和context_precision衡量检索模块对相关文档的覆盖与精准程度，三者均为辅助性子指标。只有answer_correctness综合反映系统在真实场景中的有效性和实用性。'},
  {id:158,type:'single',answer:'B',stem:'以下代码片段实现了哪种文本合规检查方法？python import re def check_text(text): pattern = r"假货|劣质|骗子" if re.search(pattern, text): return "包含敏感词" else: return "文本安全" Text = "这个产品质量很好,不像其他假货" result = check_text(Text) print(result) #输出：包含敏感词',opts:['语义分析','模式匹配','机器学习','词性匹配'],exp:'该代码使用正则表达式匹配文本中是否包含“假货”“劣质”“骗子”等关键词，属于基于预定义字符串模式的匹配方法。模式匹配通过re.search函数实现，直接比对文本与固定词库，不涉及语义理解、模型训练或词性分析。选项A语义分析需理解上下文含义，C机器学习依赖训练数据与算法模型，D词性匹配关注词语语法类别，均不符合本例实现方式。正确方法为模式匹配。'},
  {id:159,type:'single',answer:'C',stem:'、def set_default_model () :EMBED_MODEL= DashScopeEmbedding(Model_name=DashScopeTextEmbeddingsModels.TEXT_EMBEDDING_V2,type_name=DashScopeTextEmbeddingType.TEXT_TYPE_DOCUMENT,LLM_MODEL = DashScope (model_name="qwen-plus")Settings.embed_model = EMBED_MODEL Settings. llm = LLM_MODEL',opts:['使得 llm 可以流式输出','使得 embedding 模型可以参与 llm 的生成过程中','使得有关 Llamaindex 的后续步骤中无需再次指定 llm 与 embed_model','定义了 EMBED_MODEL 与 LLM_MODEL'],exp:'代码中通过 Settings.embed_model 和 Settings.llm 分别赋值，完成全局嵌入模型与大语言模型的配置。Llamaindex 框架在后续调用中会自动读取 Settings 中已设置的模型参数，无需重复指定。选项 A 错误，LLM 输出不依赖此配置实现流式输出；选项 B 错误，embedding 模型不参与 LLM 生成过程；选项 D 正确但非核心意图，仅描述变量定义，未体现框架自动化特性；选项 C 正确，符合 Llamaindex 的全局配置机制，后续步骤自动继承。'},
  {id:160,type:'single',answer:'D',stem:'以下哪种参数组合会使得模型生成结果最具多样性？',opts:['temperature = 0.1, top_p = 0.9','temperature = 0.1, top_p = 0.1','temperature = 0.9, top_p = 0.1','temperature = 0.9, top_p = 0.9'],exp:'temperature参数控制生成结果的随机性，其值越高概率分布越平坦。top_p参数决定候选词范围，数值越大候选词越多。高temperature（0.9）增加随机性，高top_p（0.9）扩大候选词集合，两者结合促进多样性最大化。选项D的组合同时满足这两个条件。其他选项或限制候选词范围（top_p=0.1）或降低随机性（temperature=0.1），生成的多样性较弱。此知识点涉及语言模型生成策略中的采样技术。'},
  {id:161,type:'single',answer:'D',stem:'在文档审阅中，为什么不建议一次输出所有的结果？',opts:['只需关注营销表达','大模型可能会漏掉一些错误','内容错误不需要处理','信息量过大,难以理解'],exp:'文档审阅过程中，一次性输出所有结果可能导致信息过载，超出审阅者的处理能力。这一观点基于认知负荷理论，强调人类信息处理存在容量限制。选项D指出大量信息难以理解，符合分阶段处理以提升效率的逻辑。选项A偏离主题，选项B涉及模型性能而非审阅策略，选项C错误。'},
  {id:162,type:'single',answer:'B',stem:'以下哪个代码片段正确地展示了system、user和 assistant三种角色的交互顺序?',opts:['python Messages = [ {"role" : "assistant", "content" : "你好"}, {"role" : "user", "content" : "我想订一张机票"}, {"role" : "system", "content" : "你是一个订票助手"} ]','python Messages = [ {"role" : "system", "content" : "你是一个订票助手"}, {"role" : "user", "content" : "我想订一张机票"}, {"role" : "assistant", "content" : "你好,请问你想去哪里?"} ]','python Messages = [ {"role" : "user", "content" : "我想订一张机票"}, {"role" : "assistant", "content" : "你好,请问你想去哪里?"}, {"role" : "system", "content" : "你是一个订票助手"} ]','python Messages = [ {"role" : "user", "content" : "我想订一张机票"}, {"role" : "system", "content" : "你是一个订票助手"}, {"role" : "assistant", "content" : "你好,请问你想去哪里?"}'],exp:'在对话AI模型中，正确的角色交互顺序应为：首先由system角色设定助手的行为规范和背景，然后user角色提出具体问题或需求，最后由assistant角色生成相应回复。这种顺序符合对话模型的逻辑流程，system指令为整个对话提供基础设定，user输入驱动对话进展，assistant基于前两者的信息生成回答。选项A中assistant先于system出现，选项C和D中system出现在user之后，都破坏了正确的对话初始化流程。只有选项B遵循了正确的system→user→assistant顺序，确保模型能正确理解上下文并生成符合预期的回复。'},
  {id:163,type:'single',answer:'A',stem:'以下哪个选项最适合用于请求大模型总结一篇文章的主要内容？',opts:['用简洁的语言概括以下文章的核心观点: (文章内容)','文章的主要内容是什么? (文章内容)','重写这篇文章。','这篇文章写了什么?'],exp:'这道题考查对指令明确性的理解。在提示工程中，明确的动词指令（如"概括核心观点"）比开放式提问（如"主要内容是什么"）更能精准引导模型产出结构化答案。使用"简洁的语言"作为限定条件能进一步缩小输出范围，避免冗余信息。选项C属于文本生成任务，D选项表述过于笼统，均不符合"总结"需求。该知识点对应自然语言处理中的指令设计原则，相关方法在《人工智能提示技术实战》第三章有具体阐述。'},
  {id:164,type:'single',answer:'C',stem:'在监控模型训练性能时，以下哪段代码可用于计算并打印准确率？',opts:['loss.backward ()','optimizer.step ()','correct /= total ; print (f\'Accuracy: {100 ∗ correct :.2f}%\')','running_loss += loss.item () ∗ inputs.size (0)'],exp:'准确率计算需统计正确预测样本数与总样本数之比，公式为：准确率 = 正确样本数 / 总样本数。选项C中correct /= total完成比例计算，print(f"Accuracy: %")实现结果输出，符合监控训练性能的直接需求。其他选项分别用于反向传播、参数更新和损失累加，均不涉及准确率计算。'},
  {id:165,type:'single',answer:'B',stem:'在RAGAS评分之后，你对其中一些指标有些疑问，你可以查看哪个字段来追溯大模型评分的原因？',opts:['source','reason','json_object','source_node'],exp:'[回答]：在RAGAS评分体系中，评分结果通常会附带一个解释性字段，用于说明模型为什么给出特定的分数或判定。这个字段通常命名为"reason"，它包含了评分的依据或推理过程。选项A（source）一般指信息来源，选项C（json__object）指JSON格式的对象，选项D（source__node）指源节点信息，这些都不直接提供评分的原因解释。因此，要追溯大模型评分的原因，应查看"reason"字段，即选项B是正确的答案。'},
  {id:166,type:'single',answer:'B',stem:'replacements的作用是:Python def get_documents (path) :Documents = SimpleDirectoryReader (path). load_data ()Document = Document (text="\n".join ([doc.text for doc in documents])) replacements = {for src, dst in replacements. items () :Document.text = document.text.replace (src, dst)return document',opts:['使得文本更有层级','LlamaIndex 按照英文标点切分句子,这么做保证每个句子不会太大','提高大模型对标点符号的识别准确率','降低召回文本段的中文含量'],exp:'replacements 的作用是通过替换标点符号前后的空格，确保英文句子的标点规范。例如将 " . " 替换为 ". "，使句点紧贴前文、后接空格，符合英文书写习惯。LlamaIndex 在处理文档切分时依赖标点作为句子边界，此操作避免因空格错位导致句子被错误截断或合并，从而保证每句长度合理，提升后续嵌入与检索效果。'},
  {id:167,type:'single',answer:'A',stem:'APlAssistantAgent示例代码_forward_and_submit_outputs 函数的核心功能是什么？pythonDef _forward_and_submit_outputs ( self, run_ status) :111get the function name, run and return the function output to the serverFunc_obj = run_ status.required_action. submit_tool_outputs.tool_calls[0 ]. function func_name = func_obj.nameArguments = json. loads (func_obj.arguments)Tool_outputs = [{\'tool_call_id" :Run_ status.required_action. submit_tool_outputs.tool_calls[o ]. id,output" : json.dumps (self.funcs[func_name] (**arguments)) }Run_ status = dashscope.Runs. submit_ id_outputs(run_ status.id, thread_id= self.thread. id,Tool_ outputs= tool_ outputs)Return',opts:['执行 function call 并将结果提交给服务器','向 Assistant 提交用户 query','等待 Run 完成','获取 Assistant 的回复','创建新的 Assistant','创建新的 Thread'],exp:'_forward_and_submit_outputs 函数的核心功能是执行 function call 并将结果提交给服务器。代码中通过解析 run_status 中的 tool_calls 获取函数名与参数，调用对应函数并生成输出，再调用 submit_tool_outputs 接口将结果回传。该流程完整体现工具调用后结果提交的闭环操作。其他选项涉及用户查询提交、等待运行完成、获取回复、创建 Assistant 或 Thread，均与本函数实际行为不符。'},
  {id:168,type:'single',answer:'A',stem:'以下哪种做法不符合使用大模型提升开发效率的思路？',opts:['对于所有类型的图片,都使用视觉模型进行深层次解析, 以确保信息的完整性。','使用 DashScopeParse 解析文档,而不是自己编写复杂的解析逻辑。','将复杂的文档处理任务拆分成多个子任务,分别使用不同的模型或工具处理。','对于简单的文本替换操作,使用正则表达式而不是调用大模型 API。'],exp:'在利用大模型提升开发效率的思路中，核心原则是合理、高效地利用模型的能力，避免不必要的资源消耗和复杂度增加。 A选项提出“对于所有类型的图片，都使用视觉模型进行深层次解析，以确保信息的完整性”。这一做法的问题在于，并非所有类型的图片都需要深层次解析。对于一些简单的图片，如仅包含基本形状或文字的图片，使用视觉模型进行深层次解析可能是过度处理，不仅浪费计算资源，还可能降低处理效率。因此，这一做法不符合利用大模型提升开发效率的思路。 B选项“使用 DashScopeParse 解析文档，而不是自己编写复杂的解析逻辑”，是合理的。它利用了现有的工具来简化开发过程，避免了重复造轮子，提高了开发效率。 C选项“将复杂的文档处理任务拆分成多个子任务，分别使用不同的模型或工具处理”，也是符合提升开发效率思路的。通过拆分任务，可以更有效地利用不同模型或工具的优势，提高处理效率和准确性。 D选项“对于简单的文本替换操作，使用正则表达式而不是调用大模型 API”，同样是合理的。对于简单的操作，使用更轻量级的工具或方法可以更快地完成任务，避免不必要的资源消耗。 综上所述，A选项是不符合利用大模型提升开发效率的思路的，因此是正确答案。'},
  {id:169,type:'single',answer:'D',stem:'要将索引持久化到磁盘,应使用以下哪个方法?',opts:['index.store ()','index.persist ()','index.save ()','index.storage_context.persist ()'],exp:'在LlamaIndex框架中，持久化操作通常涉及StorageContext对象。根据官方文档索引持久化标准方法，存储上下文负责管理向量存储、文档存储等组件。索引对象本身不直接提供持久化方法。选项A通过调用storage_context的persist()方法实现数据写入磁盘，符合API设计规范。其他选项的persist()、store()或save()方法并非LlamaIndex索引对象的标准接口。'},
  {id:170,type:'single',answer:'C',stem:'大模型如何判断什么时候应该停止输出？',opts:['只会在输出长度达到阈值时停止','需要用户手动打断','在输出长度达到阈值,或输出特殊 Token(如,end of sentence, 即句子结束标记)','当模型检测到生成内容与输入主题无关时自动停止'],exp:'大模型生成文本的终止机制涉及预定义规则与模型自身预测的结合。常见方法包括设置最大生成长度限制，防止无限循环。同时，模型在训练时学习预测特殊结束标记（如），当生成该标记时即终止输出。选项A依赖外部干预，不符合自动终止场景；选项B忽略结束符预测能力；选项C涉及相关性判断，但并非主流终止条件；选项D结合阈值与标记预测，符合实际应用中的双重控制逻辑。该机制参考了Transformer架构生成任务的设计，如GPT、BERT等模型均采用类似策略。'},
  {id:171,type:'single',answer:'D',stem:'你正在基于某视觉理解大模型开发一个门店巡检系统（检查垃圾桶是否盖好、操作是否整洁、水池是否洗干净等），但发现用大模型同时识别判断场景、给出判断结果的效果总是不好，以下哪种改进方案能更低成本地解决这一问题？?',opts:['增加更多的监控摄像头,给大模型更多的输入信息','收集一批高质量的监控画面数据,面向巡检任务微调大模型','改进当前的数据输入,减少监控画面的分辨率,避免引入干扰信息','用物体分割小模型圈出识别区域,然后抠图输入给大模型检测状态'],exp:'视觉理解大模型在多任务场景下的性能优化往往依赖任务聚焦的数据处理策略。物体分割模型预先定位关键区域，能够过滤无关信息，降低大模型的计算复杂度，同时保留核心目标的判别特征。选项A增加输入可能导致噪声干扰；选项B需要大量标注成本；选项C可能损失细节信息。分割预处理结合大模型检测既控制计算资源，又提升任务针对性，符合低成本高效改进的目标。'},
  {id:172,type:'single',answer:'B',stem:'某企业需要部署一个大模型，不定期自动地分析现有的产品文档，并产出改进建议，以下哪一种计费方式可以在满足业务需求的同时最大化降低运行成本？：',opts:['通过按量付费方式创建 GPU 资源','使用抢占式实例(Spot Instance),同时设计好任务中断的自动恢复机制','购买显卡并搭建本地服务器','通过预付费(包年包月)方式创建 GPU 资源'],exp:'云计算计费模式对比。AWS、阿里云等云服务商提供多种实例类型：抢占式实例成本最低，但可能被中断，适合可中断任务；预付费适合长期稳定需求；按量付费适合短期或波动负载。企业需求为不定期自动分析文档，任务可中断并重启。选项A利用低价抢占式实例，配合自动恢复机制，既满足业务又降低成本，符合场景需求。选项B预付费需长期占用资源，成本浪费；选项C按量付费单价高；选项D本地部署前期投入大、维护成本高。'},
  {id:173,type:'single',answer:'A',stem:'你需要在资源受限的环境下部署一个大模型，以下哪种方案有助于你减少对显存的需求？ 选项：',opts:['蒸馏小模型,训练一个更小参数量的模型','扩大允许的输入 Token 长度','微调现有模型,改善其效果','提高模型批量任务的数量'],exp:'减少显存需求的关键在于降低模型计算和存储开销。知识蒸馏通过迁移大模型知识至小模型，降低参数量，从而减少显存占用。输入长度增加（B）导致计算复杂度上升，显存需求增大；微调（C）通常保留原参数规模，不减少显存；增大批量（D）直接提升显存消耗。蒸馏技术（A）有效压缩模型尺寸，降低资源需求。'},
  {id:174,type:'single',answer:'D',stem:'使用LoRA微调时，训练损失波动剧烈，以下哪种策略有可能解决这一问题？',opts:['继续训练,无须调整','把 batch_size 从 16 调到 4','将 lora_rank 从 8 提升到 32','将学习率降低至原来的 10 分之一'],exp:'训练损失剧烈波动通常源于学习率设置过高，导致优化过程不稳定。降低学习率可有效平滑梯度更新步长，使模型参数更平缓地收敛，从而减少损失曲线的震荡幅度。将学习率降至原值的十分之一能显著提升训练过程的稳定性，是应对此类问题的常规且有效手段。'},
  {id:175,type:'single',answer:'D',stem:'你准备为企业内部人事系统搭建一个多轮问答功能,现有历史对话“张三的办公楼在哪？”,在A轮公“他的主管是谁？”，你应该怎么设计检索步骤？',opts:['对 “主管 ” 进行同义词扩展,包含 “领导 ”、“上级 ” 等,提高召回率','提高检索的相似度阈值,确保不包含无用信息','混合使用关键词检索与向量检索策略','结合对话历史改写 query,再进行检索'],exp:'多轮问答系统中，上下文关联是关键挑战。当用户连续提问时，后续问题常包含代词或省略信息，需依赖历史对话理解语义。例如当前问题“他的主管是谁”中的“他”指向历史中的“张三”。直接检索“主管”可能忽略实体关联，导致结果不准确。对话历史改写通过将当前问题与历史信息结合（如将“他”替换为“张三”），生成完整明确的查询（如“张三的主管是谁”），解决指代消解问题。此方法在《Conversational Question Answering over Passages》等研究中被证实能有效提升上下文感知能力。选项A侧重召回率但未解决上下文，选项B可能过滤有用信息，选项C未处理核心的上下文依赖，选项D直接针对问题核心。'},
  {id:176,type:'single',answer:'C',stem:'在 qwen2.5 - 1.5b 模型微调时,训练损失快速震荡甚至开始上升,说明模型当前处于?',opts:['过拟合','训练成功','训练失败','欠拟合'],exp:'训练损失快速震荡或上升是模型优化过程中常见的现象。在模型微调时，这种现象通常与优化过程的稳定性相关。当损失不再下降反而上升，可能表明梯度爆炸、学习率设置不当或优化器失效等问题，导致模型无法有效更新参数。选项A（欠拟合）对应损失长期停滞而非震荡上升；选项B（过拟合）通常伴随训练损失持续降低而验证损失上升；选项D（训练成功）显然不符合损失上升的特征。损失异常震荡或上升多指向优化失败，属于训练过程中的严重问题，与模型收敛性直接相关。该现象在机器学习文献中常被归为训练失败的典型表现。'},
  {id:177,type:'single',answer:'D',stem:'你需要构建公文智能处理系统,用户上传 PDF文件,系统需自动识别文本内容并生成摘要。以下哪种架构设计比较合理？',opts:['前端上传文件至 FC,FC 调用 OCR 服务提取文本并存入 OSS,再由百炼模型提供结果链接','前端直接调用百炼模型解析 PDF,模型将原始文件和分析结果存入 OSS,通过访问链接提供结果的访问','OSS 仅存储最终摘要文件,原始 PDF 通过 FC 直传至百炼模型服务进行全流程处理','前端上传 PDF 至 OSS,触发 FC 解析文本,FC 调用百炼模型生成摘要,结果存入 OSS 并前端下载'],exp:'该题目涉及云服务架构设计，主要考察对阿里云函数计算（FC）、对象存储（OSS）、大模型服务集成能力。根据应用场景，系统需实现文件上传、文本提取、摘要生成及存储分发全链路。选项D的设计路径为：前端上传至OSS触发事件驱动FC执行文本解析，调用大模型生成摘要后存储结果至OSS，符合Serverless架构事件驱动、服务解耦原则。其他选项中，A依赖OCR而非大模型直接处理，B前端直接调用模型存在安全与性能隐患，C未体现事件触发机制且未合理利用OSS存储中间结果。'},
  {id:178,type:'single',answer:'D',stem:'某社交平台需自动屏蔽违规评论,要求同时处理文字、图片。以下哪种方案更合理？',opts:['延迟显示所有 AI 生成内容等待人工审核','建立独立的关键词库分别过滤文本和图片','要求用户上传内容前手动选择内容分类标签','使用多模态模型拦截图文混合违规内容,如 qwen - v1 72b'],exp:'该题涉及社交平台内容审核中多模态数据处理的技术应用。当前互联网内容审核趋势强调结合文本与视觉信息的综合识别，传统单一模态过滤（如独立文本关键词或图片识别）难以应对隐蔽的图文混合违规内容。多模态模型通过联合分析文字语义与图像特征，可识别如“文字规避敏感词但图片隐含违规信息”等复杂情况。qwen-v172b属于此类模型，其技术原理参考了ACL 2022会议论文《Unified Vision-Language Pre-training for Image Captioning and VQA》提出的多模态联合建模方法。选项A效率低下，B存在模态割裂缺陷，C依赖用户主观判断，均无法满足实时自动化审核需求。'},
  {id:179,type:'single',answer:'A',stem:'法，哪一项是正确的？',opts:['生成模块是系统的核心,应优先优化生成阶段的知识总结能力。','应重点评估检索模块的表现, 因为商品信息的准确性和相关性直接影响最终生成的结果。','应对检索阶段和生成阶段分别进行评测, 以便全面优化系统性能。','评测时只需关注最终回答的准确性, 因为用户的满意度主要取决于答案是否正确。'],exp:'通过集群提供服务,具有高可用性(也可以说是可靠性)，四层负载均衡是通过LVS来实现的，七层负载均衡是通过Tengine来实现的。负载均衡必须和云服务器ECS配合使用。'},
  {id:180,type:'single',answer:'A',stem:'某公司推出了一款“大小模型协同系统，使用小模型处理常规问答，大模型处理复杂推理或文档分析。系统还采用了多智能体架构，然而系统经常把一些简单FAQ也交给大模型处理，浪费了算力。为了解决该问题，以下哪种做法最有效？',opts:['在 Planner Agent 中增加任务复杂度判断逻辑,优先调用小模型处理简单 FAQ','对小模型进行额外训练,提升其对更多类型问题的处理能力,从而减轻大模型负担','在工具函数描述中添加更多示例,让大模型能更准确区分不同请求的复杂度','为 Summary Agent 提供更多训练数据,确保最终回答更加全面'],exp:'Planner Agent作为任务调度的核心组件，通过在Planner Agent中增加任务复杂度判断逻辑，可精准识别简单FAQ，并优先调用小模型处理，从任务分配源头减少大模型的无效调用，直接提升系统算力利用效率，解决简单FAQ被误交给大模型处理的问题。'},
  {id:181,type:'single',answer:'C',stem:'在构建微调数据集时，以下哪个方面的考量是错误的？',opts:['数据集要根据微调效果持续迭代','要包括任务全场景','测试集内容要包含在训练集中','要确保数据集准确、 内容相关'],exp:'机器学习模型评估中，训练集与测试集需独立以避免数据泄露。测试集用于评估模型的泛化能力，若训练集包含测试数据会导致模型在测试阶段提前"见过"数据，使评估结果失真。该原则属于机器学习基础常识，常见于《机器学习》（周志华著）等教材。选项B提出测试集内容包含在训练集中，直接违背数据划分的基本原则；选项A、C、D分别对应数据质量、迭代优化、场景覆盖等正确做法。'},
  {id:182,type:'single',answer:'D',stem:'在一个电商客服RAG系统中，如果过度追求召回率，可能会导致哪些问题？',opts:['检索结果数量不足,用户无法获得足够推荐。','检索结果过少,用户找不到相关商品。','检索条件过于严格,用户查询失败率增加。','检索结果包含大量无关商品信息,影响用户体验。'],exp:'在信息检索系统中，召回率衡量检索到的相关文档占所有相关文档的比例。电商客服场景下，召回率过高意味着系统倾向于尽可能返回更多结果，包括潜在不相关的商品。可能导致检索结果中出现大量无关商品，用户需要花费更多时间筛选，降低效率。选项A描述的现象符合高召回率带来的负面影响。选项B、D指向召回率不足的问题，选项C与检索条件严格相关，属于精确度过高的情况。相关概念参考信息检索中的“召回率-精确度权衡”理论。'},
  {id:183,type:'single',answer:'A',stem:'测试时发现，RAG应用的答案中仍包含大量无用细节，导致阅读困难。哪种做法可以最直接地减少无关细节？',opts:['在检索后用 ReRank 且设置更小的 Top N','把索引文件放进 Redis 数据库','增加大模型的 “max_tokens ”','强制用户只提简单问题'],exp:'回答中过多无关细节往往是因为检索阶段召回了太多片段，然后全部拼接进提示词。先ReRank再缩小Top N→只保留最相关的少量文档，能从源头上减少噪声，生成阶段自然更简洁聚焦。提高max_tokens只会让模型输出更长，细节更多；调整存储介质与内容冗余无关；限制用户提问并非技术方案，也无法保证答案不啰嗦。'},
  {id:184,type:'single',answer:'D',stem:'某企业的文档（Markdown格式）中，部门职责常落在多段文字里，检索时想精准定位,哪种切片策略最能减少“职责信息被拆散的问题？ 选项：',opts:['Token 切片','随机分段','句子切片','Markdown 结构化切片'],exp:'Markdown文档的结构特性（标题、列表、代码块等）为内容组织结构提供了明确标记。结构化切片基于这些标记进行划分，能最大程度保持原始逻辑单元（如章节、段落列表）的完整性。Token切片依赖固定长度切分，易破坏段落连贯性；随机分段违背文本顺序；句子切片虽保留句子完整，但忽略上下文关联。结构化切片直接利用文档内部层级，减少职责信息因跨段落或列表项被拆散的风险。来源参考信息检索中基于文档结构的文本分块策略。'},
  {id:185,type:'single',answer:'B',stem:'你希望用阿里云百炼平台的通义千问大模型生成商品描述，但要求不同用户看到的内容略有差异，应如何实现？',opts:['启用 enable_search 参数','保持 temperature=0.9 且不固定 seed','设置 temperature=0.0','使用完全相同的提示词'],exp:'生成结果的多样性通常通过调整模型参数实现。temperature参数控制生成文本的随机性，值越大结果越多样。保持较高temperature（如0.9）且不固定随机种子（seed），可使每次生成略有差异。阿里云百炼平台文档中明确说明，temperature参数影响生成结果的多样性，同时随机种子未固定时，模型每次生成会引入额外随机因素。选项A中temperature设为0会导致输出完全确定，选项C的enable_search与搜索功能相关，选项D无法满足差异化需求。'},
  {id:186,type:'single',answer:'D',stem:'某大模型客服系统被攻击者通过提示',opts:['改进提示词,确保模型在回答问题时避免回答列表形式的内容','改进提示词,让大模型避免回答这类问题','改进提示词,并且在输入阶段过滤无数据 “关键词','在知识库检索前严格限制应用的数据访问权限,避免泄露公开信息'],exp:'题干描述了大模型客服系统被攻击者通过提示词注入获取知识库元数据的问题，需选择有效防范措施。选项A、B改进提示词虽能限制模型回答形式或内容，但无法从根本上阻止攻击者获取元数据。选项C过滤无数据“关键词”同样无法有效防范。选项D在知识库检索前严格限制应用的数据访问权限，能从源头上避免敏感信息泄露，有效防范提示词注入攻击。因此，选项D是更有效的防范措施。易错提醒：需从数据源头控制角度思考防范措施。'},
  {id:187,type:'single',answer:'A',stem:'RAG系统在回答时，返回了多位同名员工的信息，无法区分他们，最合理的改进方式是什么？',opts:['在检索前自动补充标签,例如 “姓名: 张伟( IT 部) ”','简单将 “ 张伟 ” 替换成 “张伟唯一 ”','大幅提高大模型的温度','默认检索 100 条切片,手动让用户筛选'],exp:'题目考察解决RAG系统中实体歧义问题的策略。同名员工信息无法区分时，补充上下文标签能有效辨识不同个体。选项A通过添加部门信息增强实体唯一性，直接关联检索准确性。选项B缺乏实际区分信息，选项C降低用户体验，选项D影响生成稳定性。正确方法需嵌入额外属性，如部门、职位等，以形成唯一标识符。参考信息检索领域实体消歧技术，增加辅助属性是标准做法。'},
  {id:188,type:'single',answer:'B',stem:'请问蜗牛需要多少天能爬出这口井？”。以下哪种提示方法可以提升大模型的解答准确率？',opts:['要求大模型使用平均速度计算总天数','要求大模型在生成时解释逻辑推导过程','要求大模型直接输出最终结果','要求大模型面临陷阱时进行解答'],exp:'井问题考察蜗牛爬升与滑落的周期性及临界点处理。该题常见于逻辑陷阱问题集，旨在检验对周期性问题的细节处理。选项B要求解释推导过程，通过分步分析可发现最后一天白天爬升无需下滑，避免简单用总高度除以净爬升导致的错误。选项A因忽略临界情况导致偏差；选项C缺乏中间步骤易出错；选项D未明确陷阱具体机制，针对性不足。'},
  {id:189,type:'single',answer:'B',stem:'你希望用户在向你的大模型应用提问我想预约医生时，能主动追问必要信息(如科室、时间),以下哪种提示词设计能更好地实现这一效果？',opts:['你是一个细心的医疗客服。注意每次回复后必须追加一个问题,例如请问需要补充什么信息?','你是一个医疗客服 。对于预约就诊类问题,如果用户未说明就诊科室、预约时间,应向用户追问,如果是其他咨询,则正常回答。','你是一个医疗客服。如果用户的请求不完整,请追问所有可能缺失的信息(如科室、时间、症状描述、保险类型等)。','你是一个医疗客服。如果用户的请求不足以完成预约,请主动追问。'],exp:'该题考察医疗客服场景下提示词设计的针对性原则。题干要求模型在用户未提供关键信息时主动追问。选项D明确限定了触发条件（预约就诊类问题）和必要追问字段（科室、时间），同时对其他咨询保持正常应答，既保证了信息完整性又避免冗余提问。相比之下，A选项的固定追问缺乏针对性，B/C选项的"不完整"判断标准未具体化，可能存在过度追问风险。D选项通过精准的条件判断实现业务场景与交互效率的平衡。参考自《对话系统设计原则》第三章的"意图识别与槽位填充"技术规范。'},
  {id:190,type:'single',answer:'D',stem:'用户对你开发的聊天机器人提了反馈，总是要等10s以上才能看到答案。你考虑是否要采取流式输出策略。以下想法正确的是：',opts:['可以采取流式输出,但是我要在原有基础上调整一下 temperature 和 top_p 等参数','不能采取流式输出,将实时返回的结果立刻返回给前端界面是一件很难做到的事情','不能采取流式输出,我调了好久的 prompt 在流式输出时效果肯定会下降','可以采取流式输出,但是我要修改一下返回层面的代码, 比如适配流式输出的数据格式,并且将 return 改为 yield'],exp:'流式输出策略能够实现实时返回结果，减少用户等待时间。为实现这一目标，需要修改返回层面的代码，适配流式输出的数据格式，并将return改为yield，从而确保数据能够以流的形式逐步返回给前端界面，提升交互体验。'},
  {id:191,type:'single',answer:'B',stem:'某团队想用RAG做“分步骤查询”，先找出人员名单，再分别查询每人的部门信息，以下哪项功能最适合？',opts:['ReRank(重排序)','MultiStepQueryEngine(多步查询)','SimpleDirectoryReader(读取本地文档)','HyDE(假想文档生成)'],exp:'本题核心考查RAG框架中多步查询功能的实际应用场景。MultiStepQueryEngine通过逻辑分解实现链式检索，允许将复杂问题拆分为多个顺序执行的子查询（如先提取人员名单、再批量获取部门信息），直接对应分步骤查询需求。HyDE侧重生成假设文档优化检索，ReRank用于调整结果排序，SimpleDirectoryReader仅处理文档加载，三者均不涉及多步骤决策流程。'},
  {id:192,type:'single',answer:'B',stem:'在进行 RAG 应用评测时,应该如何获取测试集中的正确答案( ground_truth)?',opts:['由性能最强的大模型进行编写','由该领域的专家进行编写','由数据工程师进行编写','由算法工程师进行编写'],exp:'在构建RAG应用评测的测试集时，正确答案（ground_truth）的获取需确保权威性和准确性。领域专家具备专业知识和实践经验，能够针对特定问题提供可靠的标准答案。算法工程师的职责侧重于模型设计与优化，性能强大的模型可能生成结果但仍存在不确定性，数据工程师主要负责数据处理而非内容专业性。专业领域对答案的精确度要求较高，需依赖专家知识体系保障评测的有效性。相关研究指出，专家标注是构建高质量评测数据集的核心方法之一。'},
  {id:193,type:'single',answer:'D',stem:'用户只输入了“张伟部门”这样非常简短的关键词，导致最后给出的答案不够完整，在这种情况下，若想自动补全或扩充用户的查询意图，以下哪种策略最合适？',opts:['增加 embedding 维度','多步查询(MultiStepQuery)','使用 HyDE 生成假想文档','问题改写(Question Rewriting)'],exp:'在这个问题中，用户输入了非常简短的关键词“张伟 部门”，这导致查询意图不明确，给出的答案可能不够完整。为了自动补全或扩充用户的查询意图，我们需要选择一种能够理解和扩展用户原始查询的策略。 A选项“增加embedding维度”通常用于提高模型对文本特征的表示能力，但它并不直接解决查询意图不明确的问题。增加维度可能会使模型更复杂，但不一定能更好地理解用户的简短查询。 B选项“多步查询（MultiStepQuery）”通常涉及多个查询步骤或子查询，以逐步获取更详细的信息。然而，这种方法需要明确的查询路径或规则，对于简短的、意图不明确的查询来说，可能不太适用。 C选项“使用HyDE生成假想文档”是一种假设性文档生成方法，它可能用于生成与查询相关的额外信息，但这种方法通常更复杂，且不一定能直接解决查询意图不明确的问题。 D选项“问题改写（Question Rewriting）”则是一种直接针对用户查询意图不明确问题的策略。通过改写用户的问题，可以使其更加明确和具体，从而更容易获取到完整的答案。例如，可以将“张伟 部门”改写为“张伟所在的部门是什么？”或“请查询张伟的部门信息”。这样的改写有助于系统更好地理解用户的查询意图，并给出更完整的答案。 因此，最合适的策略是D选项“问题改写（Question Rewriting）”。'},
  {id:194,type:'single',answer:'C',stem:'你正在尝试使用大模型Qwen-72B完成一个用户反馈分类任务，但效果不佳，以下选项中，你应首先考虑的策略是？',opts:['换用 Qwen-14B 模型','微调大模型(Fine-tuning)','改进提示词(Prompt Engineering)','调整模型的温度参数(Temperature)'],exp:'在处理大模型应用效果优化时，改进提示词通常是首要考虑的步骤。大型语言模型如Qwen系列的性能高度依赖输入提示的清晰度和任务对齐。调整提示词无需额外训练数据或计算资源，能快速验证和迭代。微调需要特定数据集和训练成本，换用更小模型可能导致性能下降，温度参数主要影响生成多样性而非任务准确性。OpenAI等机构推荐优先通过提示工程优化模型输出，再进行其他复杂操作。'},
  {id:195,type:'single',answer:'B',stem:'你准备了一批txt格式的公司制度文档，准备将其用于RAG，若要让RAG后续能快速进行相似度检索，下列哪项是必需的？',opts:['手动把 txt 文件改为 JSON 格式','对文本进行嵌入(embedding)并将向量存进向量数据库','先对这些 txt 文件进行加密存储','在检索时把 txt 文件原样拼给大模型'],exp:'RAG系统的核心在于将文本转化为向量表示，以便高效计算语义相似性。向量嵌入将文本映射到高维空间中的点，相似内容在空间中距离更近。通过预先计算并存储嵌入向量，检索时只需比较向量间的距离（如余弦相似度），避免了实时处理全文的计算开销，极大提升检索速度。其他选项涉及数据格式、安全性或输入方式，与优化检索效率无直接关联。'},
  {id:196,type:'single',answer:'D',stem:'在开发过程中，你发现大模型调用某工具函数时常因输入参数格式错误而失败，最可能的原因是？',opts:['大模型运行时受到系统资源限制(如内存或处理延迟) 影响,导致在处理复杂输入文本时发生数据截断或错误,生成错误的参数格式。','用户输入中可能包含非标准符号或格式不规范的内容,误导大模型在调用参数时产生偏差。','工具函数发生了变化,造成数据传输时自动转换格式出现问题,从而影响参数的正确生成。','工具函数的参数描述信息不足,未明确规定输入参数的具体格式,导致大模型生成调用参数时出现偏差 。'],exp:'根据题目描述，问题在于大模型在调用工具函数时，因输入参数格式错误而失败。这通常指向一个核心原因：大模型对工具函数的参数要求理解不够清晰或准确。 选项A提及系统资源限制，虽然理论上可能影响处理，但通常不会直接导致参数格式错误，更多是性能问题。 选项B涉及用户输入不规范，这确实可能干扰模型，但问题明确聚焦于“调用工具函数时”的格式错误，而非用户输入本身。 选项C提到工具函数变化，但若已变化，通常需要更新模型或接口，而非仅参数格式错误。 选项D指出工具函数的参数描述信息不足，这是最常见且合理的原因。如果参数定义不清晰或缺少示例，大模型在生成调用时容易产生格式偏差，导致失败。 因此，正确答案是D。'},
  {id:197,type:'single',answer:'B',stem:'你是某公司IT部门主管，想使用大模型生成符合公司内部编码规范的Java代码模板，请问以下哪个提示词更合适？',opts:['请帮我生成一份 java 代码,用于……','请帮我生成一份 java 代码,需求是: 要求是: 符合下列编码规范','请逐步分析需求,然后生成一份 java 代码,需求是:','请参考开源社区流行的编码风格,生成一份 java 代码'],exp:'生成符合公司编码规范的代码需明确规范内容。A未提规范，D用开源风格不符内部要求，C缺规范指向，B直接要求符合所列编码规范，提示具体且匹配目标。提示词应清晰限定约束条件，避免笼统或外部参照，以确保输出贴合内部标准。'},
  {id:198,type:'single',answer:'B',stem:'当我们发现使用的模型在大数计算时表现不佳，哪个措施提升最大？',opts:['改进提示词','微调模型,让它学会在大数计算时使用计算器插件','提供大数计算样例','使用微调提高模型的逻辑推理能力'],exp:'大数计算需要精确处理超出常规训练数据范围的能力。大型语言模型在数值运算上通常存在局限性，尤其是超出训练数据分布的数值范围时容易产生近似错误。直接调用计算器插件可绕过模型本身的数值计算弱点，将符号化数字转换为机器可处理的精确计算格式。OpenAI在GPT-4技术报告中指出，通过工具使用（如代码解释器）能有效增强模型的数学与计算能力，这种增强方式比单纯增加训练数据或改进提示工程更直接解决核心问题。选项A依赖模型自身泛化能力，C侧重逻辑而非计算精度，D受限于模型固有计算缺陷。'},
  {id:199,type:'single',answer:'A',stem:'某公司更新了组织架构，但知识库还是旧文档，查询结果经常过时。为避免回答陈旧信息，最合适的方式是？',opts:['定期同步最新文档并重建索引','调整 Node Parser 切片长度','对旧知识不做任何处理','增大模型温度让其自由生成'],exp:'某公司更新组织架构后，知识库文档未及时匹配导致查询结果过时。组织架构变更直接影响知识库有效性，需保证文档与当前结构的一致性。信息检索系统中，索引是加速查询的核心组件，但若文档内容变动后未更新索引，系统仍基于旧数据返回结果。定期同步文档确保数据源最新，重建索引使系统能识别新增、删除或修改的内容，从而提升查询结果的准确性。选项B涉及文本处理粒度，与时效性无关；选项C放任数据陈旧；选项D调整生成随机性，无法解决根源问题。信息管理领域强调数据维护机制，如《信息检索导论》指出“索引更新是动态系统的核心挑战”。'},
  {id:200,type:'single',answer:'C',stem:'某企业计划通过阿里云百炼平台构建一个大模型应用，用于处理对实时性要求不高的任务（如离线招生生成、批量内容摘要提取等）。为了在满足业务需求的同时降低运行成本，以下哪种措施可以最有效地优化成本？',opts:['引入流式输出, 降低模型推理成本','调用最新且参数大的模型(如 Qwen-max)通过更好的技术降低计算成本','使用批量推理服务,离线方式处理数据','调用支持上下文缓存(Context Cache) 的模型减少重复请求的计算开销'],exp:'暂无解析'},
  {id:201,type:'single',answer:'A',stem:'在大模型调用外部 API 工具时,工具函数的描述(description)起到的关键作用是什么?',opts:['帮助大模型理解何时以及如何调用该函数','减少 API 调用过程中的内存占用','加密 API 请求中的敏感数据','提高 API 调用的速度'],exp:'在大模型调用外部API工具时，工具函数的描述（description）直接影响模型对函数功能和使用场景的识别。工具描述通常作为元数据输入模型，为模型提供语义信息，使其能够判断当前上下文是否需要触发该API，并生成符合参数结构的请求内容。例如，若描述为“获取当前天气”，模型会在用户询问天气时调用此API，并根据参数格式（如城市名）填充请求数据。选项A、C、D涉及性能或安全机制，与语义理解无关。相关机制参考了如OpenAI Function Calling设计思路，描述直接影响模型决策流程。'},
  {id:202,type:'single',answer:'A',stem:'梯度下降算法中,如果学习率设置过大可能导致?',opts:['在最优解附近震荡','需要更多迭代次数才能收敛','收敛速度过慢','参数更新幅度不足'],exp:'梯度下降法的核心在于通过负梯度方向更新参数，学习率控制更新步长。当学习率过大，参数更新可能越过最优点，在两侧来回跳跃，无法稳定收敛至最优解，形成震荡现象。过小学习率会导致更新幅度不足、收敛缓慢，但震荡并非由过小引发。选项B、C、D均由学习率过小引起，与题干条件不符。梯度下降中学习率与收敛性的关系在《机器学习》(周志华)、《Deep Learning》(Goodfellow et al.)等教材中均有讨论。选项A正确描述了学习率过高的典型后果。'},
  {id:203,type:'single',answer:'A',stem:'你需要借助大模型为小学生写一篇关于“保护环境的科普短文，但输出的内容过于学术化（频繁使用碳达峰“生物降解等术语)。以下哪个提示词优化方向能最直接解决该问题?',opts:['定义角色与受众: 以 “小学科学老师 ” 身份,用比喻和故事向 “6 - 12 岁学生 ” 讲解','提供样例: 附上一篇《如何节约用水》 的短文(语言平实,包含互动问答)','补充任务目标:要求文章包含 “垃圾分类对社区的影响 ” 案例','扩展上下文: 添加背景 “ 当前城市垃圾填埋占比超过 60% ”'],exp:'该题考察提示词工程中调整输出风格以适应目标受众的能力。来源可追溯至教育传播学中关于年龄适配语言的研究。选项分析：A通过角色设定（小学老师）和受众明确（6-12岁），要求使用儿童易理解的比喻与叙事手法，直接解决术语过多问题。B提供范文但未明确消除术语机制，C增加案例但未改变表达方式，D补充数据可能反而增加理解难度。只有A从身份和表达方式两个维度同步优化，实现了语言降维。'},
  {id:204,type:'single',answer:'C',stem:'以下哪种方式有助于在大模型多轮对话场景中，保障生成内容质量的同时，降低成本，并提升响应速度？',opts:['使用 Batch API','并行调用大模型 API','使用支持上下文缓存的大模型 API','使用经过量化的模型'],exp:'上下文缓存技术允许模型在多轮对话中复用已生成的中间结果，减少重复计算。这项优化手段直接作用于对话场景的长文本处理环节。选项A的量化可能损失模型精度，选项B的批量处理难以满足实时对话需求，选项D并行调用增加成本开销。支持上下文缓存的API（选项C）通过历史对话状态的持久化存储，有效降低单位请求的计算量。参考大模型工程优化方案，该技术被证实可降低20-40%的推理成本并缩短响应时延。'},
  {id:205,type:'single',answer:'C',stem:'你使用阿里云百炼平台的通义千问API开发了聊天机器人，用户反馈：提问某地天气时模型总是无法回答。如何快速解决这个问题？',opts:['提前设置话术,在面对类似问题时可以直接将话术返回给用户','通过复杂的工程手段,对用户的输入提取关键词,集成第三方搜索引擎,并将搜索结果返回给大模型','设置 enable_search(联网搜索) 参数,为通义千问 API 引入联网能力','在聊天界面显眼位置标注限制,不建议用户输入类似问题'],exp:'通义千问API文档中明确提到，设置enable_search参数可以启用模型的联网搜索能力，允许访问实时信息。选项C提供的解决方案直接利用平台内置功能，无需额外开发或限制用户输入。选项A和D属于被动应对，无法动态获取天气数据；选项B涉及复杂第三方集成，效率较低。'},
  {id:206,type:'single',answer:'B',stem:'在RAG的建立索引的过程中，以下哪一点是将源知识文件分割成文本段的主要原因？',opts:['让大模型输出更加多样','提高检索精度,更快速定位相关段落','减少数据存储空间','减少索引构建时间'],exp:'将源知识文件分割成文本段可提升检索精度，因为原始文件篇幅长且内容混杂，整体索引难以精准匹配问题。分割成小文本段后，能缩小单次检索范围，使向量数据库更易匹配相关片段，还可加速定位关键段落，减少无关内容干扰，为后续大模型提供更聚焦的上下文依据。'},
  {id:207,type:'single',answer:'B',stem:'你希望你所构建的大模型客服应用能保障合规性的同时，也要确保用户使用体验，以下哪个技术方案更可靠且不明显影响体验？',opts:['在大模型生成答案后,使用正则表达式过滤器,检测并替换敏感关键词','结合内容安全服务,对大模型流式输出实施实时合规扫描,违规片段内容进行替换','基于关键词实时匹配触发拦截机制,高危内容直接终止响应并提示用户','部署混合模型架构: 大模型生成回答后,立即调用专用小模型进行合规性重写'],exp:'更可靠: 结合内容安全服务(如专业的内容审核API),利用AI 进行实时语义分析 ,而非简单关键词匹配,能更准确检测和替换违规片段,保障合规性 。不明显影响体验: 流式输出与实时扫描结合,响应几乎无延迟,用户看到的是即时处理后的内容,替换仅针对违规片段,整体对话流畅自然 。综合优势: 相比其他选项,B 在技术成熟度、效率和用户体验上更平衡,适合大模型客服的高并发、实时交互场景。'},
  {id:208,type:'single',answer:'A',stem:'某团队需要翻译一份文档，其中包含30条机构内部术语的英文缩写，为了确保翻译的高准确性，以下哪种方案能解决这一问题？',opts:['在提示词中提供 30 条对应术语缩写与翻译示例','提供前 5 条翻译示例,要求模型类推处理剩余条目','直接让大模型翻译,大模型能够完成这类任务','使用支持联网搜索的大模型 API 完成此任务'],exp:'针对翻译任务中确保机构内部术语准确性的需求，重点在于定制化术语的处理方式。大模型对特定领域或内部术语的翻译依赖清晰的上下文示例。选项A通过完整提供所有术语对应关系，为模型建立明确的参考基准，减少猜测空间。选项B的类推方法适用于通用术语，但内部缩写可能缺乏外部逻辑关联。选项C和D未主动提供定制化数据，无法覆盖训练集外的内部术语。该思路参考提示工程中"示例驱动准确性优化"原则（相关研究见《自然语言处理中的上下文学习机制》）。'},
  {id:209,type:'single',answer:'C',stem:'、相比直接使用大模型的API,使用百炼的AssistantAPI构建Agent的主要优势是什么?',opts:['能够绕过一些 API 调用限制,使得开发出的 Agent 功能更强大','能够完全控制模型底层训练过程','自带了会话管理和联网搜索等工具,简化 Agent 开发工作','能够修改一些大模型 API 不直接提供的参数,使得开发 Agent 的过程更灵活'],exp:'百炼的Assistant API设计理念侧重于为开发者提供更便捷的Agent构建体验。官方文档明确指出，该API内置了如会话管理、联网搜索等工具，开发者无需重复开发基础功能。选项A涉及模型底层训练控制，与API使用无关；选项B中的“绕过API限制”不符合实际，API权限由服务方管理；选项D提到的参数修改能力未被官方列为API特性。选项C强调内置工具简化开发，直接对应百炼Assistant API的核心优势。'},
  {id:210,type:'single',answer:'C',stem:'你在开发一个旅途规划系统，希望该系统能够帮助用户规划出行交通方式、具体景点行程、以及住宿安排，并且将总预算控制在指定范围内。以下哪种设计方案更为合理：',opts:['设计一个多 Agent 系统 ,主 Agent 拆分任务 -> 子 Agent 独立执行 -> 基于模板汇总子Agent 执行结果','设计一个单 Agent 系统,依次调用对应服务 API,在代码中写好预算分配规则,最终基于模板汇总信息形成规划表格','设计一个多 Agent 系统,规划 Agent 规划拆分任务 -> 子 Agent 并行执行 -> 汇总 Agent校验冲突(如或酒店与交通预订时间冲突)','基于工作流,按照常用顺序(交通 -> 景点 -> 住宿),依次调用对应服务 API-> 基于模板汇总子 Agent 执行结果'],exp:'旅途规划要同时处理交通、景点、住宿,多 Agent 系统能拆分任务并行执行提高效率,而 C 里汇总 Agent 还能校验冲突(像酒店和交通时间冲突这类实际问题),单 Agent 或没冲突校验的多 Agent(A 等)搞不定复杂约束 。'},
  {id:211,type:'single',answer:'B',stem:'某大学为学生提供一款问答机器人,能回答课程安排和考试时间,学校想新增自助预定自习室功能,需要查询并预定教室资源。要使这个功能能与现有问答无缝集成，合适的做法是什么？ 选项：',opts:['在模型系统消息中提供大量备用的数据','使用一个专门的 Agent 调用内部预定 API','仅通过提示让模型推测当前可用教室','在 Prompt 中写死可预约教室列表'],exp:'现有的问答机器人需要处理动态数据查询和操作请求。预定自习室涉及实时资源管理和系统交互，仅依靠模型生成或静态数据无法保证准确性与事务性。专用Agent能够通过API直接对接后台数据库或预定系统，实时检索可用教室并执行预定操作，确保数据一致性和功能可靠性。其他选项要么依赖静态信息无法动态更新，要么缺乏执行实际操作的接口，无法满足需求。'},
  {id:212,type:'single',answer:'B',stem:'你开发了一个专用于医疗场景问答的RAG应用，许多用户都反馈说关于疾病症的回答总是得不到正确答案，你应该首先检查哪一环节？',opts:['检查检索环节的 embedding 模型是否能分辨相似的文本段','检查训练集的内容是否存在于知识集中','检查计算资源是否充足','检查大模型是否能根据知识内容对问题进行正确解答'],exp:'暂无解析'},
  {id:213,type:'single',answer:'B',stem:'在开发一个需要调用大模型API的应用时,为了保护敏感信息不被泄露，以下哪种方式是处理API Key的安全做法？',opts:['在代码中写入 API Key','将 API Key 存储到环境变量中','在代码注释中记录 API Key','将 API Key 保存在公开的配置文件中'],exp:'API密钥等敏感信息的安全管理是应用开发中的基本要求。直接写入代码、注释或公开配置文件会导致密钥暴露，尤其在代码版本控制或共享时风险极大。环境变量将密钥与代码分离，避免密钥被提交到代码仓库或意外泄露。例如，12 Factor App原则建议将配置存储在环境中，确保安全性与环境解耦。选项中，环境变量符合安全最佳实践。'},
  {id:214,type:'single',answer:'D',stem:'、某律所希望开发一个基于RAG的合同审阅系统，已通过POC(Proof of Concept,是针对客户具体应用的验证性测试）验证了系统对于一些常见问题的准确性和效率。下一步应该优先做什么？',opts:['降低相似度阈值,增加召回文本段个数','对前端界面进行优化','针对 POC 测试中的问题进行反复优化','请法律专家参与构建评测集'],exp:'RAG系统开发流程中，POC验证后需构建高质量评测集以评估实际场景效果。法律领域的专业性要求评测集需包含真实业务问题及专业标注，缺乏专家参与会导致评测偏差。D选项通过引入法律专家构建评测集，可准确量化系统性能并为后续迭代提供依据。其他选项在缺乏可靠评测基准时易陷入主观优化，难以保证系统满足专业场景需求。'},
  {id:215,type:'single',answer:'D',stem:'在RAG应用中，为什么需要将文本转化为向量表示？',opts:['提高向量在前端界面的显示效果','减少存储空间','方便人工阅读','便于计算语义相似度'],exp:'在RAG（检索增强生成）应用中，将文本转化为向量表示的核心目的是为了实现高效的语义匹配与检索。具体分析如下： A选项错误：向量表示通常是高维数值，其本身并不具备可读性，无法直接用于前端界面的显示优化。 B选项错误：将文本转化为向量表示通常会增加存储开销，因为高维向量比原始文本需要更多的存储空间（除非采用特殊的压缩或量化技术，但这不是转化的主要目的）。 C选项错误：向量表示是一串难以理解的浮点数，不便于人工直接阅读或理解。 D选项正确：向量化后的文本，可以通过计算向量之间的余弦相似度、欧氏距离等数学度量，在语义层面快速找到与用户查询最相关的内容。这正是RAG应用中“检索”环节的基础，使得系统能够在大规模文档中高效定位语义相关的信息片段。 因此，正确答案是D。'},
  {id:216,type:'single',answer:'D',stem:'你在阿里云百炼上搭建了一个智能应用，为用户提供美食推荐服务，你希望智能体记住用户的喜好、避免推荐之前用户提及过的忌口食物。以下哪个方案能以低成本满足这一诉求？',opts:['构建独立的历史对话知识库,通过 RAG 在每次请求时检索用户全部聊天记录并持续维护知识库更新与索引优化','在应用侧硬编码用户提供忌口信息','构建基于向量数据库的实时对话语义检索系统,检索常见忌口信息','使用长期记忆功能,让智能体不断积累用户偏好信息'],exp:'在阿里云百炼上搭建智能应用时，希望智能体记住用户喜好并避免推荐忌口食物，核心诉求是“低成本”且“持续记忆”。我们来分析各选项： - **A选项**：构建独立历史对话知识库，通过RAG检索全部聊天记录，并持续维护知识库更新与索引优化。这需要额外的存储、索引维护和每次请求的检索开销，开发和运维成本较高，且不是最优的低成本方案。 - **B选项**：在应用侧硬编码用户忌口信息。虽然成本极低，但硬编码意味着信息是静态的，无法动态适应不同用户的个性化喜好，也无法随用户交流积累新信息，不具备“记住用户喜好”的灵活性。 - **C选项**：构建基于向量数据库的实时对话语义检索系统，检索常见忌口信息。这仍然涉及向量数据库的搭建与维护，且检索“常见”信息而非用户个人历史，可能遗漏用户特定的忌口，成本也高于D选项。 - **D选项**：使用长期记忆功能，让智能体不断积累用户偏好信息。在阿里云百炼等平台中，通常提供内置的长期记忆能力（如对话记忆、用户画像存储），开发者只需简单配置即可让智能体自动记住用户历史中的偏好和忌口，无需额外开发复杂的检索系统或数据库，是成本最低且最直接满足“记忆”和“低成本”诉求的方案。 因此，正确答案是D。'},
  {id:217,type:'single',answer:'B',stem:'你想通过语音命令操作网页，例如，用户说“我想煮2杯咖啡”，系统转译语音后，根据用户位置和互动意图确定位置并点击“下单”的按钮。由于UI复杂，哪项技术最适合精准锚点点击目标按钮？',opts:['引入安全审核机制,对所有操作进行预先校验,确保操作前先确定 UI 元素的合法性。','标注页面上的可交互元素,然后结合视觉理解大模型识别并构建应该做出的点击动作。','利用 RAG(检索增强生成) 技术,动态检索界面说明文档来辅助识别目标按钮。','采用提示词工程技术,通过优化语言描述指导模型从文本中推断出应操作的 UI 元素。'],exp:'暂无解析'},
  {id:218,type:'single',answer:'A',stem:'为什么我们要在微调中使用早停法？',opts:['因为模型微调容易出现过拟合现象','因为 eval_step 设计太大会导致过拟合','微调学习率太小导致模型参数更新太慢','微调轮次过少可能导致模型欠拟合'],exp:'在深度学习模型训练中，早停法通过监控验证集性能防止模型过度依赖训练数据。过拟合指模型在训练集表现优异，但泛化能力下降。微调时，模型参数已在预训练中学习通用特征，继续迭代可能使模型过度适应特定任务数据。选项A正确，B中“eval_step过大”影响评估频率，与过拟合无直接因果关系。选项C、D涉及学习率和训练轮次不足，属于欠拟合问题，与早停目标不符。早停法的核心原理出自《Deep Learning》（Ian Goodfellow等）中对正则化方法的讨论。'},
  {id:219,type:'single',answer:'B',stem:'你在开发RAG应用时，发现召回的文本段包含了回答所需的必要信息，但是回答效果很差，你可以怎么做？',opts:['更换向量数据库的选型','更换性能更好的大模型','更换性能更好的 embedding 模型','尝试使用 LlamaIndex 外的其它 RAG 开发框架'],exp:'RAG应用中，检索阶段负责召回相关文本，生成阶段依赖大模型整合信息并生成答案。当召回文本包含所需信息但回答效果不佳时，问题通常出在生成阶段的模型能力不足。更换更强的大模型能直接提升生成质量，确保召回信息被正确理解和组织。选项D针对生成阶段优化，而A、B、C均针对检索或框架，与题干问题无关。'},
  {id:220,type:'single',answer:'D',stem:'你在优化一个多语言翻译系统，发现文学翻译经常“失去原文意境”，而技术文档翻译经常用词生硬、难以理解。现有提示词已包含“保持专业性”和“语言流畅要求，并添加了示例下一步最应优先尝试的策略是？',opts:['提高温度参数(Temperature=1.0) 增强灵活性','要求模型分两次翻译: 先直译再人工润色','在现有模板中增加更多诗歌和手册的对照示例','为文学和技术翻译分别设计专用提示词模板'],exp:'文学与技术文档对译文风格的要求截然不同：文学更强调意境、韵味、修辞；技术强调准确、术语一致、易于理解。在同一个提示词里同时满足二者往往顾此失彼。将两类文本拆分、为每类单独配置提示词模板，能精准地约束生成风格（例如文学模板强调“保留情感与意象”，技术模板强调“术语一致、句式简明”），是最直接且高效的改进路径。增加诗歌/手册示例虽有帮助，但因场景差异过大，示例混在一起效果受限；提高 temperature 只会让输出更随机，并不能针对性解决失真或生硬问题；先直译再人工润色增加人工成本且违背系统自动化目标。'},
  {id:221,type:'single',answer:'B',stem:'为缩短响应时延，你想在索引前减少切片数量，每个切片包含2-3页内容。结果发现，回答容易混进无关信息。导致无关信息的根本原因是什么？',opts:['文档内没有标题','切片过大,且主题混杂','切片过短,信息量不足','大模型出现故障'],exp:'索引切片时，若每个切片包含2-3页内容，可能导致单个切片覆盖多个不同主题。较大的切片范围容易引入与查询意图无关的文本段落，尤其是当切片内部存在主题跳跃或内容混杂时，模型难以精准定位核心信息。LangChain等文档处理框架的官方文档指出，过大的文本块会影响检索准确率。选项B直接对应切片尺寸与主题混杂的问题，其他选项未涉及文本块划分对语义完整性的影响。'},
  {id:222,type:'single',answer:'C',stem:'开发医疗问答系统时发现模型频繁产生“幻觉”，应优先采取哪种优化组合？',opts:['降低 LoRA 秩值 + 增大学习率','增加训练 epoch + 提高相似度阈值','RAG 增强知识库 + LoRA 微调领域数据','更换主参微调 + 减少 batch_size'],exp:'模型产生”幻觉”指生成不准确或无关内容。选项A中降低LoRA秩值会降低模型容量，增大学习率可能导致训练不稳定，不能解决幻觉问题；选项B增加训练epoch可能过拟合，提高相似度阈值与幻觉问题关联不大；选项C中RAG（检索增强生成）增强知识库可提供准确知识，LoRA微调领域数据使模型更适应特定场景，能有效减少幻觉；选项D更换全参数成本高且不一定有效，减少batch_size影响训练效率。故优先选C。易错提醒：不要只关注单一优化手段，要综合知识增强和模型微调。'},
  {id:223,type:'single',answer:'A',stem:'你开发了一个RAG应用，发现用户经常连续提问（多轮对话)，但是当前应用还不支持多轮对话，你应该怎么改造检索步骤来进行适配？选项： 选项：',opts:['检索时 ,先用大模型对历史对话以及用户输入进行总结 ,生成一个新的 query,然后用新 Query 输入向量数据库进行检索;','检索时, 由大模型判断哪些文本段是相关的;','检索时将历史对话信息输入向量数据库进行检索;','检索时,将用户的问题输入向量数据库进行检索;'],exp:'多轮对话场景下，需将历史对话与当前问题融合为统一查询语句，以提升检索相关性。正确做法是使用大模型对历史对话和当前输入进行语义总结，生成新的查询语句，再基于此向量数据库检索。选项B仅判断相关段落，未整合上下文；选项C直接将历史对话输入向量库，引入噪声；选项D忽略对话历史，无法体现多轮语义关联。'},
  {id:224,type:'single',answer:'D',stem:'在qwen2.5-1.5b微调训练时，训练损失、验证损失都收敛到较低水平，不再明显波动变化，你应该？',opts:['模型开始过拟合,应终止训练','模型处于欠拟合状态,需要继续训练','训练失败,重新调整训练策略','训练成功,停止训练并进一步评估其效果'],exp:'在深度学习模型的微调训练中，损失函数的变化趋势是判断训练状态的重要指标。当训练损失和验证损失都收敛到较低水平，并且不再出现明显波动时，说明模型已经基本学习到了数据中的有效特征，既没有明显欠拟合（训练损失未持续下降）也没有显著过拟合（验证损失未开始上升）。此时，通常认为模型已经达到当前训练策略下的较优状态，因此应当停止训练，并进一步在测试集上评估模型的最终性能。 - A选项（过拟合）不成立，因为过拟合通常表现为训练损失持续下降而验证损失开始上升，题干中验证损失没有波动上升。 - B选项（欠拟合）不成立，因为欠拟合时训练损失和验证损失都处于较高水平且仍在下降。 - C选项（训练失败）也不成立，因为训练过程正常收敛。 - D选项（训练成功，停止训练并进一步评估）符合训练收敛的标准流程。 因此，正确答案是D。'},
  {id:225,type:'single',answer:'B',stem:'在一次评审会上，大家针对同一条问答的准确性产生分歧，工程师认为回答和问题语义相似度高，业务负责人则认为回答中有错误细节。该争议主要反映了什么？',opts:['词法分析不完善','纯粹的向量相似度不足以衡量业务正确性','检索速度过慢','大模型对中文支持度不足'],exp:'该题考察语义相似度与实际业务正确性的差异。自然语言处理中，向量相似度常用于衡量文本间语义距离，但无法直接验证事实准确性或业务逻辑合理性。题干中工程师侧重技术指标（语义匹配），业务负责人关注业务事实正确性，两者维度不同。选项B、C、D均未涉及业务正确性与技术指标的冲突，仅选项A明确点出向量相似度的局限。相关研究指出，语义相似度模型难以捕捉专业领域细节正确性（如文献《Beyond Semantic Similarity: Evaluating Factual Accuracy in Question Answering》）。其他选项与题干争议无直接关联。'},
  {id:226,type:'single',answer:'B',stem:'在qwen2.5-1.5b模型训练时,当训练损失持续下降但验证损失开始上升时,说明模型处于什么状态?',opts:['欠拟合','过拟合','训练失败','训练成功'],exp:'在机器学习模型训练过程中，损失函数是衡量模型预测结果与真实值之间差异的指标。通常，我们会同时监控训练集上的损失和验证集上的损失（或测试集上的损失），以判断模型的训练状态。 A选项（欠拟合）不正确：当模型欠拟合时，模型无法很好地捕捉训练数据的特征，此时训练损失和验证损失通常都会处于较高水平，且都可能下降缓慢或停滞。欠拟合的特征是训练损失本身就没有降到较低水平，而不是训练损失下降而验证损失上升。 B选项（过拟合）正确：过拟合是指模型在训练数据上表现优异（训练损失持续下降），但泛化到新数据（验证集）上的能力变差（验证损失开始上升）。这是因为模型过于复杂，学习到了训练数据中的噪声和细节，导致对未见过的数据预测效果不佳。题干中描述的情况——“训练损失持续下降但验证损失开始上升”——正是过拟合的典型表现。 C选项（训练失败）不正确：训练失败通常指训练过程无法收敛，比如损失爆炸或持续震荡，而题干中训练损失在下降，说明模型在有效学习。 D选项（训练成功）不正确：训练成功的标志通常是训练损失和验证损失都收敛到较低水平且两者差距不大，而验证损失上升说明模型泛化能力变差，不能视为成功。 因此，正确答案是B。'},
  {id:227,type:'single',answer:'A',stem:'LoRA微调对数据量要求的说法错误的是？',opts:['微调数据量较小时,应增大 LoRA 的秩以提升模型表达能力','在数据质量有保障时,增大数据量、多样化通常能提升微调效果','LoRA 微调需求数据量比预训练要小','同等数据量下( 1000 条),LoRA 微调效果接近全参微调'],exp:'LoRA（Low-Rank Adaptation）是一种用于微调大型预训练模型（如GPT、BERT等）的高效方法，其核心思想是通过低秩分解来减少可训练参数的数量，从而降低计算成本和内存需求。以下是对各选项的分析： A. **错误**。当微调数据量较小时，增大LoRA的秩（rank）通常**不会**提升模型表达能力，反而可能导致过拟合。因为低秩分解的目的是在参数效率和模型容量之间取得平衡，数据量较小时，高秩可能导致模型过于复杂，无法泛化到新数据。正确的做法是保持较低的秩，或通过正则化等技术防止过拟合。 B. **正确**。在数据质量有保障时，增大数据量和数据多样性通常能提升微调效果。这是因为更多的高质量数据可以帮助模型学习到更通用的特征，减少过拟合风险。 C. **正确**。LoRA微调的需求数据量通常比预训练要小。预训练需要海量数据来学习通用语言表示，而微调（尤其是LoRA）只需少量任务特定数据来适应特定任务。 D. **正确**。在同等数据量下（如1000条），LoRA微调的效果通常接近全参数微调。这是因为LoRA通过低秩分解保留了模型的主要表达能力，同时减少了参数数量，因此在数据量较小时仍能取得较好的效果。 综上所述，**选项A的说法是错误的**，因为增大LoRA的秩在数据量较小时可能导致过拟合，而非提升模型表达能力。因此，正确答案是A。'},
  {id:228,type:'single',answer:'C',stem:'开发过程中，你注意到系统日志显示大模型对某工具函数调用频率异常高，但调用结果经常出错，最可能原因是什么？',opts:['大模型的计算资源不足','该工具函数的调用接口存在安全漏洞','该工具函数的描述过于宽泛,导致大模型误以为适用于多种任务','用户输入错误导致大模型误调用该工具'],exp:'大模型在调用工具函数时依赖其描述的准确性。若工具函数描述过于宽泛，模型可能无法准确判断其适用场景，从而在多种不相关任务中频繁尝试调用。该现象与工具函数描述颗粒度对模型任务匹配能力的影响相关，如文献中对工具增强型语言模型（Tool-augmented LM）的接口设计讨论指出，模糊描述易导致误用。选项A涉及资源问题，与调用错误无直接关联；选项B聚焦安全漏洞，不直接影响调用逻辑；选项D归因用户输入，题干未体现此类信息。'},
  {id:229,type:'single',answer:'C',stem:'以下哪项是流式输出的主要优势？',opts:['降低模型推理错误率','避免使用负载均衡','提升用户感知的响应速度','减少服务器计算资源消耗'],exp:'流式输出技术允许数据在生成过程中逐步传输而非等待全部处理完成。其核心优势在于用户能够即时接收部分结果，减少了等待完整结果的感知延迟。选项B的表述符合这一特点。选项A与实际情况可能相反，流式传输可能因维持长连接消耗更多资源；选项C与模型本身的推理逻辑相关，输出方式不影响错误率；选项D涉及基础设施，流式输出仍需负载均衡应对高并发场景。流式输出的应用场景如HTTP分块传输、大模型实时生成响应（OpenAI API等），均以优化用户体验为核心目标。'},
  {id:230,type:'single',answer:'B',stem:'你维护了一个开发者社区的大模型问答助手，但你发现有人通过上传一些恶意的文章，诱导大模型生成恶意代码。从长期防护角度，最根本的解决措施是？',opts:['输出阶段调用代码静态分析工具','在知识库上传阶段扫描文档安全性','限制模型生成可执行代码','为知识库文档添加数字签名'],exp:'从长期和根本的防护角度看，防止恶意内容进入系统源头是关键。选项A和C属于输出阶段的补救或限制措施，无法根除恶意内容进入知识库的风险。选项D的数字签名主要用于验证文档来源和完整性，无法识别文档内容的恶意性。选项B通过在知识库上传阶段进行安全扫描，能主动拦截恶意文档，防止其污染知识库，从而从根本上减少模型被诱导生成恶意代码的风险。因此，最根本的解决措施是在知识库上传阶段扫描文档安全性'},
  {id:231,type:'single',answer:'A',stem:'你在调用通义千问API时设置了temperature(温度)参数,以下哪种说法是正确的?',opts:['温度参数越高,候选 Token 的概率值之间的差距会变大,从而带来更高的随机性','温度参数越高,低概率的候选 Token 有概率超过高概率的候选 Token 的概率','温度参数越高,候选 Token 的概率值会越接近,从而带来更高的随机性','温度参数越高,越适合撰写技术报告、代码等有较高确定性需求的场景'],exp:'在调用通义千问 API 时，temperature（温度）参数用于控制生成文本的随机性。温度参数越高，模型对候选Token的概率分布影响越大，原本概率差异较大的Token概率会趋于接近，即概率值更接近，从而带来更高的随机性。而选项B中概率值差距应变小，选项C描述不准确，低概率Token不会直接超过高概率Token概率，只是相对差距缩小。所以选项A正确。易错提醒：注意温度参数对概率分布的影响是使概率更接近而非差距变大。'},
  {id:232,type:'single',answer:'C',stem:'模型微调适合解决哪种任务？',opts:['数据量极小的任务','需要学习庞大知识库的任务','需要模型学习专业领域知识的任务','数据分布剧烈漂移的任务'],exp:'模型微调的核心目的是让预训练模型适应特定领域需求。预训练模型具备通用语言理解能力，微调针对专业领域数据（如医学、法律）调整参数，使其掌握领域特有词汇、表达和知识结构。选项A中数据量过小易导致过拟合，微调通常需适量数据；选项C的“庞大知识库”更依赖预训练阶段而非微调；选项D的数据分布剧烈变化可能需要更复杂方法（如领域自适应）。微调的优势在于高效利用预训练特征，结合少量领域数据优化任务性能，契合专业领域知识迁移的场景。相关方法见自然语言处理领域关于迁移学习的文献（如Devlin et al., 2018）。'},
  {id:233,type:'single',answer:'B',stem:'你希望大模型客服在处理模糊请求时（如用户说“我想订票”),能主动追问必要信息(如时间、地点),以下哪种提示词设计最有效？',opts:['你是一个订票客服人员。请根据用户提供的信息来回答问题或进行订票。','你是一个订票客服人员 。对于订票问题,如果信息不完整,应询问用户,直到获取了完整的出发地、 目的地、时间信息。如果是其他票务问题,则正常回答。','你是一个细心的订票客服人员。注意每次回复后必须追加一个问题,例如 “请问需要补充什么信息? ”','你是一个订票客服人员。对于订票问题,如果信息不完整,请向用户主动询问订票相关信息。如果是其他票务问题,则正常回答。'],exp:'订票需明确出发地、目的地和时间三项关键信息。选项B明确要求在信息不完整时主动追问缺失要素，且限定仅针对订票业务，符合服务场景的精准性与效率要求。选项A未规定追问机制，无法引导模型主动澄清模糊请求。选项C强制每次回复都追问，违背对话自然性，易造成冗余交互。选项D将责任转嫁给用户，要求“用户主动询问”，与题干中“主动追问”的核心需求相悖。'},
  {id:234,type:'single',answer:'C',stem:'游戏公司开发AI数字人NPC时，以下哪项技术要求目前最难实现？',opts:['根据玩家情绪调整对话语气','识别语音指令执行简单任务','实时生成符合角色设定的剧情分支','通过动作捕捉复现预设舞蹈动作'],exp:'自然语言处理与人工智能生成内容（AIGC）领域技术难度差异。《人工智能：现代方法》指出，实时生成符合角色设定的剧情分支需要动态叙事生成、上下文连贯性保持及多模态交互融合，技术复杂度远超其他选项。A依赖情感计算与语调调整算法，已有成熟应用；B基于语音识别与指令解析，技术相对成熟；D使用动作捕捉与动画合成，工程实现难度低。C需结合角色知识图谱、生成对抗网络（GAN）与实时决策树，面临逻辑自洽性与创作多样性双重挑战。'},
  {id:235,type:'single',answer:'D',stem:'在qwen2.5-1.5b模型微调时,训练损失和验证损失在快速下降,以下说法正确的是?',opts:['说明模型已收敛,可停止训练','说明模型开始过拟合,需立即停止','说明学习率设置过高,需调小','说明训练策略有效,应继续训练'],exp:'在模型微调过程中，训练损失和验证损失同步快速下降，表明模型能够有效学习训练数据特征，同时保持对验证数据的泛化能力，这是训练策略有效的体现。该现象说明当前训练策略，如学习率、批次大小等参数设置合理，模型正处于高效学习阶段，应继续训练直至损失趋于稳定，实现模型收敛。'},
  {id:236,type:'single',answer:'C',stem:'你开发了一个RAG应用，用户反馈回复效果不佳。你通过后台日志发现用户的输入有时缺少信息，如“我要读研”、“请假”，你应该优先进行哪方面的优化？ 选项：',opts:['更换检索速度更快的向量数据库','调整大模型的 top_p 参数','结合历史常见问题,使用大模型对 query 进行改写','优化文档切分策略'],exp:'RAG应用中，用户输入信息不足会导致检索不准确，影响最终回复质量。关键在于提升查询的明确性和上下文信息，而非调整生成参数或数据库性能。通过分析历史常见问题，利用大模型对原始query进行扩展或改写，能有效补充缺失的上下文，提升检索相关性。例如，"请假"改写为"员工请假流程需要提交哪些材料"，使检索系统更精准定位相关文档片段。此方法直接针对输入信息缺失的核心问题，符合RAG优化中优先处理检索阶段的思路。'},
  {id:237,type:'single',answer:'C',stem:'你想使用Qwen－Max从一段冗长的课程文本中提炼出关键信息,用于创建PPT脚本。以下哪个提示词最合适？',opts:['用更少的字概括这段文字','缩短这段文字','从以下课程文本中提取关键信息,生成一个简洁的 PPT 脚本大纲,突出重点内容,并控制在5 个要点以内。','把这段文字变成 PPT'],exp:'题目考察如何通过恰当提示词引导AI完成特定任务——从文本中提取关键信息生成PPT大纲。正确选项需明确任务目标、内容重点及格式限制。选项C明确要求提取关键信息、生成PPT大纲、突出重点并限制要点数量，比其他选项更全面地覆盖任务需求。A、B仅涉及文本长度缩短，未说明应用场景；D未指定关键点提炼与格式限制，缺乏操作指引。类似需求常见于《人工智能应用》课程中提示工程章节，强调精准描述任务需求对输出质量的影响。'},
  {id:238,type:'single',answer:'C',stem:'在设定大语言模型的训练参数时，哪个参数可以影响模型每次更新时所考虑的数据量，并间接影响到模型收敛速度和内存使用？',opts:['学习率','正则化','批大小','动态学习率策略'],exp:'在训练神经网络时，批大小（batch size）决定了每次参数更新所使用的最小训练样本数量。较大的批大小通常需要更多的内存，但可能提高计算效率；较小的批大小有助于更频繁的参数更新，但可能导致噪声较多。学习率控制参数更新的步长，正则化用于防止过拟合，动态学习率策略调整学习过程中的步长变化，三者均不直接影响每次使用的数据量。该概念源于深度学习基础理论中优化算法的核心参数设置。选项B正确对应批大小的作用。'},
  {id:239,type:'single',answer:'A',stem:'、StorageContext.from_defaults (persist_dir=PERSIST_DIR) 的作用是什么?',opts:['创建一个新的 StorageContext 对象,并使用默认配置,但指定持久化目录。','将 StorageContext 对象保存到 PERSIST_DIR。','从 PERSIST_DIR 加载 StorageContext 对象。','创建一个默认的 StorageContext 对象,并忽略 PERSIST_DIR。'],exp:'[回答]：在LlamaIndex框架中，`StorageContext`用于管理向量存储、索引存储、文档存储等组件的持久化配置。`from_defaults`是一个类方法，用于创建一个`StorageContext`实例，并允许通过参数（如`persist_dir`）自定义默认设置。具体来说，`StorageContext.from_defaults(persist_dir=PERSIST_DIR)`的作用是生成一个新的`StorageContext`对象，该对象采用默认的存储配置（例如内存存储），但额外指定了持久化目录`PERSIST_DIR`，以便后续在保存或加载索引时使用该目录。它并不立即执行保存或加载操作，也不忽略传入的目录参数。因此，选项A的描述“创建一个新的StorageContext对象,并使用默认配置,但指定持久化目录”最为准确。选项B（保存到目录）和选项C（从目录加载）是其他方法（如`persist`或`from_persist_dir`）的功能，选项D（忽略目录）则与参数传递的目的相悖。故正确答案为A。'},
  {id:240,type:'single',answer:'B',stem:'以下哪种方法不属于常见的文档切片方法?',opts:['按词性分割','按 token 长度分割','按语义分割','按字符分割'],exp:'文档切片方法用于将文本划分为可处理单元。常见方法包括按词性分割（区分名词、动词等结构）、按语义分割（根据上下文或主题划分）以及按字符分割（固定字符数分块）。按token长度分割涉及将文本按预定义token数量切分，token通常指处理中的最小单元（如单词或子词），但此方法在常规文档切片中较少被归类为主要方式。答案对应选项B。'},
  {id:241,type:'single',answer:'A',stem:'以下哪种方式不符合Multi-Agent的处理思想?',opts:['将文档的标题改写、表格单元格改写和语义分割都交给同一个大模型一次性完成.','使用DashScopeParse解析文档结构,再使用通义千问API润色文本.','使用规则引擎处理简单的文本格式转换,使用大模型处理复杂的语义理解任务.','根据不同的子任务需求,选择不同的模型类型和参数.'],exp:'Multi-Agent系统强调的是多个智能体（Agent）之间的协作与分工，每个智能体负责特定的任务或功能，通过协同工作来完成更复杂的任务。这种处理思想的核心在于任务的分解与模块化，以及不同智能体之间的有效交互。 现在我们来分析每个选项： A. 将文档的标题改写、表格单元格改写和语义分割都交给同一个大模型一次性完成。这种方式并没有体现出Multi-Agent的处理思想，因为它没有将任务分解给多个智能体，而是试图用一个模型完成所有任务。这不符合Multi-Agent系统的模块化与协作原则。 B. 使用DashScopeParse解析文档结构，再使用通义千问API润色文本。这种方式体现了Multi-Agent的思想，因为它将文档解析和文本润色两个任务分别交给了两个不同的工具（可以视为智能体）来完成。 C. 使用规则引擎处理简单的文本格式转换，使用大模型处理复杂的语义理解任务。这同样符合Multi-Agent的思想，因为它根据任务的复杂性和性质，选择了不同的处理工具（智能体）来完成。 D. 根据不同的子任务需求，选择不同的模型类型和参数。这也是Multi-Agent系统的一个典型特征，即根据任务需求动态选择和配置智能体。 综上所述，选项A不符合Multi-Agent的处理思想，因为它没有将任务分解给多个智能体进行协作处理。因此，正确答案是A。'},
  {id:242,type:'single',answer:'B',stem:'以下哪种文档切片方法能够更好地保持句子的完整性？',opts:['基于语义的切片,通过 markdown 文档结构进行','基于句子的切片','随机切片','基于语义的切片,通过嵌入模型计算语义断点','基于字符切片','基于固定 token 长度切片'],exp:'暂无解析'},
  {id:243,type:'single',answer:'D',stem:'以下哪段代码实现了模型训练过程中的损失函数计算？',opts:['for epoch in range (num_epochs) :','optimizer.zero_grad ()','with torch.no_grad () : correct +=(predicted ==labels).sum().item()','loss =F.nll_loss (output,target,reduction=\' sum\')'],exp:'在PyTorch框架中，损失函数计算是模型训练的核心步骤之一。`F.nll_loss`是PyTorch中用于计算负对数似然损失的函数，常见于分类任务。选项D直接调用该函数，传入模型输出（`output`）和真实标签（`target`），并指定损失求和方式（`reduction=\'sum\'`），符合损失计算的定义。选项A控制训练轮数，选项B处理梯度清零，选项C统计预测正确数，均不涉及损失值的计算。'},
  {id:244,type:'single',answer:'C',stem:'下面哪个 Python 库函数常用于计算F1 分数?',opts:['sklearn.metrics.recall_ score','sklearn.metrics.accuracy_score','sklearn.metrics.f1_score','sklearn.metrics.precision_score'],exp:'F1分数是分类任务中衡量模型精确率和召回率调和平均的指标。scikit-learn库的metrics模块提供了f1_score函数用于直接计算该值。选项A对应召回率，B对应准确率，D对应精确率，C选项名称明确对应F1分数计算。官方文档中metrics模块的函数命名直接关联各自指标。'},
  {id:245,type:'single',answer:'D',stem:'以下哪个提示词要素用于约束大模型的应答风格，使其符合特定人群的阅读习惯？',opts:['角色(Role)','输出格式(Output Fomat)','上下文(Context)','受众(Audience)'],exp:'题目询问哪个提示词要素用于约束大模型应答风格，使其符合特定人群阅读习惯。分析选项：A选项“角色（Role）”指设定模型扮演的角色，与应答风格关联不大；B选项“输出格式（Output Format）”指输出形式，如文本、表格等，与阅读习惯无关；C选项“上下文（Context）”指对话背景信息，不直接决定应答风格；D选项“受众（Audience）”指目标读者群体，通过设定受众，模型可调整应答语言、复杂度等，以符合特定人群阅读习惯。因此，D选项正确。'},
  {id:246,type:'single',answer:'B',stem:'在微调大语言模型的过程中，什么是用来衡量模型在每个训练批次上表现的一个标准？',opts:['准确率','训练时间','测试误差','损失函数'],exp:'在微调大型语言模型时，训练过程中每个批次的模型表现通常通过损失函数衡量。损失函数直接反映模型预测结果与真实标签之间的差异，其数值越小代表模型在该批次上的拟合效果越好。这一概念源自机器学习的基本训练机制，其中梯度下降等优化方法依赖损失函数计算参数更新方向。准确率主要用于评估模型整体分类性能，而非实时优化；训练时间则属于效率指标，与模型表现无直接关联。'},
