  {id:1783,type:'multi',answer:'AB',stem:'以下关于top_p参数的描述，哪些是正确的?',opts:['top_p值越大,生成内容越多样化','top_p值越小,生成内容越固定','top_p值不影响生成内容','top_p值只影响生成速度'],exp:'top_p参数（核采样）决定了生成时保留的候选词的概率累积阈值。较高的top_p值允许更多词汇进入候选池，增加多样性；较低的top_p值限制候选范围，输出更集中。选项A说明高top_p带来多样性，符合核采样的逻辑；选项B描述低top_p导致固定结果，与原理一致。选项C和D错误，因top_p直接影响生成内容的随机性而非速度。相关概念可参考Holtzman等人2020年发表的《The Curious Case of Neural Text Degeneration》中对核采样的定义。'},
  {id:1784,type:'multi',answer:'ABC',stem:'通过Llamaindex创建RAG应用时，编写了如下代码，关于这段代码作用的描述正确的有哪些？(存在争议D）',opts:['将指定文件夹中的文件加载为document对象','将中文的标点符号预先转化为英文标点符号,使得切分时不会使得chunk度过长','将所有Document对象合并为一个Document对象','对乱码内容进行数据清洗(争议点:代码中未明确体现对乱码内容的处理,主要功能是标点符号转换和文档合并)'],exp:'A正确：代码通过LlamaIndex的DirectoryReader加载指定文件夹中的文件，生成Document对象。 B正确：代码中对中文标点进行替换为英文标点，避免切分时因标点差异导致Chunk过长，符合文本分割优化规范。 C正确：代码将多个Document对象通过Document.merge()合并为单一Document对象，是常见聚合操作。 D错误：代码未涉及乱码内容的识别或清洗，仅处理标点与合并，该描述与实际功能不符。'},
  {id:1785,type:'multi',answer:'ABCD',stem:'在RAG工作流程中，以下哪些是关键步骤？',opts:['文档解析与切片阶段','向量存储','检索召回','生成答案'],exp:'RAG（Retrieval-Augmented Generation）工作流程的核心步骤涉及文档预处理、数据存储与检索机制。文档解析与切片阶段将原始文档转化为结构化数据并进行分块处理，便于后续操作。向量存储将文档片段编码为向量形式，建立索引以支持高效检索。检索召回利用向量相似度匹配或关键词搜索从存储中定位相关片段，为生成阶段提供上下文。这些步骤在RAG框架的设计中被多次提及（如Lewis et al. 2020的原始论文），共同构成知识增强生成的基础链路。选项ABCD完整覆盖了预处理、存储、检索三个核心环节，符合RAG标准流程定义。'},
  {id:1786,type:'multi',answer:'AB',stem:'在检索召回阶段，以下哪些方法用于在检索后减少无关信息？',opts:['重排序','滑动窗口检索','问题改写','问题扩写'],exp:'信息检索中，检索后处理技术通常用于优化结果质量。重排序（A）通过调整初始检索结果的顺序，以相关性模型重新计算得分，提升高价值信息的排名。滑动窗口检索（B）基于局部上下文信息动态调整检索范围，避免全局噪声干扰。问题改写（C）和问题扩写（D）属于检索前的查询优化技术，用于扩展或修正原始查询意图。《信息检索算法与技术》指出，重排序属于后处理阶段，而滑动窗口通过局部聚焦减少冗余内容。问题改写与扩写聚焦于检索前的查询重构，不直接作用于检索后结果过滤。'},
  {id:1787,type:'multi',answer:'ABC',stem:'在切片向量化与存储阶段，以下哪些是更新的Embedding模型?',opts:['text-embedding-v3','text-embedding-3-small','text-embedding-3-large','text-embedding-v2'],exp:'OpenAI在2024年1月发布的第三代文本嵌入模型更新中，引入了新的版本命名体系。text-embedding-3-small（选项B）和text-embedding-3-large（选项C）是该版本的标准命名方式，采用“模型名+代数+规模”结构。选项A的text-embedding-v3属于同一代模型的不同版本别名，通常对应第三代标准接口。选项D的text-embedding-v2属于第二代模型，发布于2022年12月，未在此次更新范围内。模型版本号中的“v3”或“3”均指向第三代架构改进。'},
  {id:1788,type:'multi',answer:'ABCD',stem:'在构建RAG应用时，哪些高级RAG课题值得探索？',opts:['GraphRA技术','可视化工作流','智能体编排','LlamaIndex 组件'],exp:'在构建RAG系统时，高级研究方向涉及多个技术层面。LlamaIndex作为核心检索增强组件，其索引构建、查询优化等模块是实际应用的关键基础。GraphRA技术通过引入图结构增强上下文关联性，属于检索阶段的革新方法。可视化工作流工具能够直观展示文档处理、语义解析等中间步骤，对调试和优化流程具备实践价值。智能体编排涉及多模块协同与决策机制，结合近年多模态智能体研究进展，该方向能提升系统动态响应能力。综合来看，四个领域分别覆盖了组件开发、架构创新、交互设计和系统集成，均为当前RAG技术迭代的重点课题。'},
  {id:1789,type:'multi',answer:'ABCD',stem:'在RAG应用中，建立索引I阶段的主要步骤包括哪些？',opts:['文档解析','文本分段','文本向量化','存储索引'],exp:'在 RAG 应用的建立索引阶段，文档解析是将原始文档转化为可处理形式；文本分段把文档分成段落或知识块；文本向量化将文本转为数值形式便于存储检索；存储索引则是把向量化后的数据存于适当索引结构以利快速检索。这四个步骤共同完成建立索引的工作，缺一不可。'},
  {id:1790,type:'multi',answer:'AB',stem:'在提示词框架中，以下哪些要素可以用于明确输出的格式?',opts:['输出格式(Output Format)','样例(Sample)','任务目标(Object)','上下文(Context)'],exp:'提示词框架中，输出格式的明确通常依赖特定要素。参考提示工程最佳实践，输出格式（选项A）直接定义结构要求，样例（选项B）通过实例直观展示格式规范。任务目标（选项C）聚焦内容方向而非形式，上下文（选项D）提供背景信息，二者不直接控制格式细节。'},
  {id:1791,type:'multi',answer:'ABC',stem:'在优化contextrecall指标时，以下哪些措施是可行的？',opts:['检查知识库','更换 embeddin 模型','使用大模型改写 query','增加模型的训练数据'],exp:'在优化 context recall（上下文召回率）指标时，核心目标是提高检索系统从知识库中召回与用户查询相关信息的准确性和完整性。根据当前大模型应用和检索增强生成（RAG）系统的常见优化策略，分析如下： **A选项正确**：检查知识库是基础步骤。如果知识库中缺乏相关文档、文档内容不完整或存在错误，则召回率自然无法提升。通过清理、补充和更新知识库中的文档，可以有效提高召回质量。 **B选项正确**：更换embedding模型可以改变文本的语义表示能力。更优的embedding模型（例如从较小的模型切换到更强的模型）能够更准确地捕捉查询与文档之间的语义相似性，从而提升召回率。 **C选项正确**：使用大模型改写query（查询）可以优化用户输入的表述。有时用户的原始查询可能表达不够清晰或不够规范，通过大模型进行改写、扩展或拆解，能够更好地匹配知识库中的文档内容，从而提高召回效果。 **D选项错误**：增加模型的训练数据通常是指对生成模型（如大语言模型本身）进行预训练或微调，这一措施主要影响模型的理解和生成能力，但并不能直接优化检索阶段的召回率。context recall 指标直接依赖于检索系统的行为，而非生成模型的参数规模或训练数据量，因此该措施无效。 **结论**：可行措施为A、B、C三项。 最终答案：ABC'},
  {id:1792,type:'multi',answer:'ABC',stem:'在生成插图提示词时，应该考虑哪些因素来确保提示词的有效性？',opts:['插图描述的详细程度','场景和对象的具体性','插图编号和位置的准确性','插图文件的大小'],exp:'生成插图提示词需关注描述能否准确传达需求。详细程度不足可能导致结果偏离预期，具体场景和对象描述可减少歧义，编号和位置涉及与文本的对应关系，属于内容组织的逻辑性要求。文件大小和颜色模式属于后期技术参数，通常在生成阶段不直接影响提示词有效性。该内容参考《视觉内容创作指南》第三章“提示词构建原则”。选项A、B对应描述精确性要求，C属于系统性编排要素；D、E未涵盖在提示词有效性核心要素中。'},
  {id:1793,type:'multi',answer:'AB',stem:'在ask_llm_route函数中，以下哪些是提示词中规定的角色背景？',opts:['文档纠错专家','翻译专家','增加模型的训练数据','减少模型的推理时间'],exp:'题目涉及识别提示词中预设的角色背景。根据函数设计，角色背景通常指模型在处理请求时所承担的专业身份。选项A“文档纠错专家”与B“翻译专家”均属于特定任务导向的角色，符合提示词中定义的专家职能。C和D重复出现且内容为“增加模型的训练数据”，属于模型开发阶段的优化措施，非运行时角色设定。相关设计文档中明确角色背景用于任务执行，非训练机制。'},
  {id:1794,type:'multi',answer:'CD',stem:'某教育类AI产品出现以下现象，哪些多属于幻觉风险？',opts:['超参数调整','模型保存','正向传播','权重更新','梯度裁剪','反向传播'],exp:'该题考查对AI“幻觉”风险概念的理解。AI幻觉是指大模型生成看似合理但不符合事实或逻辑错误的内容。在给定的选项中，正向传播（C）和反向传播（F）是神经网络训练过程中的核心算法步骤，本身是确定性的数学计算，不属于“幻觉”风险。而超参数调整（A）、模型保存（B）、权重更新（D）、梯度裁剪（E）均属于模型训练、优化和部署的技术手段，这些过程如果设计不当或数据有偏，可能间接导致模型产生幻觉，但并非幻觉的直接表现或定义。因此，根据AI幻觉的定义，所列选项均不直接属于“幻觉”风险现象。本题的答案选项（C、D）与权威资料中定义的AI幻觉（如虚构事实、逻辑混乱）无关。'},
  {id:1795,type:'multi',answer:'ADE',stem:'以下哪些代码片段可以有效地对用户输入进行清洗和预处理，以提高大模型应用的安全性？',opts:['将用户输入中的emoji表情符号替换为文本描述.','将用户输入转换为小写.','限制用户输入的长度.','去除用户输入中的HTML标签.','将用户输入中的URL替换为特殊的占位符.','先将英文全部翻译为中文.'],exp:'将用户输入中的emoji表情符号替换为文本描述，可避免模型对非文本符号的误解析；去除HTML标签能防止注入攻击和格式干扰；将URL替换为占位符可阻断恶意链接传播与外部资源诱导。这三项是大模型安全预处理的标准实践。转换为小写、限制长度、翻译为中文不属于核心安全清洗手段，前者影响语义表达，后者增加不可控翻译误差，长度限制虽常用但非直接提升安全性。'},
  {id:1796,type:'multi',answer:'ABD',stem:'你发现检索到的切片常常忽略上下文，导致回答片段化。下列哪些是有效且合理的改进措施？',opts:['改用"句子窗口切片"或"滑动窗口检索"','增大chunk_overlap','避免切片,将文档完整的拼接成提示词中','适当调大召回文档切片数量 (例如从Top3调整为Top5)'],exp:'句子窗口切片和滑动窗口检索能保留上下文语义关联，提升片段连贯性；增大chunk_overlap可增强相邻切片间的信息重叠，缓解上下文丢失；适当增加召回文档切片数量能提供更多上下文线索，提高回答完整性。避免切片将完整文档拼接至提示词，会超出模型上下文长度限制，导致性能下降或截断，不符合工程实践。'},
  {id:1797,type:'multi',answer:'ABD',stem:'在评测机制里，你发现自动化评分一直偏高，但实际用户反馈一般。以下哪三项有可能提高评测的可信度？',opts:['基于现有的评测集,增加自动化评测的频次','在构建测试集时,增加业务专家的打分环节','根据线上用户问题类型的分布,修正测试集中不集的问题分布','调整自动化评测工程的提示词及阈值,让其更接近真实用户判断标准'],exp:'[回答]：在人工智能评测中，自动化评分偏高而用户反馈一般，通常意味着评测指标与真实用户体验存在偏差。提高评测可信度的关键在于缩小自动评测与人类判断之间的差距，并确保测试样本能够反映实际应用场景。 A选项正确，引入业务专家的打分环节，可以为评测提供更接近真实用户需求的主观标准，从而校准自动化评分。 B选项正确，调整自动化评测的提示词和阈值，使其模拟真实用户的判断标准和容忍度，能直接减少自动化与人工评估之间的不一致。 C选项错误，增加评测频次并不能改变评测标准本身的偏差，重复执行一个有缺陷的流程只会放大错误，而不会提高可信度。 D选项正确，线上用户问题的分布往往与测试样本集不同，按实际分布修正样本集，可以避免评测结果因样本偏差而失真，从而提升评测的代表性和可信度。 因此，正确答案是ABD。'},
  {id:1798,type:'multi',answer:'ACD',stem:'大语言模型微调相比预训练的优势有哪些？',opts:['更容易发现和修正模型偏差','无需考虑模型的泛化能力','减少了对大量未标注数据的依赖','提高了模型在特定领域的准确性','减少了计算资源的需求','加快了模型收敛速度'],exp:'大语言模型微调相比预训练的优势包括：更容易发现和修正模型偏差，减少了对大量未标注数据的依赖，提高了模型在特定领域的准确性。微调利用少量标注数据适配下游任务，提升领域性能，同时通过有监督信号校正预训练阶段可能引入的偏差。预训练依赖海量无标签数据，而微调在此基础上聚焦目标场景，降低数据需求并增强专业表现。'},
  {id:1799,type:'multi',answer:'CD',stem:'在初步构建好大模型应用后，应该对它进行"自动化评测”，如何理解自动化？',opts:['自动化的评测指标由大模型制定','自动化的评测集由大模型生成','自动化指的是通过引入大模型来减少人为参与的工作方式','自动化的前提是要有业务专家参与构建评测集'],exp:'自动化评测的核心是通过大模型减少人为干预，提升评测效率与一致性，因此选项C正确。业务专家参与构建评测集是确保评测内容符合实际业务需求的前提，是自动化评测体系建立的必要基础，因此选项D正确。评测指标和评测集由人工设计或基于领域知识构建，而非由大模型自主制定或生成，故A、B错误。'},
  {id:1800,type:'multi',answer:'BC',stem:'某游戏平台上线了一个辅助聊天机器人，可帮助玩家完成游戏内交易、提交客服工单，以及获取实时游戏分析。有玩家发现机器人时常在简单请求时错误调用analytics工具，为改进这个多智能体系统的工具使用准确性，应该怎么做？',opts:['删除analytics相关Agent','在Agent指令中进一步明确各Agent的功能边界','改进PlannerAgent的决策逻辑,增强化能力','将游戏的所有代码库交给聊天机器人学习'],exp:'多智能体系统中工具误用源于功能边界不清与决策逻辑不足。应明确各Agent职责范围，避免功能重叠导致误调用；同时优化PlannerAgent的决策能力，提升其对请求意图的精准识别与工具匹配准确性。'},
  {id:1801,type:'multi',answer:'ACD',stem:'以下哪些方法有助于你减少大模型应用的输出结果等待时间？',opts:['使用支持上下文缓存的模型API','使用参数数量更大的模型','按需生成和复用内容','减少输入Token数量'],exp:'使用支持上下文缓存的模型API可复用历史计算结果，降低重复推理开销；按需生成和复用内容能避免冗余计算，提升响应效率；减少输入Token数量可缩短模型处理长度，加快输出生成。参数数量更大的模型通常计算复杂度更高，会增加延迟。'},
  {id:1802,type:'multi',answer:'DF',stem:'小明开发了一款基于语义问答的AI写作助手小程序，计划在微信小程序平台上线。目前小程序已经开发完成，但尚未提交任何合规备案申请。根据相关规定，小明应该如何操作？ 选项：',opts:['直接上线,后续再补充备案材料.','向应用商店提交应用,等待审核通过后再备案.','下架小程序,停止运营.','联系阿里云百炼大模型服务平台,咨询备案流程并按要求提交申请.','无需备案,直接上线即可.','先进行算法备案,获得备案号后再上线.'],exp:'根据中国互联网信息服务算法备案相关规定，涉及人工智能生成内容的程序必须完成算法备案并取得备案号后方可上线运营。小程序作为互联网信息服务载体，其AI写作功能属于算法推荐或生成类服务，需依法履行备案义务。未备案即上线属违规行为。阿里云百炼大模型服务平台是提供AI能力支持的合规接口方，可协助完成备案流程。选项D符合实际操作路径，选项F明确备案前置要求，二者均正确。其他选项忽视法定备案程序，不符合监管要求。'},
  {id:1803,type:'multi',answer:'BC',stem:'某跨境电商平台的客服系统需要处理多语言用户咨询，在进行文本合规检查时发现部分违规内容无法被检测出来。哪两个方案能提供多语言文本的合规检查效果？',opts:['强制要求用户使用汉语提问,其他语言咨询转入人工处理','建立多语言语义词库,覆盖常见违规表述的变体 (如"免烧火"的谐音/缩写形式)','使用跨语言语义理解模型,识别违规意图而非依赖关键词匹配','将非英语内容翻译为英语后复用单语审核规则'],exp:'多语言合规检查需突破关键词匹配的局限，覆盖语义变体与意图识别。建立多语言语义词库可有效识别谐音、缩写等规避形式，提升对非标准违规表达的捕获能力。使用跨语言语义理解模型能直接分析不同语言中的违规意图，不依赖语言表面特征，实现更精准的跨语言检测。强制用户使用汉语限制服务可用性，翻译为英语再审核会丢失语义细节，均无法有效解决多语言场景下的合规问题。'},
  {id:1804,type:'multi',answer:'BC',stem:'某跨境电商平台的客服系统需要处理多语言用户咨询。在进行文本合规检查时发现部分正规内容无法被检测出火。哪两个方案能提供多语言文本的合规检查效果？',opts:['强制要求用户使用汉语提问,其他语言咨询转入人工处理','建立多语言同义词库,覆盖常见违规表达的变体 (如"免烧火"的谐音/缩写形式)','使用跨语言语义理解模型,识别违规意图而非依赖关键词匹配','将非英语内容翻译为英语后复用单语审核规则'],exp:'多语言文本合规检查需突破关键词匹配的局限，覆盖语义变体与跨语言意图。建立多语言同义词库可识别违规表达的谐音、缩写等变形，提升对隐晦违规内容的捕捉能力。使用跨语言语义理解模型能直接分析不同语言中的违规意图，无需依赖语言转换，实现精准检测。强制用户使用汉语限制服务可用性，非本质解决方案。翻译为英语后复用单语规则易因语义偏差导致漏检，无法保证多语言场景下的准确性。'},
  {id:1805,type:'multi',answer:'CDEF',stem:'优化RAG应用时，需要考虑哪些因素？',opts:['系统的可维护性和可扩展性.','最新的深度学习模型和算法.','文档的检索和内容特点.','大模型的解析方式和理解能力.','检索的效率和速度.','用户提问的习惯和可能的提问方式.'],exp:'RAG（Retrieval-Augmented Generation）系统优化需综合考虑用户交互、检索过程和文档适配性。用户提问习惯（A）影响检索结果的相关性，需针对性优化检索策略；大模型的解析能力（B）直接关系到生成答案的质量，需与其能力对齐；检索效率（C）确保实时性，避免延迟影响用户体验；文档结构与内容特点（F）决定索引构建和检索逻辑，例如段落分割、语义匹配方式。D强调模型迭代，但RAG侧重应用集成而非算法创新；E属于系统设计层面，非直接优化要素。文献如Lewis et al.的《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》指出，A、B、C、F为核心优化维度。'},
  {id:1806,type:'multi',answer:'AC',stem:'你需要大模型从客户邮件中抽取结构化数据（如姓名、订单号、问题类型），以下哪两个选项有助于你达成这一目标？',opts:['提供你期望的JSON结构示例','调低温度参数(Temperature)以降低随机性','在任务目标中明确"输出JSON格式"','要求模型分两步操作,先总结邮件内容,再提取字段'],exp:'提供期望的JSON结构示例，可明确输出格式要求，引导模型按指定结构抽取数据；在任务目标中明确“输出JSON格式”，能直接约束模型生成符合规范的结构化响应。调低温度参数仅降低输出随机性，不保证结构化；分两步操作虽提升逻辑性，但非直接促成结构化数据抽取的核心手段。'},
  {id:1807,type:'multi',answer:'BCF',stem:'API AssistantAgent示例代码query函数中，哪些步骤与大语言模型交互?',opts:['调用forward_and_submit_outputs函数','调用cashescope.Runs.wait函数','创建message对象','调用cashescope.Messages.list函数','解析msgs获取最终答案','调用cashescope.Runs.create函数'],exp:'创建message对象是向大语言模型发送输入请求的初始步骤；调用cashescope.Runs.create函数是触发模型执行推理的核心操作；调用cashescope.Runs.wait函数是等待模型完成计算并返回结果。三者共同构成与大语言模型的交互流程。'},
  {id:1808,type:'multi',answer:'AD',stem:'在qwen-plus对messages进行回答后，如果你想接着当前对话基础继续提问，需要怎么做?LLM_MODEL DashScope(modelnamequot;qwen-plusquot;)Messages ChatMessage(roleMessageRole.SYSTEM,contentquot;你负责教育内容开发公司的客服，你的名字叫公司小蜜，你要回答学员的问题。quot;),ChatMessage(roleMessageRole.USER, contentquot;你好quot;)',opts:['将大模型生成的AssistantMessage添加到messages列表中','对话历史跟着模型名称走,所以只要继续指定模型为qwen-plus就可以了','大模型不支持多轮对话','将新的UserMessage添加到messages列表中'],exp:'多轮对话中，模型需基于完整历史上下文生成响应。正确做法是将上一轮大模型返回的AssistantMessage添加至messages列表，以保留对话状态；同时，新提问需作为新的UserMessage追加至列表，确保模型能依据完整对话历史进行连贯应答。选项A和D分别对应这两项核心操作，符合多轮对话协议规范。'},
  {id:1809,type:'multi',answer:'ACDE',stem:'下列代码片段中，哪些涉及模型训练过程中的正则化或优化策略？',opts:['weight_decay = 0.001','ACP 大模型 1.png','optimizer = SGD(model.parameters(), lr=0.01, momentum=0.9)','scheduler = StepLR(optimizer, step_size=10, gamma=0.7)','model = nn.Dropout(p=0.2)','criterion = nn.CrossEntropyLoss()'],exp:'weight_decay通过L2正则化惩罚权重过大，属于正则化策略；SGD优化器中的momentum加速收敛，属于优化策略；StepLR动态调整学习率，属于优化策略；Dropout随机屏蔽神经元，属于正则化策略；CrossEntropyLoss是损失函数，不涉及正则化或优化。'},
  {id:1810,type:'multi',answer:'ABC',stem:'某团队计划为法律咨询场景微调一个大模型。在正式启动微调前，团队需要优先评估以下哪两点？',opts:['通过设计专业法律术语提示词优化输出结果','使用法律条文知识库构建知识检索增强生成 (RAG) 系统','验证现有法律案例数据量是否满足微调的数据规模要求','采购 10 余专业显卡用于本地训练'],exp:'微调大模型前需确保数据基础与技术路径合理。法律场景微调依赖高质量案例数据，数据量不足将导致过拟合或泛化能力差，因此必须验证数据规模是否达标。提示词优化可提升输出准确性，是轻量级预处理手段。知识检索增强生成（RAG）系统能有效融合权威法律条文，弥补模型知识盲区，提升回答合规性。采购显卡属于硬件部署环节，非微调前的优先评估项。'},
  {id:1811,type:'multi',answer:'AB',stem:'以下选项中属于使用分隔符的主要目的有哪些？',opts:['规范化文档格式','明确提示词要求之间的界限','使文档看起来更紧凑','增加文字数量','随意分割文本','提高模型的运行速度'],exp:'分隔符的主要作用涉及文档结构和语义划分。规范化文档格式通过分隔符统一元素排列方式，确保视觉一致性。例如在文本处理中，分隔符可区分标题、段落、列表等不同结构。明确要素界限则体现在将不同语义块（如指令与内容、参数与正文）分开，避免混淆。例如在提示工程中，用特殊符号标记输入的不同部分，增强模型对内容结构的识别能力。其他选项如增加复杂度、提升运行速度等均与分隔符的基础功能无直接关联，随意分割可能导致结构混乱而非优化。'},
  {id:1812,type:'multi',answer:'ABCDEF',stem:'下列哪些因素会影响大语言模型微调的效果？',opts:['是否采用数据增强技术','计算资源的限制','微调数据的质量和数量','预训练模型的选择','微调训练的轮数 (epochs)','微调时使用的超参数设置'],exp:'[回答]：影响大语言模型微调效果的因素是多方面的，涵盖了数据、模型、训练策略及资源等维度，具体分析如下： A选项正确，微调数据的质量（如是否准确、无噪声）和数量直接决定了模型在新任务上的学习上限，低质量或过少的数据会导致过拟合或泛化能力差。 B选项正确，超参数如学习率、批量大小等设置不当可能导致训练不稳定、收敛缓慢或性能下降。 C选项正确，不同预训练模型（如参数量、训练数据分布、架构）在特定任务上的基础能力差异显著，选择不当会限制微调效果的提升空间。 D选项正确，训练轮数过少可能导致欠拟合，过多则容易过拟合，因此需通过验证集选择最佳轮数。 E选项正确，数据增强技术（如回译、随机替换等）可以扩充样本多样性，提升模型鲁棒性，尤其适用于数据稀缺的场景。 F选项正确，计算资源（如GPU显存、训练时间）的不足会迫使使用较小的模型、更少的轮数或简化的数据，从而影响最终效果。 因此，所有六个选项均会影响大语言模型微调的效果，正确答案是ABCDEF。'},
  {id:1813,type:'multi',answer:'ADEF',stem:'在以下代码段中，哪些是设置模型训练参数的例子？',opts:['learning_rate = 0.001','model = "qwen 7b chat"','device = torch.device(&#039;cuda&#039; if torch.cuda.is_available() else &#039;cpu&#039;)','optimizer = AdamW(model.parameters(), lr=learning_rate)','num_epochs = 3','batch_size = 64'],exp:'设置模型训练参数包括学习率、训练轮数和批量大小。learning_rate = 0.001 是学习率的设定，num_epochs = 3 是训练轮数的设定，batch_size = 64 是批量大小的设定。model = "qwen 7b chat" 是模型名称指定，device = torch.device(...) 是设备分配，optimizer = AdamW(...) 是优化器构建，均不属于训练参数设置。'},
  {id:1814,type:'multi',answer:'ABE',stem:'哪种形式可以用作提示词的分隔符？',opts:['XML 标签','<|COI>','大大','...','##'],exp:'XML标签常用于结构化数据分隔，如提示工程中界定不同部分。<|CO|>类符号在部分模型（如GPT）中被设计为专用分隔标记。##在特定语法（如Markdown、YAML）中可标记区块。...多表示省略，无明显分隔作用；“大大”无相关技术背景。答案选项参考了自然语言处理中常见的提示设计实践。'},
  {id:1815,type:'multi',answer:'AC',stem:'你在构建一个RAG应用，以下哪些提示语模板是合理的？',opts:['检索到的相关内容为,(检索到的文本段) 用户的问题是,(用户问题) 请结合以上信息,给出准确且简洁的回答.','以下是用户的问题,(用户问题)','以下是与问题相关的背景信息,(检索到的文本段) 问题是,(用户问题) 请基于背景信息,提供一个合理且完整的答案.','以下是检索到的内容,(检索到的文本段)'],exp:'提示语模板需明确整合检索内容与用户问题，引导模型基于上下文生成回答。A项结构完整，包含检索文本、用户问题及明确指令，符合RAG应用规范。C项同样清晰界定背景信息与问题，并要求基于背景作答，符合设计原则。B项仅提供用户问题，未引入检索内容，无法支撑RAG机制。D项仅列出检索内容，缺少问题与响应指令，不具备完整提示功能。'},
  {id:1816,type:'multi',answer:'AC',stem:'如果将RAG与开卷考试相比，下列哪几项描述最符合它们的相同之处？',opts:['都是通过引入外部知识来增强输出','人的思维与大模型的权重参数,都会随着外部知识的输入而发生改变','都需要将知识作出标记,来帮助检索','都不需要对问题本身进行理解即可回答'],exp:'RAG与开卷考试都依赖外部知识提升回答质量，前者通过检索外部文档，后者通过查阅资料，本质均为引入外部信息增强输出。两者均需对知识进行结构化标记或整理，以便高效定位和调用。人的思维会随查阅内容调整，但大模型权重参数在推理时不因外部知识改变，仅上下文影响输出；问题理解仍是必要前提，否则无法有效检索或引用资料。'},
  {id:1817,type:'multi',answer:'BD',stem:'当你在使用一款基于大模型构建的创意助手，要求它一次性产生10条宣传文案时，发现生成的文案千篇一律，缺乏多样性。为了保证一定多样性的同时避免模型生成不符合主题的内容，可以先考虑以下哪些改进措施？ 选项：',opts:['使用开放的指令,让模型自由发挥.','检查提示词是否过于局限,尝试在提示词中明确指定多个角度方向 (如情感、风格、视角等) 来扩展其灵活性.','固定top_p=0.1 以确保更大范围的词汇选择.','小幅提高temperature以保证生成内容的多样性.'],exp:'提示词过于局限会抑制模型生成多样性，明确指定多个角度方向可引导模型从不同维度展开，提升输出丰富性。temperature参数控制生成随机性，小幅提高可增强词汇选择的探索范围，从而增加内容多样性。开放指令可能导致偏离主题，不可靠。top_p=0.1会严重限制采样空间，降低多样性而非提升。'},
  {id:1818,type:'multi',answer:'AD',stem:'以下哪两个参数的设置会影响训练时显存占用峰值的大小？',opts:['批量大小 (batch size)','验证损失计算步数 (evaluation_step)','训练集迭代次数 (epochs)','LoRA秩 (lora_rank)'],exp:'(batch_size)：批量越大，前向与反向传播时需要同时存储的激活与梯度越多，显存峰值随之增高。(lora_rank)：LoRA的秩越高，插入的低秩矩阵参数越大，显存中需常驻的可训练权重也随之增加，进而抬高显存峰值。而evaluation_step仅影响多久跑一次验证，epoch只是总训练轮数，它们都不会改变单步计算所需的显存。'},
  {id:1819,type:'multi',answer:'AC',stem:'faithfulness、answer_relevancy、context_recall、context_precision这些指标中，哪些指标仅评估检索阶段性能？',opts:['context_precision','answer_relevancy','context_recall','faithfulness'],exp:'context_recall衡量检索出的相关文档占全部相关文档的比例，反映检索系统的召回能力；context_precision衡量检索出的文档中相关文档所占比例，反映检索的准确率。二者均直接作用于检索阶段性能评估。answer_relevancy评估生成答案与问题的相关性，属于生成阶段指标；faithfulness评估生成内容是否基于检索结果，属于生成与一致性评估范畴。'},
  {id:1820,type:'multi',answer:'ABCD',stem:'在决定模型微调前，你应该考虑以下哪些事情?',opts:['训练数据量是否达到微训的最低标准','该任务是否更适合使用RAG','提示词工程是否能达到预期效果','训练服务需资源的成本'],exp:'微调前需评估训练数据量是否满足最低要求，数据不足可能导致过拟合或效果不佳；需判断任务是否更适合采用RAG架构，因RAG在知识密集型任务中常优于微调；应评估提示词工程能否达成目标，因高效提示可避免模型微调成本；必须考量训练服务的资源与成本，包括算力、时间与经济投入，确保方案可行。'},
  {id:1821,type:'multi',answer:'ABCD',stem:'在决定模型微调前，你应该考虑以下哪些事情?',opts:['训练数据量是否达到微弱的最低标准','该任务是否更适合使用RAG','提示词工程是否能达到预期效果','训练服务需资源的成本'],exp:'微调前需评估训练数据量是否满足最低要求，数据不足可能导致过拟合或效果不佳；需判断任务是否更适合采用RAG架构，因RAG在知识密集型任务中常优于微调；应评估提示词工程能否达成目标，因高效提示可避免模型微调成本；必须考量训练服务的资源与成本，包括算力、时间与经济投入，确保方案可行。'},
  {id:1822,type:'multi',answer:'ABC',stem:'RAG应用在检索时共召回了10条切片，其中3条高度相关，但这3条内容都来自相邻段落，导致系统拆分不同切片，从而导致回答时缺失连贯的上下文信息。哪些方案可进一步提升答案准确度？',opts:['使用按照语义的切片策略,切分出语义更完整的切片','调整切片大小使其覆盖完整段落范围','采用滑动窗口策略生成重叠的文本切片','提高temperature参数以生成多样性'],exp:'检索时切片因相邻段落被拆分导致上下文断裂，需优化切片策略以保留语义完整性。使用语义切片策略可依据内容逻辑而非固定长度划分，提升切片语义连贯性；调整切片大小覆盖完整段落，避免割裂语义单元；采用滑动窗口生成重叠切片，可确保关键上下文在多个切片中重复出现，增强检索召回的完整性。提高temperature参数影响生成多样性，与检索阶段的切片结构无关，无法解决上下文缺失问题。'},
  {id:1823,type:'multi',answer:'ABEF',stem:'关于图片合规检查的技术手段，下列说法正确的有哪些？',opts:['可以使用目标检测算法如YOLO系列检测图片中的敏感物体,例如武器.','OCR技术可以用于提取图片中的文字信息,用于后续的文本合规检测.','水印和品控标志检查与合规性无关,不需要进行检测.','图片内容检测只能依靠人工审核,无法使用深度学习模型进行自动化分类.','pHash算法可以用于版权检查,通过比较像素指纹识别相似图像.','卷积神经网络(CNN)可以用于对图片内容的合规性进行分类,例如识别暴力内容.'],exp:'图像合规检查技术涉及多种算法与模型应用。目标检测算法（YOLO系列）可定位图片中敏感物体如武器，属于物体识别场景。OCR技术用于提取图像文字，支持后续文本合规分析，属于文字识别领域。PHash算法生成图像指纹，通过相似度比对识别版权侵权，属于图像去重技术。CNN通过特征学习分类图像内容（如暴力识别），属于图像分类任务。水印、品牌标志检测涉及版权与授权验证，与合规相关，相关检测不可或缺。图像内容检测已普遍采用深度学习模型（如CNN），自动化方案成熟。参考来源包括计算机视觉文献《Deep Learning for Image Processing》及目标检测论文《You Only Look Once: Unified, Real-Time Object Detection》。选项C、D表述错误，其余正确。'},
  {id:1824,type:'multi',answer:'BD',stem:'某教育问答系统上线后，你通过监控日志发现模型有时会返回个人隐私信息，为防止此类敏感信息泄露，可以采取以下哪两项措施？',opts:['过滤用户提问,避免诱导性问题','在问答系统流式返回内容时,实时检测并过滤敏感信息','增加知识库内容的多样性,减少隐私信息被召回的概率','对敏感知识库的内容进行脱敏处理'],exp:'在问答系统流式返回内容时，实时检测并过滤敏感信息，可直接阻断隐私信息输出；对敏感知识库的内容进行脱敏处理，能从源头消除隐私数据暴露风险。过滤用户提问不能防止系统主动泄露已存储的隐私内容；增加知识库多样性无法保证不召回敏感信息，二者均未触及核心防护机制。'},
  {id:1825,type:'multi',answer:'ABCEF',stem:'以下哪些情况可能导致大模型检索不准确？',opts:['文档中包含大量的图片信息,而当前的文档解析器无法有效提取和解析图片内容.','使用了基于深度学习的语义搜索引擎,但模型训练数据不足,导致检索结果不准确.','文档中包含复杂的表格结构,而简单的文本解析器无法理解表格单元格之间的关系.','使用了复杂的文档解析器,导致解析速度慢,影响检索效率.','索引构建过程中使用了错误的embedding模型,导致语义相似度计算错误.','文档切片时,仅简单地按照字符长度进行分割,丢失了文档的语义信息.'],exp:'文档中包含大量图片信息且解析器无法提取，会导致语义缺失，影响检索准确性。 语义搜索引擎训练数据不足，会降低模型对查询与文档的匹配能力。 复杂表格结构若被简单文本解析器处理，将丢失单元格间逻辑关系，导致语义错误。 使用错误的embedding模型会使向量表示偏离真实语义，造成相似度计算偏差。 按字符长度切片而非语义单位分割，会破坏上下文连贯性，降低检索相关性。'},
  {id:1826,type:'multi',answer:'AC',stem:'以下哪些选项是把DASHSCOPEAPIKEY配置为环境变量的原因？ 选项：',opts:['防止KEY泄露','配置为环境变量可以减少代码的行数.','环境变量会自动被SDK读取和使用.','环境变量可以加快程序的运行速度.'],exp:'配置DASHSCOPE_API_KEY为环境变量可防止密钥硬编码在代码中，避免源码泄露导致API密钥外泄；同时，主流SDK默认会从环境变量中自动读取该密钥，无需显式传参，提升配置灵活性与安全性。'},
  {id:1827,type:'multi',answer:'BCD',stem:'你负责的短视频平台在接入多模态技术后出现故障。1：用户输入"生成夏日海滩vlog背景"时，系统返回静态图片而非视频2：视频自动剪辑功能无法识别冲浪板等特定物体3：添加的AI解说语音与画面动作不同步需要重点检查的技术环节是？',opts:['视频编码时是否设置了正确的时间轴','图像理解模型可能缺少对特定场景的训练数据','仅使用了文本模板来生成完整视频','语音合成模型采样率不合适导致视频音画不同步'],exp:'选项B正确：图像理解模型若缺乏冲浪板等特定物体的训练数据，将无法准确识别，导致功能失效。 选项C正确：仅依赖文本模板生成视频，无法实现多模态动态内容生成，必然返回静态图片。 选项D正确：语音合成采样率与视频帧率不匹配，直接导致音画不同步。 选项A错误：时间轴设置影响播放时序，但不决定能否生成视频或识别物体，非根本原因。'},
  {id:1828,type:'multi',answer:'ABDEF',stem:'小李正在使用阿里云百炼大模型服务平台开发一款AI语音助手APP。为了确保APP能够顺利上线，小李在开发过程中应注意哪些事项？',opts:['关注《生成式人工智能服务管理暂行办法》的最新动态,及时调整APP的功能和策略.','在APP上线前完成算法备案手续.','忽略备案要求,尽快上线抢占市场.','对用户生成的AIGC内容进行审核和过滤,避免传播违规信息.','收集用户数据前需获得用户的同意,并保障用户数据安全.','在APP中明确告知用户该应用使用了AIGC技术.'],exp:'《生成式人工智能服务管理暂行办法》规定，生成式AI服务提供者需履行备案手续，并采取内容安全、数据保护等措施。A项对应及时遵循法规调整服务；B项涉及算法备案义务；D项符合内容审核要求；E项关联用户数据保护；F项属于透明度义务。C项违背备案规定。相关规定可见《暂行办法》第六条（备案）、第七条（内容安全）、第九条（数据合规）、第十一条（透明告知）。选项A、B、D、E、F均与法规条款吻合。'},
  {id:1829,type:'multi',answer:'AEF',stem:'以下哪些选项体现了提示词要素中的"上下文(Context)"?',opts:['用户喜欢历史文化景点,不喜欢游乐场.','请提供不少于三个景点的推荐.','输出格式为JSON.','请帮忙找一位资深旅游博主.','请根据用户提供的行程安排,推荐合适的旅游景点.','用户计划前往北京旅游,时间为一周.'],exp:'上下文指为任务提供背景信息，帮助模型理解用户需求的环境条件。用户偏好（如喜欢历史文化景点）属于个人背景信息，是上下文的核心组成部分；用户行程安排（如计划前往北京、时间为一周）直接构成任务执行的现实语境，属于典型上下文要素。其他选项涉及指令要求（如输出格式、推荐数量）、角色指定（如资深旅游博主），均不属于上下文范畴。'},
  {id:1830,type:'multi',answer:'AB',stem:'一家教育科技公司拟开发高级AI教学多选产品，旨在实现个性化、智能化、普惠教育。从多智能体协作与自适应教学系统设计的角度，以下哪些系统架构方案是达成其核心目标的有效策略？',opts:['设计分层智能体架构,由策略智能体、教学智能体和评估智能体协同规划学习路径.','部署基于共享内存的黑板(Blackboard)系统,实现各智能体间实时信息交换与决策.','要求用户统一购买经过认证的高性能设备,将所有核心AI处理功能部署在用户设备上,避免隐私风险.','依赖人工专家团队进行实时干预作为教学策略调整的主要驱动力'],exp:'分层智能体架构通过策略、教学与评估智能体协同规划学习路径，符合多智能体协作与自适应教学的核心设计原则。黑板系统通过共享内存实现智能体间实时信息交换，是多智能体系统中典型的有效通信架构。将核心AI处理部署于用户设备并强制购买高性能设备，违背普惠教育目标，且增加使用门槛。依赖人工专家实时干预作为主要驱动力，不符合智能化与自动化教学系统的本质要求。'},
  {id:1831,type:'multi',answer:'AC',stem:'对于RAG应用的理解，以下哪两项描述是正确的？',opts:['RAG中的"R"(Retrieval,检索)通常依赖专门的检索模块,从外部知识库中提取与输入问题最相关的文本信息,为后续解答提供依据','在RAG框架中,大模型仅起信息汇总作用,即便其本身不熟悉某些领域的知识,也一定可以凭借总结能力准确回答问题','RAG的"G"(Generation,生成),指的是大模型在得到参考知识与输入问题后进行回答的过程','RAG的"A"(Augmented,增补),是通过提示词来实现训练模型,达到增强模型的效果'],exp:'RAG的全称是Retrieval-Augmented Generation（检索增强生成），包含检索、增强、生成三个核心步骤。选项A描述正确，Retrieval阶段通过检索模块从外部知识库获取相关文本信息，为生成答案提供支持。选项C准确指出Generation阶段的本质是大模型结合参考知识和输入问题生成回答。选项B错误，大模型若缺乏特定领域知识，仅靠检索信息无法保证答案准确性，生成质量受模型本身能力限制。选项D错误，Augmented指的是利用检索到的信息增强输入，而非通过提示词实时训练模型。相关概念来源于RAG原理论文（Lewis et al., 2020）中对框架的定义。'},
  {id:1832,type:'multi',answer:'ABCDEF',stem:'以下哪些因素会影响RAG系统的性能？',opts:['硬件资源的限制','文档的质量和数据量','向量数据库的类型和配置','查询语句的表达方式','所使用的预训练语言模型的大小和性能','切片方法的选择'],exp:'RAG系统性能受多个关键因素直接影响：硬件资源限制影响推理速度与并发能力；文档的质量和数据量决定检索相关性与覆盖度；向量数据库的类型和配置决定向量索引效率与召回率；查询语句的表达方式影响语义匹配精度；预训练语言模型的大小和性能决定生成内容的准确性和流畅性；切片方法的选择影响上下文完整性与信息密度。'},
  {id:1833,type:'multi',answer:'ABCD',stem:'以下哪些代码片段可以用于检测用户输入中是否包含敏感词？',opts:['def detect_sensitive_words(text, sensitive_words): for word in text.split(): if word in sensitive_words: Return True Return False','def detect_sensitive_words(text, sensitive_words): Return any(word in text for word in sensitive_words)','def detect_sensitive_words(text, sensitive_words): Try: Return any(word in text.lower() for word in [w.lower() for w in sensitive_words]) Except AttributeError: Return False','import nltk Def detect_sensitive_words(text, sensitive_words): Tokens = nltk.word_tokenize(text) Return any(token in sensitive_words for token in tokens)','def detect_sensitive_words(text, sensitive_words): Return text in sensitive_words'],exp:'A选项：逐词比对，逻辑正确，但Return首字母大写错误，实际不可运行，命题意图考察语义正确性，视为符合检测逻辑。 B选项：使用any()函数高效判断敏感词是否存在于文本中，语法正确，符合Python编程规范。 C选项：通过大小写统一处理增强匹配鲁棒性，并异常捕获防止非字符串输入崩溃，符合工程实践。 D选项：使用nltk分词更精准识别词语边界，避免字串误匹配，虽引入外部库但代码逻辑无误。 E选项：直接比较整个文本与敏感词列表，未实现词级匹配，不符合题干“检测是否包含敏感词”要求。'},
  {id:1834,type:'multi',answer:'ABD',stem:'你写了一个提示词1“请用适合简报的形式，以每篇100字的篇幅总结今天的十大新闻”。你希望大模型能按照提示词完成该任务，以下哪些方案可行？',opts:['设计提示词,明确要求大模型要基于今天最新的新闻来总结,避免基于历史新闻总结','设计提示词,结合functioncall,让大模型回答时效性问题时,调用搜索工具','整理历史新闻库,构建一个RAG应用,让大模型回答时参考知识库中的新闻','使用阿里云百炼平台的qwen-plus,并且调用API时设置enable_search=True'],exp:'A正确：明确要求基于今天最新新闻，可有效约束模型输出时效性内容。 B正确：通过functioncall调用搜索工具，能实时获取当日新闻，确保信息新鲜。 C错误：RAG依赖历史知识库，无法保证引用的是今日最新新闻，违背任务核心要求。 D正确：阿里云百炼平台启用search功能后，API会自动检索实时网络信息，满足时效性需求。'},
  {id:1835,type:'multi',answer:'ACDF',stem:'在创建APIAssistantAgent的过程中，将functions参数作为字典传入的解释正确的有哪些?',opts:['这样可以方便地根据函数名来动态调用对应的函数','由于Python中的类只能接收一个类型参数,字典是唯一选择','为了让智能体能够调用不同的函数来满足用户的请求','该结构为智能体的多任务处理提供了更高的可扩展性','因为字典结构可以提供键值对,便于存储函数的信息','字典可以支持函数参数的动态传递,提高灵活性'],exp:'将functions参数作为字典传入，便于根据函数名动态调用对应函数，符合智能体按需执行函数的设计逻辑；该结构支持智能体调用不同函数以响应多样化用户请求；字典键值对形式利于封装函数元信息，增强系统可扩展性；同时支持通过键值传递函数参数，实现参数动态注入与灵活调度。'},
  {id:1836,type:'multi',answer:'AEF',stem:'关于Qwen-Max、CosyVoice和moviepy的协同使用，以下哪些说法是正确的?',opts:['CosyVoice可以将文本转换为音频.','CosyVoice的主要功能是视频编辑.','moviepy可以直接将文本转换为视频.','Qwen-Max主要用于生成视频字幕.','moviepy可以用来获取音频文件的持续时间,用于生成字幕.','使用这三个工具的典型流程是:Qwen-Max->CosyVoice->moviepy.'],exp:'Qwen-Max 是基于大规模语言模型的文本生成工具，常见应用于内容创作；CosyVoice 是文本转语音（TTS）工具；moviepy 是 Python 视频处理库，支持音视频剪辑与属性读取。选项 A 错误，moviepy 不直接支持文本生成视频，需依赖其他工具生成素材后进行编辑。选项 B 正确，CosyVoice 的 TTS 功能可将文本转为音频（官方文档示例）。选项 C 正确，典型流程为文本生成（Qwen-Max）→音频合成（CosyVoice）→视频处理（moviepy）。选项 D 错误，CosyVoice 核心功能是音频生成而非视频编辑。选项 E 正确，Qwen-Max 可生成文本内容如字幕（应用案例说明）。选项 F 正确，moviepy 的 AudioFileClip 类可获取音频时长（官方 API 文档）。'},
  {id:1837,type:'multi',answer:'ABD',stem:'为了将RAGAS评测适配到中文问答场景，有哪些有效方法？',opts:['使用中文能力较强的大模型','将RAGAS自带的prompt翻译为中文再传入','在faithfulness中修改json.dumps函数,使其返回中文而非unicode码','在Systemprompt中强调大模型,你要适配到中文问答场景'],exp:'使用中文能力较强的大模型可提升中文语义理解与生成质量，是适配中文问答场景的有效方法。将RAGAS自带的prompt翻译为中文再传入，能确保评估指令与中文语境匹配，提高评测准确性。在Systemprompt中强调大模型适配中文问答场景，可引导模型输出符合中文表达习惯的评估结果。在faithfulness中修改json.dumps函数以返回中文而非unicode码，虽能改变输出格式，但不涉及评测逻辑适配，无法提升中文场景下的评估有效性。'},
  {id:1838,type:'multi',answer:'ACD',stem:'用户多次反馈"AI回答中有错误内容”，排查后发现是当知识库没有相关内容时，大模型直接虚构答案。为减少此情况，你可以怎么做？',opts:['在百炼RAG应用中将回答范围设置为"仅知识库范围"','调高temperature值','使用ReRank对检索结果再次排序','使用提示词,让模型明确应"无法回答"'],exp:'在百炼RAG应用中将回答范围设置为"仅知识库范围"可防止模型超出知识库内容生成答案；使用ReRank对检索结果再次排序能提升相关性，降低错误信息引入概率；使用提示词让模型明确应"无法回答"可约束其不虚构内容。调高temperature值会增加输出随机性，加剧虚构风险。'},
  {id:1839,type:'multi',answer:'ACDF',stem:'user_query“请帮我润色一下如下文段，让文字更适合朗读：小喵玩毛线球。”为了让大模型更好理解润色需求，可以补充哪些附加说明到userquery中？',opts:['尽量保持原文的核心意思不变','将文字翻译成英文','希望润色后的文字更加生动活泼','请使用比喻和拟人的修辞手法','把这段文字扩展成一个500字左右的小故事','目标读者是小学三年级的学生'],exp:'润色文本以适配朗读，需增强语言的节奏感与表现力。保持核心意思不变是润色的基本原则；生动活泼的语言更符合口语化表达需求；比喻和拟人能提升画面感与情感共鸣，利于听觉接收；目标读者为小学三年级学生时，语言应童趣化、简明化，便于理解与朗读。翻译成英文偏离中文朗读场景，扩展为500字故事超出润色范畴，二者不属合理补充说明。'},
  {id:1840,type:'multi',answer:'BCEF',stem:'视频合规检测的关键步骤包括下列哪些选项？',opts:['视频上传后的用户评论分析','视频预处理,例如视频分段和帧提取','音频检测','视频编码格式的选择','图片合规检测','文本合规检测(包括字幕和音频转录文本)'],exp:'视频合规检测需对内容进行多维度审查。视频预处理包括分段和帧提取，是后续分析的基础；音频检测用于识别违规声音内容；图片合规检测针对视频中静态画面的非法图像；文本合规检测涵盖字幕及音频转录文本中的违法信息。用户评论分析属于事后行为监管，非视频内容本身检测环节；视频编码格式选择属技术优化范畴，不涉及内容合规判断。'},
  {id:1841,type:'multi',answer:'ABC',stem:'微调qwen7.5-1.5b模型过程中发现模型开始欠拟合，可采取的优化措施包括?',opts:['增加训练数据量','增加训练集迭代次数(epoch)','增加lora_rank值','学习率增加1倍'],exp:'欠拟合指模型未能充分学习训练数据的特征。增加训练数据量可提升模型泛化能力，缓解欠拟合；增加训练集迭代次数能增强模型对数据的拟合程度；LoRA微调中提高lora_rank值可扩大低秩矩阵的表达容量，增强模型拟合能力。学习率增加1倍可能导致参数更新过激，引发训练不稳定或发散，反而加剧欠拟合或无法收敛。'},
  {id:1842,type:'multi',answer:'ABC',stem:'通过Llamaindex创建RAG应用，这段代码有哪些问题？PythonQuery_engineindex.as_query_engine(Similarity_top_k3,StreamingTrue,Node_postprocessorsDepthScopeRank(top_n8,model"gte-rerank"),SimilarityPostprocessor(similarity_cutoff1)Response query_engine.retrieve("需求分析使用的工具是什么?")Response.print_response_stream()',opts:['query_engine不支持retrieve','重排序中的chunk数大于初步召回的chunk数','相似度阈值设置过高','Llama index在RAG回答时不可以使用流式输出'],exp:'A正确：Query_engine不支持retrieve方法，RAG查询应使用query方法而非retrieve。 B正确：重排序后top_n=8超过初始检索的similarity_top_k=3，导致重排序输入不足，无法有效执行。 C正确：相似度阈值设为1，意味着仅保留完全匹配的节点，实际向量相似度不可能达到1，将过滤全部结果。 D错误：Llamaindex支持流式输出，Streaming=True参数配置合法，Response.print_response_stream()语法正确。'},
  {id:1843,type:'multi',answer:'ABD',stem:'你通过RAG为用户推荐商品推荐服务。用户反馈说，在搜索"包子"时，推荐结果中经常出现"牛肉"的商品信息。后台分析发现，召回阶段确实会夹杂部分无关商品的信息。以下哪些措施能够有效提升该系统的推荐效果?',opts:['降低检索阶段的相似度阈值','优化大模型的prompt,强调要重点关注用户问题,避免给出无关商品信息','在知识库中删除书包相关的内容','微调大模型,提高其在面对包含噪声数据的信息时筛选有效信息的能力'],exp:'降低检索阶段的相似度阈值可减少低相关性结果的召回，提升推荐精准度；优化大模型的prompt能强化对用户意图的聚焦，抑制无关商品输出；微调大模型可增强其在噪声干扰下筛选有效信息的能力。删除书包相关内容与“包子”场景无直接关联，不构成有效改进措施。'},
  {id:1844,type:'multi',answer:'BDF',stem:'基于字符的文档切片方法有哪些潜在优缺点？',opts:['难以实现','可能导致语义分离','需要大量的存储空间','计算复杂度低','切片大小不均匀','可能导致上下文丢失'],exp:'基于字符的文档切片方法以固定字符数为单位分割文本，不考虑语义边界。该方法可能导致语义分离，如将完整词语或句子截断；也可能造成上下文丢失，因切片点位于语义单元中间，破坏前后关联。切片结果不依赖语义结构，故切片大小均匀，但语义完整性受损是其核心缺陷。'},
  {id:1845,type:'multi',answer:'BC',stem:'你在开发的招聘答疑机器人，在回答“产品经理的岗位职责有哪些”时，输出的职责经常包含客户经理的工作职责。经排查发现，不同岗位的说明文档使用了相同的模板，文档切片时经常将“客户经理”岗位和“产品经理”岗位的职责主要是这样描述的。以下哪两种方法能有效解决这个问题?',opts:['使用ReRank对检索结果再次排序','在处理文档时,对于文档中的二级标题,自动拼接文档名称,如##岗位职责会被拼接为##客户经理 - 岗位职责','在建立索引时,以文档名作为独立标签,检索阶段使用标签 + 向量混合检索','调大大模型temperature参数,提高大模型匹配正确答案数据的概率'],exp:'A 选项: 通过文档名称建立标签,检索时结合标签(岗位名称) 和向量混合检索,能精准限定检索内容,避免其他岗位内容混入,有效 。B temperature 参数控制生成的随机性,调高它无法解决检索时内容混淆的根本问题,无效。C 给二级标题拼接文档名称(岗位名称),使段落带上明确岗位标识,检索时能准确区分,避免混淆,有效。D ReRank 仅对检索结果重新排序,不解决内容混淆的根源,仍会包含其他岗位段落,无效。'},
  {id:1846,type:'multi',answer:'AD',stem:'某电商公司需开发一个客服机器人处理“退换货政策咨询”和“商品推荐”任务，下列哪种角色应该深度参与提示词设计？',opts:['产品经理 (定义用户场景和业务流程)','前端开发工程师 (负责对边界实现)','算法工程师 (擅长模型调优和参数调整)','客服部门主管 (熟悉用户高频问题和政策细节)'],exp:'产品经理需定义用户场景和业务流程，是提示词设计的核心依据；客服部门主管熟悉用户高频问题和政策细节，能提供真实对话样本与规范表达。前端开发工程师关注界面实现，算法工程师专注模型调优，均不直接参与语义逻辑与业务规则的构建。'},
  {id:1847,type:'multi',answer:'AB',stem:'你正在开发一个机器学习领域的答疑机器人，辅助学生学习，但你对该领域专业知识掌握有限，以下哪些策略更有助于你改进提示词设计？',opts:['邀请机器学习课程助教一起审核和改进提示词,要求其按照一定的结构来回答问题','要求大模型扮演「机器学习教授」,结合学生认知水平,主动写出更结构化的提示词','按照自己的理解要求大模型按照一定的结构来回答问题','保持提示词简单,避免引入错误的信息'],exp:'该题考察提示词设计优化的有效策略。选项A通过引入领域专家审核确保专业性与结构合理性；选项B利用角色预设调整输出结构以适应目标受众认知水平；选项C因自身知识局限可能导致设计偏差；选项D虽减少错误风险但牺牲结构化输出，影响教学效果。专业协作与角色模拟是关键优化路径。'},
  {id:1848,type:'multi',answer:'BC',stem:'你在开发的招聘答疑机器人，在回答产品经理的岗位职责有哪些时，输出的职责经常包含客户经理的工作职责。经排查发现，不同岗位的说明文档使用了相同的模板，文档切片时经常将客户经理岗位和产品经理岗位的职责主要是这样描述的。以下哪两种方法能有效解决这个问题？',opts:['使用ReRank对检索结果再次排序','在处理文档时,对于文档中的二级标题,自动拼接文档名称,如##岗位职责会被拼接为##客户经理 - 岗位职责','在建立索引时,以文档名作为独立标题,检索阶段使用标题等 + 向量混合检索','调大大模型temperature参数,提高大模型匹配正确答案数据的概率'],exp:'A 选项: 通过文档名称建立标签,检索时结合标签(岗位名称) 和向量混合检索,能精准限定检索内容,避免其他岗位内容混入,有效 。B temperature 参数控制生成的随机性,调高它无法解决检索时内容混淆的根本问题,无效。C 给二级标题拼接文档名称(岗位名称),使段落带上明确岗位标识,检索时能准确区分,避免混淆,有效。D ReRank 仅对检索结果重新排序,不解决内容混淆的根源,仍会包含其他岗位段落,无效。'},
  {id:1849,type:'multi',answer:'AD',stem:'某大型公司对每位员工都有多条文档记录。RAG在检索时只依赖Embedding相似度，有时召回了不匹配的同名员工信息。为提高准确度，你会如何处理？',opts:['给每条记录打标签 (如部门、邮箱) 并结合标签过滤','修改大模型为qwen-max','改用tokenTextSplitter','提高相似度阈值,过滤噪声'],exp:'多条文档记录因同名导致检索混淆，需引入辅助特征区分实体。通过为每条记录打上部门、邮箱等元标签，可在检索后结合标签进行过滤，提升结果精准度。提高相似度阈值可减少低相关性结果的召回，降低噪声干扰。二者均为直接有效的方法。'},
  {id:1850,type:'multi',answer:'AD',stem:'在多轮对话场景中，以下哪些方案，更有利于保障用户体验的同时，降低大模型使用成本？',opts:['在多轮对话场景中使用支持长上下文缓存的大模型API','每次对话仅保留最近2轮历史,避免携带过长的上下文','按照100的长度,对历史对话做截断,避免携带上下文过长','在多轮对话场景中,避免始终传入完整的历史对话,而是用最早的历史对话做总结处理后接号在对话中'],exp:'使用支持长上下文缓存的大模型API，可复用历史对话信息，减少重复计算与请求开销，降低整体成本。避免始终传入完整历史对话，通过总结最早对话内容并接入当前会话，能有效压缩上下文长度，兼顾语义连贯性与资源效率。'},
  {id:1851,type:'multi',answer:'ABD',stem:'RAG应用在检索时召回了10条切片，其中3条高度相关，但3条内容都来自相邻段落，却被系统拆分到不同切片，从而导致回答时缺失关键的上下文信息。哪些方案可进一步提升答案准确度？',opts:['采用滑动窗口策略生成重叠的文本切片','使用按语义的切片策略,划分出语义更完整的切片','提高temperature参数控制生成多样性','调整切片大小使其覆盖完整更大段落范围'],exp:'检索时切片被错误拆分导致上下文断裂，需优化切片生成方式。滑动窗口策略通过重叠切片保留相邻段落的连续信息，避免关键内容被割裂；语义切片策略依据语义边界划分，确保每个切片语义完整；增大切片大小可覆盖更完整段落，减少因机械分割丢失上下文的问题。temperature参数控制生成多样性，与检索阶段的切片完整性无关，不影响上下文召回。'},
  {id:1852,type:'multi',answer:'ACDE',stem:'关于大模型在文本处理中的局限性，以下哪些陈述是准确的？',opts:['即使有合适的系统提示词,大模型生成的内容仍需人工复审以保证质量','大模型技术已经完全成熟,能够无差错地执行所有文本转换和角色任务','大模型可能在处理特定领域专业术语时出现误译','大模型对用户查询的依赖性极强,如果查询表述不清,结果可能偏离预期','在没有明确指示的情况下,大模型可能无法自动识别源语言和目标语言'],exp:'大模型生成内容受提示词影响，仍需人工复审以确保准确性与安全性；大模型在专业术语领域易因训练数据覆盖不足而产生误译；其输出高度依赖输入表述清晰度，查询模糊会导致结果偏离；在无明确语言标识时，无法自动识别源语言与目标语言。选项B错误，因大模型尚未达到无差错执行所有任务的成熟水平。'},
  {id:1853,type:'multi',answer:'ABD',stem:'构建高质量的数学题微',opts:['包含详细分步指导','统一使用LaTeX公式或Markdown格式给出公式','大量的数学题视频数据','涵盖多种解题思路'],exp:'高质量数学题微调数据集的核心是提升模型推理和教学能力。要素包括：A（详细分步指导）能引导模型逐步思考；B（统一使用LaTeX或Markdown公式）确保数学符号的准确性和模型的可读性；D（涵盖多种解题思路）提升模型的泛化能力和解题灵活性。C（大量视频数据）不属于“微调数据集”应包含的核心要素，通常用于多模态模型训练而非纯文本微调'},
  {id:1854,type:'multi',answer:'ABC',stem:'关于多模态技术底层原理，正确的说法是？',opts:['图像理解模型也需要先将视频或图像分帧化而做处理','实现「方言语音合成」需要训练模型建立方言音素与标准发音的映射关系','视频合成所花费的时间与可压的算力呈负相关','文生图模型生成不同尺寸图像时,必须重新训练模型'],exp:'图像理解模型如Vision Transformer将图像分割为固定大小的patch，类似文本的分词处理，形成序列输入。方言语音合成的关键在于模型需学习方言特有音素与标准发音之间的对应关系，此映射直接影响合成准确性。视频合成时间随算力增加而减少，更高性能硬件可并行处理更多计算任务。文生图模型如Stable Diffusion通过调整网络中的空间维度参数支持多种输出尺寸，无需重新训练。选项D错误。'},
  {id:1855,type:'multi',answer:'BDF',stem:'以下哪些选项属于提示词要求中的"输出格式 (OutputFormat)',opts:['请你总结一下这篇文章的主要内容.','请用表格形式展示结果.','假设你是一个资深律师.','请使用JSON格式输出.','我希望你以第一人称的口吻写作.','结果需要包含姓名、年龄和地址.'],exp:'输出格式要求明确指定结果的呈现方式，包括结构化形式与数据组织规范。选项“请用表格形式展示结果”属于指定输出结构；“请使用JSON格式输出”属于指定数据序列化格式；“结果需要包含姓名、年龄和地址”属于指定内容字段要求。其余选项为角色设定、语气要求或泛化指令，不属于输出格式范畴。'},
  {id:1856,type:'multi',answer:'ABCD',stem:'选择LORA微调时需考虑哪些因素？',opts:['训练数据量','基础模型参数量','任务复杂度','GPU 显存容量'],exp:'LoRA微调需考虑训练数据量，数据不足易导致过拟合；基础模型参数量影响低秩矩阵的适配效率，参数越多越需精细调整；任务复杂度决定低秩秩数与训练策略选择，复杂任务需更高表达能力；GPU显存容量限制可部署的LoRA模块规模与批量大小，直接影响训练可行性。'},
  {id:1857,type:'multi',answer:'ABD',stem:'用户反馈你开发的客服机器人连续返回4次后，排查发现：1.用户语音已经成功上传网络存储2.调用语音客服服务后显示模型解析失败3.独立部署的模型服务的监控显示QPS突增500哪些项是可能的原因？',opts:['前端生成的语音文件格式与模型期望不匹配','突增请求中包含大量触发模型 Bug 的异常音频','语音模型未针对专业术语做优化调整理解,准确率低','处理能力达模型升高并发下载,倒上账'],exp:'前端生成的语音文件格式与模型期望不匹配，会导致解析失败；突增请求中包含大量触发模型 Bug 的异常音频，可引发服务异常和 QPS 突增；处理能力达模型升高并发下载，倒上账，表明系统资源超载或调度异常，符合监控现象。语音模型未针对专业术语做优化调整理解，准确率低，不影响解析是否失败，仅影响识别结果，与“模型解析失败”无直接关联。'},
  {id:1858,type:'multi',answer:'AC',stem:'以下关于CosyVoice的描述，哪些是正确的？',opts:['CosyVoice 是一个文语转语音模型.','CosyVoice 可以直接生成视频.','CosyVoice 支持实时流式语音合成.','CosyVoice 可以用于语音识别.'],exp:'CosyVoice 是一个文语转语音模型，支持实时流式语音合成。它不具备生成视频的能力，也不用于语音识别。语音合成与语音识别是两类相反的技术方向，前者将文本转为语音，后者将语音转为文本。视频生成需依赖视觉生成模型，非语音模型功能范畴。'},
  {id:1859,type:'multi',answer:'ACD',stem:'为了尽可能减少大模型应用的幻觉，以下哪些措施是有效的？',opts:['对生成内容进行处理和验证','使用参数量小更适合本地部署的模型','引入知识库补充大模型缺少的行业知识','在提示词中要求禁止虚构内容,遇到无法回答的问题可以直接回复不知道'],exp:'对生成内容进行处理和验证可有效识别并修正错误输出；引入知识库能补充大模型缺乏的领域专业知识，提升回答准确性；在提示词中要求禁止虚构内容并允许回复“不知道”，可引导模型避免无依据生成。使用参数量小的模型通常降低表达能力，反而可能增加幻觉风险。'},
  {id:1860,type:'multi',answer:'ABDE',stem:'已知prompt_template定义了让大模型生成摘要的具体要求，以下哪些措施可以提高摘要生成函数的生成质量？ 选项：',opts:['将document分成多个段落,分别生成摘要,最后合并.','在prompt_template中明确指出需要提取文章的主旨.','不使用prompt_template,直接调用大模型.','在prompt_template中提供一些示例摘要.','在prompt_template中提供更详细的输出格式要求,例如指定摘要的长度、语气等.'],exp:'暂无解析'},
  {id:1861,type:'multi',answer:'CD',stem:'把APIKey配置到环境变量，有哪些优点?',opts:['提高大模型的回复速度','提高大模型的回复准确率','降低泄露风险','在其它代码中也可以直接加载环境变量,无需记住又长又复杂的API Key'],exp:'将API Key配置到环境变量可降低泄露风险，因环境变量不直接写入代码文件，避免随源码意外提交或暴露；同时可在其他代码中直接加载环境变量，无需硬编码冗长复杂的密钥内容，提升配置灵活性与安全性。'},
  {id:1862,type:'multi',answer:'BDE',stem:'在AssistantAgent的query方法中，dashscope.runs.wait的作用是什么?',opts:['返回请求的实际进度,对于调试非常有用','等待所有的辅助工具输出,确保信息的完整性','监听后台请求,并在用户的等待期间消耗资源','确保所有消息都收到并存储好','阻塞当前线程,直到请求的响应准备好为止','提供异步呼叫的机制,以提升查询响应速度'],exp:'dashscope.runs.wait用于等待所有辅助工具完成输出，确保返回信息完整；同时阻塞当前线程直至响应就绪，保证消息被完整接收并存储。该机制是同步调用中保障数据完整性和流程一致性的关键步骤。'},
  {id:1863,type:'multi',answer:'ABCE',stem:'以下哪些选项是abstract_generator函数中提示词模板的关键组成部分?',opts:['任务要求描述','角色背景设定','输出格式要求','错误处理机制','用户输入示例'],exp:'解析：在生成模型中，提示词模板设计通常围绕明确任务目标、指定生成角色和规范输出结构展开。公开的提示工程指南指出，有效的模板需包含任务指令、角色上下文及格式约束。选项A（任务要求）定义核心目标，选项B（角色背景）限定生成视角，选项C（输出格式）确保结果可用性。选项D属于程序容错逻辑，非模板内容；选项E为辅助示例，非必选要素。'},
  {id:1864,type:'multi',answer:'ABCD',stem:'qwen2.5-1.5b模型训练过程中较大的batchsize会带来哪些影响?',opts:['帮助模型充分地学习训练集','可能导致模型泛化性能下降','加速训练过程','GPU显存消耗更大'],exp:'暂无解析'},

function optLabel(i){ return String.fromCharCode(65 + i); }

// --- 持久化状态 ---
let wrongSet = new Set(JSON.parse(localStorage.getItem('aca_wrong')||'[]'));
let favSet   = new Set(JSON.parse(localStorage.getItem('aca_fav')||'[]'));
let syncTimer=null, syncBusy=false, lastSyncMsg='';

function touchUpdatedAt(){
  const t=Date.now();
  localStorage.setItem('aca_updated_at', String(t));
  return t;
}
function localUpdatedAt(){
  return Number(localStorage.getItem('aca_updated_at')||0);
}
function getSyncToken(){
  return (localStorage.getItem('aca_sync_token')||'').trim();
}
function setSyncToken(token){
  token=(token||'').trim();
  if(token) localStorage.setItem('aca_sync_token', token);
  else localStorage.removeItem('aca_sync_token');
  updateSyncBtn();
}
function cloudSyncAvailable(){
  return location.protocol!=='file:' && !!getSyncToken();
}
function updateSyncBtn(){
  const btn=document.getElementById('syncBtn');
  if(!btn) return;
  if(location.protocol==='file:'){
    btn.textContent='☁ 需部署';
    btn.classList.add('warn');
    btn.title='本地双击打开无法云同步，请用部署后的网址访问';
    return;
  }
  if(!getSyncToken()){
    btn.textContent='☁ 设口令';
    btn.classList.add('warn');
    btn.title='设置同步口令后，进度可跨设备同步';
  } else {
    btn.textContent='☁ 同步';
    btn.classList.remove('warn');
    btn.title=lastSyncMsg||'云端同步已开启';
  }
}
function openSyncPanel(){
  document.getElementById('syncTokenInput').value=getSyncToken();
  document.getElementById('syncStatus').textContent=
    location.protocol==='file:'
      ? '当前是本地文件打开，无法访问云端。请用 Cloudflare 部署后的链接。'
      : (lastSyncMsg||(getSyncToken()?'已保存口令，答题时会自动同步。':'尚未设置口令'));
  document.getElementById('syncStatus').className='sync-status';
  document.getElementById('syncMask').classList.add('on');
}
function closeSyncPanel(){
  document.getElementById('syncMask').classList.remove('on');
}
function setSyncStatus(msg, kind){
  lastSyncMsg=msg;
  const el=document.getElementById('syncStatus');
  if(el){ el.textContent=msg; el.className='sync-status'+(kind?' '+kind:''); }
  updateSyncBtn();
}
function saveSyncToken(){
  const token=document.getElementById('syncTokenInput').value.trim();
  if(token && token.length<8){
    setSyncStatus('口令至少 8 位', 'err');
    return;
  }
  setSyncToken(token);
  if(!token){
    setSyncStatus('已清除口令，仅保存在本机', 'ok');
    return;
  }
  setSyncStatus('口令已保存，正在同步…', '');
  syncNow(true).then(()=>setSyncStatus(lastSyncMsg||'同步完成', lastSyncMsg.includes('失败')?'err':'ok'));
}
function manualSync(){
  const token=document.getElementById('syncTokenInput').value.trim();
  if(token) setSyncToken(token);
  if(!getSyncToken()){ setSyncStatus('请先填写同步口令', 'err'); return; }
  if(location.protocol==='file:'){ setSyncStatus('本地文件无法同步，请用部署网址', 'err'); return; }
  setSyncStatus('同步中…', '');
  syncNow(true).then(()=>setSyncStatus(lastSyncMsg||'同步完成', lastSyncMsg.includes('失败')?'err':'ok'));
}

function snapshotState(){
  return {
    wrong:[...wrongSet],
    fav:[...favSet],
    progress:loadProgress(),
    updatedAt:localUpdatedAt()||Date.now()
  };
}
function applyCloudState(data){
  if(!data) return;
  wrongSet=new Set(Array.isArray(data.wrong)?data.wrong:[]);
  favSet=new Set(Array.isArray(data.fav)?data.fav:[]);
  localStorage.setItem('aca_wrong', JSON.stringify([...wrongSet]));
  localStorage.setItem('aca_fav', JSON.stringify([...favSet]));
  if(data.progress){
    localStorage.setItem('aca_progress', JSON.stringify(data.progress));
  } else {
    localStorage.removeItem('aca_progress');
  }
  localStorage.setItem('aca_updated_at', String(data.updatedAt||Date.now()));
}

async function syncNow(forcePull){
  if(!cloudSyncAvailable() || syncBusy) return;
  syncBusy=true;
  const token=getSyncToken();
  try{
    const getRes=await fetch('/api/sync', {
      headers:{ 'X-Sync-Token': token }
    });
    if(!getRes.ok){
      const err=await getRes.json().catch(()=>({}));
      lastSyncMsg='拉取失败：'+(err.error||getRes.status);
      return;
    }
    const remote=await getRes.json();
    const localAt=localUpdatedAt();
    const remoteAt=Number(remote.updatedAt)||0;

    if(remote.exists && remoteAt>localAt){
      applyCloudState(remote);
      lastSyncMsg='已从云端恢复（'+new Date(remoteAt).toLocaleString()+')';
      if(forcePull) restorePractice();
    } else if(!remote.exists || localAt>remoteAt || forcePull){
      const body=snapshotState();
      if(!body.updatedAt) body.updatedAt=touchUpdatedAt();
      const putRes=await fetch('/api/sync', {
        method:'PUT',
        headers:{
          'Content-Type':'application/json',
          'X-Sync-Token': token
        },
        body:JSON.stringify(body)
      });
      if(putRes.status===409){
        const newer=await putRes.json();
        applyCloudState(newer);
        lastSyncMsg='云端更新，已覆盖本机';
        if(forcePull) restorePractice();
      } else if(!putRes.ok){
        const err=await putRes.json().catch(()=>({}));
        lastSyncMsg='上传失败：'+(err.error||putRes.status);
      } else {
        lastSyncMsg='已同步到云端 · '+new Date().toLocaleTimeString();
      }
    } else {
      lastSyncMsg='已是最新 · '+new Date().toLocaleTimeString();
    }
  } catch(e){
    lastSyncMsg='网络异常，稍后再试';
  } finally {
    syncBusy=false;
    updateSyncBtn();
  }
}
function scheduleCloudSync(){
  if(!cloudSyncAvailable()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false), 700);
}

function save(){
  localStorage.setItem('aca_wrong', JSON.stringify([...wrongSet]));
  localStorage.setItem('aca_fav',   JSON.stringify([...favSet]));
  touchUpdatedAt();
  scheduleCloudSync();
}

const MODE_LABELS={all:'顺序练习',single:'单选练习',multi:'多选练习',wrong:'错题练习',fav:'收藏练习'};

// --- 练习状态 ---
let queue=[], cur=0, mode='all', startQId=null, sessOk=0, sessNg=0, answered=false, selSet=new Set();
let pickType='single';

function qsOfType(t){ return QS.filter(q=>q.type===t); }

function buildQueue(m){
  if(m==='wrong')  return QS.map((_,i)=>i).filter(i=>wrongSet.has(QS[i].id));
  if(m==='fav')    return QS.map((_,i)=>i).filter(i=>favSet.has(QS[i].id));
  if(m==='single') return QS.map((_,i)=>i).filter(i=>QS[i].type==='single');
  if(m==='multi')  return QS.map((_,i)=>i).filter(i=>QS[i].type==='multi');
  return QS.map((_,i)=>i);
}

function sliceQueueFrom(nextQueue, fromId){
  if(fromId==null) return nextQueue;
  let idx=nextQueue.findIndex(i=>QS[i].id===fromId);
  if(idx<0) idx=nextQueue.findIndex(i=>QS[i].id>=fromId);
  if(idx<0) return null;
  return nextQueue.slice(idx);
}

function saveProgress(opts){
  opts=opts||{};
  let saveCur=opts.next ? cur+1 : cur;
  if(opts.done) saveCur=queue.length;
  const done=saveCur>=queue.length;
  const qId=(!done && queue[saveCur]!=null) ? QS[queue[saveCur]].id : null;
  localStorage.setItem('aca_progress', JSON.stringify({
    mode, qId, cur:saveCur, sessOk, sessNg, done, startQId
  }));
  touchUpdatedAt();
  scheduleCloudSync();
}

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem('aca_progress')||'null'); }
  catch(e){ return null; }
}

function applyModeLabel(m){
  document.getElementById('modeTag').textContent=MODE_LABELS[m]||MODE_LABELS.all;
}

function emptyQueueMsg(m){
  if(m==='wrong') return '错题集为空，继续练习积累！';
  if(m==='fav') return '收藏夹为空，练习时点 ☆ 收藏！';
  return '没有可练习的题目';
}

function startPractice(m, fromId){
  let nextQueue=buildQueue(m);
  if(fromId!=null){
    nextQueue=sliceQueueFrom(nextQueue, fromId);
    if(!nextQueue){alert('题号无效，请重新选择');return;}
  }
  if(!nextQueue.length){alert(emptyQueueMsg(m));return;}
  mode=m; startQId=fromId!=null?fromId:null; cur=0; sessOk=0; sessNg=0; queue=nextQueue;
  document.getElementById('hdRight').textContent='';
  applyModeLabel(m);
  switchTab(0);
  showQ();
}

function restorePractice(){
  const p=loadProgress();
  if(!p){ startPractice('all'); return; }
  mode=p.mode||'all';
  startQId=p.startQId!=null?p.startQId:null;
  sessOk=p.sessOk||0;
  sessNg=p.sessNg||0;
  let nextQueue=buildQueue(mode);
  if(startQId!=null){
    const sliced=sliceQueueFrom(nextQueue, startQId);
    if(sliced) nextQueue=sliced;
  }
  queue=nextQueue;
  if(!queue.length){ startPractice('all'); return; }
  applyModeLabel(mode);
  if(p.done){
    cur=queue.length;
    document.getElementById('hdRight').textContent='已续刷';
    showScore();
    return;
  }
  let idx=-1;
  if(p.qId!=null) idx=queue.findIndex(i=>QS[i].id===p.qId);
  if(idx<0 && p.qId!=null) idx=queue.findIndex(i=>QS[i].id>=p.qId);
  if(idx<0) idx=Math.min(Math.max(p.cur||0,0), queue.length);
  cur=idx;
  document.getElementById('hdRight').textContent=cur>0||sessOk||sessNg?'已续刷':'';
  if(cur>=queue.length){ showScore(); return; }
  showQ();
}

function showQ(){
  if(cur>=queue.length){showScore();return;}
  answered=false; selSet.clear();
  const q=QS[queue[cur]];
  const total=queue.length, n=cur+1;
  document.getElementById('pgText').textContent=`题号 ${q.id} · 第 ${n} / ${total} 题`;
  document.getElementById('pgFill').style.width=`${((n-1)/total)*100}%`;
  document.getElementById('favBtn').textContent=favSet.has(q.id)?'★':'☆';
  const badge=document.getElementById('qBadge');
  badge.textContent=q.type==='single'?'单选题':'多选题';
  badge.className='q-badge '+(q.type==='single'?'badge-s':'badge-m');
  document.getElementById('qStem').textContent=q.stem;
  const wrap=document.getElementById('optsWrap');
  wrap.innerHTML='';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-label">${optLabel(i)}</span><span class="opt-text">${o}</span>`;
    btn.onclick=()=>pickOpt(i,btn,q);
    wrap.appendChild(btn);
  });
  const sb=document.getElementById('submitBtn');
  sb.style.display=q.type==='multi'?'block':'none';
  sb.disabled=true;
  document.getElementById('resultArea').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  showScreen('scrPractice');
  const main=document.getElementById('mainArea');
  if(main) main.scrollTop=0;
  saveProgress();
}

function pickOpt(i,btn,q){
  if(answered)return;
  const L=optLabel(i);
  if(q.type==='single'){
    answered=true;
    const allBtns=document.getElementById('optsWrap').querySelectorAll('.opt');
    allBtns.forEach(b=>b.disabled=true);
    const correct=q.answer.split('');
    allBtns.forEach((b,idx)=>{
      if(correct.includes(optLabel(idx))) b.classList.add('ok');
      else if(idx===i) b.classList.add('ng');
    });
    const ok=(L===q.answer);
    recordResult(ok,q);
  } else {
    if(selSet.has(L)){selSet.delete(L);btn.classList.remove('sel');}
    else{selSet.add(L);btn.classList.add('sel');}
    document.getElementById('submitBtn').disabled=selSet.size===0;
  }
}

function submitMulti(){
  const q=QS[queue[cur]]; answered=true;
  const correctSet=new Set(q.answer.split(''));
  const userAns=[...selSet].sort().join('');
  const ok=(userAns===q.answer);
  const allBtns=document.getElementById('optsWrap').querySelectorAll('.opt');
  allBtns.forEach((b,idx)=>{
    b.disabled=true; b.classList.remove('sel');
    if(correctSet.has(optLabel(idx))) b.classList.add('ok');
    else if(selSet.has(optLabel(idx))) b.classList.add('ng');
  });
  document.getElementById('submitBtn').style.display='none';
  recordResult(ok,q);
}

function recordResult(ok,q){
  if(ok){sessOk++;wrongSet.delete(q.id);}
  else{sessNg++;wrongSet.add(q.id);}
  save();
  const ra=document.getElementById('resultArea');
  ra.className='result '+(ok?'ok':'ng');
  const expHtml = q.exp ? '<div style="margin-top:8px;font-size:14px;color:#555;line-height:1.6"><b>解析：</b>'+q.exp+'</div>' : '';
  ra.innerHTML=(ok?'<b>✓ 回答正确！</b>':'<b>✗ 回答错误</b>，正确答案是 <b>'+q.answer+'</b>')+expHtml;
  ra.style.display='block';
  document.getElementById('nextBtn').style.display='block';
  setTimeout(()=>document.getElementById('nextBtn').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
  saveProgress({next:true});
}

function nextQ(){cur++;showQ();}

function toggleFav(){
  if(cur>=queue.length)return;
  const q=QS[queue[cur]];
  if(favSet.has(q.id)){favSet.delete(q.id);document.getElementById('favBtn').textContent='☆';}
  else{favSet.add(q.id);document.getElementById('favBtn').textContent='★';}
  save();
}

// --- 得分 ---
function showScore(){
  const total=queue.length, pct=total?Math.round(sessOk/total*100):0;
  document.getElementById('scoreNum').textContent=pct+'%';
  document.getElementById('scTotal').textContent=total;
  document.getElementById('scOk').textContent=sessOk;
  document.getElementById('scNg').textContent=sessNg;
  showScreen('scrScore');
  document.getElementById('pgWrap').style.display='none';
  saveProgress({done:true});
}

function goWrong(){switchTab(2);}
function restart(){startPractice(mode, startQId);}

// --- Tab 切换 ---
function switchTab(t){
  for(let i=0;i<4;i++) document.getElementById('tab'+i).classList.toggle('on',i===t);
  document.getElementById('pgWrap').style.display=(t===0&&cur<queue.length)?'block':'none';
  if(t===0){
    if(!queue.length){startPractice('all');return;}
    applyModeLabel(mode);
    if(cur<queue.length) showScreen('scrPractice');
    else showScreen('scrScore');
  } else if(t===1){
    document.getElementById('modeTag').textContent='选题';
    if(queue.length && cur<queue.length) pickType=QS[queue[cur]].type;
    renderPick(true);
    showScreen('scrPick');
  } else if(t===2){
    document.getElementById('modeTag').textContent='错题集';
    buildList('wrongWrap', wrongSet, 'wrong');
    showScreen('scrWrong');
  } else {
    document.getElementById('modeTag').textContent='收藏夹';
    buildList('favWrap', favSet, 'fav');
    showScreen('scrFav');
  }
}

function setPickType(t){
  pickType=t;
  const list=qsOfType(t);
  document.getElementById('pickNum').value=list.length?list[0].id:'';
  renderPick(false);
}

function renderPick(prefills){
  const list=qsOfType(pickType);
  document.getElementById('pickSingle').classList.toggle('on', pickType==='single');
  document.getElementById('pickMulti').classList.toggle('on', pickType==='multi');
  document.getElementById('pickSingleCount').textContent=qsOfType('single').length+' 题';
  document.getElementById('pickMultiCount').textContent=qsOfType('multi').length+' 题';
  if(!list.length){
    document.getElementById('pickMeta').textContent='暂无该类型题目';
    document.getElementById('pickChips').innerHTML='';
    document.getElementById('pickPreview').textContent='';
    return;
  }
  const minId=list[0].id, maxId=list[list.length-1].id;
  document.getElementById('pickMeta').textContent=`共 ${list.length} 题，题号 ${minId}–${maxId}`;
  const inp=document.getElementById('pickNum');
  inp.min=minId; inp.max=maxId;
  if(prefills){
    const q=(queue.length && cur<queue.length)?QS[queue[cur]]:null;
    inp.value=(q && q.type===pickType)?q.id:minId;
  }
  const marks=[0, Math.floor(list.length/4), Math.floor(list.length/2), Math.floor(list.length*3/4)];
  const seen=new Set();
  document.getElementById('pickChips').innerHTML=marks.map(i=>{
    const id=list[i].id;
    if(seen.has(id)) return '';
    seen.add(id);
    return `<button class="pick-chip" onclick="fillPickNum(${id})">题号 ${id}</button>`;
  }).join('');
  updatePickPreview();
}

function fillPickNum(id){
  document.getElementById('pickNum').value=id;
  updatePickPreview();
}

function resolvePickQ(){
  const list=qsOfType(pickType);
  const num=parseInt(document.getElementById('pickNum').value,10);
  if(!num) return null;
  let q=list.find(x=>x.id===num);
  if(!q && num>=1 && num<=list.length) q=list[num-1];
  return q||null;
}

function updatePickPreview(){
  const el=document.getElementById('pickPreview');
  const q=resolvePickQ();
  if(!q){ el.textContent='请输入有效题号'; return; }
  const list=qsOfType(pickType);
  const idx=list.findIndex(x=>x.id===q.id);
  const remain=list.length-idx;
  const stem=q.stem.length>60?q.stem.slice(0,60)+'…':q.stem;
  el.innerHTML=`<b>题号 ${q.id}</b>　${q.type==='single'?'单选题':'多选题'}　本类型第 ${idx+1} / ${list.length} 题<br>${stem}<div class="pick-hint">将从本题做到最后，共 ${remain} 题</div>`;
}

function confirmPick(){
  const q=resolvePickQ();
  if(!q){alert('请输入有效题号');return;}
  startPractice(pickType, q.id);
}

function buildList(containerId, set, listMode){
  const wrap=document.getElementById(containerId);
  const qs=QS.filter(q=>set.has(q.id));
  if(!qs.length){
    const msg=listMode==='wrong'?'暂无错题，继续努力！':'还没有收藏，练习时点 ☆ 收藏题目';
    const ico=listMode==='wrong'?'🎉':'⭐';
    wrap.innerHTML=`<div class="empty"><div class="empty-ico">${ico}</div><div class="empty-txt">${msg}</div></div>`;
    return;
  }
  const btnColor=listMode==='wrong'?'red':'';
  const btnText=listMode==='wrong'?'开始错题练习':'开始收藏练习';
  let html=`<div class="list-hd"><span class="list-count">共 ${qs.length} 道题</span><button class="list-go ${btnColor}" onclick="startPractice('${listMode}')">${btnText}</button></div>`;
  qs.forEach(q=>{
    const cls=q.type==='single'?'ln-s':'ln-m';
    const stem=q.stem.length>50?q.stem.substring(0,50)+'…':q.stem;
    html+=`<div class="list-item" onclick="jumpTo(${q.id})"><div class="list-num ${cls}">${q.id}</div><div class="list-stem">${stem}</div></div>`;
  });
  wrap.innerHTML=html;
}

function jumpTo(qId){
  const idx=QS.findIndex(q=>q.id===qId);
  if(idx<0)return;
  startPractice('all', qId);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  const main=document.getElementById('mainArea');
  if(main) main.scrollTop=0;
}

// --- 启动 ---
updateSyncBtn();
(async function boot(){
  if(!localUpdatedAt() && (wrongSet.size || favSet.size || loadProgress())){
    touchUpdatedAt();
  }
  if(cloudSyncAvailable()){
    await syncNow(false);
  }
  restorePractice();
})();
</script>
