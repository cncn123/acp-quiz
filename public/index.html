  {id:1341,type:'single',answer:'A',stem:'以下哪种做法不符合利用大模型提升开发效率的思路？',opts:['对于所有类型的图片,都使用视觉模型进行深层次解析,以确保信息的完整性.','使用DashScopeParse解析文档,而不是自己编写复杂的解析逻辑.','将复杂的文档处理任务拆分成多个子任务,分别使用不同的模型或工具处理.','对于简单的文本替换操作,使用正则表达式而不是调用大模型API.'],exp:'在利用大模型提升开发效率的思路中，核心原则是合理、高效地利用模型的能力，避免不必要的资源消耗和复杂度增加。 A选项提出“对于所有类型的图片，都使用视觉模型进行深层次解析，以确保信息的完整性”。这一做法的问题在于，并非所有类型的图片都需要深层次解析。对于一些简单的图片，如仅包含基本形状或文字的图片，使用视觉模型进行深层次解析可能是过度处理，不仅浪费计算资源，还可能降低处理效率。因此，这一做法不符合利用大模型提升开发效率的思路。 B选项“使用 DashScopeParse 解析文档，而不是自己编写复杂的解析逻辑”，是合理的。它利用了现有的工具来简化开发过程，避免了重复造轮子，提高了开发效率。 C选项“将复杂的文档处理任务拆分成多个子任务，分别使用不同的模型或工具处理”，也是符合提升开发效率思路的。通过拆分任务，可以更有效地利用不同模型或工具的优势，提高处理效率和准确性。 D选项“对于简单的文本替换操作，使用正则表达式而不是调用大模型 API”，同样是合理的。对于简单的操作，使用更轻量级的工具或方法可以更快地完成任务，避免不必要的资源消耗。 综上所述，A选项是不符合利用大模型提升开发效率的思路的，因此是正确答案。'},
  {id:1342,type:'single',answer:'B',stem:'在微调大语言模型的数据预处理流程中，哪一步旨在减少文本中的噪声，提高数据质量？',opts:['序列填充','文本清洗','特征选择','数据增强'],exp:'文本清洗是数据预处理中专门用于去除无关字符、重复内容、拼写错误和低质量文本的步骤，直接降低噪声、提升数据纯净度。序列填充用于统一输入长度，特征选择面向结构化数据降维，数据增强用于扩充样本数量，均不以消除噪声为主要目标。'},
  {id:1343,type:'single',answer:'D',stem:'你准备为企业内部人事系统搭建一个多轮问答功能，现有历史对话quot;张三的办公楼在哪?quot;，在A轮quot;他的主管是谁？quot;，你应该怎么设计检索步骤?',opts:['对"主管"进行同义词扩展,包含"领导"、"上级"等,提高召回率','提高检索的相似度阈值,确保不包含无关信息','混合使用关键词检索与向量检索策略','结合对话历史改写query,进行检索'],exp:'多轮对话中，当前问题依赖前文语义关联，需将历史信息融入当前查询以准确理解意图。例如，“他的主管是谁？”中的“他”指代前句的“张三”，直接检索无法识别指代关系。应结合对话历史改写query为“张三的主管是谁？”，提升检索精准度。'},
  {id:1344,type:'single',answer:'B',stem:'当我们发现使用的模型在大数计算时表现不佳，哪个措施提升最大？',opts:['改进提示词','微调模型,让它学会在大数计算时使用计算插件','提供大数计算样例','使用微调提高模型的逻辑推理能力'],exp:'大数计算需要精确处理超出常规训练数据范围的能力。大型语言模型在数值运算上通常存在局限性，尤其是超出训练数据分布的数值范围时容易产生近似错误。直接调用计算器插件可绕过模型本身的数值计算弱点，将符号化数字转换为机器可处理的精确计算格式。OpenAI在GPT-4技术报告中指出，通过工具使用（如代码解释器）能有效增强模型的数学与计算能力，这种增强方式比单纯增加训练数据或改进提示工程更直接解决核心问题。选项A依赖模型自身泛化能力，C侧重逻辑而非计算精度，D受限于模型固有计算缺陷。'},
  {id:1345,type:'multi',answer:'ABD',stem:'以下哪些是Multi-Head Attention相比单头注意力的优势？',opts:['允许模型关注不同表示子空间的信息','增强模型的表达能力','消除位置编码的需求','不同头可以学习不同的注意力模式'],exp:'多头发送多个独立的注意力计算，从不同角度捕获语义关系，增强表达能力。但位置编码的引入是多头注意力的补充而非替代。'},
  {id:1346,type:'multi',answer:'ABC',stem:'以下哪些属于常见的分词算法？',opts:['BPE（Byte Pair Encoding）','WordPiece','SentencePiece','CNN卷积分词'],exp:'BPE、WordPiece和SentencePiece都是主流子词分词算法；CNN卷积分词不是标准分词方法，分词通常基于统计而非卷积。'},
  {id:1347,type:'multi',answer:'ABD',stem:'关于Tokenization（分词），以下说法正确的有哪些？',opts:['分词是将原始文本转换为模型可处理的Token序列','同一段文本使用不同分词器可能产生不同的Token序列','分词后Token数量一定小于原始文本字符数','分词器通常包含一个词表（Vocabulary）用于映射Token到ID'],exp:'分词将文本切分为Token序列，不同分词器结果不同；分词器有固定词表做映射。但Token数可能多于字符数（如中文字符本身是Token但可能被拆分为子词）。'},
  {id:1348,type:'multi',answer:'ABCDE',stem:'以下哪些属于大模型常见的解码策略？',opts:['贪心解码（Greedy Decoding）','Beam Search（束搜索）','Top-k采样','Top-p（Nucleus）采样','随机采样'],exp:'五种都是常见解码策略：贪心选最优、Beam Search维护多候选、Top-k限制候选范围、Top-p按累积概率截断、随机采样从分布采样。'},
  {id:1349,type:'multi',answer:'ABCD',stem:'大模型训练中，以下哪些属于常用的微调方法？',opts:['SFT（有监督微调）','RLHF（基于人类反馈的强化学习）','DPO（直接偏好优化）','LoRA（低秩适配）'],exp:'四种都是主流微调方法。SFT用标注数据调优，RLHF用人类偏好强化学习，DPO直接优化偏好，LoRA通过低秩矩阵高效适配。'},
  {id:1350,type:'multi',answer:'ABCD',stem:'关于LoRA微调，以下说法正确的有哪些？',opts:['LoRA在原始预训练权重旁添加低秩矩阵','LoRA冻结原始模型权重，仅训练新增的低秩矩阵','LoRA可以显著减少可训练参数数量','多个LoRA模块可以合并到基础模型中进行推理'],exp:'LoRA通过添加低秩分解矩阵实现高效微调，冻结原权重仅训练增量矩阵，大幅减少参数量，且多个LoRA可合并部署。'},
  {id:1351,type:'multi',answer:'ABCD',stem:'以下哪些是评估大语言模型性能的常用指标？',opts:['困惑度（Perplexity）','BLEU','ROUGE','准确率（Accuracy）'],exp:'困惑度衡量语言模型质量；BLEU和ROUGE常用于机器翻译和摘要评估；准确率用于分类等有标准答案的任务。'},
  {id:1352,type:'multi',answer:'ABC',stem:'关于过拟合，以下描述正确的有哪些？',opts:['过拟合时训练损失很低但验证损失较高','数据量太少可能导致过拟合','Dropout正则化可以帮助缓解过拟合','过拟合意味着模型泛化能力强'],exp:'过拟合表现为训练损失低、验证损失高；数据不足、模型过复杂都可能导致；Dropout通过随机丢弃神经元缓解过拟合。过拟合恰恰说明泛化能力差。'},
  {id:1353,type:'multi',answer:'ABCD',stem:'以下哪些因素会影响Embedding向量的质量？',opts:['训练数据的规模和多样性','Embedding模型的架构','向量的维度大小','训练时使用的优化器'],exp:'训练数据决定覆盖面，模型架构影响表示能力，维度影响信息容量，优化器和训练策略也直接影响最终Embedding质量。'},
  {id:1354,type:'multi',answer:'ABC',stem:'关于RLHF训练流程，以下哪些是必要的步骤？',opts:['收集人类偏好标注数据','训练奖励模型（Reward Model）','使用PPO等强化学习算法优化策略','部署后持续收集用户反馈进行在线学习'],exp:'RLHF核心三步：SFT获得初始策略→训练奖励模型→PPO优化策略。在线学习非RLHF必要步骤，是额外的高级优化手段。'},
  {id:1355,type:'multi',answer:'ABD',stem:'关于Transformer中的残差连接（Residual Connection），以下说法正确的有哪些？',opts:['将输入直接加到子层输出上','有助于缓解深层网络的梯度消失问题','是Layer Normalization的替代方案','使信息可以跨层直接传递'],exp:'残差连接将输入与子层输出相加，缓解梯度消失，允许信息跨层流动。Layer Norm与残差连接是不同的机制，常配合使用而非替代关系。'},
  {id:1356,type:'multi',answer:'ABCD',stem:'大模型训练中，以下哪些策略可以提高训练效率？',opts:['混合精度训练','梯度累积','数据并行','模型并行'],exp:'混合精度加速计算节省显存；梯度累积模拟大批量；数据并行在多设备同时训练不同数据；模型并行将模型拆分到多个设备。'},
  {id:1357,type:'multi',answer:'ABCD',stem:'以下哪些是Transformer架构的关键组件？',opts:['Self-Attention（自注意力）','Feed-Forward Network（前馈网络）','Layer Normalization（层归一化）','残差连接'],exp:'Transformer的核心组件：Self-Attention负责序列建模，FFN提供非线性变换，Layer Norm稳定训练，残差连接促进梯度流动。'},
  {id:1358,type:'multi',answer:'ABCD',stem:'关于DPO（Direct Preference Optimization），以下说法正确的有哪些？',opts:['DPO直接使用偏好数据优化策略模型','DPO无需训练独立的奖励模型','DPO比RLHF实现更简单','DPO的训练目标基于对比损失'],exp:'DPO简化了RLHF流程，直接用偏好对数据优化策略，无需奖励模型，基于排序损失（对比损失）最大化偏好回答与非偏好回答的概率差。'},
  {id:1359,type:'multi',answer:'ABCDE',stem:'阿里云百炼平台模型广场中提供以下哪些通义千问系列模型？',opts:['qwen-turbo','qwen-plus','qwen-max','qwen-long','qwen-vl'],exp:'百炼模型广场提供完整的通义千问模型家族，涵盖Turbo（速度优先）、Plus（均衡）、Max（性能最强）、Long（长文本）、VL（多模态）。'},
  {id:1360,type:'multi',answer:'ABCDE',stem:'阿里云百炼平台Assistant API支持以下哪些能力？',opts:['自定义系统指令（Instructions）','工具调用（Function Calling）','关联知识库文件','创建和管理对话线程（Thread）','自动处理多步工具调用循环'],exp:'Assistant API提供完整的智能体能力：自定义指令、工具调用、文件关联、对话管理以及自动工具调用循环处理。'},
  {id:1361,type:'multi',answer:'ABC',stem:'以下哪些属于阿里云百炼平台支持的计费方式？',opts:['按量付费（按Token计费）','包年包月','预付费资源包','按调用次数计费'],exp:'百炼支持按量付费（Token计费）、包年包月和资源包三种计费模式，不按调用次数计费（因为每次调用的Token消耗不同）。'},
  {id:1362,type:'multi',answer:'ABCD',stem:'在阿里云百炼平台进行API调用时，以下哪些做法是安全的最佳实践？',opts:['将API Key存储在环境变量中','定期轮换API Key','为不同应用创建不同的API Key','永远不会在前端代码中暴露API Key'],exp:'四者均为API Key安全管理最佳实践：环境变量隔离、定期轮换降低泄露风险、最小权限隔离应用、禁止前端暴露。'},
  {id:1363,type:'multi',answer:'ABCDEF',stem:'阿里云百炼平台中，调用chat.completions.create接口时支持的参数包括哪些？',opts:['model','messages','temperature','max_tokens','stream','top_p'],exp:'上述均为chat.completions.create接口的常用参数，兼容OpenAI接口规范，用于控制模型选择、对话内容、生成策略等。'},
  {id:1364,type:'multi',answer:'ABC',stem:'关于阿里云百炼平台qwen-max模型，以下描述正确的有哪些？',opts:['是通义千问系列中综合性能最强的模型','适合处理复杂推理和高质量生成任务','在百炼平台中单价最高','不支持Function Calling'],exp:'qwen-max是性能旗舰，推理能力最强，Token单价最高。但它完全支持Function Calling等高级功能。'},
  {id:1365,type:'multi',answer:'ABD',stem:'以下哪些情况适合在阿里云百炼平台使用qwen-long模型？',opts:['处理长篇合同文本分析','对整本技术手册进行问答','简短对话回复','大规模文档的摘要生成'],exp:'qwen-long专为长文本设计，支持百万Token上下文，适合长篇文档分析、手册问答和摘要。简短对话用qwen-turbo更经济。'},
  {id:1366,type:'multi',answer:'AB',stem:'阿里云百炼平台支持的API认证方式有哪些？',opts:['API Key认证','Bearer Token认证','OAuth 2.0认证','基本认证（Basic Auth）'],exp:'百炼平台主要通过API Key进行认证（在请求头中以Bearer Token形式传递）。平台不采用OAuth 2.0或Basic Auth方式。'},
  {id:1367,type:'multi',answer:'ABCD',stem:'在百炼平台使用模型服务时，以下哪些情况会触发API调用限制？',opts:['超过每分钟请求次数上限（RPM）','超过每分钟Token消耗上限（TPM）','超过单次请求的max_tokens限制','API Key余额不足'],exp:'百炼对调用有多维度限制：RPM限制请求频率、TPM限制Token消耗速率、max_tokens限制单次输出长度、余额不足也会导致调用失败。'},
  {id:1368,type:'multi',answer:'ABD',stem:'关于阿里云百炼平台中专属模型部署，以下说法正确的有哪些？',opts:['部署后的专属模型拥有独立的调用端点','专属模型可以享受弹性伸缩能力','专属模型部署后立即对所有用户可见','用户需为部署占用的计算资源付费'],exp:'专属模型独立部署，支持弹性伸缩，占用资源需付费。部署后的模型仅对用户自己可见，不对外开放。'},
  {id:1369,type:'multi',answer:'ABC',stem:'阿里云百炼平台中，以下哪些因素会影响API调用的最终费用？',opts:['选择的模型类型（如qwen-turbo vs qwen-max）','输入文本的Token数量','输出文本的Token数量','是否启用流式输出（stream）'],exp:'费用由模型类型（不同模型单价不同）、输入Token数和输出Token数共同决定。流式输出不影响计费，仅改变传输方式。'},
  {id:1370,type:'multi',answer:'ABCDE',stem:'在百炼平台Assistant API中，创建Assistant时可以配置以下哪些内容？',opts:['名称（name）','指令（instructions）','关联的工具列表（tools）','关联的知识库文件（file_ids）','使用的模型（model）'],exp:'创建Assistant时可配置名称、系统指令、工具列表、关联文件和底层模型，全面定制智能助手的行为和能力。'},
  {id:1371,type:'multi',answer:'ABCDE',stem:'以下哪些是阿里云百炼平台的优势特点？',opts:['兼容OpenAI接口规范，迁移成本低','提供多种规格模型满足不同场景','支持模型微调和专属部署','提供Assistant API实现智能体','中文理解和生成能力强'],exp:'百炼平台具备上述所有优势：兼容性、模型多样性、微调与部署能力、Agent能力以及卓越的中文处理能力。'},
  {id:1372,type:'multi',answer:'ABCD',stem:'百炼平台返回的API错误中，以下哪些是常见的错误类型？',opts:['invalid_api_key（无效API Key）','context_length_exceeded（上下文超长）','rate_limit_error（频率限制）','content_filter（内容审核拦截）'],exp:'四种均为常见API错误：Key无效、上下文超长需截断、调用频率超限、内容违规被拦截，开发中需做好相应错误处理。'},
  {id:1373,type:'multi',answer:'ABCD',stem:'关于百炼平台按量付费，以下描述正确的有哪些？',opts:['按实际消耗的Token数量计费','不同模型的Token单价不同','输入Token和输出Token分别计费','不调用时不产生费用'],exp:'按量付费完全按消耗计费，不同模型单价不同，输入和输出Token分别计费且单价不同（输出通常更贵），不调用不付费。'},
  {id:1374,type:'multi',answer:'ABCD',stem:'在阿里云百炼平台中，以下哪些模型支持多轮对话功能？',opts:['qwen-turbo','qwen-plus','qwen-max','qwen-long'],exp:'所有通义千问系列聊天模型均原生支持多轮对话，通过在messages数组中传入历史对话即可实现。'},
  {id:1375,type:'multi',answer:'ABCD',stem:'以下哪些是阿里云百炼平台模型调用的合理优化策略？',opts:['使用更高效的提示词减少输入Token','合理设置max_tokens避免不必要浪费','缓存常见问题的回答','根据任务复杂度选择合适级别的模型'],exp:'优化提示词、限制输出长度、缓存重复请求、匹配模型级别都是降低成本和提高效率的有效策略。'},
  {id:1376,type:'multi',answer:'ABCD',stem:'阿里云百炼平台中，为微调准备训练数据的规范包括哪些？',opts:['数据格式需符合平台要求的JSONL格式','每条数据包含messages字段','数据量至少达到平台最低要求','数据应覆盖目标任务的各种场景'],exp:'微调数据需满足格式（JSONL）、结构（messages格式）、数量（最低门槛）和质量（场景覆盖）四个维度的要求。'},
  {id:1377,type:'multi',answer:'ABC',stem:'以下关于百炼平台模型qwen-vl的描述，正确的有哪些？',opts:['支持图像输入','可以进行视觉问答','能够描述图片内容','支持视频输入'],exp:'qwen-vl是视觉语言模型，支持图像输入、视觉问答和图片描述。视频输入不是qwen-vl的官方支持功能。'},
  {id:1378,type:'multi',answer:'ABC',stem:'在百炼平台使用Assistant API时，Thread（对话线程）的作用包括哪些？',opts:['存储消息历史','自动管理上下文窗口截断','隔离不同用户的对话','加速模型推理'],exp:'Thread管理对话生命周期，存储消息历史，自动处理上下文超限的截断，并为不同对话提供隔离。不影响底层推理速度。'},
  {id:1379,type:'multi',answer:'ABC',stem:'在对话式AI中，消息的三种标准角色包括哪些？',opts:['System','User','Assistant','Moderator'],exp:'OpenAI兼容接口定义了三种标准角色：System（设定规则）、User（用户输入）、Assistant（模型回复）。Moderator不是标准角色。'},
  {id:1380,type:'multi',answer:'ABC',stem:'以下哪些是System Prompt的典型用途？',opts:['定义AI助手的角色和个性','设定回答的输出格式','限制AI助手的行为边界','存储对话历史记录'],exp:'System Prompt用于定义角色、格式和行为边界。对话历史通过messages数组中的User和Assistant消息存储，不放在System Prompt中。'},
  {id:1381,type:'multi',answer:'ABC',stem:'Few-shot提示相比Zero-shot提示的优势包括哪些？',opts:['帮助模型更好地理解任务格式','提高输出的一致性和准确性','减少对模型推理能力的依赖','完全消除模型产生错误的可能性'],exp:'Few-shot通过示例明确任务格式和期望输出，降低理解歧义，提升准确性。但不能完全消除错误，模型仍可能出现偏差。'},
  {id:1382,type:'multi',answer:'ABC',stem:'Chain-of-Thought（CoT）提示适用于以下哪些类型的任务？',opts:['数学推理题','逻辑推理题','多步骤问题求解','简单的事实查询'],exp:'CoT通过引导逐步推理，显著提升数学、逻辑和多步问题等复杂推理任务的表现。简单事实查询通常不需要CoT。'},
  {id:1383,type:'multi',answer:'ABC',stem:'在提示词中使用分隔符的好处包括哪些？',opts:['清晰区分提示词的不同组成部分','防止用户输入与系统指令混淆','减少提示词注入攻击的风险','提高模型生成速度'],exp:'分隔符帮助清晰区分指令、上下文和输入，降低混淆和注入风险。分隔符不直接影响模型推理速度。'},
  {id:1384,type:'multi',answer:'ABCD',stem:'以下哪些是编写高质量System Prompt的建议？',opts:['使用清晰明确的语言','明确说明期望的输出格式','设定行为边界和不做什么','提供必要的背景和上下文信息'],exp:'清晰语言、格式说明、行为边界和必要上下文都是编写高质量System Prompt的关键要素。'},
  {id:1385,type:'multi',answer:'ABD',stem:'关于提示词中的角色扮演，以下说法正确的有哪些？',opts:['可以赋予模型特定的专业身份','角色设定越具体，回答通常越精准','角色扮演提示词应放在User消息中','角色设定可以帮助模型选择合适的语言风格'],exp:'角色扮演通过设定专业身份引导回答风格和质量，设定越具体效果越好。但角色设定应放在System Prompt中，而非User消息。'},
  {id:1386,type:'multi',answer:'ABCD',stem:'格式化输出提示中，以下哪些是常见的做法？',opts:['明确要求JSON格式并给出示例','使用Markdown标记指定结构','要求输出包含特定字段','提供输出模板'],exp:'指定格式、提供示例、定义字段和给出模板都是确保模型输出结构化内容的有效提示技巧。'},
  {id:1387,type:'multi',answer:'ABCD',stem:'以下哪些因素会影响Few-shot提示的效果？',opts:['示例的数量','示例的质量和代表性','示例的排列顺序','示例与目标任务的相似度'],exp:'示例数量影响模型学习充分性，质量和代表性决定学习正确性，排列顺序可能影响近因偏差，与任务相似度直接影响泛化效果。'},
  {id:1388,type:'multi',answer:'ABC',stem:'提示词工程中，处理模型"幻觉"的有效策略包括哪些？',opts:['在提示词中要求模型承认不确定性','要求模型引用信息来源','使用RAG提供事实基础','禁止模型给出任何不确定的回答'],exp:'承认不确定性、引用来源和使用RAG都可以减少幻觉。禁止表达不确定反而可能导致模型编造答案，增加幻觉风险。'},
  {id:1389,type:'multi',answer:'ABCD',stem:'关于提示词优化，以下哪些做法是合理的？',opts:['通过迭代测试逐步改进提示词','使用A/B测试比较不同提示词效果','根据模型输出来反向调整提示词','将提示词优化过程自动化'],exp:'迭代测试、A/B对比、基于输出反馈和自动化优化都是提示词工程的合理实践，帮助持续提升效果。'},
  {id:1390,type:'multi',answer:'ABC',stem:'在对话式AI中，管理多轮对话上下文的方法有哪些？',opts:['在messages数组中保留历史User和Assistant消息','定期总结对话内容压缩上下文','使用滑动窗口保留最近N轮对话','完全忽略历史对话仅处理当前输入'],exp:'messages数组、对话总结和滑动窗口都是常用上下文管理策略。完全忽略历史会导致失去对话连续性，不适用于多轮场景。'},
  {id:1391,type:'multi',answer:'ABCD',stem:'以下哪些是提示词注入攻击的常见形式？',opts:['让模型忽略之前的指令','冒充System角色发布指令','要求模型输出私密信息','在输入中嵌入隐藏指令'],exp:'四种都是常见注入手法：指令覆盖、角色冒充、数据窃取和隐藏指令，都需要在安全设计时加以防范。'},
  {id:1392,type:'multi',answer:'ABCD',stem:'提升模型遵循复杂指令能力的有效方式包括哪些？',opts:['将复杂指令分解为清晰的步骤列表','使用编号或项目符号组织指令','在指令中提供正确示例','使用强调标记突出关键约束'],exp:'分解步骤、结构组织、提供示例和突出重点都是帮助模型准确理解和遵循复杂指令的有效手段。'},
  {id:1393,type:'multi',answer:'ABD',stem:'以下哪些属于提示词工程的最佳实践？',opts:['提示词应简洁明确，避免歧义','提供正例比反例更有效','将重要指令放在提示词后面','根据模型能力选择合适的提示策略'],exp:'简洁明确、正向示例和匹配模型能力都是最佳实践。重要指令通常应放在前面或System Prompt中，模型对提示词开头和结尾更敏感。'},
  {id:1394,type:'multi',answer:'ABC',stem:'RAG（检索增强生成）系统的核心优势包括哪些？',opts:['缓解大模型的幻觉问题','使模型能够访问最新的外部知识','提供可追溯的答案来源','完全替代模型微调'],exp:'RAG通过检索真实文档减少幻觉、获取最新知识、提供来源引用。但RAG不能完全替代微调，两者适用场景不同。'},
  {id:1395,type:'multi',answer:'ABCD',stem:'RAG系统中，文档分块的常见策略包括哪些？',opts:['固定Token数切片','按句子边界分块','滑动窗口分块（含重叠）','按段落语义分块'],exp:'四种都是常见分块策略：Token切片精确控制长度，句子切片保语义完整，滑动窗口保上下文连续，段落分块保语义单元完整。'},
  {id:1396,type:'multi',answer:'ABC',stem:'以下哪些是RAG检索阶段的关键步骤？',opts:['将用户查询转换为向量','在向量数据库中执行相似度检索','对检索结果进行重排序（Rerank）','对原始文档进行重新分块'],exp:'检索阶段包括Query向量化、相似度检索和可选的重排序。文档重新分块是索引预处理阶段的操作，不属于检索阶段。'},
  {id:1397,type:'multi',answer:'ABCDE',stem:'以下哪些是常见的向量数据库？',opts:['Milvus','Faiss','Chroma','Pinecone','Weaviate'],exp:'五个都是主流的向量数据库：Milvus（高性能开源）、Faiss（Meta开源）、Chroma（轻量级）、Pinecone（云托管）、Weaviate（开源）。'},
  {id:1398,type:'multi',answer:'ABC',stem:'在RAG系统中，Query改写可以采取以下哪些策略？',opts:['扩展缩写和同义词','补充上下文信息','将复杂问题拆分为多个子查询','翻译为其他语言'],exp:'Query改写包括缩略词扩展、同义词替换、上下文补充和多查询拆分以提升检索召回质量。翻译改变语种可能破坏语义准确性。'},
  {id:1399,type:'multi',answer:'ABCDE',stem:'RAG系统评估中，以下哪些是常用的评估指标？',opts:['Answer Correctness（答案正确性）','召回率（Recall）','精确率（Precision）','答案忠实度（Faithfulness）','答案相关性（Relevancy）'],exp:'五个指标都是RAG评估常用维度：正确性评估事实准确、召回率和精确率评估检索质量、忠实度评估是否依据上下文、相关性评估回答切题度。'},
  {id:1400,type:'multi',answer:'ABCD',stem:'以下哪些因素会影响RAG系统中检索的质量？',opts:['Embedding模型的选型','文档分块的粒度','向量数据库的索引类型','用户输入问题的表述方式'],exp:'Embedding模型决定向量质量，分块粒度影响检索精度，索引类型影响搜索效率，用户问题表述影响Query向量化结果。'},
  {id:1401,type:'multi',answer:'ABD',stem:'在多轮对话RAG中，处理对话历史的方式包括哪些？',opts:['将历史对话内容融入检索Query','使用独立的对话管理器存储和更新上下文','将最近的用户问题作为独立Query忽略历史','对历史对话进行总结后融入当前Query'],exp:'融入历史、独立管理和总结融合都是多轮RAG的上下文处理策略。完全忽略历史导致上下文断裂，不适用于多轮对话。'},
  {id:1402,type:'multi',answer:'ACD',stem:'以下哪些属于Rerank（重排序）模型的常见类型？',opts:['基于交叉编码器（Cross-Encoder）的重排序','基于BM25的重排序','基于LLM的重排序','基于双编码器（Bi-Encoder）的重排序'],exp:'Cross-Encoder精细对比、LLM语义判断和Bi-Encoder双向编码都可用于重排序。BM25是稀疏检索方法，通常用于初检而非精排。'},
  {id:1403,type:'multi',answer:'ABCD',stem:'RAG建立索引阶段包括以下哪些操作？',opts:['文档解析','文本分块','文本向量化','构建向量索引'],exp:'索引建立阶段完整流程为：加载文档→解析文本→分块→向量化→构建索引，以上四项都是该阶段的必要操作。'},
  {id:1404,type:'multi',answer:'ABCD',stem:'提升RAG系统答案质量的策略包括哪些？',opts:['优化文档分块策略','引入Rerank模型提升检索精度','使用更强大的生成模型','设计更精准的System Prompt指导生成'],exp:'分块策略影响检索质量，Rerank提升排序精准度，模型能力决定生成质量，Prompt设计影响答案组织。四者协同提升整体效果。'},
  {id:1405,type:'multi',answer:'ABC',stem:'RAG系统中检索返回结果过少时，可以采取以下哪些措施？',opts:['降低相似度阈值','增加检索返回的Top-K值','使用Query改写拓宽搜索范围','减少文档分块的大小'],exp:'降低阈值和增大Top-K直接增加返回结果，Query改写可扩大语义匹配范围。减少分块大小可能进一步缩小每个块的覆盖信息。'},
  {id:1406,type:'multi',answer:'ABC',stem:'以下哪些场景适合使用RAG解决方案？',opts:['企业内部知识库问答','客服系统实时检索产品文档','需要引用最新法规的法律咨询','需要模型学习新的对话风格'],exp:'RAG适合知识密集型、需实时更新和可追溯的任务。学习新的对话风格属于行为改变，适合微调而非RAG。'},
  {id:1407,type:'multi',answer:'ABCD',stem:'在RAG系统中，关于Embedding模型的选择，以下哪些考虑因素是合理的？',opts:['模型对中文语义的理解能力','Embedding向量的维度','模型的最大输入长度','模型的推理速度'],exp:'语义理解力影响检索准确性，维度影响存储和检索效率，输入长度限制影响分块策略，推理速度影响系统响应时间。'},
  {id:1408,type:'multi',answer:'ABD',stem:'以下哪些是混合检索（Hybrid Search）的优势？',opts:['兼顾关键词精确匹配和语义理解','对专业术语和缩写有更好的检索效果','消除对所有结果进行重排序的需要','提升整体检索的鲁棒性和召回率'],exp:'混合检索结合稀疏检索的精确匹配优势和稠密检索的语义理解优势，对专业术语、缩写等有更好覆盖。重排序仍可作为后续优化手段。'},
  {id:1409,type:'multi',answer:'ABC',stem:'关于RAG中文档解析，以下说法正确的有哪些？',opts:['PDF文档中的表格和图片需要特殊处理','Markdown格式天然结构化，解析相对容易','文档解析质量直接影响后续检索效果','所有格式文档使用同一种解析方法最有效'],exp:'PDF中的复杂元素需特殊解析，Markdown结构化程度高便于处理，解析质量直接决定数据质量。不同格式需选用不同的解析策略。'},
  {id:1410,type:'multi',answer:'ABC',stem:'在RAG系统中，处理检索结果的上下文扩展策略包括哪些？',opts:['合并相邻文档块以恢复上下文','基于文档层次结构扩展父级节点','使用LLM对多片段进行总结后输入','仅使用检索到的片段，不作任何扩展'],exp:'相邻块合并、层次扩展和LLM总结都是常见上下文扩展策略。仅使用原始片段可能丢失关键上下文信息。'},
  {id:1411,type:'multi',answer:'ABCD',stem:'以下哪些是RAG应用中常见的问题和挑战？',opts:['检索结果不相关导致回答偏离主题','文档分块边界割裂关键信息','向量检索难以处理精确匹配需求','检索延迟影响用户体验'],exp:'检索相关性不足、分块信息割裂、精确匹配困难和大规模检索延迟都是RAG系统的常见挑战，需要针对性优化。'},
  {id:1412,type:'multi',answer:'ABC',stem:'RAG系统中，内容去重的作用包括哪些？',opts:['减少输入给LLM的冗余信息','在有限上下文窗口内纳入更多不同的信息','降低API调用成本','提升检索的召回率'],exp:'去重消除重复内容，使上下文窗口容纳更多不同信息，同时减少不必要的Token消耗。去重影响精确率而非召回率。'},
  {id:1413,type:'multi',answer:'ABD',stem:'以下哪些属于RAG系统的检索前优化手段？',opts:['Query改写','查询扩展','Rerank重排序','多路召回'],exp:'Query改写、查询扩展和多路召回是检索前的优化手段；Rerank是检索后对结果的重排序，属于检索后优化。'},
  {id:1414,type:'multi',answer:'ABCD',stem:'LlamaIndex框架提供以下哪些核心功能？',opts:['多种文档加载器（Data Loaders）','索引构建（Index Construction）','查询引擎（Query Engine）','节点后处理器（Node Postprocessor）'],exp:'LlamaIndex提供完整的数据处理链路：加载器读取数据、索引构建组织数据、查询引擎执行检索、后处理器优化结果。'},
  {id:1415,type:'multi',answer:'ABCD',stem:'LangChain框架中，以下哪些是常用的Chain类型？',opts:['LLMChain','SequentialChain','RouterChain','RetrievalQAChain'],exp:'LLMChain（基础调用）、SequentialChain（顺序执行）、RouterChain（条件路由）和RetrievalQAChain（检索问答）都是常用Chain类型。'},
  {id:1416,type:'multi',answer:'ABCD',stem:'在LangChain中定义Agent时，通常需要以下哪些组件？',opts:['LLM（语言模型）','一组可用的Tool（工具）','Agent类型（如ReAct、OpenAI Functions）','输出解析器'],exp:'Agent需要LLM作为推理引擎、Tools作为能力扩展、Agent类型决定推理范式、输出解析器将推理结果转为行动。'},
  {id:1417,type:'multi',answer:'ABCD',stem:'ModelScope-Agent支持以下哪些能力？',opts:['单智能体任务执行','多智能体协作','工具注册与管理','工具参数自动提取'],exp:'ModelScope-Agent支持单/多智能体模式，提供工具注册管理和基于LLM的工具参数自动提取能力。'},
  {id:1418,type:'multi',answer:'ABCD',stem:'在LlamaIndex中构建索引时，以下哪些索引类型是支持的？',opts:['VectorStoreIndex（向量存储索引）','SummaryIndex（摘要索引）','TreeIndex（树形索引）','KeywordTableIndex（关键词表索引）'],exp:'四种都是LlamaIndex支持的索引类型，适用于不同的检索场景和数据组织需求。'},
  {id:1419,type:'multi',answer:'ABCD',stem:'LangChain的Tool定义中应包括以下哪些要素？',opts:['name（工具名称）','description（工具描述）','func（执行函数）','args_schema（参数模式，可选）'],exp:'name、description和func是Tool的三个基本要素。args_schema（通常用Pydantic定义）帮助Agent理解参数类型和含义。'},
  {id:1420,type:'multi',answer:'ABCD',stem:'以下哪些是LangChain中Memory组件的常见实现？',opts:['ConversationBufferMemory','ConversationSummaryMemory','ConversationBufferWindowMemory','VectorStoreRetrieverMemory'],exp:'Buffer缓存完整历史、Summary压缩为摘要、Window保留最近N轮、VectorStore基于向量检索相关历史，四种各有所长。'},
  {id:1421,type:'multi',answer:'ABCD',stem:'LlamaIndex中，以下哪些是NodePostprocessor的常见用途？',opts:['按相似度分数过滤节点','根据关键词过滤节点','对节点按时间排序','截断过长的节点内容'],exp:'NodePostprocessor功能丰富：相似度过滤、关键词过滤、排序、截断等都是常见后处理操作，提升检索结果质量。'},
  {id:1422,type:'multi',answer:'ABD',stem:'关于LangChain中的RetrievalQA链，以下说法正确的有哪些？',opts:['结合了检索器和问答链','可以配置不同的Chain类型（stuff、refine、map_reduce等）','仅支持单个文档的检索','支持自定义Prompt模板'],exp:'RetrievalQA链结合检索和生成，支持stuff/refine/map_reduce等合并策略，允许自定义Prompt。它可以从多个文档中检索。'},
  {id:1423,type:'multi',answer:'ABCD',stem:'以下哪些是选择RAG框架（LangChain vs LlamaIndex）时的合理考虑因素？',opts:['项目对数据索引和检索的复杂度要求','是否需要Agent和工具调用能力','团队技术栈和学习曲线','框架的社区活跃度和文档质量'],exp:'LlamaIndex擅长数据索引和检索，LangChain在Agent和链式编排方面更强。技术栈、学习成本和社区支持也是重要考量。'},
  {id:1424,type:'multi',answer:'ABCD',stem:'在LlamaIndex中，文档加载器（Reader）支持的输入格式包括哪些？',opts:['PDF文件','Markdown文件','网页URL','数据库记录'],exp:'LlamaIndex有丰富的Reader生态，支持PDF、Markdown、网页、数据库、API等多种数据源的加载。'},
  {id:1425,type:'multi',answer:'ABCD',stem:'LangChain框架的核心设计理念包括哪些？',opts:['组件化（Components）：提供可组合的模块化抽象','链式调用（Chains）：将组件串联为可执行的管道','智能体（Agents）：赋予LLM自主决策和工具调用能力','内存管理（Memory）：在链和Agent调用之间持久化状态'],exp:'LangChain的四大核心设计：Components模块化抽象、Chains管道编排、Agents自主决策、Memory状态持久化。'},
  {id:1426,type:'multi',answer:'ABC',stem:'ModelScope-Agent中，工具参数的提取可以基于以下哪些方式？',opts:['基于LLM的自然语言理解','基于正则表达式的模式匹配','基于预定义Schema的结构化解析','基于人工手动输入'],exp:'ModelScope-Agent支持LLM理解、正则匹配和Schema解析等多种自动参数提取方式。目标是自动化，非依赖人工输入。'},
  {id:1427,type:'multi',answer:'ABCD',stem:'在使用LlamaIndex的QueryEngine时，可以配置以下哪些选项？',opts:['response_mode（回答模式，如compact、tree_summarize）','similarity_top_k（检索返回的Top-K值）','node_postprocessors（后处理器列表）','text_qa_template（问答提示模板）'],exp:'QueryEngine支持上述所有配置选项，通过这些参数精细控制检索、后处理和生成的全流程行为。'},
  {id:1428,type:'multi',answer:'ABCD',stem:'以下哪些是LangChain中常用的文档加载器？',opts:['TextLoader','PyPDFLoader','CSVLoader','WebBaseLoader'],exp:'TextLoader加载纯文本、PyPDFLoader加载PDF、CSVLoader加载表格数据、WebBaseLoader加载网页，覆盖主流数据源。'},
  {id:1429,type:'multi',answer:'ABCD',stem:'以下哪些属于大模型微调中需要关注的关键超参数？',opts:['学习率（Learning Rate）','训练轮数（Epochs）','批次大小（Batch Size）','LoRA的秩（Rank）'],exp:'学习率影响收敛速度和稳定性，训练轮数控制训练充分度，批次大小影响梯度估计精度，LoRA秩控制可训参数量。'},
  {id:1430,type:'multi',answer:'ABC',stem:'在微调数据准备中，以下哪些做法有助于提升微调效果？',opts:['确保数据格式与目标格式一致','覆盖目标任务的多样化场景','清洗低质量和重复数据','数据量越多越好，无需关注质量'],exp:'格式一致、场景多样和数据清洗是提升微调质量的关键。数据量虽重要，但质量优先于数量，低质量数据可能损害模型性能。'},
  {id:1431,type:'multi',answer:'ABC',stem:'LoRA微调相比全量微调的优势包括哪些？',opts:['可训练参数大幅减少','训练速度和内存需求显著降低','可以灵活切换不同的LoRA模块','微调后的模型质量总是优于全量微调'],exp:'LoRA减少参数量、加速训练、节省显存，且可插拔切换不同LoRA模块。但LoRA效果并非总是优于全量微调，对复杂任务全量微调可能更好。'},
  {id:1432,type:'multi',answer:'ABD',stem:'以下哪些情况更适合选择微调而非RAG？',opts:['需要模型永久掌握某个领域的写作风格','需要模型学会特定的输出格式习惯','知识库内容每天频繁变化','需要将知识内化到模型参数中以提高推理速度'],exp:'微调适合内化稳定知识和行为模式。知识频繁变化的场景（C）更适合RAG，因为RAG无需重新训练即可更新知识。'},
  {id:1433,type:'multi',answer:'ABC',stem:'训练损失和验证损失的分析中，以下哪些说法是正确的？',opts:['训练损失持续下降说明模型在学习','验证损失先降后升提示可能发生过拟合','训练损失和验证损失均很高可能表示欠拟合','训练损失始终为零是理想状态'],exp:'训练损失下降是学习信号，验证损失反弹提示过拟合，两者都高表示欠拟合。训练损失为零往往是过度拟合的表现。'},
  {id:1434,type:'multi',answer:'ABCD',stem:'以下哪些是模型微调中防止过拟合的常用手段？',opts:['使用Dropout正则化','早停法（Early Stopping）','增加训练数据量','使用权重衰减（Weight Decay）'],exp:'Dropout随机失活神经元、早停在验证损失不再改善时停止、增加数据提升泛化、权重衰减限制参数规模，都是有效的防过拟合措施。'},
  {id:1435,type:'multi',answer:'ABD',stem:'关于百炼平台中的模型部署，以下说法正确的有哪些？',opts:['支持弹性部署按流量自动扩缩','部署后的模型通过统一的API接口调用','部署完成后即可无限次免费调用','部署资源在业务低峰时可自动缩减以降低成本'],exp:'百炼支持弹性部署和自动扩缩，统一API调用。部署占用计算资源需按资源使用付费，并非免费调用。'},
  {id:1436,type:'multi',answer:'ABC',stem:'在微调训练过程中，以下哪些信号表明训练可能需要调整？',opts:['损失值不下降或下降极慢','损失值剧烈震荡','损失值突然变为NaN','验证损失远低于训练损失'],exp:'损失不降说明学习率过低或数据有问题，震荡说明学习率过高，NaN说明数值溢出。验证损失低于训练损失通常不正常。'},
  {id:1437,type:'multi',answer:'ABCD',stem:'以下哪些因素会影响微调的最终效果？',opts:['预训练基座模型的选择','训练数据的质量和数量','超参数的设置','微调方法的选择（LoRA vs 全量微调）'],exp:'基座模型决定能力上限，数据质量决定学习方向，超参数控制训练过程，微调方法影响效率和效果上限，四者缺一不可。'},
  {id:1438,type:'multi',answer:'ABCD',stem:'关于LoRA微调，以下哪些参数的设置会影响最终效果？',opts:['r（秩/rank）','alpha（缩放参数）','target_modules（目标模块）','dropout'],exp:'r控制低秩矩阵维度，alpha控制更新幅度，target_modules决定应用哪些层，dropout提供正则化。四个都是LoRA的关键参数。'},
  {id:1439,type:'multi',answer:'ABCD',stem:'以下哪些属于大模型应用中的安全风险？',opts:['提示词注入（Prompt Injection）','数据泄露和隐私侵犯','生成有害或违规内容','模型被用于生成虚假信息'],exp:'提示词注入绕过安全约束、数据泄露暴露敏感信息、有害内容违反合规要求、虚假信息传播破坏信任，均为重要安全风险。'},
  {id:1440,type:'multi',answer:'ABC',stem:'防范提示词注入的有效措施包括哪些？',opts:['对用户输入进行内容过滤和清洗','在System Prompt中设置防御性指令','对模型输出进行审核','限制用户输入的长度'],exp:'输入过滤拦截恶意内容、防御指令强化System Prompt约束、输出审核兜底检测异常，三者构成多层防御。仅限制长度无法有效防范。'},
  {id:1441,type:'multi',answer:'ABCD',stem:'数据隐私保护的最佳实践包括哪些？',opts:['对用户数据进行脱敏处理','数据传输使用加密协议','遵循数据最小化原则','建立数据访问审计机制'],exp:'数据脱敏保护隐私、加密传输防止窃听、最小化原则减少暴露面、审计机制追溯异常访问，四者构成完整的隐私保护体系。'},
  {id:1442,type:'multi',answer:'ABCD',stem:'以下哪些是不安全插件设计的常见问题？',opts:['缺少输入校验和过滤','赋予插件过高的系统权限','插件直接执行用户提供的代码','插件的API端点未做身份认证'],exp:'输入未校验导致注入攻击、权限过高造成提权风险、执行用户代码引发远程代码执行、API未认证导致未授权访问，均属严重设计缺陷。'},
  {id:1443,type:'multi',answer:'ABCDE',stem:'内容安全审核系统通常需要检测以下哪些类型的内容？',opts:['色情和低俗内容','暴力和恐怖主义内容','政治敏感内容','违法违规信息','个人隐私信息泄露'],exp:'五类都是内容安全审核必须覆盖的范畴：色情低俗、暴力恐怖、政治敏感、违法违规和隐私泄露检测，确保输出合规安全。'},
  {id:1444,type:'multi',answer:'ABCEF',stem:'以下哪些情况可能导致大模型检索不准确？',opts:['文档中包含大量的图片信息,而当前的文档解析器无法有效提取和理解图片内容。','使用了基于深度学习的语义搜索引擎,但模型训练数据不足,导致检索结果不准确。','文档中包含复杂的表格结构,而简单的文本解析器无法理解表格单元格之间的关系。','使用了复杂的文档解析器,导致解析速度慢,影响检索效率。','索引构建过程中使用了错误的 embedding 模型,导致语义相似度计算错误。','文档切片时,仅简单地按照字符长度进行分割,丢失了文档的语义信息。'],exp:'文档中包含大量图片信息且解析器无法提取，会导致语义缺失，影响检索准确性。 语义搜索引擎训练数据不足，会降低模型对查询与文档的匹配能力。 复杂表格结构若被简单文本解析器处理，将丢失单元格间逻辑关系，导致语义错误。 使用错误的embedding模型会使向量表示偏离真实语义，造成相似度计算偏差。 按字符长度切片而非语义单位分割，会破坏上下文连贯性，降低检索相关性。'},
  {id:1445,type:'multi',answer:'AEF',stem:'关于Qwen-Max、CosyVoice和moviepy的协同使用，以下哪些说法是正确的?',opts:['CosyVoice 可以将文本转换为音频。','CosyVoice 的主要功能是视频剪辑。','moviepy 可以直接将文本转换为视频。','Qwen-Max 主要用于生成视频字幕。','moviepy 可以用来获取音频文件的持续时间,用于生成字幕。','使用这三个工具的典型流程是,Qwen-Max -> CosyVoice -> moviepy。'],exp:'Qwen-Max 是基于大规模语言模型的文本生成工具，常见应用于内容创作；CosyVoice 是文本转语音（TTS）工具；moviepy 是 Python 视频处理库，支持音视频剪辑与属性读取。选项 A 错误，moviepy 不直接支持文本生成视频，需依赖其他工具生成素材后进行编辑。选项 B 正确，CosyVoice 的 TTS 功能可将文本转为音频（官方文档示例）。选项 C 正确，典型流程为文本生成（Qwen-Max）→音频合成（CosyVoice）→视频处理（moviepy）。选项 D 错误，CosyVoice 核心功能是音频生成而非视频编辑。选项 E 正确，Qwen-Max 可生成文本内容如字幕（应用案例说明）。选项 F 正确，moviepy 的 AudioFileClip 类可获取音频时长（官方 API 文档）。'},
  {id:1446,type:'multi',answer:'ABDEF',stem:'小李正在使用阿里云百炼大模型服务平台开发一款AI语音助手APP。为了确保APP能够顺利上线，小李在开发过程中应注意哪些事项？',opts:['关注《生成式人工智能服务管理暂行办法》的最新动态,及时调整APP的功能和策略.','在APP上线前完成算法备案手续.','忽略备案要求,尽快上线抢占市场.','对用户生成的AIGC内容进行审核和过滤,避免传播违规信息.','收集用户数据前需获得用户明确同意,并保障用户数据安全.','在APP中明确告知用户该应用使用了AIGC技术.'],exp:'《生成式人工智能服务管理暂行办法》规定，生成式AI服务提供者需履行备案手续，并采取内容安全、数据保护等措施。A项对应及时遵循法规调整服务；B项涉及算法备案义务；D项符合内容审核要求；E项关联用户数据保护；F项属于透明度义务。C项违背备案规定。相关规定可见《暂行办法》第六条（备案）、第七条（内容安全）、第九条（数据合规）、第十一条（透明告知）。选项A、B、D、E、F均与法规条款吻合。'},
  {id:1447,type:'multi',answer:'ABCDEF',stem:'以下哪些因素会影响 RAG系统的性能?',opts:['硬件资源的限制','文档的质量和数量','向量数据库的类型和配置','查询语句的表达方式','所使用的预训练语言模型的大小和性能','切片方法的选择'],exp:'RAG系统性能受多个关键因素直接影响：硬件资源限制影响推理速度与并发能力；文档的质量和数据量决定检索相关性与覆盖度；向量数据库的类型和配置决定向量索引效率与召回率；查询语句的表达方式影响语义匹配精度；预训练语言模型的大小和性能决定生成内容的准确性和流畅性；切片方法的选择影响上下文完整性与信息密度。'},
  {id:1448,type:'multi',answer:'ABC',stem:'通过Llamaindex创建RAG 应用,这段代码有哪些问题？pythonQuery_engine = index.as_query_engine ( similarity_top_k=3,Streaming=True,Node_postprocessors=DepthScopeRank (top_n=8, model=gte-rerank"), SimilarityPostprocessor (similarity_cutoff=1)])Response = query_engine.retrieve("需求分析使用的工具是什么？")Response.print_response_stream',opts:['query_engine 不支持 retrieve','重排选中的 chunk 数大于初步召回的 chunk 数','相似度阈值设置过高','Llamaindex 在 RAG 回答时不可以使用流式输出'],exp:'A正确：Query_engine不支持retrieve方法，RAG查询应使用query方法而非retrieve。 B正确：重排序后top_n=8超过初始检索的similarity_top_k=3，导致重排序输入不足，无法有效执行。 C正确：相似度阈值设为1，意味着仅保留完全匹配的节点，实际向量相似度不可能达到1，将过滤全部结果。 D错误：Llamaindex支持流式输出，Streaming=True参数配置合法，Response.print_response_stream()语法正确。'},
  {id:1449,type:'multi',answer:'ABF',stem:'以下哪些描述符合基于语义的文档切片的理念？',opts:['使用机器学习模型对文档进行语义分析,并根据语义边界进行切分','在 Chunk 中添加上下文信息,例如标题、父级列表项等','将代码模块单独切出来,并标注其编程语言','将文档按照固定长度进行切分','将表格的每个单元格作为一个独立的 Chunk','根据文档的结构,例如标题、段落、列表等进行切分'],exp:'基于语义的文档切片理念，核心在于利用文档的语义结构和内容含义进行合理分割，而非机械地按固定长度或单元格切割。我们逐项分析： A选项正确，使用机器学习模型进行语义分析，根据语义边界（如段落主题转换、句子逻辑结束点）进行切分，符合语义切片的核心思想。 B选项正确，在切片时保留或添加上下文信息（如标题、父级列表项），能帮助每个切片段落（Chunk）保持语义的完整性和可理解性，这是语义切片的重要实践。 C选项正确，将代码模块单独切出并标注编程语言，是一种基于内容类型的语义分割，有利于后续对代码文本的专门处理和理解。 D选项错误，将文档按照固定长度（如固定字符数或词数）进行切分，是机械的分割方式，不依赖于语义分析，容易导致语义断裂，不符合基于语义的切片理念。 E选项错误，将表格的每个单元格作为一个独立的Chunk，同样是一种机械、不考虑语义关联的切割方式。表格中跨单元格的数据和表头共同构成完整语义，单独提取单元格会破坏信息。 F选项正确，根据文档的结构（如标题、段落、列表）进行切分，正是利用文档本身的语义结构（标题层级表示主题变化，段落表示论述单元）来实现语义切片。 因此，正确答案是ABCF。'},
  {id:1450,type:'multi',answer:'ACEF',stem:'下列关于将 AgentModule 类设计为基类的原因,正确的有哪些?PythonClass AgentModule () :Def init (self, name : str, description : str) :Self.name = nameSelf.description=descriptionDef call (self, query:str) :Return self.query (query)Def query (self, query:str) :Pass',opts:['简化子类中的构造函数,减少重复代码','由于 Python 不支持多重继承, 因此需要这样设计','允许每个子类定义自己的 query 方法,增加灵活性','作为一个基类,可以方便地隐藏私有属性,保护数据','提供统一的 call 方法以便通过相同的方式调用所有子类','使得多个不同的代理模块可以共享相同的接口,实现代码复用'],exp:'B Python 支持多重继承, 因此该选项的说法本身错误,设计基类与 Python 是否支持多重继承无关 ;D 基类 的设计主要是为 了实现代码复用和统一接 口 ,而不是为 了 隐藏私有属 性,Python 中通过命名约定来表示私有属性,与基类的设计并无直接关系'},
  {id:1451,type:'multi',answer:'ACDE',stem:'关于大模型在文本处理中的局限性，以下哪些陈述是准确的？',opts:['即使有合适的系统提示词,大模型生成的内容仍需人工复审以保证质量。','大模型技术已经完全成熟,能够无差错地执行所有文本转换和润色任务。','大模型可能在处理特定领域专业术语时出现误解。','大模型对用户查询的依赖性强,如果查询表述不清,结果可能偏离预期。','在没有明确指示的情况下,大模型可能无法自动识别源语言和目标语言。'],exp:'大模型生成内容受提示词影响，仍需人工复审以确保准确性与安全性；大模型在专业术语领域易因训练数据覆盖不足而产生误译；其输出高度依赖输入表述清晰度，查询模糊会导致结果偏离；在无明确语言标识时，无法自动识别源语言与目标语言。选项B错误，因大模型尚未达到无差错执行所有任务的成熟水平。'},
  {id:1452,type:'multi',answer:'BD',stem:'在使用大语言模型时，什么是样例的作用？',opts:['确定目标用户','辅助模型生成单一答案','明确限制模型的回答长度','提供有指导性的案例','设定模型的情感色彩','抽象出实现方案'],exp:'在大语言模型应用中，"样例"主要用于引导模型生成符合特定需求的输出。OpenAI文档指出，通过提供示例，用户能更清晰地传递意图和期望格式。选项B涉及利用示例减少答案多样性，确保输出一致性；D对应示例的核心功能，即为模型提供参考模板；E则通过例句中的情感倾向影响回答基调，如使用积极语句引导正面回应。其余选项与示例设计关联较弱，如用户定位、长度控制等通常通过其他指令实现。'},
  {id:1453,type:'multi',answer:'ABCDEF',stem:'在下面的代码片段中，哪些是微调大语言模型训练循环中必要的步骤？',opts:['model.train ()','loss = criterion (predictions, targets)','predictions = model (inputs)','optimizer.step ()','optimizer.zero_grad ()','loss.backward ()'],exp:'在PyTorch框架中，训练循环的标准流程包括设置模型模式、前向计算、损失计算、反向传播、梯度清零及参数更新。选项A确保模型处于训练模式（影响Dropout等层）；C执行前向传播生成预测值；B通过损失函数计算预测与目标的差异；F利用反向传播计算梯度；E清除历史梯度防止累加；D调用优化器更新参数。所有步骤均为典型训练迭代的必要组成部分，PyTorch官方教程及深度学习实践指南均明确列出这些流程。'},
  {id:1454,type:'multi',answer:'ABCDEF',stem:'下列哪些因素会影响大语言模型微调的效果?',opts:['是否采用数据增强技术','计算资源的限制','微调数据的质量和数量','预训练模型的选择','微调持续的轮数(epochs)','微调时使用的超参数设置'],exp:'[回答]：影响大语言模型微调效果的因素是多方面的，涵盖了数据、模型、训练策略及资源等维度，具体分析如下： A选项正确，微调数据的质量（如是否准确、无噪声）和数量直接决定了模型在新任务上的学习上限，低质量或过少的数据会导致过拟合或泛化能力差。 B选项正确，超参数如学习率、批量大小等设置不当可能导致训练不稳定、收敛缓慢或性能下降。 C选项正确，不同预训练模型（如参数量、训练数据分布、架构）在特定任务上的基础能力差异显著，选择不当会限制微调效果的提升空间。 D选项正确，训练轮数过少可能导致欠拟合，过多则容易过拟合，因此需通过验证集选择最佳轮数。 E选项正确，数据增强技术（如回译、随机替换等）可以扩充样本多样性，提升模型鲁棒性，尤其适用于数据稀缺的场景。 F选项正确，计算资源（如GPU显存、训练时间）的不足会迫使使用较小的模型、更少的轮数或简化的数据，从而影响最终效果。 因此，所有六个选项均会影响大语言模型微调的效果，正确答案是ABCDEF。'},
  {id:1455,type:'multi',answer:'ABCE',stem:'用户上传了一个包含复杂表格的Markdown文档，使用默认的RAG流程进行问答。用户提问关于表格中特定单元格含义的问题时，大模型经常给出错误或不相关的答案。请问以下哪些方案可以尝试解决这个问题？',opts:['对用户提问进行预处理,提取表格相关的关键词。','在文档切片时,将表格的行列信息添加到每个单元格的 Chunk 中。','将表格转换成 JSON 格式,然后使用 JSON Loader 加载数据。','使用 OCR 技术识别表格中的文字,并将识别结果添加到文本中。','使用更强大的 Embedding 模型。','增加训练数据,让大模型更好地理解表格内容。'],exp:'C 方案最彻底,B+A 组合适用于快速改进,E 方案作为补充,D/F 不建议'},
  {id:1456,type:'multi',answer:'ACDE',stem:'下列代码片段中，哪些涉及模型训练过程中的正则化或优化策略？',opts:['weight_decay = 0.001','ACP 大模型-1.png','optimizer = SGD (model.parameters (), lr=0.01, momentum=0.9)','scheduler = StepLR (optimizer, step_size=10, gamma=0. 1)','model = nn.Dropout (p=0.2)','criterion = nn.CrossEntropyLoss ()'],exp:'weight_decay通过L2正则化惩罚权重过大，属于正则化策略；SGD优化器中的momentum加速收敛，属于优化策略；StepLR动态调整学习率，属于优化策略；Dropout随机屏蔽神经元，属于正则化策略；CrossEntropyLoss是损失函数，不涉及正则化或优化。'},
  {id:1457,type:'multi',answer:'ABD',stem:'通过LlamaIndex创建RAG应用，在修改默认prompt时，包含以下哪些步骤？',opts:['定义新的prompt字符串,将chunk和query的位置空出来','使用新的prompt初始化一个PromptTemplate对象','对新的prompt进行保存,使得LlamaIndex中的源代码prompt也变成中文','用index的update_prompts方法将新的prompt同步上去'],exp:'解析： LlamaIndex文档中，自定义Prompt需遵循特定流程。修改默认prompt时，需先定义包含占位符的新prompt字符串（A），通过PromptTemplate封装（B），再用update_prompts方法更新索引（D）。C选项提到的修改库源代码无关联，官方流程无需此操作。'},
  {id:1458,type:'multi',answer:'CDE',stem:'有关输出格式要素的描述，以下哪项是正确的？',opts:['输出格式不影响大模型的应答','不需要明确不期望输出的内容','可使用案例来提示大模型的输出','应明确指出枚举值的范围','明确提供要输出的内容类型','无需结合样例来明确输出格式'],exp:'本题考察输出格式要素的理解。[A]枚举值范围不一定必须明确，实际应用中可能只指定类型而非具体值。[B]不期望的内容通常无需特别说明，重点在明确期望内容。[C]样例的使用有助于明确格式要求。[D]案例作为提示方法有效。[E]明确输出类型是基本要求。[F]输出格式直接影响模型应答，是关键因素。相关内容参考提示工程实践，如OpenAI建议明确结构和示例，避免冗余限制。'},
  {id:1459,type:'multi',answer:'AC',stem:'以下哪些选项是把DASHSCOPE_API_KEY配置为环境变量的原因？',opts:['防止 KEY 泄漏','配置为环境变量可以减少代码的行数。','环境变量会自动被 SDK 读取和使用。','环境变量可以加快程序的运行速度。'],exp:'B 配置环境变量本身不会减少代码行数,而是通过 SDK 自动读取环境变量来简化认证流程,与代码行数无关;D 环境变量的读取属于系统级操作,对程序运行速度的影响可忽略不计,不会显著提升性能'},
  {id:1460,type:'multi',answer:'ABC',stem:'在进行RAGAS评测时，使用通过自定义API封装的langchainLLM对象主要有哪些优点？',opts:['可以在API中定义langchainLLM类中不支持指定的参数','由于langchain官方封装好的模型有限,因此通过自定义方法选择更多模型','可以打印出中间结果,帮助评测人员了解分数来源','无需输入APIKey即可使用大模型'],exp:'RAGAS评测中使用自定义API封装的langchainLLM对象，其优势涉及灵活性和扩展性。选项A允许覆盖或补充原生类未支持的参数，例如调整超参数或引入自定义逻辑，增强配置自由度。选项B针对模型多样性，自定义API可突破官方封装限制，接入非官方支持的第三方或私有模型。选项C通过输出中间结果提升评测透明性，便于追踪分数计算细节，辅助问题排查。选项D不符合实际，因多数云服务模型需APIKey验证，自定义封装无法绕过安全机制。相关内容关联LangChain框架实践及RAGAS评测文档中的扩展性设计原则。'},
  {id:1461,type:'multi',answer:'ABCD',stem:'以下哪些代码片段可以用于检测用户输入中是否包含敏感词？',opts:['python Def detect_ sensitive_words (text, sensitive_words) : For word in text.split () : If word in sensitive_words : Return True Return False','python Def detect_ sensitive_words (text, sensitive_words) : Return any (word in text for word in sensitive_words)','python Def detect_ sensitive_words (text, sensitive_words) : # added error handling try : Return any (word in text.lower () for word in [w.lower () for w in sensitive_words]) except AttributeError : # in case text is not a string Return False','python Import nltk Def detect_ sensitive_words (text, sensitive_words) : Tokens = nltk.word_token ize (text) Return any (token in sensitive_words for token in tokens)','python Def detect_ sensitive_words (text, sensitive_words) : Return text in sensitive_words'],exp:'A选项：逐词比对，逻辑正确，但Return首字母大写错误，实际不可运行，命题意图考察语义正确性，视为符合检测逻辑。 B选项：使用any()函数高效判断敏感词是否存在于文本中，语法正确，符合Python编程规范。 C选项：通过大小写统一处理增强匹配鲁棒性，并异常捕获防止非字符串输入崩溃，符合工程实践。 D选项：使用nltk分词更精准识别词语边界，避免字串误匹配，虽引入外部库但代码逻辑无误。 E选项：直接比较整个文本与敏感词列表，未实现词级匹配，不符合题干“检测是否包含敏感词”要求。'},
  {id:1462,type:'multi',answer:'BCE',stem:'以下哪些选项属于提示词要素中的样例(Sample)?',opts:['请你扮演一位医生.','输入:汽车,输出:交通工具','用户输入:"我想了解一下人工智能",你的回复:"人工智能是......"','请用表格形式展示结果.','输入:苹果,输出:水果','请你总结这篇文章的中心思想.'],exp:'在提示词（Prompt）工程中，样例（Sample）特指提供具体的输入输出对（Input-Output Pair），用于示范期望的回答模式。选项B、C、E均给出了具体的输入和对应的输出示例，符合样例的定义。A、D、F分别属于角色设定、格式要求和任务指令，不是样例'},
  {id:1463,type:'multi',answer:'ABDF',stem:'Assistant API的Assistant类的各项功能中涵盖了以下哪些操作？',opts:['删除','更新','剪切','创建','复制','列举'],exp:'Assistant类的功能通常涉及对资源的管理操作。在常见的API设计中，如RESTful架构，资源管理的基础操作包含创建（Create）、读取（Retrieve）、更新（Update）、删除（Delete），即CRUD，其中“列举”属于读取的一种形式。参考OpenAI Assistants API文档，Assistant类支持创建（`create`）、更新（`update`）、删除（`delete`）和列举（`list`）操作。剪切（B）和复制（C）不属于常规资源管理方法，通常由客户端处理或特定接口实现。选项A（列举）、D（删除）、E（更新）、F（创建）对应API定义的标准功能。'},
  {id:1464,type:'multi',answer:'BCDF',stem:'.21、APIAssistantAgent示例代码query函数中，哪些步骤与大语言模型交互？pythondef query （self,query:str):message =dashscope.Messages. create (self. thread_id,content=query)message_run = dashscope.Rums. create ( self. thread_id,assistant_id= self.assistant_idrum_status = dashscope.Runs.wait(message_run. id,thread_id= self. thread_idif run_status.required_action :self. forward_and_ submit_outputs (run_ status)run_status = dashscope.Runs.wait(run_status.id,thread_id= self.thread_idmsgs = dashscope.Messages. list (self. thread_idanswerjson. loads (json. dumps (msg s,defaul t=lambdadict))["data"][o]["content"][o]["text"]["value"]returnanswer',opts:['调用 forward_and_submit_outputs 函数','调用 dashscope.Runs.wait 函数','创建 message 对象','调用 dashscope.Messages.list 函数','解析 msg s 获取最终答案','调用 dashscope.Runs create 函数'],exp:'A/E 属于后续处理,B/C/D/F 构成完整交互链'},
  {id:1465,type:'multi',answer:'ABDF',stem:'以下哪些Python库可以用于处理视频或图像?',opts:['numpy','OpenCV','pandas','TensorFlow','requests','moviepy'],exp:'A 作为基础支持库入选,B/D/F 是专业多媒体库,C/E 无关'},
  {id:1466,type:'multi',answer:'DF',stem:'小明开发了一款基于通义千问的AI写作助手小程序，计划在微信小程序平台上线。目前小程序已经开发完成，但尚未提交任何合规备案申请。根据相关规定，小明应该如何操作？',opts:['直接上线,后续再补充备案材料。','向应用商店提交应用,等待审核通过后再备案。','下架小程序,停止运营。','联系阿里云百炼大模型服务平台,咨询备案流程并按要求提交申请。','无需备案,直接上线即可。','先进行算法备案,获得备案号后再上线。'],exp:'必须完成算法备案和平台合规流程'},
  {id:1467,type:'multi',answer:'BDF',stem:'以下哪些选项属于提示词要素中的输出格式(OutputFormat)”？',opts:['请你总结一下这篇文章的主要内容。','请用表格形式展示结果。','假设你是一个资深律师。','请使用 JSON 格式输出。','我希望你以第一人称的口吻写作。','结果需要包含姓名、年龄和地址。'],exp:'A/C/E 属于其他提示词要素,B/D/F 是标准的输出格式指令'},
  {id:1468,type:'multi',answer:'ABD',stem:'为了将RAGAS评测适配到中文问答场景，有哪些有效方法？',opts:['使用中文能力较强的大模型','将 RAGAS 自带的 prompt 翻译为中文再传入','在 faithfulness 中修改 json.dumps 函数 ,使其返回中文而非 unicode 码','在 System prompt 中提醒大模型: 你要适配到中文问答场景'],exp:'使用中文能力较强的大模型可提升中文语义理解与生成质量，是适配中文问答场景的有效方法。将RAGAS自带的prompt翻译为中文再传入，能确保评估指令与中文语境匹配，提高评测准确性。在Systemprompt中强调大模型适配中文问答场景，可引导模型输出符合中文表达习惯的评估结果。在faithfulness中修改json.dumps函数以返回中文而非unicode码，虽能改变输出格式，但不涉及评测逻辑适配，无法提升中文场景下的评估有效性。'},
  {id:1469,type:'multi',answer:'AC',stem:'以下关于CosyVoice 的描述,哪些是正确的?',opts:['CosyVoice 是一个文本转语音模型。','CosyVoice 可以直接生成视频。','CosyVoice 支持实时流式语音合成。','CosyVoice 可以用于语音识别。'],exp:'CosyVoice 是一个文语转语音模型，支持实时流式语音合成。它不具备生成视频的能力，也不用于语音识别。语音合成与语音识别是两类相反的技术方向，前者将文本转为语音，后者将语音转为文本。视频生成需依赖视觉生成模型，非语音模型功能范畴。'},
  {id:1470,type:'multi',answer:'ACD',stem:'在RAGAS评测中，embedding模型的作用有哪些？',opts:['评估answer与ground truth的相似度,从而计算answer_correctness','评估每个chunk之间的相似度,从而剔除离群点','评估context与answer的相似度,从而计算faithfulness','评估answer与query的相似度,从而计算answer_relevancy'],exp:'在RAGAS（Retrieval Augmented Generation Assessment）评测框架中，embedding模型主要用于将文本转化为向量表示，从而通过向量间的相似度计算来评估生成答案的质量。根据RAGAS的官方定义和常见实现： - **A选项正确**：answer_correctness指标需要比较生成的答案（answer）与标准答案（ground_truth）在语义上的相似度，这通常通过计算两者embedding向量的余弦相似度来实现。 - **C选项正确**：faithfulness指标评估生成的答案是否忠实于检索到的上下文（context），即需要计算context与answer之间的语义相似度，以判断答案是否基于所提供的上下文信息。 - **D选项正确**：answer_relevancy指标评估生成的答案与用户查询（query）之间的相关性，通过计算answer与query的embedding相似度来衡量。 - **B选项不正确**：RAGAS中并没有“评估每个chunk之间的相似度、从而剔除离群点”这一标准步骤，chunk的筛选或离群点剔除并非embedding模型在RAGAS中的核心作用。 因此，正确答案是A、C、D。'},
  {id:1471,type:'multi',answer:'ACD',stem:'通过Llamalndex创建RAG应用,关于下面这段代码作用的描述正确的有哪些？pythonDef get_documents (path) :Documents = SimpleDirectoryReader (path). load_ data ()Document = Document (text="\n\n".join ([doc.text for doc in documents])) replacements = {?\':\'?\'For src, dst in replacements. items O) :Document.text = document.text.replace ( src, dst) return document',opts:['将所有 Document 对象合并为一个 Document 对象','对乱码内容进行数据清洗','将中文的标点符号预先转化为英文标点符号,使得切分时不会使得 chunk 长度过长','将指定文件夹中的文件加载为 document 对象'],exp:'码仅替换特定标点符号,未涉及乱码检测或修复'},
  {id:1472,type:'multi',answer:'CDF',stem:'在大语言模型微调的训练循环中，哪些步骤是必须包含的？',opts:['超参数调整','模型保存','正向传播','梯度更新','梯度裁剪','反向传播'],exp:'在大语言模型微调的训练循环中，必须包含的步骤是那些直接构成一次完整参数更新过程的步骤。以下是分析过程： - **A. 梯度裁剪**：虽然梯度裁剪常用于防止梯度爆炸，尤其是在大模型中，但它不是训练循环的必需步骤——许多微调任务不需要梯度裁剪也能正常训练。 - **B. 模型保存**：保存模型是训练结束后或检查点保存的步骤，而不是每个训练循环（每批次或每步）都必须执行的。在训练循环内部，通常不会每步都保存模型。 - **C. 正向传播**：正向传播是必须的，因为它计算模型的输出和损失函数的值，是所有后续步骤的基础。 - **D. 反向传播**：反向传播是必须的，因为它计算损失相对于模型参数的梯度，这是参数更新的依据。 - **E. 超参数调整**：超参数调整通常是在训练开始前或通过验证集评估后进行，不是在训练循环的每一步都执行的操作。 - **F. 梯度更新**：梯度更新（如使用优化器更新参数）是必须的，因为它利用反向传播得到的梯度来修改模型参数，使损失降低。 因此，在训练循环的每一步中，必须包含正向传播、反向传播和梯度更新。正确答案是**C、D、F**。'},
  {id:1473,type:'multi',answer:'BCEF',stem:'视频合规检测的关键步骤包括下列哪些选项？',opts:['视频上传后的用户评论分析','视频预处理,例如视频分段和帧提取','音频合规检测','视频编码格式的选择','图片合规检测','文本合规检测(包括字幕和音频转录文本)'],exp:'视频合规检测需对内容进行多维度审查。视频预处理包括分段和帧提取，是后续分析的基础；音频检测用于识别违规声音内容；图片合规检测针对视频中静态画面的非法图像；文本合规检测涵盖字幕及音频转录文本中的违法信息。用户评论分析属于事后行为监管，非视频内容本身检测环节；视频编码格式选择属技术优化范畴，不涉及内容合规判断。'},
  {id:1474,type:'multi',answer:'ABDE',stem:'已知 prompt_template 定义了让大模型生成摘要的具体要求,以下哪些措施可以提高摘要生成函数的生成质量？',opts:['将 document 分成多个段落,分别生成摘要,最后合并。','在 prompt_template 中明确指出需要提取文章的主旨。','不使用 prompt_template,直接调用大模型。','在 prompt_template 中提供一些示例摘要。','在 prompt_template 中提供更详细的输出格式要求,例如指定摘要的长度、语气等。'],exp:'C 无提示模板会导致输出不可控,质量波动大,完全依赖模型的默认行为,难以满足特定需求。'},
  {id:1475,type:'multi',answer:'AB',stem:'你正在开发一个机器学习领域的答疑机器人，辅助学生学习，但你对该领域专业知识掌握有限，以下哪些策略更有助于你改进提示词设计？',opts:['邀请机器学习课程助教一起审核和改进提示词,要求其按照一定的结构来回答问题','要求大模型扮演「机器学习教授」 ,结合学生认知水平,重新写出更结构化的提示词','按照自己的理解要求大模型按照一定的结构来回答问题','保持提示词简单,避免引入错误的信息'],exp:'该题考察提示词设计优化的有效策略。选项A通过引入领域专家审核确保专业性与结构合理性；选项B利用角色预设调整输出结构以适应目标受众认知水平；选项C因自身知识局限可能导致设计偏差；选项D虽减少错误风险但牺牲结构化输出，影响教学效果。专业协作与角色模拟是关键优化路径。'},
  {id:1476,type:'multi',answer:'ABC',stem:'（关于多模态技术底层原理,正确的说法是？',opts:['图像理解模型也需要先将视频或图像分词化再做处理','实现「方言语音合成」 需要训练模型建立方言音素与标准发音的映射关系','视频合成所花费的时间与可用的算力呈负相关','文生图模型生成不同尺寸图像时,必须重新训练模型'],exp:'图像理解模型如Vision Transformer将图像分割为固定大小的patch，类似文本的分词处理，形成序列输入。方言语音合成的关键在于模型需学习方言特有音素与标准发音之间的对应关系，此映射直接影响合成准确性。视频合成时间随算力增加而减少，更高性能硬件可并行处理更多计算任务。文生图模型如Stable Diffusion通过调整网络中的空间维度参数支持多种输出尺寸，无需重新训练。选项D错误。'},
  {id:1477,type:'multi',answer:'ABC',stem:'一家旅游公司计划推出一款沉浸式个性化AI导游产品，以下哪些功能设计可以有效提升产品的吸引力和实用性？',opts:['使用大语言模型为游客实时生成个性化的景点介绍,结合游客的兴趣和历史游览记录。','开发一个路径规划系统,根据实时交通和天气情况为游客推荐最佳游览路线。','利用图像识别技术分析游客拍摄的照片, 自动标注景点名称并提供相关背景信息。','提供一个语音讲解的随身 pad,确保所有游客听到的内容完全相同。'],exp:'图像识别技术自动标注景点信息能增强游客互动体验，实时路径规划优化游览效率。统一语音讲解缺乏个性化，无法满足个体需求；大语言模型生成定制化内容适配不同游客兴趣，提升沉浸感。图像识别、路径规划算法及生成式AI技术均属智慧旅游中的典型应用场景。'},
  {id:1478,type:'multi',answer:'BCD',stem:'某金融智能风控系统在高峰期偶尔出现模型不可用的情况，以下哪些方案可以作为降级策略？',opts:['增加 GPU 实例数量','切换至规则引擎兜底','使用备份模型继续服务','关闭部分非核心功能'],exp:'在金融智能风控系统出现模型不可用的情况时，降级策略的核心目标是保障系统基本可用性、降低风险，同时尽量减少对业务的影响。以下是对各选项的分析： A. **增加 GPU 实例数量**： 该方案属于扩容或资源增强措施，目的是提升系统处理能力，但无法直接解决模型不可用的问题（例如模型本身故障或依赖服务中断）。因此，它不属于降级策略，而是性能优化手段。 B. **切换至规则引擎兜底**： 规则引擎是基于预设规则的决策系统，不依赖复杂模型。在模型不可用时，切换至规则引擎可确保风控系统继续运行，虽可能牺牲部分精准度，但能维持基本功能，属于典型的降级策略。 C. **使用备份模型继续服务**： 备份模型是预先准备的替代方案，可在主模型故障时快速切换，保障服务连续性。这是降级策略中常见的容灾手段，符合要求。 D. **关闭部分非核心功能**： 通过关闭非核心功能（如辅助分析模块），可释放系统资源，优先保障核心风控逻辑的稳定性。这种资源优化措施能有效应对模型不可用时的系统压力，属于降级策略。 **综上，正确答案为 B、C、D**。'},
  {id:1479,type:'multi',answer:'ABCD',stem:'一家教育科技公司拟开发AI教学产品，以下哪些方案能体现“个性化、智能化、普惠教育”？',opts:['自适应学习平台根据学生水平动态调整题库','用 VR 实验室模拟替代昂贵的物理实验, 降低教学成本','方言识别系统辅助少数民族学生练习普通话','选择题自动判卷, 问答题错别字纠正'],exp:'自适应学习平台根据学生水平动态调整题库，体现个性化与智能化；用VR实验室模拟替代昂贵的物理实验，降低教学成本，体现普惠教育；方言识别系统帮助少数民族学生练习普通话，促进教育公平与普惠；选择题自动判卷、问答题辅助订正，提升教学效率与智能化水平。四项均符合个性化、智能化、普惠教育的核心要求。 ---'},
  {id:1480,type:'multi',answer:'BC',stem:'某跨境电商平台的客服系统需要处理多语言用户咨询，在进行文本合规检查时发现部分违规内容无法被检测出来。哪两个方案能提供多语言文本的合规检查效果？',opts:['强制要求用户使用英语提问,其他语言咨询转入人工处理','建立多语言同义词库,覆盖常见违规表述的变体(如 “免税代购 ” 的谐音 / 缩写形式)','使用跨语言语义理解模型,识别违规意图而非依赖关键词匹配','将非英语内容翻译为英语后复用单语种审核规则'],exp:'多语言合规检查需突破关键词匹配的局限，覆盖语义变体与意图识别。建立多语言语义词库可有效识别谐音、缩写等规避形式，提升对非标准违规表达的捕获能力。使用跨语言语义理解模型能直接分析不同语言中的违规意图，不依赖语言表面特征，实现更精准的跨语言检测。强制用户使用汉语限制服务可用性，翻译为英语再审核会丢失语义细节，均无法有效解决多语言场景下的合规问题。'},
  {id:1481,type:'multi',answer:'BD',stem:'当你在使用一款基于大模型构建的创意助手，要求它一次性产生10条宣传文案时，发现生成的文案千篇一律，缺乏多样性。为了在保证一定多样性的同时避免模型生成不符合主题的内容，可以优先考虑以下哪些改进措施？',opts:['使用模糊的指令,让模型自由发挥。','检查提示词是否过于局限,尝试在提示词中明确指定多个角度方向(如情感、风格、视角等) 来扩展其灵活性。','固定 top_p=0.1 以确保最大范围的词汇选择。','小幅调高 temperature 以保证生成内容的多样性。'],exp:'B 提供结构化多样性引导,D 增加适当随机性,两者结合可优化生成效果'},
  {id:1482,type:'multi',answer:'AD',stem:'用户多次反馈“AI回答中有捏造内容”，排查后发现是当知识库没有相关内容时，大模型直接虚构答案。为减少此情况，你可以怎么做？',opts:['在百炼 RAG 应用中将回答范围设置为 “仅知识库范围 ”','调高 temperature 值','使用 ReRank 对检索结果再次排序','使用提示词 ,无匹配就明确回复 “无法回答 ”'],exp:'A 适用于严格依赖知识库的场景,D 作为兜底策略,两者均可减少幻觉。C 可辅助提升检索质量,但非必需;B 完全错误'},
  {id:1483,type:'multi',answer:'ABCD',stem:'构建高质量的数学题微调数据集应包含哪些要素？',opts:['包含详细分步推导','统一使用 LaTeX 公怯或 Markdown 格怯输出公怯','大量的数学题解题数据','覆盖多种解题思路'],exp:'构建数学题微调集时，需要同时保证规模（大量样本）、多样性（不同题型/多解思路）、格式一致性（统一LaTeX或Markdown公式），以及完整性（包含逐步推导过程）。这四项共同决定模型能否学到规范、可复现且高质量的解题能力。'},
  {id:1484,type:'multi',answer:'AC',stem:'你需要大模型从客户邮件中提取结构化数据(如姓名、订单号、问题类型)，以下哪两个选项有助于你达成这一目标？ 选项：',opts:['提供你期望的 JSON 结构示例','调低温度参数(Temperature) 以降低随机性','在任务目标中明确 “输出 JSON 格怯 ”','要求模型分两步操作,先总结邮件内容,再提取字段'],exp:'字段复杂 ,可追加示例邮件+对应 JSON,增强模型理解。 使用函数调用直接绑定 JSON Schema,进一步标准化输出'},
  {id:1485,type:'multi',answer:'ACD',stem:'关于temperature和top_p参数的作用，以下哪三个描述是正确的?',opts:['较低的top_p可以提高生成内容的稳定性','较低的temperature可以增加生成内容的多样性','通常情况下,只需调整其中一个参数即可.','较高的temperature可以增加生成内容的多样性'],exp:'解析：temperature参数控制生成随机性，较高的值使概率分布更平缓，提升多样性（A正确）。top_p通过累积概率阈值筛选候选词，较低值时可选范围缩小，输出更稳定（B正确）。实际应用中调整其中一个即可，同时修改可能导致效果冲突（C正确）。OpenAI文档及论文《The Curious Case of Neural Text Degeneration》指出temperature和top_p的作用机制。D错误，低温降低多样性。'},
  {id:1486,type:'multi',answer:'BCD',stem:'以下哪些方案，有助于提升大模型应用的用户体验？',opts:['等全部内容生成后一次性返回','展示任务处理进度','生成的内容流式输出','将任务分解为多个步骤,并且将分步执行过程展示给用户'],exp:'在用户体验设计中，及时反馈、减少等待感知、透明化流程是关键要素。【B】展示任务处理进度让用户明确当前状态，缓解不确定性焦虑；【C】流式输出内容避免长时间等待，提升交互自然度；【D】分步展示执行过程增强可控性和理解。这些方法常见于人机交互研究及产品设计实践，如《Don\'t Make Me Think》强调即时反馈的重要性。而【A】等待全部生成后再返回会延长用户等待时间，削弱即时性，不利于体验优化。'},
  {id:1487,type:'multi',answer:'AC',stem:'关于Lossfunction&Costfunction,下面描述正确的是？',opts:['拟合任意复杂函数','用于度量当前所设置的参数是否合适','决定神经元是否被激活并传递信息','帮助寻找函数的参数最优解'],exp:'用于度量当前所设置的参数是否合适——Loss / Cost函数通过计算预测与真实标签的误差来衡量模型参数的好坏。帮助寻找函数的参数最优解——训练过程就是最小化Loss，从而迭代出一组近似最优的模型参数。'},
  {id:1488,type:'multi',answer:'ABDF',stem:'下列哪些AIGC应用场景需要进行算法备案？',opts:['基于AIGC的智能客服系统','使用机器学习算法进行数据分析的企业内部工具','基于大模型的AI写作工具','利用深度学习进行图像生成的绘画软件'],exp:'基于大模型的AI写作工具、利用深度学习进行图像生成的绘画软件、基于AIGC的智能客服系统、集成通义千问API的智能问答小程序，均属于面向社会公众提供服务的生成式人工智能应用，依据《生成式人工智能服务管理暂行办法》规定，需履行算法备案义务。使用机器学习算法进行数据分析的企业内部工具，因不对外提供服务，不属于备案范围。仅供个人研究使用的AIGC模型Demo，未面向公众开放，无需备案。'},
  {id:1489,type:'multi',answer:'ABD',stem:'在评测机制里，你发现自动化评分一直偏高，但实际用户反馈一般。以下哪三项有可能提高评测的可信度？',opts:['基于现有的评测集,增加自动化评测的频次','在构建测试集时,增加业务专家的打分环节','根据线上用户问题类型的分布,修正测试样本集的问题分布','调整自动化评测工程的提示词及阈值,让其更接近真实用户判断标准'],exp:'[回答]：在人工智能评测中，自动化评分偏高而用户反馈一般，通常意味着评测指标与真实用户体验存在偏差。提高评测可信度的关键在于缩小自动评测与人类判断之间的差距，并确保测试样本能够反映实际应用场景。 A选项正确，引入业务专家的打分环节，可以为评测提供更接近真实用户需求的主观标准，从而校准自动化评分。 B选项正确，调整自动化评测的提示词和阈值，使其模拟真实用户的判断标准和容忍度，能直接减少自动化与人工评估之间的不一致。 C选项错误，增加评测频次并不能改变评测标准本身的偏差，重复执行一个有缺陷的流程只会放大错误，而不会提高可信度。 D选项正确，线上用户问题的分布往往与测试样本集不同，按实际分布修正样本集，可以避免评测结果因样本偏差而失真，从而提升评测的代表性和可信度。 因此，正确答案是ABD。'},
  {id:1490,type:'multi',answer:'ABCD',stem:'选择LoRA权重时需考虑哪些因素?',opts:['GPU 显存容量','训练数据量','任务复杂度','基础模型参数量'],exp:'LoRA（Low-Rank Adaptation）是一种通过低秩矩阵分解调整预训练模型权重的高效微调方法。其权重选择需结合硬件条件与任务需求：GPU显存容量（A）直接影响可加载的权重规模；训练数据量（B）决定了过拟合风险，需通过权重秩的大小平衡模型容量与泛化能力；任务复杂度（C）对应权重秩的需求，复杂任务需更高秩以捕捉更多参数变化；基础模型参数量（D）规模越大，适配权重秩通常需相应增加以有效调整模型行为。相关因素在LoRA原论文（Hu et al., 2021）及实践指南中均有讨论。'},
  {id:1491,type:'multi',answer:'BD',stem:'你发现大量员工信息都存放在PDF、Word文档里，部分还包含表格和图片，RAG无法正确提取关键信息。你可以怎么处理？',opts:['手动复制粘贴所有文档内容','使用 OCR 技术识别并提取图片中的文字','强制用户只上传纯文本','使用 DashScopeParse 等工具 ,对 PDF/Word 进行结构化解析'],exp:'该题考察对非结构化文档信息提取方法的理解。PDF/Word等文档常包含表格、图片等元素，传统的RAG模型难以有效解析。针对此类场景，可通过结构化解析工具（如DashScopeParse）将文档转化为带标签的层次化数据，便于机器学习模型处理。同时，对嵌入图片中的文字信息，需运用OCR技术实现光学字符识别。阿里云文档指出，DashScopeParse支持多模态文档解析，而OCR技术是处理图像文本的标准方案。手动复制粘贴无法应对大规模数据，强制限制文档格式会影响系统可用性，故排除B/D。'},
  {id:1492,type:'multi',answer:'ABD',stem:'RAG应用在检索时共召回了10条切片，其中3条高度相关，但3条内容都来自相邻段落，却被系统拆分成不同切片，从而导致回答时缺失连贯的上下文信息。哪些方案可进一步提升答案准确度？',opts:['采用滑动窗口策略生成重叠的文本切片','使用按照语义的切片策略,切分出语义更完整的切片','提高 temperature 参数控制生成多样性','调整切片大小使其覆盖完整更大段落范围'],exp:'题目探讨提升RAG系统答案准确度的方法，针对因文本切片不连贯导致上下文缺失的问题。选项A通过滑动窗口生成重叠切片，确保相邻内容部分重复，维持上下文关联；选项B采用语义切片策略，依据段落或话题完整性分割，避免打断语义单元；选项D调整切片大小，扩大覆盖范围，减少拆分完整段落的风险。选项C的temperature参数影响生成多样性，与上下文连贯性无关，故不适用。相关方法参考信息检索和NLP文献，如Lewis等关于RAG的研究中强调分块策略对性能影响。'},
  {id:1493,type:'multi',answer:'AD',stem:'你正在优化一个RAG系统，发现某些相似文本对的向量相似度较低，以下哪两种方法可以改善这种情况？',opts:['更换效果更好的 embedding 模型','将索引保存到本地并在运行时加载','减少向量数据库的存储容量','通过对比学习让相关文本对的向量相似度更高'],exp:'RAG系统的核心在于检索相关文本的能力，向量相似度低会导致检索效果不佳。对比学习（A）通过优化正负样本的向量距离直接提升相关文本对的相似性；更换更优的embedding模型（C）增强文本表示能力，改善底层语义编码。这两者针对向量生成和训练过程进行调整，直接影响相似度计算结果。其他选项如本地存储索引（B）和减少存储（D）不涉及向量质量或相似度优化。'},
  {id:1494,type:'multi',answer:'BC',stem:'你在开发的招聘答疑机器人，在回答“产品经理的岗位职责有哪些时，输出的职责经常包含客户经理的工作职责。经排查发现，不同岗位的说明文档使用了相同的模板，文档切片时经常将#客户经理#岗位和#产品经理#岗位的职责主要是这样描述的。以下哪两种方法能有效解决这个问题？',opts:['使用 ReRank 对检索结果再次排序','在处理文档时,对于文档中的二级标题, 自动拼接文档名称,如 ## 岗位职责 会被拼接为 ##客户经理 - 岗位职责','在建立索引时, 以文档名称建立标签,检索阶段使用标签 + 向量混合检索','调高大模型 temperature 参数,提高大模型匹配正确答案数据的概率'],exp:'A 选项: 通过文档名称建立标签,检索时结合标签(岗位名称) 和向量混合检索,能精准限定检索内容,避免其他岗位内容混入,有效 。B temperature 参数控制生成的随机性,调高它无法解决检索时内容混淆的根本问题,无效。C 给二级标题拼接文档名称(岗位名称),使段落带上明确岗位标识,检索时能准确区分,避免混淆,有效。D ReRank 仅对检索结果重新排序,不解决内容混淆的根源,仍会包含其他岗位段落,无效。'},
  {id:1495,type:'multi',answer:'ACD',stem:'为了尽量减少大模型应用的幻觉，以下哪些措施是有效的？',opts:['对生成内容进行后处理和验证','使用参数量小更适合本地部署的模型','引入知识库补充大模型缺少的行业知识','在提示词中要求禁止虚构内容,遇到无法回答的问题可以直接回复不知道'],exp:'为了尽量减少大模型应用的幻觉，我们需要理解“幻觉”是指模型生成看似合理但实际不准确或虚构的内容。以下是对各选项的分析： A选项正确：在提示词中明确要求禁止虚构内容，并允许模型在不确定时回答“不知道”，可以直接约束模型行为，减少其编造信息的倾向。 B选项正确：通过引入知识库（如检索增强生成，RAG），可以为模型提供外部可靠信息，弥补其训练数据中缺失或模糊的领域知识，从而降低因知识不足而产生的幻觉。 C选项正确：对生成的内容进行后处理与验证，例如人工审核或使用自动校验工具，能够识别和纠正模型输出中的错误或不一致之处，是有效的补救措施。 D选项错误：使用参数量小、适合本地部署的模型并不能直接减少幻觉。小参数模型通常能力较弱，可能更容易出现错误或简化问题，反而可能增加幻觉的风险。减少幻觉主要依赖提示词设计、知识增强和验证流程，而非单纯缩小模型规模。 因此，有效减少幻觉的措施包括A、B、C，正确答案是ABC。'},
  {id:1496,type:'multi',answer:'AD',stem:'以下哪两个参数的设置会影响训练时显存占用峰值的大小？',opts:['批量大小(batch_size)','验证损失计算步数(evaluation_step)','训练集迭代次数(epoch)','LoRA 秩( lora_rank)'],exp:'(batch_size)：批量越大，前向与反向传播时需要同时存储的激活与梯度越多，显存峰值随之增高。(lora_rank)：LoRA的秩越高，插入的低秩矩阵参数越大，显存中需常驻的可训练权重也随之增加，进而抬高显存峰值。而evaluation_step仅影响多久跑一次验证，epoch只是总训练轮数，它们都不会改变单步计算所需的显存。'},
  {id:1497,type:'multi',answer:'AD',stem:'在多轮对话场景中，以下哪些方案，更有利于保障用户体感的延迟，降低大模型使用成本？',opts:['在多轮对话场景中使用支持长上下文缓存的大模型 API','每次对话仅保留最近 2 轮历史,避免携带过长的上下文','按照 100 的长度,对历史对话取截断,避免携带上下文过长','在多轮对话场景中,避免始终传入完整的历史对话,而是用最早的历史对话做总结处理后携带在对话中'],exp:'暂无解析'},
  {id:1498,type:'multi',answer:'AC',stem:'你在构建一个RAG应用，以下哪些提示词模板是合理的？',opts:['检索到的相关内容为, {检索到的文本段}用户的问题是, {用户问题} 请结合以上信息,给出准确且简洁的回答。','以下是用户的问题, {用户问题}','以下是与问题相关的背景信息, {检索到的文本段}问题是, {用户问题} 请基于背景信息,提供一个合理且完整的答案。','以下是检索到的内容, {检索到的文本段}'],exp:'构建RAG应用时，提示词模板需有效整合检索内容与用户问题。合理模板应明确包含检索文本段、用户问题，并指示结合两者生成回答。选项A通过结构化指令将检索内容与问题并列，要求模型结合信息。选项D将检索内容作为背景信息，与用户问题共同输入，强调基于背景回答。两者均符合RAG机制中信息融合与指令明确的需求。选项B、C仅单独提供问题或内容，未体现关联性，无法有效引导模型生成整合性答案。OpenAI的RAG最佳实践指出，有效模板需清晰区分输入来源并明确任务指令。'},
  {id:1499,type:'multi',answer:'CD',stem:'把APIKey配置到环境变量里有哪些优点?',opts:['提高大模型的回复速度','提高大模型的回复准确率','降低泄漏风险','在其它代码中也可以直接加载环境变量,无需记住又长又复杂的 API Key'],exp:'API Key配置到环境变量中涉及安全性和代码管理实践。根据软件开发和信息安全的常见原则，环境变量存储敏感信息避免了硬编码密钥，减少代码仓库或日志中意外暴露的可能性（选项B）。环境变量作为全局配置，可通过系统接口直接调用，避免重复记忆或复制密钥到不同代码文件（选项D）。回复速度（A）由网络、服务器性能决定，与密钥存储方式无关；准确率（C）取决于模型训练和数据，与密钥管理无关。参考12-Factor App的配置管理原则。'},
  {id:1500,type:'multi',answer:'AC',stem:'对于RAG应用的理解，以下哪两项描述是正确的？',opts:['RAG 中的 “R ”(Retrieval,检索)通常依赖专门的检索模块,从外部知识库中提取与输入问题最相关的文本信息,为后续解答提供依据','在 RAG 框架中,大模型仅起信息汇总作用, 即便其本身不熟悉某些领域的知识,也一定可以凭借总结能力准确回答问题','RAG 的 “G ”(Generation,生成),指的是大模型在得到参考知识与输入问题后进行回答的过程','RAG 的 “A ”(Augmented,增强),是通过提示词来实时训练模型,达到增强模型的效果'],exp:'RAG的全称是Retrieval-Augmented Generation（检索增强生成），包含检索、增强、生成三个核心步骤。选项A描述正确，Retrieval阶段通过检索模块从外部知识库获取相关文本信息，为生成答案提供支持。选项C准确指出Generation阶段的本质是大模型结合参考知识和输入问题生成回答。选项B错误，大模型若缺乏特定领域知识，仅靠检索信息无法保证答案准确性，生成质量受模型本身能力限制。选项D错误，Augmented指的是利用检索到的信息增强输入，而非通过提示词实时训练模型。相关概念来源于RAG原理论文（Lewis et al., 2020）中对框架的定义。'},
  {id:1501,type:'multi',answer:'ABC',stem:'你负责的短视频平台在引入多模态技术后出现故障。1:用户输入“生成夏日海滩vlog背景时,系统返回静态图片而非视频2：视频自动剪辑功能无法识别冲浪板等特定物体3：添加的AI解说语音与动画动作不同步需要重点检查的技术环节是？',opts:['视频编辑时是否设置了正确的时间轴','图像理解模型可能缺少对特定场景的训练数据','仅使用了文生图模型来生成完整视频','语音合成模型采样率不合适导致视频音画不同步'],exp:'多模态技术整合涉及文本生成视觉内容、物体识别及音视频同步。图像生成视频失败可能与模型类型有关；物体识别依赖足够训练数据；音画同步涉及音频采样率等技术参数。B选项涉及物体识别数据不足，C选项指出模型类型错误生成静态图，D选项采样率影响同步。A选项时间轴设置错误未明确关联问题3主因。答案参考多模态系统整合常见问题，如图像生成模型误用、数据集偏差及采样率配置。《多模态系统设计与优化》指出模型选择、数据完整性及参数配置为关键环节。'},
  {id:1502,type:'multi',answer:'ABCD',stem:'在决定模型微调前,你应该考虑以下哪些事情？',opts:['训练数据量是否达到微调的最低标准','该任务是否更适合使用 RAG','提示词工程是否能达到预期效果','训练服务器资源的成本'],exp:'微调前需评估训练数据量是否满足最低要求，数据不足可能导致过拟合或效果不佳；需判断任务是否更适合采用RAG架构，因RAG在知识密集型任务中常优于微调；应评估提示词工程能否达成目标，因高效提示可避免模型微调成本；必须考量训练服务的资源与成本，包括算力、时间与经济投入，确保方案可行。'},
  {id:1503,type:'multi',answer:'BCD',stem:'某教育问答系统上线后，你通过监控日志发现模型有时会返回个人隐私信息，为防止此类敏感信息泄露，可以采取以下哪三项措施？',opts:['过滤用户提问,避免诱导性问题','在问答系统流式返回内容时,实时检测并过滤敏感信息','增加知识库内容的多样性,减少隐私信息被召回的概率','对教育知识库的内容进行脱敏处理'],exp:'隐私信息防护措施通常涉及输入输出控制与数据源头处理。参考数据安全实践，A选项通过限制问题类型降低模型暴露敏感信息风险；B选项在传输过程中动态拦截，避免已生成内容中的隐私泄露；D选项从源头确保知识库不含敏感数据，直接减少泄露可能。C选项对知识库多样性调整无法消除现有隐私信息存在风险，无法有效解决问题。正确选项为ABD。'},
  {id:1504,type:'multi',answer:'ABE',stem:'哪种形式可以用作提示词的分隔符？',opts:['XML 标签','<|CO|>','大大','…','##'],exp:'XML标签常用于结构化数据分隔，如提示工程中界定不同部分。<|CO|>类符号在部分模型（如GPT）中被设计为专用分隔标记。##在特定语法（如Markdown、YAML）中可标记区块。...多表示省略，无明显分隔作用；“大大”无相关技术背景。答案选项参考了自然语言处理中常见的提示设计实践。'},
  {id:1505,type:'multi',answer:'AC',stem:'faithfulness、answer_relevancy、context_recall、context_precision 这些指标中,哪些指标仅评估检索阶段的性能？',opts:['context_precision','answer_relevancy','context_recall','faithfulness'],exp:'检索阶段的核心是召回率(recall)和精准率(precision),因此选 A 和 C。其他指标涉及生成答案的质量,属于后续阶段。'},
  {id:1506,type:'multi',answer:'ABDEF',stem:'以下哪些任务可以使用 ffmpeg完成?',opts:['提取视频中的音频.','调整视频的分辨率.','训练一个语音识别模型.','将多个视频片段合并成一个视频.','为视频添加水印.','转换视频格式 (例如 mp4 到 avi)'],exp:'FFmpeg官方文档及常见用例表明，其功能集中于音视频处理。A选项通过提取音轨实现，常用参数`-vn`。B选项使用`scale`滤镜调整分辨率。D选项通过`concat`协议或文件合并。E选项利用`overlay`滤镜叠加图像/文字。F选项通过指定输出格式实现转码。C选项属于机器学习范畴，非FFmpeg功能。'},
  {id:1507,type:'multi',answer:'BD',stem:'在RAGAS中，answer_correctness由哪些指标共同计算得来?',opts:['answer与context的语义相似度;','answer与ground_truth的语义相似度;','answer与query的一致性;','基于ground_truth与answer计算answer的事实准确性;'],exp:'answer_correctness 指标基于 answer 与 ground_truth 的语义相似度计算，反映答案与标准答案的匹配程度；同时通过 ground_truth 与 answer 对比评估事实准确性，确保答案内容符合真实信息。二者共同构成对答案正确性的核心衡量。'},
  {id:1508,type:'multi',answer:'ACE',stem:'在实现大模型辅助的新员工帮助应用中，以下哪些建议有助于提升用户体验？',opts:['为每个任务定制详细的系统提示词,确保大模型理解上下文。','限制用户查询长度, 因为长文本可能导致响应延迟或理解错误。','引入多轮对话机制,允许用户基于大模型的初步回应进一步细化需求。','由于大模型的准确性极高,无需提供反馈或修正机制。','实现自动检测用户查询类型并调用相应的大模型处理策略,无需用户指定任务类型。'],exp:'暂无解析'},
  {id:1509,type:'multi',answer:'ABEF',stem:'关于图片合规检查的技术手段，下列说法正确的有哪些？',opts:['可以使用目标检测算法如 YOLO 系列检测图片中的敏感物体,例如武器。','OCR 技术可以用于提取图片中的文字信息,用于后续的文本合规检测。','水印和品牌标志检查与合规性无关,不需要进行检测。','图片内容检测只能依靠人工审核,无法使用深度学习模型进行自动化分类。','PHash 算法可以用于版权检查,通过比较图像指纹识别相似图像。','卷积神经网络(CNN)可以用于对图片内容的合规性进行分类,例如识别暴力内容。'],exp:'图像合规检查技术涉及多种算法与模型应用。目标检测算法（YOLO系列）可定位图片中敏感物体如武器，属于物体识别场景。OCR技术用于提取图像文字，支持后续文本合规分析，属于文字识别领域。PHash算法生成图像指纹，通过相似度比对识别版权侵权，属于图像去重技术。CNN通过特征学习分类图像内容（如暴力识别），属于图像分类任务。水印、品牌标志检测涉及版权与授权验证，与合规相关，相关检测不可或缺。图像内容检测已普遍采用深度学习模型（如CNN），自动化方案成熟。参考来源包括计算机视觉文献《Deep Learning for Image Processing》及目标检测论文《You Only Look Once: Unified, Real-Time Object Detection》。选项C、D表述错误，其余正确。'},
  {id:1510,type:'multi',answer:'ABCE',stem:'哪些代码段涉及文本序列化和标准化?',opts:['tokenizer: texts to sequences(texts)','pad_sequences(sequences, padding=\'post\')','vocab_size = len(tokenizer.word_index) + 1','sequences = [seq[MAX_SEQ_LEN] for seq in sequences]','texts = [preprocess(text) for text in texts]','embedding matrix = np.zeros((vocab_size, EMBEDDING_DIM))'],exp:'文本序列化指将文本转换为数值序列，tokenizer: texts to sequences(texts) 实现此过程；标准化指对序列进行统一长度处理，pad_sequences(sequences, padding=\'post\') 完成填充对齐；词汇表构建 vocab_size = len(tokenizer.word_index) + 1 是序列化的前提；文本预处理 texts = [preprocess(text) for text in texts] 属于标准化前的清洗步骤。embedding matrix 构建与序列化无关，sequences[MAX_SEQ_LEN] 为索引越界错误，非标准化操作。'},
  {id:1511,type:'multi',answer:'ADE',stem:'以下哪些代码片段可以有效地对用户输入进行清洗和预处理，以提高大模型应用的安全性？',opts:['将用户输入中的 emoji 表情符号替换为文本描述。','将用户输入转换为小写。','限制用户输入的长度。','去除用户输入中的 HTML 标签。','将用户输入中的 URL 替换为特殊的占位符。','先把英文全部翻译为中文。'],exp:'将用户输入中的emoji表情符号替换为文本描述，可避免模型对非文本符号的误解析；去除HTML标签能防止注入攻击和格式干扰；将URL替换为占位符可阻断恶意链接传播与外部资源诱导。这三项是大模型安全预处理的标准实践。转换为小写、限制长度、翻译为中文不属于核心安全清洗手段，前者影响语义表达，后者增加不可控翻译误差，长度限制虽常用但非直接提升安全性。'},
  {id:1512,type:'multi',answer:'CDEF',stem:'优化RAG 应用时,需要考虑哪些因素?',opts:['系统的可维护性和可扩展性。','最新的深度学习模型和算法。','文档的结构和内容特点。','大模型的解析方式和理解能力。','检索的效率和速度。','用户提问的习惯和可能的提问方式。'],exp:'RAG（Retrieval-Augmented Generation）系统优化需综合考虑用户交互、检索过程和文档适配性。用户提问习惯（A）影响检索结果的相关性，需针对性优化检索策略；大模型的解析能力（B）直接关系到生成答案的质量，需与其能力对齐；检索效率（C）确保实时性，避免延迟影响用户体验；文档结构与内容特点（F）决定索引构建和检索逻辑，例如段落分割、语义匹配方式。D强调模型迭代，但RAG侧重应用集成而非算法创新；E属于系统设计层面，非直接优化要素。文献如Lewis et al.的《Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks》指出，A、B、C、F为核心优化维度。'},
  {id:1513,type:'multi',answer:'BE',stem:',208、在APlAssistantAgent的query方法中，dashscope.Runs.wait的作用是什么？pythonclassAPlAssistantAgent(AgentModule):def query (self, query: str):query : string, the query string to the assistant. e.g. Who is the Jack Chou? ""message = dashscope.Messages. create(self. thread. id, content=query)message_run = dashscope.Runs.create(selfthread.id, assistant_id=self.assistant.id) run_status = dashscope.Runs.wait(message_run.id,thread_id=selfthread.id)if run_status.required_action:self forward and_submit outputs（run_status)run_status = dashscope.Runs.wait(run_status.id,thread_id=self.thread.id)msg s = dashscope.Messages. list( self.thread. id)answerjson.loads (ison.dumps msg s.default=lambda0:dict)[\'data\'][o][content][O][text][value]retum answer',opts:['返回请求的实时进度,对于调试非常有用','等待所有的辅助工具输出,确保信息的完整性','监听后台请求,并在用户的等待期间消耗资源','确保所有消息都已处理并存储好','阻塞当前线程,直到请求的响应准备好为止','提供异步呼叫的机制, 以提升查询响应速度'],exp:'解析：`dashscope.Runs.wait`为同步阻塞等待运行完成。选项B，wait会等待所有辅助工具（若有调用）输出完毕，确保响应信息完整，正确；选项E，wait会监控流程直到请求的响应准备好才返回，正确。A中“实时进度”错误，wait是等完成而非实时反馈；C中“消耗资源”“监听后请求”不符合wait逻辑；D中“消息处理存储”非wait功能；F中“异步机制”错误，wait是同步等待。'},
  {id:1514,type:'multi',answer:'BCD',stem:'以下哪些选项属于流式输出相比于非流式输出的优势？',opts:['能够提升大模型回复的效果','能够给用户带来良好的阅读体验','能够加快大模型回复的速度','在网络连接时不会造成可能存在的超时错误'],exp:'流式输出通过分块实时返回内容，使用户能即时看到部分结果，避免长时间等待，从而带来良好阅读体验。同时，分块传输方式可避免因完整响应生成慢导致的网络请求超时问题，在网络连接时降低超时错误可能性。'},
  {id:1515,type:'multi',answer:'ABC',stem:'以下哪些选项是abstract_generator函数中提示词模板的关键组成部分？pythonDef abstract_generator (document) :Prompt_template=""【角色背景】你是一个专业的审稿人，你将阅读文稿，并生成摘要【任务要求】你将看到一篇文章。请提取文章的主旨。【输出要求】请以json格式输出,不要输出其他内容如{"abstract"："xxx"}摘要本身的内容不超过40个字【用户输入】以下是用户输入，请审阅：Query=prompt_template+document Q_S (system,query)',opts:['任务要求描述','角色背景设定','输出格式要求','错误处理机制','用户输入示例'],exp:'在 `abstract_generator` 函数的提示词模板中，关键组成部分包括： - **角色背景设定**：指定模型的角色，如“你是一个专业的审稿人”。 - **任务要求描述**：明确模型需要完成的任务，如“提取文章的主旨”。 - **输出格式要求**：规定输出的格式，如“以 json 格式输出”。 - **用户输入示例**：提供输入示例，如“以下是用户输入，请审阅”。 选项 D“错误处理机制”和 E“用户输入示例”不是提示词模板的关键组成部分。错误处理机制通常在代码逻辑中实现，而非提示词模板中；用户输入示例虽然出现在模板中，但并非模板的核心结构部分。 因此，正确答案是 A、B、C。'},
  {id:1516,type:'multi',answer:'AB',stem:'以下选项中属于使用分隔符的主要目的有哪些？',opts:['规范化文档格式','明确提示词各要素之间的界限','使文档看起来更复杂','增加文字数量','随意分割文本','提高模型的运行速度'],exp:'分隔符的主要作用涉及文档结构和语义划分。规范化文档格式通过分隔符统一元素排列方式，确保视觉一致性。例如在文本处理中，分隔符可区分标题、段落、列表等不同结构。明确要素界限则体现在将不同语义块（如指令与内容、参数与正文）分开，避免混淆。例如在提示工程中，用特殊符号标记输入的不同部分，增强模型对内容结构的识别能力。其他选项如增加复杂度、提升运行速度等均与分隔符的基础功能无直接关联，随意分割可能导致结构混乱而非优化。'},
  {id:1517,type:'multi',answer:'ADEF',stem:'在以下代码段中,哪些是设置模型训练参数的例子?',opts:['learning_rate = 0.001','model="qwen-7b - chat"','device = torch.device(\'cuda\' if torch.cuda.is_available () else \'cpu\')','optimizer = AdamW (model.parameters (), lr= learning_rate)','num_epochs = 3','batch_size = 64'],exp:'设置模型训练参数包括学习率、训练轮数和批量大小。learning_rate = 0.001 是学习率的设定，num_epochs = 3 是训练轮数的设定，batch_size = 64 是批量大小的设定。model = "qwen 7b chat" 是模型名称指定，device = torch.device(...) 是设备分配，optimizer = AdamW(...) 是优化器构建，均不属于训练参数设置。'},
  {id:1518,type:'multi',answer:'ABCE',stem:'以下哪些场景适合使用流式对话LLM_MODEL.stream_chat(messages)?',opts:['实时聊天机器人,需要立即响应用户输入','需要对大模型的输出进行实时监控和干预的场景','用户需要快速获得初步结果,后续可以继续补充信息完善结果','只需要一次性返回完整结果的简单任务,例如翻译单个单词','需要处理长文本输入的场景,可以逐步返回结果,避免超时'],exp:'流式对话模型适用于需要逐步生成或实时返回结果的场景。实时聊天机器人需即时反馈，流式处理能满足低延迟需求。监控干预输出时，流式可实现中间结果检查与调整。快速获取初步结果并允许后续补充的场景，流式支持增量式交互。处理长文本时，流式分块返回可避免因一次性处理导致的超时问题。一次性返回完整结果的简单任务无需流式机制。参考流式模型应用场景及API设计原理，A、B、C、E均为典型适用情况，D则不符合流式特性。'},
  {id:1519,type:'multi',answer:'ABEF',stem:'以下哪些措施可以提高大模型在私域场景下的安全性？',opts:['对相关人员进行安全培训','建立完善的安全 incident 响应机制','使用开源的数据管理软件','将所有数据存储在云端','定期更新大模型和相关软件','对大模型进行持续的安全评估和测试'],exp:'核心措施:人员培训(A)+ 应急机制(B)+ 持续更新(E)+ 安全测试(F) 需避免:盲目依赖开源(C)或云端(D),需结合业务需求定制方案'},
  {id:1520,type:'multi',answer:'ABE',stem:'在监控大语言模型训练性能时,哪些指标是常用的?',opts:['训练时间','生成速度','batch size','精准率','损失函数值','准确率'],exp:'监控大语言模型训练性能，主要关注模型的学习效果与训练效率。损失函数值直接反映模型在训练数据上的拟合程度，是核心指标。准确率用于衡量模型预测的正确性，通常在特定任务（如分类）中评估。训练时间涉及资源成本与优化效率，需监控以调整策略。生成速度属于推理阶段指标，与训练过程无关；精准率多用于二分类场景，而大语言模型侧重生成或语言建模任务。batch size作为预设超参数，通常不视为动态监控的性能指标。相关概念参考《深度学习》中对训练监控的论述。'},
  {id:1521,type:'multi',answer:'ABC',stem:'RAG应用在检索时共召回了10条切片，其中3条高度相关，但这3条内容都来自相邻段落，却被系统拆分成不同切片，从而导致回答时缺失连贯的上下文信息。哪些方案可进一步提升答案准确度？',opts:['使用按照语义的切片策略,切分出语义更完整的切片','调整切片大小使其覆盖完整更大段落范围','采用滑动窗口策略生成重叠的文本切片','提高 temperature 参数控制生成多样性'],exp:'A 按语义切片,能确保相邻且语义相关的内容不被拆分,保持上下文完整 。B 调大切片覆盖范围,可将相邻段落纳入同一切片,避免拆分导致的上下文缺失 。C 滑动窗口生成重叠切片,使相邻段落内容在重叠区域保留,减少拆分影响 。D temperature 控制生成随机性 ,与切片连贯性无关,无法解决上下文问题。'},
  {id:1522,type:'multi',answer:'ABC',stem:'微调qwen2.5-1.5b模型过程中发现模型开始欠拟合,可采取的优化措施包括?',opts:['增加训练数据量','增加训练集迭代次数(epoch)','增加 lora_rank 值','学习率增加一倍'],exp:'A 增加训练数据量,能让模型学习更多特征,改善欠拟合。B 增加迭代次数(epoch),使模型对训练数据学习更充分,有助于解决欠拟合。C 增加 lora_rank 值,提升 LORA 微调的复杂度,让模型能学习更复杂模式,改善欠拟合。D 学习率过大可能导致跳过最优解,欠拟合时提高学习率无法解决模型 “没学好 ” 的问题。'},
  {id:1523,type:'multi',answer:'BD',stem:'你通过RAG为用户提供商品推荐服务。用户反馈说，在搜索“包子”时，推荐结果中经常出现“书包”的商品信息。后台分析发现，召回阶段确实会夹杂部分无关商品的信息。以下哪些措施能够有效提升该系统的推荐效果？',opts:['降低检索阶段的相似度阈值','优化大模型的 prompt,强调要重点关注用户问题,避免输出无关商品信息','在知识库中剔除书包相关的内容','微调大模型,提高其在面对包含噪声数据的信息时筛选有效信息的能力'],exp:'针对用户反馈的搜索“包子”时出现“书包”的商品信息问题，我们首先需要明确问题的根源在于推荐系统的召回阶段中夹杂了无关商品信息。为了有效提升该系统的推荐效果，我们可以采取以下措施： A. 降低检索阶段的相似度阈值 - 这个措施可能会增加一些不相关的商品信息进入推荐结果，因此并不利于解决问题。 B. 优化大模型的 prompt - 通过优化模型的prompt，强调重点关注用户问题并避免输出无关商品信息，可以有效提升系统的指向性和准确性。 C. 微调大模型 - 提高模型在面对包含噪声数据的信息时筛选有效信息的能力，可以使得模型在处理类似“包子”和“书包”这样的不相关数据时，能够更准确地识别和过滤。 D. 在知识库中剔除书包相关的内容 - 这是一种直接而有效的手段，通过清理与主题不相关的内容，减少无关商品信息的干扰。 综上所述，选项B、C和D都能够有效提升该系统的推荐效果。而选项A可能会带来更多的问题而非解决方案。 因此，正确答案是BCD。'},
  {id:1524,type:'multi',answer:'BD',stem:'你写了一个提示词能按照提示词完成任务，以下哪些方案可行？',opts:['设计提示词, 明确要求大模型要基于今天最新的新闻来总结,避免基于历史新闻总结','设计提示词,结合 function call,让大模型回答时效性问题时,调用搜索工具','整理历史新闻库,构建一个 RAG 应用,让大模型回答时参考知识库中的新闻','使用阿里云百炼平台的 qwen-plus,并且调用 API 时设置 enable_search=True'],exp:'该题考察大模型处理时效性新闻的需求与解决方案。选项中，A依赖历史新闻库无法获取当天最新内容。B通过提示词与函数调用结合搜索工具实时检索，确保时效性。C中阿里云百炼平台启用搜索参数可直接访问最新数据。D强调提示词明确限制时间范围，指导模型优先使用最新信息。根据大模型应用场景，B、C、D均能有效解决实时性问题，而A因数据滞后不适用。'},
  {id:1525,type:'multi',answer:'AD',stem:'某大型公司对每位员工都有多条',opts:['给每条记录打标签(如部门、 邮箱) 并结合标签过滤','修改大模型为 qwen-max','改用 TokenTextSplitter','提高相似度阈值,过滤噪声'],exp:'RAG检索依赖Embedding相似度可能导致同名实体混淆。提高相似度阈值（B）可减少低相关度文档的干扰，通过严格筛选降低噪声召回。给记录添加标签（D）如部门、邮箱等结构化信息，结合标签过滤能在检索时区分同名实体，增强准确性。调整阈值属于检索参数优化，标签过滤属于元数据增强，二者直接针对检索阶段的问题。A选项涉及模型更换，对检索机制无直接影响；C选项调整分块方式，与同名歧义无关。'},
  {id:1526,type:'multi',answer:'AC',stem:'你开发了一个公司制度文件的RAG问答机器人。在测试时你发现提问公司几点上班”，召回的文本段包含公司福利等信息，作息信息由于排名靠后而没有被召回。以下哪两个措施更有助于解决这一问题？',opts:['更换一个性能更优秀的 Embedding 模型','<article class="fever - article" data - clipboard - cangjie=" [["root","copyFrom" :"m - native"],"p", ["span", {"data - type" :"text"}, ["span", {"data - type" :"leaf","color" :"#171A1D"}," 优化生成阶段的提示词模板 "]]]"> <p> 优化生成阶段的提示词模板</p> </article>','使用重排(rerank)技术','更换一个性能更优秀的大模型'],exp:'B.题干问题在于相关信息未被召回,而非生成阶段回答内容不好 。优化生成阶段提示词模板主要影响的是生成答案的内容和格式,对解决信息召回排名问题帮助不大,所以该措施不合适。D.更换性能更优秀的大模型 ,主要提升的是生成答案的质量、推理能力等方面,对于当前因文本召回排序导致相关信息未被召回的问题,不能直接有效解决,所以该措施不符合需求。'},
  {id:1527,type:'multi',answer:'ACD',stem:'大语言模型微调相比预训练的优势有哪些？',opts:['更容易发现和修正模型偏差','无需考虑模型的泛化能力','减少了对大量无标注数据的依赖','提高了模型在特定领域的准确性','减少了计算资源的需求','加快了模型收敛速度'],exp:'大语言模型微调相比预训练的优势包括：更容易发现和修正模型偏差，减少了对大量未标注数据的依赖，提高了模型在特定领域的准确性。微调利用少量标注数据适配下游任务，提升领域性能，同时通过有监督信号校正预训练阶段可能引入的偏差。预训练依赖海量无标签数据，而微调在此基础上聚焦目标场景，降低数据需求并增强专业表现。'},
  {id:1528,type:'multi',answer:'ABF',stem:'实现早停法（early stopping)策略时,考虑的条件可能包括:',opts:['验证损失连续 n 轮不再下降','验证损失达到预设阈值','训练损失持续增加','验证准确率连续提高','训练准确率不再提高','迭代次数达到预定最大值'],exp:'不依赖训练集指标(如 CE),因其无法反映泛化能力。 验证准确率提高(D) 是积极信号,不应触发早停。'},
  {id:1529,type:'multi',answer:'BEF',stem:'基于字符的文档切片方法有哪些潜在的缺点？',opts:['难以实现','可能导致语义分离','需要大量的存储空间','计算复杂度高','切片大小不均匀','可能导致上下文丢失'],exp:'A(难以实现):实际上,基于字符的切片相对简单直接,并不特别难以实现 。 C(需要大量的存储空间):基于字符的切片本身不会直接导致存储需求增加;存储需求更多取决于原始数据量和编码方式。 D(计算复杂度高):基于字符的切片计算上并不复杂,其算法通常比基于语法或语义的分割要简单得多'},
  {id:1530,type:'multi',answer:'AEF',stem:'以下哪些选项体现了提示词要素中的“上下文（Context）”',opts:['用户喜欢历史文化景点,不喜欢游乐场。','请提供不少于三个景点的推荐。','输出格式为 JSON。','请你扮演一位资深旅游博主。','请根据用户提供的行程安排,推荐合适的旅游景点。','用户计划前往北京旅游,时间为一周。'],exp:'上下文指为任务提供背景信息，帮助模型理解用户需求的环境条件。用户偏好（如喜欢历史文化景点）属于个人背景信息，是上下文的核心组成部分；用户行程安排（如计划前往北京、时间为一周）直接构成任务执行的现实语境，属于典型上下文要素。其他选项涉及指令要求（如输出格式、推荐数量）、角色指定（如资深旅游博主），均不属于上下文范畴。'},
  {id:1531,type:'multi',answer:'ABD',stem:'通过 LlamaIndex 创建 RAG 应用,在修改默认 prompt 时,包含以下哪些步骤?',opts:['用 index 的 update_prompts 方法将新的 prompt 同步上去','定义新的 prompt 字符串,将 chunk 和 query 的位置空出来','对新的 prompt 进行保存,使得 Llamalndex 中的源码 prompt 也变成中文','使用新的 prompt 初始化一个 PromptTemplate 对象'],exp:'解析： LlamaIndex文档中，自定义Prompt需遵循特定流程。修改默认prompt时，需先定义包含占位符的新prompt字符串（A），通过PromptTemplate封装（B），再用update_prompts方法更新索引（D）。C选项提到的修改库源代码无关联，官方流程无需此操作。'},
  {id:1532,type:'multi',answer:'ACDE',stem:'Assistant API中Message类包含了各类关于消息的函数，以下哪些选项属于Message类中的函数?',opts:['update','search','retrieve','create','list'],exp:'该题涉及对AssistantAPI中Message类函数的识别。参考AssistantAPI官方文档，Message类通常包含基础CRUD操作及列表功能。update用于修改现有消息内容；retrieve用于获取特定ID的消息详情；create负责生成新消息实例；list实现消息集合的批量查询。search功能一般由独立接口或通过list方法的过滤参数实现，未被归类为Message类的独立函数。'},
  {id:1533,type:'multi',answer:'AD',stem:'在qwen-plus对 messages 进行回答后，如果你想按照当前对话基础继续提问，需要怎么做？LLMMODEL=DashScope(model name=qwen-plusMessages=[ChatMessage(role=MessageRole.SYSTEM,content="↑你负责教育内容开发公司的答疑，你的名字叫公司小蜜，你要回答学员的问题。ChatMessage(role=MessageRole.USER,content=你好',opts:['将大模型生成的 Assistant Message 添加到 messages 列表中','对话历史跟着模型名称走,所以只要继续指定模型为 qwen-plus 就可以了','大模型不支持多轮对话','将新的 User Message 添加到 messages 列表中'],exp:'题干涉及DashScope中qwen-plus模型的多轮对话实现方式。文档指出messages需包含完整历史记录。选项分析：A正确，模型生成的回复需追加到messages以保证上下文延续性；D正确，用户后续提问需作为新UserMessage追加；B错误，模型名称与对话历史无关；C错误，该模型支持多轮对话。'},
  {id:1534,type:'multi',answer:'ACDEF',stem:'在创建APIAssistantAgent的过程中,将functions参数作为字典传入的解释正确的有哪些?ACP大模型-3.png',opts:['这样可以方便地根据函数名来动态调用对应的函数','由于 Python 中的类只能接收一个类型的参数,字典是唯一选择','为了让智能体能够调用不同的函数来满足用户的请求','该结构为智能体的多任务处理提供了更高的可扩展性','因为字典结构可以提供键值对,便于存储函数的信息','字典可以支持函数参数的动态传递,提高灵活性'],exp:'将functions以字典传入，可利用键快速定位函数，实现按函数名动态调用（A），使智能体依用户需求调用不同函数（C）。字典键值对便于存函数信息（E），支持参数动态传递提升灵活度（F），并为多任务扩展提供结构优势（D）。B错误，Python类可接收多类型参数，非只能用字典。'},
  {id:1535,type:'multi',answer:'ACD',stem:'以下哪些方法有助于你减少大模型应用的输出结果等待时间？',opts:['使用支持上下文缓存的模型 API','使用参数量更大的模型','提前生成和复用内容','减少输入 Token 数量'],exp:'使用支持上下文缓存的模型API可复用历史计算结果，降低重复推理开销；按需生成和复用内容能避免冗余计算，提升响应效率；减少输入Token数量可缩短模型处理长度，加快输出生成。参数数量更大的模型通常计算复杂度更高，会增加延迟。'},
  {id:1536,type:'multi',answer:'AC',stem:'某游戏平台上线了一个辅助聊天机器人，可帮助玩家完成游戏内交易、提交客服工单，以及获取实时游戏分析。有玩家发现机器人时常在简单客服请求时错误调用analytics工具。为改进这个多智能体系统的工具使用准确性应该怎么做？',opts:['删除 analytics 相关 Agent','在 Agent 指令中进一步明确各 Agent 的功能边界','改进 Planner Agent 的决策逻辑,精细化路由','将游戏的所有代码库交给聊天机器人学习'],exp:'在Agent指令中明确各Agent的功能边界√通过系统/tool描述或角色提示强化“analytics仅用于数据分析，客服请求调用service Agent”等约束，可直接降低误用概率。改进Planner Agent的决策逻辑，精细化路由√让调度层更精准地根据意图选择合适工具，必要时加意图分类器或规则，能从源头避免把简单客服请求路由给analytics。删除analytics相关Agent×彻底下线功能会损失实时游戏分析价值，治标不治本。把全部代码文库交给机器人学习×不仅成本高、隐私风险大，也无法保证解决工具误调用问题。'},
  {id:1537,type:'multi',answer:'BD',stem:'你和同事在设计一个知识库答疑机器人，他提出了以下路线，哪两个是合理的？',opts:['大模型能力很强,我们把所有知识文件的内容丢给大模型让它总结。','我们可以通过人工与大模型对公司的知识文件生成很多问答对,再使用问答对微调大模型,使大模型了解我们公司的知识。','相信大模型的能力,无需外部知识库支持, 因为大模型已经预训练了海量数据。','大模型最大输入长度有限,应该使用 RAG,先召回最相关的文本段,将文本段与输入问题进行拼接后输入大模型。'],exp:'选项B合理，人工与大模型生成问答对并微调，能让大模型针对性了解公司知识，提升答疑准确性和专业性。选项D合理，大模型输入长度受限，RAG技术可先召回相关文本段，拼接后输入大模型，充分利用外部知识，提高答疑效果。选项A把所有知识文件丢给大模型总结，缺乏针对性且可能超出处理能力。选项C完全依赖大模型预训练数据，无法满足公司特定知识需求。所以选BD。易错提醒：不要忽视大模型输入长度限制和公司特定知识需求。'},
  {id:1538,type:'multi',answer:'BCD',stem:'qwen2.5',opts:['帮助模型充分地学习训练集','可能导致模型泛化性能下降','加速训练过程','GPU 显存消耗更大'],exp:'暂无解析'},
  {id:1539,type:'multi',answer:'ABC',stem:'你发现检索到的切片里常常遗漏上下文，导致回答片段化。下列哪些是有效且合理的改进措施？',opts:['改用 “句子窗口切片 ” 或 “滑动窗口检索 ”','增大 chunk_overlap','避免切片,将文档完整的拼接到提示词中','适当调大召回文档切片数量(例如从 Top3 调整为 Top5)'],exp:'句子窗口/滑动窗口检索让相邻句子或重叠窗口一起进入向量化与检索，天然携带上下文，能有效减少“割裂”√增大chunk_overlap在切片边界处保留更多重叠区域，保证跨块语义连续√调大召回Top K额外召回前后片段，提升整体上下文覆盖率（需配合rerank过滤噪声）√整篇文档直接拼接令提示词token激增、成本高且易超长，通常不可取×'},
  {id:1540,type:'multi',answer:'AC',stem:'如果将RAG与开卷考试相类比，下列哪两项描述最符合它们的相同之处？',opts:['都是通过引入外部知识来增强输出','人的思维与大模型的权重参数,都会随着外部知识的输入而发生改变','都需要提前对知识作出标记,来帮助检索','都不需要对问题本身进行理解即可回答'],exp:'A 外部知识增强输出(RAG 检索知识,开卷考试查资料);C 知识提前标记辅助检索;B RAG不改变模型权重,开卷不涉及权重类比;D 错误(均需理解问题)'},
  {id:1541,type:'multi',answer:'CD',stem:'在开发一款基于大语言模型的会议纪要生成工具时，团队发现模型在处理会议记录时经常遗漏关键决议内容，导致生成的纪要不够准确和全面。以下哪两个选项能较低成本地解决这一问题？',opts:['增加模型的训练数据量,特别是包含更多会议记录样本的数据集','要求模型在输出纪要时使用特定格式 (如紫色字体或表格形式)','在提示词中明确角色定义,例如"你是一名专业秘书,负责从会议记录中提取所有关键决议和行动项"','要求模型先对会议记录中的行动项和决议进行逐句摘要标记,再生成最终的纪要'],exp:'选项A虽能提升模型性能，但增加训练数据量成本较高，不符合低成本要求。选项B要求模型使用特定格式输出，与提升纪要准确性无直接关联，无法解决遗漏关键决议的问题。选项C在提示词中明确角色定义，可引导模型更关注关键决议和行动项，成本较低且有效。选项D要求模型先对会议记录中的行动项和决议进行逐句摘要标记，有助于模型更准确地提取关键信息，成本也相对较低。因此，选择CD。易错提醒：不要被增加数据量等看似直接但成本高的方法迷惑，要关注低成本且有效的方法。'},
  {id:1542,type:'multi',answer:'ABD',stem:'在评测机制里，你发现自动化评分一直偏高，但实际用户反馈一般。以下哪三项有可能提高评测的可信度？',opts:['在构建测试集时,增加业务专家的打分环节','调整自动化评测工程的提示词及阈值,让其更接近真实用户判断标注','基于现有的评测集,增加自动化评测的频次','根据线上用户问题类型的分布,修正测试样本集的问题分布'],exp:'[回答]：在人工智能评测中，自动化评分偏高而用户反馈一般，通常意味着评测指标与真实用户体验存在偏差。提高评测可信度的关键在于缩小自动评测与人类判断之间的差距，并确保测试样本能够反映实际应用场景。 A选项正确，引入业务专家的打分环节，可以为评测提供更接近真实用户需求的主观标准，从而校准自动化评分。 B选项正确，调整自动化评测的提示词和阈值，使其模拟真实用户的判断标准和容忍度，能直接减少自动化与人工评估之间的不一致。 C选项错误，增加评测频次并不能改变评测标准本身的偏差，重复执行一个有缺陷的流程只会放大错误，而不会提高可信度。 D选项正确，线上用户问题的分布往往与测试样本集不同，按实际分布修正样本集，可以避免评测结果因样本偏差而失真，从而提升评测的代表性和可信度。 因此，正确答案是ABD。'},
  {id:1543,type:'multi',answer:'CD',stem:'在初步构建好大模型应用后，应该对它进行自动化评测”，如何理解自动化？',opts:['自动化的评测指标由大模型制定','自动化的评测集由大模型生成','自动化指的是通过引入大模型来减少人为查验的工作方式','自动化的前提是要有业务专家参与构建评测集'],exp:'自动化评测的核心是通过大模型减少人为干预，提升评测效率与一致性，因此选项C正确。业务专家参与构建评测集是确保评测内容符合实际业务需求的前提，是自动化评测体系建立的必要基础，因此选项D正确。评测指标和评测集由人工设计或基于领域知识构建，而非由大模型自主制定或生成，故A、B错误。'},
  {id:1544,type:'multi',answer:'ACD',stem:'以下哪三种场景更需要防范AI模型“幻觉”的风险？',opts:['医疗诊断报告生成系统','社交媒体趋势话题预测系统','法律合同条款自动生成器','医疗诊断报告生成系统,法律合同条款自动生成器,教育领域历史知识问答系统'],exp:'医疗诊断需要高度准确性。趋势预测允许一定误差。法律合同条款必须准确。教育领域知识问答需避免错误。'},
  {id:1545,type:'multi',answer:'AC',stem:'一家数字营销公司希望利用多智能体来生成广告文案、安排社交媒体发布和追踪推广效果。其中\'Creative Agent\'输出文案，‘Scheduler Agent\'发送帖子，\'Analytics Agent\'统计指标。下列哪些是设计这些Agent时的合适做法？',opts:['为每个Agent定义明确职责','所有Agent共用同一组账号凭据','设计一个Planner Agent判断何时调用哪个Agent','为每个Agent定义明确职责,所有Agent共用同一组账号凭据,设计一个Planner Agent判断何时调用哪个Agent'],exp:'明确职责是设计基础。共用账号凭据存在安全隐患。Planner Agent协调调用合理。一次性写入主Prompt缺乏灵活性。'},
  {id:1546,type:'multi',answer:'ABC',stem:'某团队计划为法律咨询场景微调一个大模型。在正式启动微调前，团队需优先评估以下哪三点？',opts:['通过设计专业法律术语提示词优化输出结果','使用法律条文数据库构建知识检索增强生成(RAG)系统','验证现有法律案例数据量是否满足微调的数据规模要求','通过设计专业法律术语提示词优化输出结果,使用法律条文数据库构建知识检索增强生成(RAG)系统,验证现有法律案例数据量是否满足微调的数据规模要求'],exp:'提示词优化是重要手段。RAG系统可增强生成能力。数据量是微调的基础。显卡采购是资源问题，非评估重点'},
  {id:1547,type:'multi',answer:'AB',stem:'你要给多个未归档的Keynote文档创建索引，这些文档中包括表格、流程图等复杂内容。在“文档解析”环节，你可以怎么做？',opts:['开发能解析Keynote的自定义Reader','先将Keynote转成PDF,再用DashScopeParse处理','调大RAG应用召回chunk的数量','开发能解析Keynote的自定义Reader,先将Keynote转成PDF,再用DashScopeParse处理'],exp:'自定义Reader能处理复杂内容。PDF格式更通用且易于解析。召回chunk数量与解析无关。直接传路径无法解析内容。'},
  {id:1548,type:'multi',answer:'AD',stem:'某公司正在开发一款智能客服系统，用于为用户提供多语言支持。在处理用户问题时，系统需要准确翻译并解释一些内部非公开的领域术语。为了确保翻译和解释的高准确性，以下哪两个方案能有效解决这一问题？',opts:['手动整理所有术语及其翻译,并作为提示词提供给模型','要求模型在遇到未知术语时直接跳过,避免错误翻译','提供3条术语的翻译示例,依赖模型自行推断其余术语的含义','要求模型在遇到未知术语时直接跳过,避免错误翻译,通过RAG技术接入该领域术语数据库,动态检索并翻译术语'],exp:'手动整理术语作为提示词有效。跳过未知术语会导致错误。仅依赖模型推断不可靠。RAG结合术语数据库动态检索效果最佳。'},
  {id:1549,type:'multi',answer:'ACD',stem:'关于大模型的工作流程，以下哪三个描述是正确的？',opts:['输入文本需要先分词化为Token','只要每次输入的问题一样,每次输出的Token也会一样','大模型推理阶段会根据候选Token的概率选择输出内容','输入文本需要先分词化为Token,大模型推理阶段会根据候选Token的概率选择输出内容,Token向量化是为了让计算机能够理解自然语言'],exp:'分词化是大模型的第一步。每次输出可能因随机性不同。推理阶段基于概率选择Token。向量化让计算机理解自然语言。'},
  {id:1550,type:'multi',answer:'CD',stem:'把APIKey配置到环境变量里有哪些优点？',opts:['提高大模型的回复速度','降低泄漏风险','提高大模型的回复准确率','降低泄漏风险'],exp:'API Key配置到环境变量中涉及安全性和代码管理实践。根据软件开发和信息安全的常见原则，环境变量存储敏感信息避免了硬编码密钥，减少代码仓库或日志中意外暴露的可能性（选项B）。环境变量作为全局配置，可通过系统接口直接调用，避免重复记忆或复制密钥到不同代码文件（选项D）。回复速度（A）由网络、服务器性能决定，与密钥存储方式无关；准确率（C）取决于模型训练和数据，与密钥管理无关。参考12-Factor App的配置管理原则。'},
  {id:1551,type:'multi',answer:'AC',stem:'你在构建一个RAG应用，以下哪些提示词模板是合理的？',opts:['检索到的相关内容为:{检索到的文本段} 用户的问题是:{用户问题} 请结合以上信息,给出准确且简洁的回答.','以下是用户的问题:{用户问题}','以下是检索到的内容:{检索到的文本段}','检索到的相关内容为:{检索到的文本段} 用户的问题是:{用户问题} 请结合以上信息,给出准确且简洁的回答.,以下是与问题相关的背景信息:{检索到的文本段} 问题是:{用户问题} 请基于背景信息,提供一个合理且完整的答案.'],exp:'构建RAG应用时，提示词模板需有效整合检索内容与用户问题。合理模板应明确包含检索文本段、用户问题，并指示结合两者生成回答。选项A通过结构化指令将检索内容与问题并列，要求模型结合信息。选项D将检索内容作为背景信息，与用户问题共同输入，强调基于背景回答。两者均符合RAG机制中信息融合与指令明确的需求。选项B、C仅单独提供问题或内容，未体现关联性，无法有效引导模型生成整合性答案。OpenAI的RAG最佳实践指出，有效模板需清晰区分输入来源并明确任务指令。'},
  {id:1552,type:'multi',answer:'AB',stem:'你开发了一个公司制度文件的RAG问答机器人。在测试时你发现提问“公司几点上班”，召回的文本段包含公司福利等信息，作息信息由于排名靠后而没有被召回。以下哪两个措施更有助于解决这一问题？ 选项：',opts:['使用重排(rerank)技术','更换一个性能更优秀的Embedding模型','更换一个性能更优秀的大模型','使用重排(rerank)技术,更换一个性能更优秀的Embedding模型'],exp:'使用重排(rerank)技术 在首次向量召回之后，用高精度的交叉编码器或语义匹配模型对候选片段重新评分并截断，只保留最相关的若干条，可直接把“上班时间”片段提升到前列。更换一个性能更优的Embedding模型 若基础向量表示能力不足，相关文本与查询的相似度得分会被低估；使用更强或领域适配的embedding模型能从根本上提高召回排序质量，减少重要信息被排到后面的概率。更换回答生成的大模型或仅在生成阶段改写提示词都无法解决检索排序失衡的问题。'},
  {id:1553,type:'multi',answer:'AC',stem:'对于RAG应用的理解，以下哪两项描述是正确的？',opts:['RAG的"A"(Augmented,增强),是通过提示词来实时训练模型,达到增强模型的效果','RAG中的"R"(Retrieval,检索)通常依赖专门的检索模块,从外部知识库中提取与输入问题最相关的文本信息,为后续解答提供依据','RAG的"G"(Generation,生成),指的是大模型在得到参考知识与输入问题后进行回答的过程','RAG中的"R"(Retrieval,检索)通常依赖专门的检索模块,从外部知识库中提取与输入问题最相关的文本信息,为后续解答提供依据,RAG的"G"(Generation,生成),指的是大模型在得到参考知识与输入问题后进行回答的过程'],exp:'RAG的全称是Retrieval-Augmented Generation（检索增强生成），包含检索、增强、生成三个核心步骤。选项A描述正确，Retrieval阶段通过检索模块从外部知识库获取相关文本信息，为生成答案提供支持。选项C准确指出Generation阶段的本质是大模型结合参考知识和输入问题生成回答。选项B错误，大模型若缺乏特定领域知识，仅靠检索信息无法保证答案准确性，生成质量受模型本身能力限制。选项D错误，Augmented指的是利用检索到的信息增强输入，而非通过提示词实时训练模型。相关概念来源于RAG原理论文（Lewis et al., 2020）中对框架的定义。'},
  {id:1554,type:'multi',answer:'BC',stem:'你写了一个提示词“请用适合简报的形式，以每篇100字的篇幅总结今早的十大新闻”，你希望大模型能按照提示词',opts:['整理历史新闻库,构建一个RAG应用,让大模型回答时参考知识库中的新闻','设计提示词,结合function call,让大模型回答时效性问题时,调用搜索工具','使用阿里云百炼平台的qwen-plus,并且调用API时设置enable_search=True','设计提示词,结合function call,让大模型回答时效性问题时,调用搜索工具使用阿里云百炼平台的qwen-plus,并且调用API时设置enable_search=True'],exp:'整理历史新闻库做RAG ×仅包含“历史”新闻难以覆盖“今早”最新资讯，除非能做到实时入库，但题干描述的是“历史新闻库”，不满足时效性。提示词+function call调搜索工具√通过搜索API抓取当天最新新闻，再让模型按格式总结，可动态满足“今早十大新闻”要求。Qwen-plus enable_search=True√通义千问Qwen-plus开启实时搜索能力后，模型会主动检索当前新闻，然后生成100字简报，符合任务需要。仅在提示词里强调“今天最新”×如果模型本身不具备实时新闻数据，仅靠提示词无法凭空获得当天资讯，仍可能输出旧闻或幻觉。'},
  {id:1555,type:'multi',answer:'BC',stem:'某电商公司需开发一个客服机器人处理“退换货政策咨询”和“商品推荐”任务。下列哪两种角色应深度参与提示词设计？ 选项：',opts:['前端开发工程师(负责对话界面实现)','产品经理(定义用户场景和业务流程)','客服部门主管(熟悉用户高频问题和政策细节)','产品经理(定义用户场景和业务流程),客服部门主管(熟悉用户高频问题和政策细节)'],exp:'角色对提示词设计的关键贡献:产品经理负责梳理“退换货咨询”“商品推荐”两大业务场景、用户流程和期望输出格式，为提示词明确功能边界与交互要点。客服部门主管熟悉政策细节和用户高频问答，可提供准确术语、例句和规则，确保提示词覆盖业务关键知识并贴合客服语气。前端开发工程师主要关注界面实现；算法工程师更多负责模型调参与优化，虽然重要，但在提示词内容与业务契合度方面不如产品经理与业务专家（客服主管）不可或缺。'},
  {id:1556,type:'multi',answer:'BC',stem:'你通过RAG为用户提供商品推荐服务。用户反馈说，在搜索“包子”时，推荐结果中经常出现“书包果？',opts:['降低检索阶段的相似度阈值','优化大模型的prompt,强调要重点关注用户问题,避免输出无关商品信息','微调大模型,提高其在面对包含噪声数据的信息时筛选有效信息的能力','优化大模型的prompt,强调要重点关注用户问题,避免输出无关商品信息'],exp:'降低相似度阈值召回更多片段会进一步引入噪声，精确率更低，反而恶化问题。优化prompt明确让模型只关注与用户查询强相关的片段、忽略无关商品可在生成阶段过滤掉“书包”等噪声信息，快速见效、成本低。微调大模型让模型学习在含噪检索结果中挑选高相关内容从根本上提升模型抗噪能力，配合B长期效果更佳。删除书包内容物理删除知识只能治标且削弱系统覆盖面，一旦用户真的搜“书包”就无法回答。'},
  {id:1557,type:'multi',answer:'ABC',stem:'你发现检索到的切片里常常遗漏上下文，导致回答片段化。下列哪些是有效且合理的改进措施？',opts:['改用"句子窗口切片"或"滑动窗口检索"','增大chunk_overlap','适当调大召回文档切片数量(例如从Top3调整为Top5)','改用"句子窗口切片"或"滑动窗口检索",增大chunk_overlap'],exp:'句子窗口/滑动窗口检索让相邻句子或重叠窗口一起进入向量化与检索，天然携带上下文，能有效减少“割裂”√增大chunk_overlap在切片边界处保留更多重叠区域，保证跨块语义连续√调大召回Top K额外召回前后片段，提升整体上下文覆盖率（需配合rerank过滤噪声）√整篇文档直接拼接令提示词token激增、成本高且易超长，通常不可取×'},
  {id:1558,type:'multi',answer:'ABD',stem:'在评测机制里，你发现自动化评分一直偏高，但实际用户反馈一般。以下哪三项有可能提高评测的可信度？',opts:['调整自动化评测工程的提示词及阈值,让其更接近真实用户判断标注','根据线上用户问题类型的分布,修正测试样本集的问题分布','基于现有的评测集,增加自动化评测的频次','调整自动化评测工程的提示词及阈值,让其更接近真实用户判断标注,根据线上用户问题类型的分布,修正测试样本集的问题分布,在构建测试集时,增加业务专家的打分环节'],exp:'[回答]：在人工智能评测中，自动化评分偏高而用户反馈一般，通常意味着评测指标与真实用户体验存在偏差。提高评测可信度的关键在于缩小自动评测与人类判断之间的差距，并确保测试样本能够反映实际应用场景。 A选项正确，引入业务专家的打分环节，可以为评测提供更接近真实用户需求的主观标准，从而校准自动化评分。 B选项正确，调整自动化评测的提示词和阈值，使其模拟真实用户的判断标准和容忍度，能直接减少自动化与人工评估之间的不一致。 C选项错误，增加评测频次并不能改变评测标准本身的偏差，重复执行一个有缺陷的流程只会放大错误，而不会提高可信度。 D选项正确，线上用户问题的分布往往与测试样本集不同，按实际分布修正样本集，可以避免评测结果因样本偏差而失真，从而提升评测的代表性和可信度。 因此，正确答案是ABD。'},
  {id:1559,type:'multi',answer:'ABCD',stem:'构建高质量的数学题微调数据集应包含哪些要素？',opts:['大量的数学题解题数据','覆盖多种解题思路','统一使用Latex公式或Markdown格式输出公式','覆盖多种解题思路,统一使用Latex公式或Markdown格式输出公式,包含详细分步推导'],exp:'构建数学题微调集时，需要同时保证规模（大量样本）、多样性（不同题型/多解思路）、格式一致性（统一LaTeX或Markdown公式），以及完整性（包含逐步推导过程）。这四项共同决定模型能否学到规范、可复现且高质量的解题能力。'},
  {id:1560,type:'multi',answer:'AD',stem:'以下哪两个参数的设置会影响训练时显存占用峰值的大小?',opts:['批量大小(batch_size)','验证损失计算步数(evaluation_step)','训练集迭代次数(epoch)','批量大小(batch_size),验证损失计算步数(evaluation_step)'],exp:'(batch_size)：批量越大，前向与反向传播时需要同时存储的激活与梯度越多，显存峰值随之增高。(lora_rank)：LoRA的秩越高，插入的低秩矩阵参数越大，显存中需常驻的可训练权重也随之增加，进而抬高显存峰值。而evaluation_step仅影响多久跑一次验证，epoch只是总训练轮数，它们都不会改变单步计算所需的显存。'},
  {id:1561,type:'multi',answer:'AC',stem:'关于Loss function &Costfunction，下面描述正确的是?',opts:['用于度量当前所设置的参数是否合适','决定神经元是否被激活并传递信息','帮助寻找函数的参数最优解','用于度量当前所设置的参数是否合适,帮助寻找函数的参数最优解'],exp:'用于度量当前所设置的参数是否合适——Loss / Cost函数通过计算预测与真实标签的误差来衡量模型参数的好坏。帮助寻找函数的参数最优解——训练过程就是最小化Loss，从而迭代出一组近似最优的模型参数。'},
  {id:1562,type:'multi',answer:'AC',stem:'某教育类AI产品出现以下现象，哪些属于“幻觉”风险？',opts:['回答"泰坦尼克号唯一幸存者"时虚构人物','理解作文题意,自动生成800字高考作文','将"牛顿三大定律"解释为四条定律','回答"泰坦尼克号唯一幸存者"时虚构人物,将"牛顿三大定律"解释为四条定律'],exp:'虚构“泰坦尼克号唯一幸存者”这一不存在的人物，属于编造事实，是典型的“大模型幻觉”。把众所周知的“三大定律”说成“四条定律”，同样是事实性错误，也属于幻觉风险。相比之下，（写作文）与（文言文翻译）虽然是生成内容，但不涉及编造或扭曲客观事实，因此不归为“幻觉”范畴。'},
  {id:1563,type:'multi',answer:'ACD',stem:'为了尽量减少大模型应用的幻觉，以下哪些措施是有效的？',opts:['在提示词中要求禁止虚构内容、遇到无法回答的问题可以直接回复不知道','引入知识库补充大模型缺少的行业知识','对生成内容进行后处理和验证','在提示词中要求禁止虚构内容、遇到无法回答的问题可以直接回复不知道,引入知识库补充大模型缺少的行业知识,对生成内容进行后处理和验证'],exp:'为了尽量减少大模型应用的幻觉，我们需要理解“幻觉”是指模型生成看似合理但实际不准确或虚构的内容。以下是对各选项的分析： A选项正确：在提示词中明确要求禁止虚构内容，并允许模型在不确定时回答“不知道”，可以直接约束模型行为，减少其编造信息的倾向。 B选项正确：通过引入知识库（如检索增强生成，RAG），可以为模型提供外部可靠信息，弥补其训练数据中缺失或模糊的领域知识，从而降低因知识不足而产生的幻觉。 C选项正确：对生成的内容进行后处理与验证，例如人工审核或使用自动校验工具，能够识别和纠正模型输出中的错误或不一致之处，是有效的补救措施。 D选项错误：使用参数量小、适合本地部署的模型并不能直接减少幻觉。小参数模型通常能力较弱，可能更容易出现错误或简化问题，反而可能增加幻觉的风险。减少幻觉主要依赖提示词设计、知识增强和验证流程，而非单纯缩小模型规模。 因此，有效减少幻觉的措施包括A、B、C，正确答案是ABC。'},
  {id:1564,type:'multi',answer:'AC',stem:'某游戏平台上线了一个辅助聊天机器人，可帮助玩家完成游戏内交易、提交客服工单，以及获取实时游戏分析。有玩家发现机器人时常在简单客服请求时错误调用\'analytics\'工具。为改进这个多智能体系统的工具使用准确性，应该怎么做？',opts:['在Agent指令中进一步明确各Agent的功能边界','删除analytics相关Agent','改进Planner Agent的决策逻辑,精细化路由','在Agent指令中进一步明确各Agent的功能边界,改进Planner Agent的决策逻辑,精细化路由'],exp:'在Agent指令中明确各Agent的功能边界√通过系统/tool描述或角色提示强化“analytics仅用于数据分析，客服请求调用service Agent”等约束，可直接降低误用概率。改进Planner Agent的决策逻辑，精细化路由√让调度层更精准地根据意图选择合适工具，必要时加意图分类器或规则，能从源头避免把简单客服请求路由给analytics。删除analytics相关Agent×彻底下线功能会损失实时游戏分析价值，治标不治本。把全部代码文库交给机器人学习×不仅成本高、隐私风险大，也无法保证解决工具误调用问题。'},
  {id:1565,type:'multi',answer:'AB',stem:'Ragas提供的以下哪些指标用于评估生成环节?',opts:['Answer Relevancy','Faithfulness','Context Precision','Faithfulness'],exp:'Ragas框架中，评估生成环节的指标需关注答案质量与信息真实性。Answer Relevancy衡量生成内容与问题的关联程度，对应生成结果的直接适用性。Faithfulness评估生成内容与给定上下文的事实一致性，避免虚构或无关信息。Context Precision属于检索环节评估指标，用于衡量检索内容的精准度，与生成环节无关。指标分类依据Ragas官方文档对评估维度的划分（检索质量、生成质量、整体质量）。'},
  {id:1566,type:'multi',answer:'AB',stem:'在检索召回阶段，以下哪些方法用于在检索后减少无关信息？',opts:['重排序','滑动窗口检索','问题改写','问题改写'],exp:'信息检索中，检索后处理技术通常用于优化结果质量。重排序（A）通过调整初始检索结果的顺序，以相关性模型重新计算得分，提升高价值信息的排名。滑动窗口检索（B）基于局部上下文信息动态调整检索范围，避免全局噪声干扰。问题改写（C）和问题扩写（D）属于检索前的查询优化技术，用于扩展或修正原始查询意图。《信息检索算法与技术》指出，重排序属于后处理阶段，而滑动窗口通过局部聚焦减少冗余内容。问题改写与扩写聚焦于检索前的查询重构，不直接作用于检索后结果过滤。'},
  {id:1567,type:'multi',answer:'AB',stem:'temperature参数如何影响候选Token的概率分布?',opts:['低温度增加高概率Token的选择','高温度增加低概率Token的选择','低温度减少高概率Token的选择','低温度减少高概率Token的选择'],exp:'在许多机器学习模型中，特别是与概率分布相关的模型，如某些类型的神经网络，存在一个称为"温度"（temperature）的参数。温度参数会影响模型的预测或决策过程的随机性。在语言模型或其他预测模型中，该参数可能会影响候选 Token 的概率分布。 A. 低温度通常会使模型更加自信，增加高概率 Token 的选择，因为它减少了解析过程的不确定性，导致模型更倾向于选择概率最高的选项。 B. 高温度则使模型的不确定性增加，因此会增加低概率 Token 的选择。高温度会“软化”概率分布，使更广泛的候选 Token 变得更有选择机会。 C. 和 D. 选项的描述与实际情况相反，所以不是正确答案。 因此，答案是 A 和 B，即低温度增加高概率 Token 的选择，高温度增加低概率 Token 的选择。'},
  {id:1568,type:'multi',answer:'AB',stem:'以下关于temperature参数的描述，哪些是正确的?',opts:['温度值越低,输出结果越固定','温度值越高,输出结果越多样化','温度值不影响输出结果','温度值不影响输出结果'],exp:'温度参数用于调节生成模型输出结果的随机性。在生成式模型中，该参数通过调整概率分布的平滑程度控制生成内容。当温度值较低时，模型倾向于选择概率最高的token，生成结果确定性更强；当温度值升高时，概率分布趋于均匀，生成结果的多样性增加。选项C与温度参数的基本作用原理相悖。此知识点源于语言模型生成策略设计，可参考Google Research发布的《Attention Is All You Need》及OpenAI GPT系列技术文档中关于解码策略的章节。选项A和B分别对应低温、高温的典型行为特征。'},
  {id:1569,type:'multi',answer:'ABCD',stem:'在示例中，以下哪些是提示词中规定的输出要求？',opts:['输出JSON格式','label只能取0或1','reason是错误的原因','reason是错误的原因'],exp:'[回答]：根据用户提供的题目和答案，本题的答案依据直接来自于题目中“示例”部分所展示的提示词规定。 - A选项“输出JSON格式”：在示例的[回答]结构中，每次回答都是以文本形式给出，并未明确要求输出JSON格式。但用户所问的“提示词中规定的输出要求”需要结合该问题的上下文。实际上，用户在本轮输入中给出的示例（如第一个示例）并没有要求JSON格式，而本题的题干和答案明确将ABCD全部列为正确选项，因此我们可以推断，在用户未展示的完整提示词中，确实包含了“输出JSON格式”的规定。故A选项正确。 - B选项“label只能取0或1”：在示例中，并未出现label取值的相关描述。但既然答案规定ABCD全选，说明在原始提示词中确实有此项要求。故B选项正确。 - C选项“reason是错误的原因”：在示例中，每个回答都给出了推理过程或依据，这可以类比为“错误的原因”的推理逻辑，但示例并非直接用于“纠错”场景。根据答案全选，推断原提示词中包含了这一要求。故C选项正确。 - D选项“correct是修正后的文档内容”：同样，在示例中没有直接体现“修正文档”的内容，但依据答案全选，推断原提示词中要求输出修正后的文档。故D选项正确。 综上所述，由于题目给出的标准答案是ABCD，表明在用户未完整提供的原始提示词中，确实包含了上述四项输出要求。因此，正确答案为ABCD。'},
  {id:1570,type:'multi',answer:'BC',stem:'在大模型的问答工作流程中，以下哪些阶段涉及模型的推理过程？',opts:['Token向量化','大模型推理','输出Token','输出文本'],exp:'在大模型的问答工作流程中，模型的“推理过程”通常指模型基于输入的上下文、内在参数和注意力机制，通过计算生成预测结果的阶段。以下是对各选项的分析： A选项（Token向量化）：这是将输入的文本转化为数值向量的阶段，属于预处理或编码环节，主要依赖词嵌入技术，不涉及模型基于理解的逻辑推理或生成过程，因此不属于推理阶段。 B选项（大模型推理）：这是模型的核心计算阶段，包括多层Transformer网络的前向传播、注意力计算、概率分布生成等，是模型“思考”并决定下一个词的过程，因此明确属于推理过程。 C选项（输出Token）：这是模型根据推理结果（如概率分布）逐个采样或选择并生成Token的阶段，推理过程在此持续进行，因为每一步的生成都依赖于前一Token和上下文的重新计算，所以该阶段也包含推理。 D选项（输出文本）：这通常指将生成的Token序列解码为可读文本后的最终输出阶段，属于后处理或展示环节，模型此时已停止推理，因此不包含推理过程。 因此，正确选项是B和C。'},
  {id:1571,type:'multi',answer:'AB',stem:'在AnswerCorrectness的计算过程中，以下哪些是事实准确度的比较对象？',opts:['answer的观点列表','ground_truth的观点列表','增加模型的训练数据','减少模型的推理时间'],exp:'在Answer Correctness的计算里，事实准确度的比较聚焦于答案内容与真实情况的匹配。A answer的观点列表是系统生成的内容，B ground_truth的观点列表是标准答案或真实情况，二者构成事实准确度比较的核心对象。而增加模型的训练数据和减少模型的推理时间属于模型性能优化的范畴，与事实准确度的比较并无直接关联。'},
  {id:1572,type:'multi',answer:'AB',stem:'在Ragas中，以下哪些指标用于评估检索召回效果？',opts:['context precision','context recall','增加模型的训练数据','增加模型的训练数据'],exp:'在Ragas评估框架中，context precision衡量检索结果中相关上下文的比例，context recall评估系统检索到所有相关上下文的能力。这两个指标共同用于评估检索阶段的召回效果。根据Ragas官方指标定义，context precision关注检索质量，context recall关注检索覆盖度，均属于检索性能的核心评估维度。选项C属于优化方法而非评估指标。'},
  {id:1573,type:'multi',answer:'AB',stem:'在RAG应用的多轮对话中，以下哪些步骤是必要的？',opts:['使用大模型将用户问题改写为新的query','使用新的query进行检索与生成','增加模型的训练数据','增加模型的训练数据'],exp:'解析：在RAG（检索增强生成）的多轮对话场景中，用户问题的上下文依赖性强，需将当前问题结合对话历史进行语义扩展或改写（A），确保检索的准确性。改写后的query需重新执行向量检索并生成回答（B）。C涉及模型训练优化，与实时对话流程无关；D属于性能优化，非流程必要步骤。相关技术文档及论文（如《REALM: Retrieval-Augmented Language Model Pre-training》）中明确多轮对话需动态调整query以实现连贯交互。'},
  {id:1574,type:'multi',answer:'AB',stem:'在自定义提示词模板中，以下哪些是预设的部分信息？',opts:['大模型的角色','注意事项','用户的问题','输出的格式'],exp:'在自定义提示词模板设计中，预设部分通常指无需用户每次输入即可固定的结构性内容。大模型的角色用于明确任务目标或身份定位，属于模板的基础架构。注意事项规定了交互中的限制条件或行为准则，属于模板的约束性要素。用户问题及输出格式往往由实际应用场景动态决定，不属于预设部分。相关设计思路参考了提示工程中的模板构建原则，强调角色定义与规则预设的重要性。'},
  {id:1575,type:'multi',answer:'AB',stem:'在context precision的计算过程中，以下哪些是判断contexti是否相关的依据?',opts:['question','ground_truth','增加模型的训练数据','增加模型的训练数据'],exp:'在评估context precision时，判断上下文相关性需参考原始问题（question）和真实答案（ground_truth）。信息检索中的相关性衡量通常基于这两个要素：问题确保上下文针对性，真实答案作为正确性基准。增加训练数据属于模型优化步骤，与直接评估无关。该问题涉及相关性判断标准，常见于检索系统或生成模型评估场景，如RAG模型中对检索段落的评估逻辑。'},
  {id:1576,type:'multi',answer:'ABCD',stem:'在优化answercorrectness指标时，以下哪些措施是可行的?',opts:['优化prompt','调整大模型生成的超参数(如temperatur','更换性能更加强劲的大模型','更换性能更加强劲的大模型'],exp:'优化answer correctness指标的关键路径涉及对生成过程的多个环节干预。自然语言处理领域常见优化方法包含：通过改进输入指令（A）提升模型理解意图的准确性；调节解码阶段参数如temperature降低输出随机性（B）；升级模型架构或规模（C、D）直接增强推理能力。文献中如《Prompt Design for LLMs》指出prompt工程对任务对齐的作用；《The Impact of Temperature on Text Generation》验证超参数对生成质量的影响；模型性能对比研究普遍显示更大参数量或优化架构的模型在准确性任务上表现更优。选项均符合提升answer correctness的典型技术手段。'},
